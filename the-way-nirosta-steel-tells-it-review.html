let cards = [{"en":"spacey","zh":"这里不是“太空般的”，而是说人有点恍惚、神游、像活在自己的精神世界里","source":"Steven Hall is equal parts funny, spacey, and profound—maybe it’s ’cause of those joints he smokes before meetings.","sourceHtml":"Steven Hall is equal parts funny, \u003cmark>spacey\u003c/mark>, and profound—maybe it’s ’cause of those joints he smokes before meetings."},{"en":"pontificate on","zh":"以权威、郑重其事甚至略显卖弄的口吻大谈某事","source":"Speaking to the 69-year-old artist, who records as Nirosta Steel, was also an experience unlike any other I’ve had in my career: He was just as likely to pontificate on an ex-boyfriend’s unorthodox sexual technique as he was to explain different modes of Buddhist thought or talk about the trauma he still holds from surviving the AIDS crisis.","sourceHtml":"Speaking to the 69-year-old artist, who records as Nirosta Steel, was also an experience unlike any other I’ve had in my career: He was just as likely to \u003cmark>pontificate on\u003c/mark> an ex-boyfriend’s unorthodox sexual technique as he was to explain different modes of Buddhist thought or talk about the trauma he still holds from surviving the AIDS crisis."},{"en":"fauxstalgia","zh":"由 （假的）和 （怀旧）拼成，指对自己从未真正经历过的年代产生浪漫化想象","source":"He warned me, throughout our conversation, against nostalgia and fauxstalgia, although it’s lives like his that those words were made for.","sourceHtml":"He warned me, throughout our conversation, against nostalgia and \u003cmark>fauxstalgia\u003c/mark>, although it’s lives like his that those words were made for."},{"en":"frame of view","zh":"观看、理解事物的框架或视角","source":"It’s a frame of view not unlike that of My Skyscraper, Hall’s towering second album, released on the independent label Ulyssa.","sourceHtml":"It’s a \u003cmark>frame of view\u003c/mark> not unlike that of My Skyscraper, Hall’s towering second album, released on the independent label Ulyssa."},{"en":"built upon the entirety of","zh":"建立在……的全部之上","source":"The 83-minute album is built upon the entirety of Hall’s vast, varied career.","sourceHtml":"The 83-minute album is \u003cmark>built upon the entirety of\u003c/mark> Hall’s vast, varied career."},{"en":"towering / immense achievement / opus","zh":"一组刻意“抬高”作品的宏伟措辞，随后被 和 戳破","source":"The record is an immense achievement, so why not liken it to one of the great innovations of human engineering?","sourceHtml":"The record is an \u003cmark>immense\u003c/mark> \u003cmark>achievement\u003c/mark>, so why not liken it to one of the great innovations of human engineering?"},{"en":"happen to be","zh":"偏偏／恰好又是","source":"His opus is, after all, basically an album-length dick joke: 17 synth-pop and avant-folk songs about gay sex and partying that also happen to be some of the most sublime songs released this year.","sourceHtml":"His opus is, after all, basically an album-length dick joke: 17 synth-pop and avant-folk songs about gay sex and partying that also \u003cmark>happen\u003c/mark> to be some of the most sublime songs released this year."},{"en":"fall in with","zh":"偶然结识并开始与某一群人来往，常暗示进入一个鲜明甚至非主流的圈子","source":"Hall was born in Scotland in the ’50s and moved to Wilmington, Delaware, with his family in the early ’70s, where he quickly fell in with legendary poets like Allen Ginsberg and William S.","sourceHtml":"Hall was born in Scotland in the ’50s and moved to Wilmington, Delaware, with his family in the early ’70s, where he quickly fell in with legendary poets like Allen Ginsberg and William S."},{"en":"kindred spirit","zh":"志趣、气质或精神上高度契合的人","source":"It was through Ginsberg that he met the downtown avant-garde legend Arthur Russell, who would go on to become one of his best friends and closest collaborators, a kindred spirit whose impact, Hall says, is still present in his work today.","sourceHtml":"It was through Ginsberg that he met the downtown avant-garde legend Arthur Russell, who would go on to become one of his best friends and closest collaborators, a \u003cmark>kindred spirit\u003c/mark> whose impact, Hall says, is still present in his work today."},{"en":"a blur of","zh":"回忆中模糊混成一片的……","source":"From there, it’s a blur of weed smoke and odd jobs and life-changing retreats, collaborations with Hong Kong pop stars and experimental theatre troupes, boyfriends in every other city.","sourceHtml":"From there, it’s \u003cmark>a blur of\u003c/mark> weed smoke and odd jobs and life-changing retreats, collaborations with Hong Kong pop stars and experimental theatre troupes, boyfriends in every other city."},{"en":"downtown avant-garde","zh":"特指纽约下城的前卫艺术生态，不只是地理上的“市中心”，还带有实验音乐、舞蹈、诗歌、剧场与酷儿文化交汇的历史语境","source":"It was through Ginsberg that he met the downtown avant-garde legend Arthur Russell, who would go on to become one of his best friends and closest collaborators, a kindred spirit whose impact, Hall says, is still present in his work today.","sourceHtml":"It was through Ginsberg that he met the \u003cmark>downtown\u003c/mark> avant-garde legend Arthur Russell, who would go on to become one of his best friends and closest collaborators, a kindred spirit whose impact, Hall says, is still present in his work today."},{"en":"be intertwined","zh":"彼此交织、难以分离","source":"Over the course of three phone conversations and email correspondence that spanned several months, Hall attempted to tell me the story of his career—which, of course, is just the story of his life, given how deeply intertwined art, sex, and friendship have been for him.","sourceHtml":"Over the course of three phone conversations and email correspondence that spanned several months, Hall attempted to tell me the story of his career—which, of course, is just the story of his life, given how deeply \u003cmark>intertwined\u003c/mark> art, sex, and friendship have been for him."},{"en":"an explosion of admiration and support","zh":"赞赏与支持突然集中爆发","source":"Pitchfork: The album came out, and it seems like there was this explosion of admiration and support.","sourceHtml":"Pitchfork: The album came out, and it seems like there was this \u003cmark>explosion of admiration and support\u003c/mark>."},{"en":"a blur","zh":"事情发展太快，以至于回想起来模糊不清","source":"Nirosta Steel: It’s been a blur because, to use an English expression, we were gobsmacked by the whole thing.","sourceHtml":"Nirosta Steel: It’s been \u003cmark>a blur\u003c/mark> because, to use an English expression, we were gobsmacked by the whole thing."},{"en":"be gobsmacked by","zh":"被……惊得目瞪口呆，非常英式、口语化","source":"Nirosta Steel: It’s been a blur because, to use an English expression, we were gobsmacked by the whole thing.","sourceHtml":"Nirosta Steel: It’s been a blur because, to use an English expression, we were \u003cmark>gobsmacked by\u003c/mark> the whole thing."},{"en":"in terms of doing music","zh":"就从事音乐而言","source":"Three weeks ago I was an Uber driver, and I was semi-retired in terms of doing music because I had moved out here to the Midwest with my husband.","sourceHtml":"Three weeks ago I was an Uber driver, and I was semi-retired in \u003cmark>terms\u003c/mark> of doing \u003cmark>music\u003c/mark> because I had moved out here to the Midwest with my husband."},{"en":"a fountain of money","zh":"金钱喷泉","source":"Arthur [Russell] had this idea that he would create a fountain of money that would just fall on his friends.","sourceHtml":"Arthur [Russell] had this idea that he would create \u003cmark>a fountain of money\u003c/mark> that would just fall on his friends."},{"en":"help someone out","zh":"在对方困难时搭把手、帮其渡过难关，比笼统的 更有具体支持意味","source":"So one of the things about being successful would be that you could help your friends out, particularly the ones who were dysfunctional.","sourceHtml":"So one of the things about being successful would be that you could \u003cmark>help your friends out\u003c/mark>, particularly the ones who were dysfunctional."},{"en":"champion people","zh":"公开支持、捍卫并积极为某类人争取机会","source":"Arthur and I tried to champion people who are dysfunctional, because often the best musicians are the ones that are most difficult, and that might be applied to me sometimes.","sourceHtml":"Arthur and I tried to \u003cmark>champion\u003c/mark> people who are dysfunctional, because often the best musicians are the ones that are most difficult, and that might be applied to me sometimes."},{"en":"dysfunctional","zh":"字面是“无法正常运作的”","source":"So one of the things about being successful would be that you could help your friends out, particularly the ones who were dysfunctional.","sourceHtml":"So one of the things about being successful would be that you could help your friends out, particularly the ones who were \u003cmark>dysfunctional\u003c/mark>."},{"en":"what a bitch I can be","zh":"自嘲自己有时能多么刻薄、难搞","source":"So that tells you what a bitch I can be, and I’m trying not to be so much of that now, and I try to be graceful and humble.","sourceHtml":"So that tells you \u003cmark>what\u003c/mark> a \u003cmark>bitch\u003c/mark> I \u003cmark>can\u003c/mark> be, and I’m trying not to be so much of that now, and I try to be graceful and humble."},{"en":"accept responsibility for all this","zh":"承担这份关注所带来的责任","source":"But at the same time, to accept responsibility for all this… I mean, you can’t say any other word than adoration.","sourceHtml":"But at the same time, \u003cmark>to accept responsibility for all this\u003c/mark>… I mean, you can’t say any other word than adoration."},{"en":"magnanimous","zh":"宽宏、有气度","source":"I mean, I could say that’s silly, but on the other hand, they expect me to be magnanimous and accept that feeling.","sourceHtml":"I mean, I could say that’s silly, but on the other hand, they expect me to be \u003cmark>magnanimous\u003c/mark> and accept that feeling."},{"en":"give it back","zh":"把收到的爱回馈出去","source":"And so, if they want to send me love, it’s my responsibility to accept it and to try to give it back as much as possible.","sourceHtml":"And so, if they want to send me love, it’s my responsibility to accept it and to try to \u003cmark>give\u003c/mark> it \u003cmark>back\u003c/mark> as much as possible."},{"en":"get inspired to do more music","zh":"受到触动，想继续创作音乐","source":"The best reaction I’ve had is some musicians have contacted me and said that when they listened to the record, they got inspired to do more music.","sourceHtml":"The best reaction I’ve had is some musicians have contacted me and said that when they listened to the record, they \u003cmark>got inspired to do more music\u003c/mark>."},{"en":"gratifying","zh":"带来深层满足感、让人觉得所做之事有价值，不只是当下“开心”","source":"That is more exciting and more gratifying than any so-called fame or money, because at my age, money means nothing.","sourceHtml":"That is more exciting and more \u003cmark>gratifying\u003c/mark> than any so-called fame or money, because at my age, money means nothing."},{"en":"so-called fame or money","zh":"所谓的名与利","source":"That is more exciting and more gratifying than any so-called fame or money, because at my age, money means nothing.","sourceHtml":"That is more exciting and more gratifying than any so-called \u003cmark>fame\u003c/mark> or \u003cmark>money\u003c/mark>, because at my age, \u003cmark>money\u003c/mark> means nothing."},{"en":"in terms of being commercial","zh":"从商业性、市场接受度的角度考虑","source":"I never considered, in terms of being commercial.","sourceHtml":"I never considered, \u003cmark>in terms of being commercial\u003c/mark>."},{"en":"not for everyone, but suddenly it was for everyone","zh":"从“小众到突然人人共鸣”的悖论式表达","source":"Anything else is extra. [The music was] not for everyone, but suddenly it was for everyone.","sourceHtml":"Anything else is extra. [The music was] \u003cmark>not\u003c/mark> for \u003cmark>everyone\u003c/mark>, \u003cmark>but\u003c/mark> \u003cmark>suddenly\u003c/mark> it was for \u003cmark>everyone\u003c/mark>."},{"en":"elocution teacher","zh":"教授清晰、规范发音和公众表达的老师","source":"I went to a speech teacher, an elocution teacher, when I was a boy in Scotland to take the accent away, because we lived near Glasgow and we had a Glasgow accent.","sourceHtml":"I went to a speech teacher, an \u003cmark>elocution teacher\u003c/mark>, when I was a boy in Scotland to take the accent away, because we lived near Glasgow and we had a Glasgow accent."},{"en":"take the accent away","zh":"把口音去掉","source":"I went to a speech teacher, an elocution teacher, when I was a boy in Scotland to take the accent away, because we lived near Glasgow and we had a Glasgow accent.","sourceHtml":"I went to a speech teacher, an elocution teacher, when I was a boy in Scotland to \u003cmark>take the accent away\u003c/mark>, because we lived near Glasgow and we had a Glasgow accent."},{"en":"do better than them","zh":"取得比父母更高的社会与经济成就，而不只是“做得更好”","source":"My parents wanted me to go to a private school and to do better than them.","sourceHtml":"My parents wanted me to go to a private school and to do \u003cmark>better\u003c/mark> \u003cmark>than\u003c/mark> \u003cmark>them\u003c/mark>."},{"en":"everybody is placed by their accent","zh":"每个人都会因口音而被定位、归类","source":"So we went to a speech teacher two or three times a week to learn how to speak properly without the Glasgow accent, because the Glasgow accent was considered low class, and as you know, in Britain, everybody is placed by their accent, which is kind of a horrible thing, but it’s true.","sourceHtml":"So we went to a speech teacher two or three times a week to learn how to speak properly without the Glasgow accent, because the Glasgow accent was considered low class, and as you know, in Britain, \u003cmark>everybody is placed by their accent\u003c/mark>, which is kind of a horrible thing, but it’s true."},{"en":"see someone from a whole different angle","zh":"从完全不同的角度认识、理解某人","source":"I’m interested in what that experience has been like—maybe for years and years, you have an idea of what makes you good, what people like about you, and then suddenly, you have this person come in and see you from a whole different angle.","sourceHtml":"I’m interested in what that experience has been like—maybe for years and years, you have an idea of what makes you good, what people like about you, and then suddenly, you have this person come in and \u003cmark>see you from a whole different angle\u003c/mark>."},{"en":"give someone permission","zh":"不一定是正式批准，而是让人感到“你可以相信自己的直觉，可以成为你自己”","source":"The best teachers are the ones that simply give you permission. [Eric] just simply said, “Give me a bunch of stuff.” It was kind of seamless.","sourceHtml":"The best teachers are the ones that simply \u003cmark>give you permission\u003c/mark>. [Eric] just simply said, “Give me a bunch of stuff.” It was kind of seamless."},{"en":"seamless","zh":"顺畅自然、几乎看不见衔接痕迹","source":"The best teachers are the ones that simply give you permission. [Eric] just simply said, “Give me a bunch of stuff.” It was kind of seamless.","sourceHtml":"The best teachers are the ones that simply give you permission. [Eric] just simply said, “Give me a bunch of stuff.” It was kind of \u003cmark>seamless\u003c/mark>."},{"en":"from the get-go","zh":"从一开始，口语表达","source":"He just understood what I was doing from the get-go, because they’re both artists, Eric and [Ulyssa co-founder] John.","sourceHtml":"He just understood what I was doing \u003cmark>from the get-go\u003c/mark>, because they’re both artists, Eric and [Ulyssa co-founder] John."},{"en":"set off the music","zh":"把音乐衬托得更鲜明","source":"The blurb he wrote was just great and it perfectly set off the music, I think.","sourceHtml":"The blurb he wrote was just great and it perfectly \u003cmark>set off the music\u003c/mark>, I think."},{"en":"a way of getting into it","zh":"一个进入、理解并亲近作品的入口","source":"It gave people a way of getting into it.","sourceHtml":"It gave people \u003cmark>a way of getting into it\u003c/mark>."},{"en":"sketchy and more like demos","zh":"这里的 不是“可疑的”，而是“粗略、未充分完成的”","source":"The only criticism we’ve had so far—my husband is monitoring all this stuff on X—is that two tracks, “Boss Trix” and “Go For the Night,” are so well produced and so shiny that emos."},{"en":"can’t get past that","zh":"无法越过这个障碍、无法接受到继续往下听","source":"The other two tracks that were criticized were “Yhema,” because some people can’t get past that.","sourceHtml":"The other two tracks that were criticized were “Yhema,” because some people \u003cmark>can’t get past that\u003c/mark>."},{"en":"jump in","zh":"迅速加入谈话或争论","source":"Some people say they love it until they get to that track and then they stop listening, and other people jump in on X and defend that track and say, “Oh, you know, he’s really trying something!” I was shocked when Eric picked that track because I thought that was a bit far, you know, and then very pleased that he was into it.","sourceHtml":"Some people say they love it until they get to that track and then they stop listening, and other people \u003cmark>jump in\u003c/mark> on X and defend that track and say, “Oh, you know, he’s really trying something!” I was shocked when Eric picked that track because I thought that was a bit far, you know, and then very pleased that he was into it."},{"en":"try something","zh":"在艺术评论里常指进行大胆、非惯常的实验","source":"Some people say they love it until they get to that track and then they stop listening, and other people jump in on X and defend that track and say, “Oh, you know, he’s really trying something!” I was shocked when Eric picked that track because I thought that was a bit far, you know, and then very pleased that he was into it.","sourceHtml":"Some people say they love it until they get to that track and then they stop listening, and other people jump in on X and defend that track and say, “Oh, you know, he’s really \u003cmark>trying\u003c/mark> \u003cmark>something\u003c/mark>!” I was shocked when Eric picked that track because I thought that was a bit far, you know, and then very pleased that he was into it."},{"en":"a bit far","zh":"有点太过、太超出接受范围","source":"Some people say they love it until they get to that track and then they stop listening, and other people jump in on X and defend that track and say, “Oh, you know, he’s really trying something!” I was shocked when Eric picked that track because I thought that was a bit far, you know, and then very pleased that he was into it.","sourceHtml":"Some people say they love it until they get to that track and then they stop listening, and other people jump in on X and defend that track and say, “Oh, you know, he’s really trying something!” I was shocked when Eric picked that track because I thought that was \u003cmark>a bit far\u003c/mark>, you know, and then very pleased that he was into it."},{"en":"a million places","zh":"夸张地表示“极多地方”，不是实数","source":"This is kind of a basic question, but in every interview I read of yours, you mention a million places you’ve lived.","sourceHtml":"This is kind of a basic question, but in every interview I read of yours, you mention \u003cmark>a million places you’ve lived\u003c/mark>."},{"en":"a rundown of","zh":"对一系列信息作简明梳理、逐项概述","source":"Can you give me kind of a rundown of everywhere you’ve lived?","sourceHtml":"Can you give me kind of \u003cmark>a rundown of\u003c/mark> everywhere you’ve lived?"},{"en":"whole areas of my life","zh":"人生中成片、成段的经历，强调遗忘不是零星的","source":"I’ve smoked so much weed over the years that it’s really hard to remember some whole areas of my life.","sourceHtml":"I’ve smoked so much weed over the years that it’s really hard to remember some \u003cmark>whole\u003c/mark> \u003cmark>areas\u003c/mark> of my \u003cmark>life\u003c/mark>."},{"en":"the songs anchor me","zh":"歌曲使我与自己的过去保持连接","source":"That’s why the songs anchor me, in a certain way—I can remember some of those people and some of those places just from the songs, but I’ll try and give a quick breakdown of it.","sourceHtml":"That’s why \u003cmark>the songs anchor me\u003c/mark>, in a certain way—I can remember some of those people and some of those places just from the songs, but I’ll try and give a quick breakdown of it."},{"en":"give a quick breakdown","zh":"把复杂内容迅速拆分、分项讲清","source":"That’s why the songs anchor me, in a certain way—I can remember some of those people and some of those places just from the songs, but I’ll try and give a quick breakdown of it.","sourceHtml":"That’s why the songs anchor me, in a certain way—I can remember some of those people and some of those places just from the songs, but I’ll try and \u003cmark>give\u003c/mark> a \u003cmark>quick\u003c/mark> \u003cmark>breakdown\u003c/mark> of it."},{"en":"bring down poets from New York","zh":"请纽约的诗人“下来”","source":"They brought down poets from New York to teach workshops.","sourceHtml":"They brought \u003cmark>down\u003c/mark> \u003cmark>poets\u003c/mark> from \u003cmark>New\u003c/mark> \u003cmark>York\u003c/mark> to teach workshops."},{"en":"luck into something","zh":"机缘巧合、走运地获得原本很难得到的机会","source":"The other people in that program—it was a government program—were older professional writers, but somehow I lucked into it because the administrator recognized something about me that was different, and I was already writing poetry.","sourceHtml":"The other people in that program—it was a government program—were older professional writers, but somehow \u003cmark>I lucked into it\u003c/mark> because the administrator recognized something about me that was different, and I was already writing poetry."},{"en":"hit it off with someone","zh":"初次接触后很快谈得来、合得来","source":"The poets that came down from New York thought that I was doing something interesting, so I sort of hit it off with one of the poets, Larry Fagin.","sourceHtml":"The poets that came down from New York thought that I was doing something interesting, so I sort of \u003cmark>hit it off with\u003c/mark> one of the poets, Larry Fagin."},{"en":"end up doing","zh":"事情一路发展，最后成了某种结果","source":"I ended up going up to New York and visiting him and staying with him—straight guy, but totally friendly, as everyone [was] in those days.","sourceHtml":"I \u003cmark>ended\u003c/mark> up going up to New York and visiting him and staying with him—straight guy, but totally friendly, as everyone [was] in those days."},{"en":"Quaaludes","zh":"安眠酮的美国商品名，曾作为镇静催眠药流行，也被娱乐性滥用","source":"It wasn’t a big deal, not only because things were relaxed, but because of the drugs that were available, particularly Quaaludes.","sourceHtml":"It wasn’t a big deal, not only because things were relaxed, but because of the drugs that were available, particularly \u003cmark>Quaaludes\u003c/mark>."},{"en":"so-called now-famous","zh":"如今被称作“著名的”","source":"That was in the so-called now-famous Poets Building, 437 East 12th.","sourceHtml":"That was in the \u003cmark>so-called now-famous\u003c/mark> Poets Building, 437 East 12th."},{"en":"live in a Hollywood movie","zh":"不是简单去美国，而是进入电影塑造出的美国想象","source":"I wanted to live in a Hollywood movie, I wanted to be in New York, see the skyline.","sourceHtml":"I wanted to \u003cmark>live\u003c/mark> in a \u003cmark>Hollywood\u003c/mark> \u003cmark>movie\u003c/mark>, I wanted to be in New York, see the skyline."},{"en":"Nirosta Steel","zh":"是一种不锈钢的名称","source":"That’s why my name is Nirosta Steel.","sourceHtml":"That’s why my name is \u003cmark>Nirosta\u003c/mark> \u003cmark>Steel\u003c/mark>."},{"en":"be cool with something","zh":"不介意、欣然接受某事","source":"And so going up to visit this guy and staying with him, I’d go up for a weekend, and my parents were totally cool with it.","sourceHtml":"And so going up to visit this guy and staying with him, I’d go up for a weekend, and my parents were \u003cmark>totally cool with it\u003c/mark>."},{"en":"hang out in the scene","zh":"在某个文化圈子里活动、来往","source":"Even before that, just hanging out in the New York scene, meeting musicians, artists, dancers, and just being taken around and treated as an equal in New York… at that time I was 17, and they talked to me just like I was one of them.","sourceHtml":"Even before that, just \u003cmark>hanging out in the New York scene\u003c/mark>, meeting musicians, artists, dancers, and just being taken around and treated ther, before Walter Gibbons got sick and kind of went all religious.","sourceHtml":"Walter Gibbons is the best, best disco mixer ever, ever, ever, ever, ever, and [he and Arthur] had this really deep connection when they were working together, before Walter Gibbons got sick and kind of \u003cmark>went all religious\u003c/mark>."},{"en":"end up working with","zh":"一路机缘发展下来，最终与……合作","source":"I went to Hong Kong, first to work with a theater company that was 80% gay, and then ended up working with this big [gay] pop star, Anthony Wong Yiu-ming.","sourceHtml":"I went to Hong Kong, first to work with a theater company that was 80% gay, and then \u003cmark>ended up working with\u003c/mark> this big [gay] pop star, Anthony Wong Yiu-ming."},{"en":"be out","zh":"公开自己的同性恋／酷儿身份","source":"He’s out now, but at that time, he couldn’t be out.","sourceHtml":"He’s \u003cmark>out\u003c/mark> now, but at that time, he couldn’t be out."},{"en":"be fuzzy about dates","zh":"对日期记不太清","source":"I’m a bit fuzzy about these dates.","sourceHtml":"\u003cmark>I’m a bit fuzzy about these dates.\u003c/mark>"},{"en":"business was booming","zh":"行业蓬勃发展、业务迅速扩张","source":"The guy who did the sound for this theater company, which is called Zuni Icosahedron, he was doing sound for movies and TV commercials and doing very well at that time—the movie business was booming in Hong Kong, this is like, the Wong Kar-Wai period.","sourceHtml":"The guy who did the sound for this theater company, which is called Zuni Icosahedron, he was doing sound for movies and TV commercials and doing very well at that time—the movie business was \u003cmark>booming\u003c/mark> in Hong Kong, this is like, the Wong Kar-Wai period."},{"en":"a scene took off","zh":"某一文化／产业生态迅速兴起","source":"And then the movie scene in Taiwan took off.","sourceHtml":"And then the movie scene in Taiwan \u003cmark>took off\u003c/mark>."},{"en":"the Wong Kar-Wai period","zh":"用王家卫来标记一个香港电影文化高度活跃的年代，而非严格的电影史分期","source":"The guy who did the sound for hat to me was so exciting.","sourceHtml":"I was dating a guy who was a \u003cmark>butch\u003c/mark> boy during the day and kind of like a gangster, and at night he turned into a girl, completely 100%, and that to me was so exciting."},{"en":"all fabulous","zh":"打扮得极其华丽、自信夺目","source":"I had another guy I was dating who was a boy during the day, and at night he was in beauty contests as a girl, and then he would come to me after the beauty contest, all fabulous.","sourceHtml":"I had another guy I was dating who was a boy during the day, and at night he was in beauty contests as a girl, and then he would come to me after the beauty contest, \u003cmark>all\u003c/mark> \u003cmark>fabulous\u003c/mark>."},{"en":"being real comes first","zh":"真实、不装腔作势地活着最重要","source":"In Thailand, in Buddhism, being real comes first.","sourceHtml":"In Thailand, in Buddhism, \u003cmark>being real comes first\u003c/mark>."},{"en":"daily practice","zh":"每天落实的修行，而非抽象信条","source":"Your daily practice, your approach to people and animals, your playfulness.","sourceHtml":"Your \u003cmark>daily\u003c/mark> \u003cmark>practice\u003c/mark>, your approach to people and animals, your playfulness."},{"en":"incorporate something into...","zh":"把某种元素吸收并融入作品或方法之中","source":"So living in Thailand taught me several things—it taught me how to be a Buddhist.","sourceHtml":"So living in Thailand taught me several things—it taught me how to be a Buddhist."},{"en":"E","zh":"的简称，即摇头丸／","source":"So living in Thailand taught me several things—it taught me how to be a Buddhist.","sourceHtml":"So living in Thailand taught me several things—it taught me how to be a Buddhist."},{"en":"go back and forth between...","zh":"在两地之间反复往返","source":"So yeah, going back and forth to Bangkok two or three times a year, staying as long as I could on my visa, two or three months, and then coming back to New York or working with Arthur’s Landing.","sourceHtml":"So yeah, going \u003cmark>back\u003c/mark> and \u003cmark>forth\u003c/mark> to Bangkok two or three times a year, staying as long as I could on my visa, two or three months, and then coming \u003cmark>back\u003c/mark> to New York or working with Arthur’s Landing."},{"en":"nostalgic about","zh":"对……怀有眷恋","source":"It’s funny that people are so nostalgic now about the ’80s.","sourceHtml":"It’s funny that people are so \u003cmark>nostalgic now about the ’80s\u003c/mark>."},{"en":"that’s where they’re coming from","zh":"这就是他们提问／反应背后的立场和心理来源，不是地理意义的“从哪里来”","source":"Because a lot of them are asking me, like, “Tell me a story about the 80s.” That’s where they’re coming from.","sourceHtml":"Because a lot of them are asking me, like, “Tell me a story about the 80s.” \u003cmark>That’s where they’re coming from.\u003c/mark>"},{"en":"fetishize","zh":"把某物过度理想化、迷恋成具有神奇魅力的对象，同时忽略其真实复杂性","source":"Not just the ’80s, but that downtown New York scene, I think people really fetishize.","sourceHtml":"Not just the ’80s, but that downtown New York scene, I think people really \u003cmark>fetishize\u003c/mark>."},{"en":"there’s this desperation","zh":"其中有一种近乎绝望的迫切感","source":"There’s this desperation—the idea that nothing can be like that anymore.","sourceHtml":"\u003cmark>There’s\u003c/mark> \u003cmark>this\u003c/mark> \u003cmark>desperation\u003c/mark>—the idea that nothing can be like that anymore."},{"en":"survivor of a scene","zh":"从某一文化圈及其灾难中活下来的人，既是生理幸存，也是记忆见证者","source":"But I think also, I mean, I’m one of the survivors of that scene, because a lot of people didn’t survive.","sourceHtml":"But I think also, I mean, I’m one of the \u003cmark>survivors of that scene\u003c/mark>, because a lot of people didn’t survive."},{"en":"pervasive","zh":"遍布各处、渗透整个环境的","source":"The drug use was so pervasive, and it was also linked a lot to being inspired and being excited.","sourceHtml":"The drug use was so \u003cmark>pervasive\u003c/mark>, and it was also linked a lot to being inspired and being excited."},{"en":"make it glamorous","zh":"把它包装得迷人、刺激、值得向往","source":"But in terms of romanticizing it and making it glamorous, it’s not quite accurate because there were a lot of casualties of that time.","sourceHtml":"But in terms of \u003cmark>romanticizing it and making it glamorous\u003c/mark>, it’s not quite accurate because there were a lot of casualties of that time."},{"en":"casualties","zh":"伤亡者、牺牲者","source":"But in terms of romanticizing it and making it glamorous, it’s not quite accurate because there were a lot of casualties of that time.","sourceHtml":"But in terms of romanticizing it and making it glamorous, it’s not quite accurate because there were a lot of \u003cmark>casualties\u003c/mark> of that time."},{"en":"closeted","zh":"尚未公开同性恋／酷儿身份的","source":"Not only people that were in the arts and in music, but also all the closeted people that were in business, in government, who could have had input, you know, directly or indirectly.","sourceHtml":"Not only people that were in the arts and in music, but also all the \u003cmark>closeted\u003c/mark> people that were in business, in government, who could have had input, you know, directly or indirectly."},{"en":"have input","zh":"参与决策、表达意见并对结果产生影响","source":"Not only people that were in the arts and in music, but also all the closeted people that were in business, in government, who could have had input, you know, directly or indirectly.","sourceHtml":"Not only people that were in the arts and in music, but also all the closeted people that were in business, in government, who could \u003cmark>have\u003c/mark> had \u003cmark>input\u003c/mark>, you know, directly or indirectly."},{"en":"a whole legion of people","zh":"人数极其庞大的一群人","source":"But there must be a whole legion of people who were not part of that scene, in the Midwest or in the South, who were still having an effect on society, even if it was indirect.","sourceHtml":"But there must be \u003cmark>a whole legion of people\u003c/mark> who were not part of that scene, in the Midwest or in the South, who were still having an effect on society, even if it was indirect."},{"en":"have disposable income","zh":"有扣除生活必需开支后可自由使用的钱","source":"I used to think that most of the people who were dying and who eventually died were creative people who had very wild nightlife going on, and had no disposable income and had the freedom in the major cities.","sourceHtml":"I used to think that most of the people who were dying and who eventually died were creative people who had very wild nightlife going on, and had no \u003cmark>disposable\u003c/mark> \u003cmark>income\u003c/mark> and had the freedom in the major cities."},{"en":"be wiped out","zh":"被大规模消灭、彻底夺去生命","source":"The idea of a whole generation of gay guys who were just wiped out, and many of them were the most successful and creative because that was what gave them access to the sex that eventually killed them.","sourceHtml":"The idea of a whole generation of gay guys who were just \u003cmark>wiped out\u003c/mark>, and many of them were the most successful and creative because that was what gave them access to the sex that eventually killed them."},{"en":"expat","zh":"长期居住海外的外派人士／侨民","source":"I didn’t want to be a tourist, and I didn’t want to be an expat because I saw in Hong Kong, it was really ugly, the behavior of the expats, the colonial sort of hangover, where the white people still acted like they owned the place.","sourceHtml":"\u003cmark>I didn’t want to be a tourist, and I didn’t want to be an expat\u003c/mark> because I saw in Hong Kong, it was really ugly, the behavior of the expats, the colonial sort of hangover, where the white people still acted like they owned the place."},{"en":"colonial hangover","zh":"殖民统治结束或松动后仍残留的权力结构、习惯与优越感","source":"I didn’t want to be a tourist, and I didn’t want to be an expat because I saw in Hong Kong, it was really ugly, the behavior of the expats, the colonial sort of hangover, where the white people still acted like they owned the place.","sourceHtml":"I didn’t want to be a tourist, and I didn’t want to be an expat because I saw in Hong Kong, it was really ugly, the behavior of the expats, the \u003cmark>colonial sort of hangover\u003c/mark>, where the white people still acted like they owned the place."},{"en":"act like they owned the place","zh":"表现得仿佛自己是这里的主人，批评其傲慢和支配姿态","source":"I didn’t want to be a tourist, and I didn’t want to be an expat because I saw in Hong Kong, it was really ugly, the behavior of the expats, the colonial sort of hangover, where the white people still acted like they owned the place.","sourceHtml":"I didn’t want to be a tourist, and I didn’t want to be an expat because I saw in Hong Kong, it was really ugly, the behavior of the expats, the colonial sort of hangover, where the white people still \u003cmark>acted\u003c/mark> \u003cmark>like\u003c/mark> \u003cmark>they\u003c/mark> \u003cmark>owned\u003c/mark> the \u003cmark>place\u003c/mark>."},{"en":"quiet as a mouse","zh":"安静得像只小老鼠，一声不响","source":"So, then, then New York, and then seven years ago, this guy who’s being quiet as a mouse on the sofa, we started dating.","sourceHtml":"So, then, then New York, and then seven years ago, this guy who’s being \u003cmark>quiet as a mouse\u003c/mark> on the sofa, we started dating."},{"en":"get serious","zh":"感情发展到认真、稳定并考虑长期承诺的阶段","source":"Having a partner, I don’t think I could get this far if I didn’t have good supporting partners.","sourceHtml":"Having a partner, I don’t think I could \u003cmark>get this far\u003c/mark> if I didn’t have good supporting partners."},{"en":"get this far","zh":"一路走到今天／取得如今的进展，既包括活下来，也包括迟来的事业突破","source":"Having a partner, I don’t think I could get this far if I didn’t have good supporting partners.","sourceHtml":"Having a partner, I don’t think I could \u003cmark>get this far\u003c/mark> if I didn’t have good supporting partners."},{"en":"from across your career","zh":"取自职业生涯的不同时期，强调横跨整个时间范围，而不是来自某一个阶段","source":"Whatever you do next, do you want it to be from across your career, like My Skyscraper?","sourceHtml":"Whatever you do next, do you want it to be \u003cmark>from across your career\u003c/mark>, like My Skyscraper?"},{"en":"float an idea","zh":"试探性地提出一个想法，供大家讨论，而不是作出正式决定","source":"Because one idea that was floated even before My Skyscraper came out was that some of these songs could be redone in a more realized way, maybe a more ambitious way.","sourceHtml":"Because one idea that was \u003cmark>floated\u003c/mark> even before My Skyscraper came out was that some of these songs could be redone in a more realized way, maybe a more ambitious way."},{"en":"a more realized version / way","zh":"构想得到更充分实现、制作完成度更高的版本","source":"Because one idea that was floated even before My Skyscraper came out was that some of these songs could be redone in a more realized way, maybe a more ambitious way.","sourceHtml":"Because one idea that was floated even before My Skyscraper came out was that some of these songs could be redone in \u003cmark>a more realized way\u003c/mark>, maybe a more ambitious way."},{"en":"show the process as much as the product","zh":"给予创作过程和最终作品同等的展示空间","source":"And also the idea that I’ve [worked on] some of these songs for so many years that people are interested in the process… Like, “Oh, today I feel like doing it with a beat, or today I don’t.” I want to show the process as much as the product.","sourceHtml":"And also the idea that I’ve [worked on] some of these songs for so many years that people are interested in the process… Like, “Oh, today I feel like doing it with a beat, or today I don’t.” I want to \u003cmark>show the process as much as the product\u003c/mark>."},{"en":"contagious","zh":"能感染人的、会传播开的","source":"I think my interest in the process is contagious in that way.","sourceHtml":"I think my interest in the process is \u003cmark>contagious\u003c/mark> in that way."},{"en":"hit someone up","zh":"主动联系某人，通常是为了提出请求、邀约或计划","source":"It seems like a lot of people have been hitting you up asking to collaborate since My Skyscraper eel better because most of the time I’m just… you only have so much listening time before your ears get tired, especially if you’re working.","sourceHtml":"I heard that Bob Dylan only listens to himself, so that made me feel better because most of the time I’m just… you only have so much listening time before \u003cmark>your ears get tired\u003c/mark>, especially if you’re working."},{"en":"preserve listening time","zh":"保护有限而高质量的聆听时间，不让耳朵被过量声音耗尽","source":"That time is sort of magical to me, so I have to preserve how much of it I do.","sourceHtml":"That time is sort of magical to me, so I have to \u003cmark>preserve\u003c/mark> how much of it I do."},{"en":"throw things at someone","zh":"短时间内把大量选择、提议或任务接连交给某人，并非真的“扔东西”","source":"Lately, they’ve been throwing things at me for opening acts, and also, would you like to work with this guy?","sourceHtml":"Lately, they’ve been \u003cmark>throwing things at me\u003c/mark> for opening acts, and also, would you like to work with this guy?"},{"en":"opening act","zh":"正式主秀前登台的暖场艺人","source":"Lately, they’ve been throwing things at me for opening acts, and also, would you like to work with this guy?","sourceHtml":"Lately, they’ve been throwing things at me for \u003cmark>opening\u003c/mark> \u003cmark>acts\u003c/mark>, and also, would you like to work with this guy?"},{"en":"a crash course in","zh":"在很短时间内密集了解某个领域的速成课","source":"It’s like a crash course in what’s happening with music.","sourceHtml":"It’s like \u003cmark>a crash course in\u003c/mark> what’s happening with music."},{"en":"playfulness in the production","zh":"制作手法中的游戏感，可能体现为意外音色、结构转折、幽默采样或不守常规的处理","source":"There’s a certain playfulness in the production and a boldness, which I like.","sourceHtml":"There’s a certain \u003cmark>playfulness in the production\u003c/mark> and a boldness, which I like."},{"en":"boldness","zh":"在声音选择和编排上敢于冒险、不畏突兀","source":"There’s a certain playfulness in the production and a boldness, which I like.","sourceHtml":"There’s a certain playfulness in the production and a \u003cmark>boldness\u003c/mark>, which I like."},{"en":"keep a sense of humor about something","zh":"面对令人不适或荒诞的处境，仍保持幽默和距离感","source":"I’m trying to keep a sense of humor about it, but I thought this [success] was going to happen when I was 20, when I was working with Arthur and people around us were turning into big stars overnight.","sourceHtml":"I’m trying to \u003cmark>keep a sense of humor about it\u003c/mark>, but I thought this [success] was going to happen when I was 20, when I was working with Arthur and people around us were turning into big stars overnight."},{"en":"turn into a star overnight","zh":"仿佛一夜之间成为明星，强调成功来得突然","source":"I’m trying to keep a sense of humor about it, but I thought this [success] was going to happen when I was 20, when I was working with Arthur and people around us were turning into big stars overnight.","sourceHtml":"I’m trying to keep a sense of humor about it, but I thought this [success] was going to happen when I was 20, when I was working with Arthur and people around us were \u003cmark>turning into big stars overnight\u003c/mark>."},{"en":"take someone away from someone","zh":"把某人从一段关系或合作中“抢走”","source":"Arthur wouldn’t introduce me to Seymour Stein because he was so afraid Seymour Stein would get a crush on me and take me away from him and sign me and then forget about Arthur.","sourceHtml":"Arthur wouldn’t introduce me to Seymour Stein because he was so afraid Seymour Stein would get a crush on me and \u003cmark>take me away from him\u003c/mark> and sign me and then forget about Arthur."},{"en":"orchestrate","zh":"精心安排、操控一连串事情","source":"I’m trying to keep a sense of humor about it, but I thought this [success] was going to happen when I was 20, when I was working with Arthur and people around us were turning into big stars overnight.","sourceHtml":"I’m trying to keep a sense of humor about it, but I thought this [success] was going to happen when I was 20, when I was working with Arthur ople actively, especially at places like CBGB."},{"en":"a legendary figure","zh":"被文化记忆塑造成传奇的人物，不仅指“非常有名”","source":"Obviously he’s become this very legendary figure, especially for a lot of young people, through books, documentaries, the music itself, and a lot has been written about him.","sourceHtml":"Obviously he’s become this very \u003cmark>legendary figure\u003c/mark>, especially for a lot of young people, through books, documentaries, the music itself, and a lot has been written about him."},{"en":"legacy","zh":"一个人去世或退出历史舞台后留下的作品、影响及公众形象","source":"I’m interested in whether there’s a side of him you knew that you feel maybe isn’t as widely understood now, in terms of what his legacy has become.","sourceHtml":"I’m interested in whether there’s a side of him you knew that you feel maybe isn’t as widely understood now, in terms of what his \u003cmark>legacy\u003c/mark> has become."},{"en":"isn’t as widely understood","zh":"没有得到同等广泛或准确的理解","source":"I’m interested in whether there’s a side of him you knew that you feel maybe isn’t as widely understood now, in terms of what his legacy has become.","sourceHtml":"I’m interested in whether there’s a side of him you knew that you feel maybe \u003cmark>isn’t as widely understood now\u003c/mark>, in terms of what his legacy has become."},{"en":"naturally funny","zh":"无需刻意讲笑话便天生具有幽默感","source":"There’s only a few guys I’ve met that have been actually naturally really funny.","sourceHtml":"There’s only a few guys I’ve met that have been actually \u003cmark>naturally really funny\u003c/mark>."},{"en":"a weapon for him","zh":"一种帮助他克服弱点、应对社交环境的有力工具","source":"That was kind of a weapon for him, because he was shy.","sourceHtml":"That was kind of \u003cmark>a weapon for him\u003c/mark>, because he was shy."},{"en":"get through to people","zh":"穿透隔阂，使别人真正理解、接受或感受到自己","source":"With humor, he could get through to people.","sourceHtml":"With humor, he could \u003cmark>get through to people\u003c/mark>."},{"en":"put dirty jokes into songs","zh":"把带有性暗示或露骨内容的笑话写进歌里","source":"And also, we were basically horny all the time, and that was the focus of even our songwriting, because we were also trying to find ways of putting dirty jokes into the songs.","sourceHtml":"And also, we were basically horny all the time, and that was the focus of even our songwriting, because we were also trying to find ways of \u003cmark>putting dirty jokes into the songs\u003c/mark>."},{"en":"a blast","zh":"极其好玩、令人兴奋的事","source":"We thought that was just a blast.","sourceHtml":"We thought that was just \u003cmark>a blast\u003c/mark>."},{"en":"in the back/front of our minds","zh":"处在意识的背景／前景","source":"What was maybe in the back of our minds was more, in Arthur’s case, it was more religious.","sourceHtml":"What was maybe in the \u003cmark>back\u003c/mark> of \u003cmark>our\u003c/mark> \u003cmark>minds\u003c/mark> was more, in Arthur’s case, it was more religious."},{"en":"easygoing","zh":"随性、宽松、不拘束","source":"But even though things were pretty easygoing in those days, it just didn’t happen.","sourceHtml":"But even though things were pretty \u003cmark>easygoing\u003c/mark> in those days, it just didn’t happen."},{"en":"be graceful about something","zh":"面对拒绝或失望时表现得体、不纠缠也不恼怒","source":"And then immediately, he was graceful about it.","sourceHtml":"And then immediately, he was \u003cmark>graceful about it\u003c/mark>."},{"en":"it just didn’t happen","zh":"这件事就是没有发生","source":"But even though things were pretty easygoing in those days, it just didn’t happen.","sourceHtml":"But even though things were pretty easygoing in those days, it \u003cmark>just\u003c/mark> \u003cmark>didn’t\u003c/mark> \u003cmark>happen\u003c/mark>."},{"en":"straightforward playing","zh":"直接、不炫技、不做过度修饰的演奏方式","source":"I played guitar a little bit for him, and he said, “That’s what I’m looking for,” because the way I played guitar was very straightforward.","sourceHtml":"I played guitar a little bit for him, and he said, “That’s what I’m looking for,” because the way I played guitar was very \u003cmark>straightforward\u003c/mark>."},{"en":"plain","zh":"朴素、裸露，不依赖复杂编曲","source":"The way we played those songs was really country at that point, because it was very plain and straightforward.","sourceHtml":"The way we played those songs was really country at that point, because it was very \u003cmark>plain and straightforward\u003c/mark>."},{"en":"augment something with...","zh":"用某种元素补充、扩展原有材料","source":"So my role was to sort of augment that with funky elements because I was listening to funk music constantly at that time, and trying to find a way of looking for the groove and maintaining the energy of the groove as a really serious endeavor.","sourceHtml":"So my role was to sort of \u003cmark>augment that with funky elements\u003c/mark> because I was listening to funk music constantly at that time, and trying to find a way of looking for the groove and maintaining the energy of the groove as a really serious endeavor."},{"en":"funky elements","zh":"放克式的切分、节奏重心、贝斯感或身体性，而不是日常义的“古怪”","source":"So my role was to sort of augment that with funky elements because I was listening to funk music constantly at that time, and trying to find a way of looking for the groove and maintaining the energy of the groove as a really serious endeavor.","sourceHtml":"So my role was to sort of \u003cmark>augment that with funky elements\u003c/mark> because I was listening to funk music constantly at that time, and trying to find a way of looking for the groove and maintaining the energy of the groove as a really serious endeavor."},{"en":"look for the groove","zh":"寻找能让乐手与听者共同进入的稳定律动感","source":"So my role was to sort of augment that with funky elements because I was listening to funk music constantly at that time, and trying to find a way of looking for the groove and maintaining the energy of the groove as a really serious endeavor.","sourceHtml":"So my role was to sort of augment that with funky elements because I was listening to funk music constantly at that time, and trying to find a way of \u003cmark>looking for the groove and maintaining the energy of the groove\u003c/mark> as a really serious endeavor."},{"en":"maintain the energy of the groove","zh":"让律动的推动力在演奏过程中持续不泄","source":"So my role was to sort of augment that with funky elements because I was listening to funk music constantly at that time, and trying to find a way of looking for the groove and maintaining the energy of the groove as a really serious endeavor.","sourceHtml":"So my role was to sort of augment that with funky elements because I was listening to funk music constantly at that time, and trying to find a way of \u003cmark>looking for the groove and maintaining the energy of the groove\u003c/mark> as a really serious endeavor."},{"en":"sexuality","zh":"不仅指性行为，也包括欲望、性取向、性身份及一个人与性的整体关系","source":"Are sex and sexuality very intertwined with creativity for you?","sourceHtml":"Are sex and \u003cmark>sexuality\u003c/mark> very intertwined with creativity for you?"},{"en":"subject matter","zh":"作品持续处理、表现的题材内容","source":"I mean, there’s nothing else—obviously that’s part of my subject matter.","sourceHtml":"I mean, there’s nothing else—obviously that’s part of my \u003cmark>subject matter\u003c/mark>."},{"en":"before things got really heavy","zh":"在局势变得极其沉重、危险和难以承受之前","source":"I just want it to be more like history: The idea of like… What did it feel like to be in a situation with basically no responsibility, before things got really heavy, before the AIDS thing destroyed everything?","sourceHtml":"I just want it to be more like history: The idea of like… What did it feel like to be in a situation with basically no responsibility, \u003cmark>before things got really heavy\u003c/mark>, before the AIDS thing destroyed everything?"},{"en":"it wasn’t a big deal","zh":"当时不会被视为严重、需要特别解释的事","source":"At a point where everything was OK, [when] you could sleep with a straight guy, and it wasn’t a big deal?","sourceHtml":"At a point where everything was OK, [when] you could sleep with a straight guy, and it \u003cmark>wasn’t\u003c/mark> a \u003cmark>big\u003c/mark> \u003cmark>deal\u003c/mark>?"},{"en":"be fueled by cocaine","zh":"由可卡因刺激、推动","source":"On top of that, the music that was being written was often fueled by cocaine, either in the listener or in the people producing it.","sourceHtml":"On top of that, the music that was being written was often \u003cmark>fueled by cocaine\u003c/mark>, either in the listener or in the people producing it."},{"en":"sparkling production","zh":"明亮、璀璨、细节闪耀而高度精致的制作质感","source":"There was this tremendous sparkling production in the music that was being done, especially in things like ABBA.","sourceHtml":"There was this \u003cmark>tremendous sparkling production\u003c/mark> in the music that was being done, especially in things like ABBA."},{"en":"beyond ecstasy","zh":"超越狂喜","source":"To hear ABBA at the Ice Palace when everybody was on Quaaludes and coke, it was beyond ecstasy.","sourceHtml":"To hear ABBA at the Ice Palace when everybody was on Quaaludes and coke, it was \u003cmark>beyond ecstasy\u003c/mark>."},{"en":"an out-of-body experience","zh":"仿佛意识离开身体的体验，常用于形容极端强烈的音乐、宗教或感官经验","source":"It was almost like an out-of-body experience where the excitement is palpable, almost like a visceral thing, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a sublime thing.","sourceHtml":"It was almost like \u003cmark>an out-of-body experience\u003c/mark> where the excitement is palpable, almost like a visceral thing, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a sublime thing."},{"en":"palpable","zh":"强烈、真实到几乎能触摸得到","source":"It was almost like an out-of-body experience where the excitement is palpable, almost like a visceral thing, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a sublime thing.","sourceHtml":"It was almost like an out-of-body experience where the excitement is \u003cmark>palpable\u003c/mark>, almost like a visceral thing, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a sublime thing."},{"en":"visceral","zh":"直接作用于肉身和本能的，而非经过理性分析才感受到的","source":"It was almost like an out-of-body experience where the excitement is palpable, almost like a visceral thing, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a sublime thing.","sourceHtml":"It was almost like an out-of-body experience where the excitement is palpable, almost like a \u003cmark>visceral thing\u003c/mark>, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a sublime thing."},{"en":"the sublime","zh":"美学意义上的“崇高”——强度巨大、既令人震撼又超出日常尺度的体验","source":"It was almost like an out-of-body experience where the excitement is palpable, almost like a visceral thing, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a sublime thing.","sourceHtml":"It was almost like an out-of-body experience where the excitement is palpable, almost like a visceral thing, and then to have this music providing this accompaniment for this kind of activity… I can understand why people see that as a \u003cmark>sublime\u003c/mark> thing."},{"en":"the point that’s really interesting","zh":"真正值得追问、最有创作价值的那个节点","source":"That’s the point that’s really interesting—what happens at dawn, what’s happening in your bed, and what music you play when you’re really high but you don’t want to dance anymore, but you still want to move.","sourceHtml":"That’s \u003cmark>the point that’s really interesting\u003c/mark>—what happens at dawn, what’s happening in your bed, and what music you play when you’re really high but you don’t want to dance anymore, but you still want to move."},{"en":"what happens at dawn","zh":"不只是时间描写，也指夜生活高潮之后更私密、更脆弱的阶段","source":"That’s the point that’s really interesting—what happens at dawn, what’s happening in your bed, and what music you play when you’re really high but you don’t want to dance anymore, but you still want to move.","sourceHtml":"That’s the point that’s really interesting—\u003cmark>what\u003c/mark> \u003cmark>happens\u003c/mark> at \u003cmark>dawn\u003c/mark>, \u003cmark>what’s\u003c/mark> \u003cmark>happening\u003c/mark> in your bed, and \u003cmark>what\u003c/mark> music you play when you’re really high but you don’t want to dance anymore, but you still want to move."},{"en":"make it to that intersection","zh":"成功抵达并表现出多种状态交汇的位置","source":"I think like, “Boss Trix” and “Go For The Night” really make it to that intersection.","sourceHtml":"I think like, “Boss Trix” and “Go For The Night” really \u003cmark>make it to that intersection\u003c/mark>."},{"en":"when the AIDS crisis broke","zh":"艾滋病危机突然暴发、进入公众现实","source":"Well, when the AIDS thing broke, I was dating a medical student, and I lived in the Caribbean in a medical school on Montserrat Island.","sourceHtml":"Well, when the AIDS thing \u003cmark>broke\u003c/mark>, I was dating a medical student, and I lived in the Caribbean in a medical school on Montserrat Island."},{"en":"practice being safe","zh":"持续采取安全性行为措施，而不是只“知道安全知识”","source":"So he taught me from the very beginning how to be safe, so I was practicing being safe even before [AIDS], just on the basis of avoiding any kind of disease.","sourceHtml":"So he taught me from the very beginning how to be safe, so I was \u003cmark>practicing being safe\u003c/mark> even before [AIDS], just on the basis of avoiding any kind of disease."},{"en":"go through surgery / a crisis","zh":"亲身经历手术或危机，并承受其全过程","source":"Once you survive a crisis like that—and also I went through some surgery where I almost died when I was around 60—you kind of can’t take things too seriously anymore.","sourceHtml":"Once you survive a crisis like that—and also I \u003cmark>went through\u003c/mark> some surgery where I almost died when I was around 60—you kind of can’t take things too seriously anymore."},{"en":"can’t take things too seriously","zh":"不再让所有事情都压得自己喘不过气","source":"Once you survive a crisis like that—and also I went through some surgery where I almost died when I was around 60—you kind of can’t take things too seriously anymore.","sourceHtml":"Once you survive a crisis like that—and also I went through some surgery where I almost died when I was around 60—you kind of \u003cmark>can’t take things too seriously anymore\u003c/mark>."},{"en":"be in the moment","zh":"把注意力放在正在发生的生活里，活在当下","source":"You have to be more in the moment.","sourceHtml":"You have to be more \u003cmark>in the moment\u003c/mark>."},{"en":"just sit with someone","zh":"不急于说话、劝解或解决问题，只是安静地陪伴对方","source":"Even when I went to visit Arthur when he was sick, I was terrified, but Allen Ginsberg was living downstairs, and he would go up and see Arthur every day and just sit with him.","sourceHtml":"Even when I went to visit Arthur when he was sick, I was terrified, but Allen Ginsberg was living downstairs, and he would go up and see Arthur every day and \u003cmark>just sit with him\u003c/mark>."},{"en":"just be there","zh":"在对方需要时在场、陪着他","source":"When I asked Allen what to do, he said, “Just be there.”","sourceHtml":"When I asked Allen what to do, he said, “\u003cmark>Just be there.\u003c/mark>”"},{"en":"cloud everything","zh":"给所有事情笼罩上一层阴影，使判断、快乐和关系都受到恐惧影响","source":"It clouded everything after that, especially for the gay men who were as active as I was—there was no reason not to be at that point, nothing stopping us, nothing in our way, especially in places like New York.","sourceHtml":"It \u003cmark>clouded everything\u003c/mark> after that, especially for the gay men who were as active as I was—there was no reason not to be at that point, nothing stopping us, nothing in our way, especially in places like New York."},{"en":"nothing in our way","zh":"没有阻碍、限制或后果挡在面前","source":"It clouded everything after that, especially for the gay men who were as active as I was—there was no reason not to be at that point, nothing stopping us, nothing in our way, especially in places like New York.","sourceHtml":"It clouded everything after that, especially for the gay men who were as active as I was—there was no reason not to be at that point, \u003cmark>nothing\u003c/mark> stopping us, \u003cmark>nothing\u003c/mark> in \u003cmark>our\u003c/mark> \u003cmark>way\u003c/mark>, especially in places like New York."},{"en":"the rug is ripped out from under you","zh":"赖以站立的基础突然被抽走，原有安全感与生活结构骤然崩塌","source":"To have that taken away is like, the rug is ripped out from under you, socially as well as culturally, because a lot of the brightest people in the queer world who were doing amazing things were just gone.","sourceHtml":"To have that taken away is like, \u003cmark>the rug is ripped out from under you\u003c/mark>, socially as well as culturally, because a lot of the brightest people in the queer world who were doing amazing things were just gone."},{"en":"a palpable sense of everything crumbling","zh":"一切正在瓦解的感觉强烈得近乎可以触摸","source":"There was a palpable sense of everything crumbling around you in terms of the culture, and even social interaction became problematic.","sourceHtml":"There was \u003cmark>a palpable sense of everything crumbling around you\u003c/mark> in terms of the culture, and even social interaction became problematic."},{"en":"you can’t really stop","zh":"既可理解为无法阻止人们继续发生性关系，也可理解为生命和欲望不会彻底停止","source":"To have that taken away is like, the rug is ripped out from under you, socially as well as culturally, because a lot of the brightest people in the queer world who were doing amazing things were just gone.","sourceHtml":"To have that taken away is like, \u003cmark>the rug is ripped out from under you\u003c/mark>, socially as well as culturally, because a lot of the brightest people in the queer world who were doing amazing things were just gone."},{"en":"remind someone of the time","zh":"唤回对那个时期的真实记忆","source":"I’m interested in how you feel when you see that stuff—whether it reminds you of the time, or just feels like a total fantasy of what you experienced.","sourceHtml":"I’m interested in how you feel when you see that stuff—whether it \u003cmark>reminds you of the time\u003c/mark>, or just feels like a total fantasy of what you experienced."},{"en":"a fantasy of what you experienced","zh":"覆盖在亲历经验之上的想象版本，未必是刻意撒谎，却可能把复杂现实美化成可消费的神话","source":"I’m interested in how you feel when you see that stuff—whether it reminds you of the time, or just feels like a total fantasy of what you experienced.","sourceHtml":"I’m interested in how you feel when you see that stuff—whether it reminds you of the time, or just feels like \u003cmark>a total fantasy of what you experienced\u003c/mark>."},{"en":"project a fantasy on top of reality","zh":"把预先构造的幻想覆盖在真实经历之上","source":"It’s kind of a fantasy that’s projected on top of what was actually happening.","sourceHtml":"It’s kind of \u003cmark>a fantasy that’s projected on top of what was actually happening\u003c/mark>."},{"en":"relive something through music","zh":"通过音乐产生重新经历某段过去的感觉","source":"You can have this fantasy about what it was like, and you can feel that, and think you’re reliving that through the music.","sourceHtml":"You can have this fantasy about what it was like, and you can feel that, and think you’re reliving that \u003cmark>through\u003c/mark> the \u003cmark>music\u003c/mark>."},{"en":"despite what was going on","zh":"尽管周围发生着那些事","source":"But the music that happened through those times is despite what was going on, really, and in some ways is the best part of [it.]","sourceHtml":"But the music that happened through those times is \u003cmark>despite what was going on\u003c/mark>, really, and in some ways is the best part of [it.]"},{"en":"be surrounded by casualties","zh":"周围布满因某种环境或目标而受伤、毁灭的人","source":"But it was surrounded by casualties, because Warhol, like me, was totally ruthless about what he wanted, and he didn’t care who the casualties were, particularly the people around him who were on speed.","sourceHtml":"But it was \u003cmark>surrounded by casualties\u003c/mark>, because Warhol, like me, was totally ruthless about what he wanted, and he didn’t care who the casualties were, particularly the people around him who were on speed."},{"en":"be ruthless about what one wants","zh":"为实现目标极其冷酷，不让同情或他人的损失妨碍自己","source":"But it was surrounded by casualties, because Warhol, like me, was totally ruthless about what he wanted, and he didn’t care who the casualties were, particularly the people around him who were on speed.","sourceHtml":"But it was surrounded by casualties, because Warhol, like me, was totally \u003cmark>ruthless about what he wanted\u003c/mark>, and he didn’t care who the casualties were, particularly the people around him who were on speed."},{"en":"take advantage of something","zh":"利用某种处境为自己获益","source":"He was just observing it and taking advantage of it by photographing them and filming them.","sourceHtml":"He was just observing it and \u003cmark>taking advantage of it\u003c/mark> by photographing them and filming them."},{"en":"part of the glamour","zh":"被包装成迷人传奇的一部分，连毁灭都被美学化","source":"If they ended up overdosing, to him that was just part of the glamour of the whole thing.","sourceHtml":"If they ended up overdosing, to him that was just \u003cmark>part of the glamour of the whole thing\u003c/mark>."},{"en":"package things","zh":"把人、形象和文化材料组织、塑造成公众容易识别和消费的形式","source":"He knew how to package things.","sourceHtml":"He knew how to \u003cmark>package things\u003c/mark>."},{"en":"media genius","zh":"懂得通过媒介、形象与注意力创造影响力的人","source":"He was the first real superstar genius of media, in a way that Trump is as well.","sourceHtml":"He was the first real superstar \u003cmark>genius\u003c/mark> of \u003cmark>media\u003c/mark>, in a way that Trump is as well."},{"en":"hold up","zh":"经过多年后仍有说服力、仍然成立，没有显得过时或空洞","source":"But you also look at, from those times, which music holds up, which art holds up.","sourceHtml":"But you also look at, from those times, which music \u003cmark>holds up\u003c/mark>, which art holds up."},{"en":"recognize what is exciting in the ordinary","zh":"发现平凡日常物中的视觉、文化或情感能量","source":"A lot of the pop art holds up because it really had a lot of passion behind it, for recognizing what was exciting in the ordinary, like in a Coke can.","sourceHtml":"A lot of the pop art holds up because it really had a lot of passion behind it, for \u003cmark>recognizing what was exciting in the ordinary\u003c/mark>, like in a Coke can."},{"en":"go on and on about something","zh":"长时间反复谈论某事","source":"Andy went on and on about how beautiful the Coke can was, and how special it was because it was democratic, because everyone could have the same Coke can.","sourceHtml":"Andy \u003cmark>went on and on about\u003c/mark> how beautiful the Coke can was, and how special it was because it was democratic, because everyone could have the same Coke can."},{"en":"connect with people in a visceral way","zh":"绕过高深理论，直接在身体、本能和感官层面触动大众","source":"In terms of philosophy, that’s really deep, and also the idea of recognizing that industrial design and graphic design were not only just as interesting and valuable as so-called formal art, but in some ways they were more exciting because they were connecting with people in a visceral way… Andy was a genius to realize that and to flip it around and say, “OK, let’s put that commercial world into the art world, and to give it a value that it never had.”","sourceHtml":"In terms of philosophy, that’s really deep, and also the idea of recognizing that industrial design and graphic design were not only just as interesting and valuable as so-called formal art, but in some ways they were more exciting because they were \u003cmark>connecting with people in a visceral way\u003c/mark>… Andy was a genius to realize that and to flip it around and say, “OK, let’s put that commercial world into the art world, and to give it a value that it never had.”"},{"en":"flip it around","zh":"把原有关系或等级颠倒过来，换一个方向理解","source":"In terms of philosophy, that’s really deep, and also the idea of recognizing that industrial design and graphic design were not only just as interesting and valuable as so-called formal art, but in some ways they were more exciting because they were connecting with people in a visceral way… Andy was a genius to realize that and to flip it around and say, “OK, let’s put that commercial world into the art world, and to give it a value that it never had.”","sourceHtml":"In terms of philosophy, that’s really deep, and also the idea of recognizing that industrial design and graphic design were not only just as interesting and valuable as so-called formal art, but in some ways they were more exciting because they were connecting with people in a visceral way… Andy was a genius to realize that and to \u003cmark>flip it around\u003c/mark> and say, “OK, let’s put that commercial world into the art world, and to give it a value that it never had.”"},{"en":"capture inflections","zh":"捕捉说话时细微的升降调、重音和语气变化","source":"At that time, what Arthur and me were doing [was] the same thing with very ordinary ways of speaking and very ordinary observations that we saw just walking around the East Village and trying to capture those inflections in what you were singing.","sourceHtml":"At that time, what Arthur and me were doing [was] the same thing with very ordinary ways of speaking and very ordinary observations that we saw just walking around the East Village and trying to \u003cmark>capture those inflections\u003c/mark> in what you were singing."},{"en":"make singing as close to talking","zh":"减少程式化歌唱腔，使旋律保留自然说话的节奏与亲密感","source":"Trying to make singing as close to talking.","sourceHtml":"Trying to \u003cmark>make singing as close to talking\u003c/mark>."},{"en":"a real character","zh":"个性极强、令人难忘甚至有些古怪的人","source":"Really, really interesting guy and a real character, but he represents the other side of Buddhism, which is the idea of going to talk about total freedom as a teacher.","sourceHtml":"Really, really interesting guy and \u003cmark>a real character\u003c/mark>, but he represents the other side of Buddhism, which is the idea of going to talk about total freedom as a teacher."},{"en":"give total permission","zh":"给予彻底探索、成为自己并超越既有规则的许可","source":"You have to give total permission because you cannot develop total freedom without that permission, and so the idea of a teacher is not one that just teaches.","sourceHtml":"You have to \u003cmark>give total permission\u003c/mark> because you cannot develop total freedom without that permission, and so the idea of a teacher is not one that just teaches."},{"en":"transcend","zh":"超越既有知识、形式或限制，而不是简单拒绝学习","source":"But if you don’t have the permission to transcend that, then you’re not getting anywhere.","sourceHtml":"But if you don’t have \u003cmark>the permission to transcend that\u003c/mark>, then you’re not getting anywhere."},{"en":"there’s wisdom in craziness","zh":"不合常规、看似疯狂的行为或经验中也可能包含洞见","source":"You know, my teacher Chögyam Trungpa, his tradition is what’s called “crazy wisdom.” The idea is that there’s wisdom in craziness, and it’s not this subtle, sophisticated approach to Buddhism, where it’s a rarefied thing, and it’s mystical, and it’s ancient.","sourceHtml":"You know, my teacher Chögyam Trungpa, his tradition is what’s called “crazy wisdom.” The idea is that \u003cmark>there’s wisdom in craziness\u003c/mark>, and it’s not this subtle, sophisticated approach to Buddhism, where it’s a rarefied thing, and it’s mystical, and it’s ancient."},{"en":"a rarefied thing","zh":"被处理成远离日常、只有少数人能接近的高深事物","source":"You know, my teacher Chögyam Trungpa, his tradition is what’s called “crazy wisdom.” The idea is that there’s wisdom in craziness, and it’s not this subtle, sophisticated approach to Buddhism, where it’s a rarefied thing, and it’s mystical, and it’s ancient.","sourceHtml":"You know, my teacher Chögyam Trungpa, his tradition is what’s called “crazy wisdom.” The idea is that there’s wisdom in craziness, and it’s not this subtle, sophisticated approach to Buddhism, where it’s \u003cmark>a rarefied thing\u003c/mark>, and it’s mystical, and it’s ancient."},{"en":"see talent in someone","zh":"辨认出某人的潜力，尤其是在这种潜力尚未得到普遍承认时","source":"Allen Ginsberg—as much [for] his own talent as a writer, [as] his ability to see talent in other people and to nurture it and to develop it and to collaborate.","sourceHtml":"Allen Ginsberg—as much [for] his own talent as a writer, [as] his ability to \u003cmark>see talent in other people\u003c/mark> and to nurture it and to develop it and to collaborate."},{"en":"nurture and develop talent","zh":"为才华提供时间、鼓励、资源和合作，使其逐步成熟","source":"Allen Ginsberg—as much [for] his own talent as a writer, [as] his ability to see talent in other people and to nurture it and to develop it and to collaborate.","sourceHtml":"Allen Ginsberg—as much [for] his own talent as a writer, [as] his ability to see talent in other people and to \u003cmark>nurture it and to develop it and to collaborate\u003c/mark>."},{"en":"a revelation","zh":"带来全新认识、仿佛突然打开视野的作品或经验","source":"I mean, Einstein on the Beach was a revelation.","sourceHtml":"I mean, Einstein on the Beach was \u003cmark>a revelation\u003c/mark>."},{"en":"mind-bending","zh":"大幅扭转常规认知、复杂新奇得令人震撼","source":"There’s things that Joni Mitchell does which are just mind-bending in terms of her approach to composition and her harmonies.","sourceHtml":"There’s things that Joni Mitchell does which are just \u003cmark>mind-bending\u003c/mark> in terms of her approach to composition and her harmonies."},{"en":"approach to composition","zh":"处理作曲、组织音乐材料的整体方法","source":"There’s things that Joni Mitchell does which are just mind-bending in terms of her approach to composition and her harmonies.","sourceHtml":"There’s things that Joni Mitchell does which are just mind-bending in terms of her \u003cmark>approach\u003c/mark> to \u003cmark>composition\u003c/mark> and her harmonies."},{"en":"can’t help oneself","zh":"忍不住、无法控制自己不做某事","source":"One quality of geniuses is that they can’t help themselves.","sourceHtml":"One quality of geniuses is that \u003cmark>they can’t help themselves\u003c/mark>."},{"en":"be left with so much stuff","zh":"某人离世后，我们仍拥有他留下的大量材料和作品","source":"It’d be like, cathedrals full of stuff.","sourceHtml":"It’d be like, \u003cmark>cathedrals full of stuff\u003c/mark>."},{"en":"cathedrals full of stuff","zh":"足以填满一座座大教堂的作品，夸张地写数量、规模和未实现的可能性","source":"It’d be like, cathedrals full of stuff.","sourceHtml":"It’d be like, \u003cmark>cathedrals full of stuff\u003c/mark>."},{"en":"inform what I do","zh":"为我的实践提供知识、视角并塑造其方法","source":"I’ve now studied dance and I studied architecture, I’ve done these other things that inform what I do.","sourceHtml":"I’ve now studied dance and I studied architecture, I’ve done these other things that \u003cmark>inform what I do\u003c/mark>."},{"en":"bring things together","zh":"把不同学科、经验和审美汇合成新的整体","source":"It’s not only one focus, it’s kind of bringing things together.","sourceHtml":"It’s not only one focus, it’s kind of \u003cmark>bringing things together\u003c/mark>."},{"en":"be demure about something","zh":"对某事表现得矜持、克制，不主动夸耀","source":"But no, I think I have to be demure about that.","sourceHtml":"But no, I think I have to be \u003cmark>demure about that\u003c/mark>."},{"en":"it’s not for me to say","zh":"这不应由我本人下结论，常用于回避自我赞美或利益相关的判断","source":"It’s not for me to say.","sourceHtml":"It’s \u003cmark>not\u003c/mark> for me to \u003cmark>say\u003c/mark>."},{"en":"sample someone / someone’s work","zh":"从某人的既有录音中截取声音片段，并放入一首新作品","source":"What did you think of that sample, and what do you think of him, as someone who basically self-identifies as an Arthur acolyte?","sourceHtml":"What did you think of that \u003cmark>sample\u003c/mark>, and what do you think of him, as someone who basically self-identifies as an Arthur acolyte?"},{"en":"self-identify as","zh":"主动把自己定义、定位为某种身份","source":"What did you think of that sample, and what do you think of him, as someone who basically self-identifies as an Arthur acolyte?","sourceHtml":"What did you think of that sample, and what do you think of him, as someone who basically \u003cmark>self-identifies as an Arthur acolyte\u003c/mark>?"},{"en":"an acolyte","zh":"原指宗教侍从，这里指忠实追随某位前辈的创作者","source":"What did you think of that sample, and what do you think of him, as someone who basically self-identifies as an Arthur acolyte?","sourceHtml":"What did you think of that sample, and what do you think of him, as someone who basically \u003cmark>self-identifies as an Arthur acolyte\u003c/mark>?"},{"en":"be folded into a track","zh":"被自然地融入一首歌的整体结构与声音织体，不显得生硬或孤立","source":"I found out about the sample a couple of years ago by doing a Google search for samples of my work—I hadn’t heard of him, but I liked the way the sample was folded into his track.","sourceHtml":"I found out about the sample a couple of years ago by doing a Google search for samples of my work—I hadn’t heard of him, but I liked the way \u003cmark>the sample was folded into his track\u003c/mark>."},{"en":"a devotee","zh":"热诚而长期的追随者、拥护者","source":"I understand now he’s an Arthur Russell devotee and has used a sample of Arthur’s previously.","sourceHtml":"I understand now he’s an Arthur Russell \u003cmark>devotee\u003c/mark> and has used a sample of Arthur’s previously."},{"en":"previously","zh":"此前、早先","source":"I understand now he’s an Arthur Russell devotee and has used a sample of Arthur’s previously.","sourceHtml":"I understand now he’s an Arthur Russell devotee and has used a sample of Arthur’s \u003cmark>previously\u003c/mark>."},{"en":"save space for something in your brain","zh":"刻意不给大脑塞
