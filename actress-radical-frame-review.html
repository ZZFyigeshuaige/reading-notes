<script>
let cards = [{"en":"pushed him off that path","zh":"把他推离原本的人生道路","source":"Darren Cunningham was a professional footballer for English football club West Bromwich Albion F.C. before an injury pushed him off that path and he found himself drifting towards club music and DJing instead.","sourceHtml":"Darren Cunningham was a professional footballer for English football club West Bromwich Albion F.C. before an injury \u003cmark>pushed him off that path\u003c/mark> and he found himself drifting towards club music and DJing instead."},{"en":"drifting towards","zh":"在没有明确计划的情况下逐渐靠近","source":"Darren Cunningham was a professional footballer for English football club West Bromwich Albion F.C. before an injury pushed him off that path and he found himself drifting towards club music and DJing instead.","sourceHtml":"Darren Cunningham was a professional footballer for English football club West Bromwich Albion F.C. before an injury pushed him off that path and he found himself \u003cmark>drifting towards\u003c/mark> club music and DJing instead."},{"en":"didn’t waste any time in getting involved in","zh":"很快便投入其中，丝毫没有耽搁","source":"After relocating to London from Wolverhampton in the West Midlands, he didn’t waste any time in getting involved in the capital’s underground music scene of the early ‘00s, establishing his club night Werkdiscs, followed by a label of the same name in 2004.","sourceHtml":"After relocating to London from Wolverhampton in the West Midlands, he \u003cmark>didn’t waste any time in getting involved in\u003c/mark> the capital’s underground music scene of the early ‘00s, establishing his club night Werkdiscs, followed by a label of the same name in 2004."},{"en":"hypnagogic debut","zh":"带有入睡前朦胧、意识游移质感的首作","source":"His hypnagogic debut Hazyville arrived in 2008; he made a Splazsh (sorry!) in 2010, and for the next 16 years, Cunningham busied himself making collaged sketches refracted through multiple angles that present his uniquely deconstructed slant on avant-techno and dance music.","sourceHtml":"His \u003cmark>hypnagogic debut\u003c/mark> Hazyville arrived in 2008; he made a Splazsh (sorry!) in 2010, and for the next 16 years, Cunningham busied himself making collaged sketches refracted through multiple angles that present his uniquely deconstructed slant on avant-techno and dance music."},{"en":"made a Splazsh","zh":"制造了一次“飞溅”","source":"His hypnagogic debut Hazyville arrived in 2008; he made a Splazsh (sorry!) in 2010, and for the next 16 years, Cunningham busied himself making collaged sketches refracted through multiple angles that present his uniquely deconstructed slant on avant-techno and dance music.","sourceHtml":"His hypnagogic debut Hazyville arrived in 2008; he \u003cmark>made a Splazsh\u003c/mark> (sorry!) in 2010, and for the next 16 years, Cunningham busied himself making collaged sketches refracted through multiple angles that present his uniquely deconstructed slant on avant-techno and dance music."},{"en":"busied himself making collaged sketches refracted through multiple angles","zh":"长期忙于制作从多重角度折射出来的拼贴式速写","source":"His hypnagogic debut Hazyville arrived in 2008; he made a Splazsh (sorry!) in 2010, and for the next 16 years, Cunningham busied himself making collaged sketches refracted through multiple angles that present his uniquely deconstructed slant on avant-techno and dance music.","sourceHtml":"His hypnagogic debut Hazyville arrived in 2008; he made a Splazsh (sorry!) in 2010, and for the next 16 years, Cunningham \u003cmark>busied himself making collaged sketches refracted through multiple angles\u003c/mark> that present his uniquely deconstructed slant on avant-techno and dance music."},{"en":"returns to much of the click-y-clack-y micro-house detailing","zh":"回到那种咔嗒作响、细部精密的微型浩室语言","source":"As Actress, Cunningham’s 10th album Radical Frame—his first for Ninja Tune in three years—returns to much of the click-y-clack-y micro-house detailing of Hazyville and other prismatic Actress records, but enlarges its vision with grander, sweeping gestures.","sourceHtml":"As Actress, Cunningham’s 10th album Radical Frame—his first for Ninja Tune in three years—\u003cmark>returns to much of the click-y-clack-y micro-house detailing\u003c/mark> of Hazyville and other prismatic Actress records, but enlarges its vision with grander, sweeping gestures."},{"en":"enlarges its vision with grander, sweeping gestures","zh":"以更宏阔、更具席卷感的处理扩大作品视野","source":"As Actress, Cunningham’s 10th album Radical Frame—his first for Ninja Tune in three years—returns to much of the click-y-clack-y micro-house detailing of Hazyville and other prismatic Actress records, but enlarges its vision with grander, sweeping gestures.","sourceHtml":"As Actress, Cunningham’s 10th album Radical Frame—his first for Ninja Tune in three years—returns to much of the click-y-clack-y micro-house detailing of Hazyville and other prismatic Actress records, but \u003cmark>enlarges its vision with grander, sweeping gestures\u003c/mark>."},{"en":"gorgeously swollen vocal passages","zh":"华美地膨胀起来的人声段落","source":"Speaking to different moods, there are elliptical piano figures, gorgeously swollen vocal passages that tip their hat to Cunningham’s self-styled “R&B concrète” palette, and an overall sense that not only can he fuck around with whatever he wants and make a masterpiece, but now he is handing the baton over for others to do the same.","sourceHtml":"Speaking to different moods, there are elliptical piano figures, \u003cmark>gorgeously swollen vocal passages\u003c/mark> that tip their hat to Cunningham’s self-styled “R&amp;B concrète” palette, and an overall sense that not only can he fuck around with whatever he wants and make a masterpiece, but now he is handing the baton over for others to do the same."},{"en":"tip their hat to","zh":"向某种传统或风格致意","source":"Speaking to different moods, there are elliptical piano figures, gorgeously swollen vocal passages that tip their hat to Cunningham’s self-styled “R&B concrète” palette, and an overall sense that not only can he fuck around with whatever he wants and make a masterpiece, but now he is handing the baton over for others to do the same.","sourceHtml":"Speaking to different moods, there are elliptical piano figures, gorgeously swollen vocal passages that \u003cmark>tip their hat to\u003c/mark> Cunningham’s self-styled “R&amp;B concrète” palette, and an overall sense that not only can he fuck around with whatever he wants and make a masterpiece, but now he is handing the baton over for others to do the same."},{"en":"fuck around with whatever he wants and make a masterpiece","zh":"随心所欲地玩弄任何材料，却仍能做出杰作","source":"Speaking to different moods, there are elliptical piano figures, gorgeously swollen vocal passages that tip their hat to Cunningham’s self-styled “R&B concrète” palette, and an overall sense that not only can he fuck around with whatever he wants and make a masterpiece, but now he is handing the baton over for others to do the same.","sourceHtml":"Speaking to different moods, there are elliptical piano figures, gorgeously swollen vocal passages that tip their hat to Cunningham’s self-styled “R&amp;B concrète” palette, and an overall sense that not only can he \u003cmark>fuck around with whatever he wants and make a masterpiece\u003c/mark>, but now he is handing the baton over for others to do the same."},{"en":"handing the baton over","zh":"把接力棒交给后来者","source":"Speaking to different moods, there are elliptical piano figures, gorgeously swollen vocal passages that tip their hat to Cunningham’s self-styled “R&B concrète” palette, and an overall sense that not only can he fuck around with whatever he wants and make a masterpiece, but now he is handing the baton over for others to do the same.","sourceHtml":"Speaking to different moods, there are elliptical piano figures, gorgeously swollen vocal passages that tip their hat to Cunningham’s self-styled “R&amp;B concrète” palette, and an overall sense that not only can he fuck around with whatever he wants and make a masterpiece, but now he is \u003cmark>handing the baton over\u003c/mark> for others to do the same."},{"en":"purposefully bold leap after leap into the unknown","zh":"有意识地一次次大胆跃入未知","source":"It follows that Radical Frame should be framed as an exploration of the Black avant-garde; Cunningham takes purposefully bold leap after leap into the unknown, underlining a section of the Fred Moten quote included in the press release that reads: “Part of what I’m after now is this: an assertion that the avant-garde is a Black thing.”","sourceHtml":"It follows that Radical Frame should be framed as an exploration of the Black avant-garde; Cunningham takes \u003cmark>purposefully bold leap after leap into the unknown\u003c/mark>, underlining a section of the Fred Moten quote included in the press release that reads: “Part of what I’m after now is this: an assertion that the avant-garde is a Black thing.”"},{"en":"True to this remit","zh":"忠实履行前面提出的创作任务或范围","source":"True to this remit, Cunningham feeds us a pair of arch opening gambits that comprise 17 seconds of warped vocals and empty, stretched-out space, imparting an uneasy mood.","sourceHtml":"\u003cmark>True to this remit\u003c/mark>, Cunningham feeds us a pair of arch opening gambits that comprise 17 seconds of warped vocals and empty, stretched-out space, imparting an uneasy mood."},{"en":"feeds us a pair of arch opening gambits","zh":"先递来两记故作高明、略带挑衅的开场招数","source":"True to this remit, Cunningham feeds us a pair of arch opening gambits that comprise 17 seconds of warped vocals and empty, stretched-out space, imparting an uneasy mood.","sourceHtml":"True to this remit, Cunningham \u003cmark>feeds us a pair of arch opening gambits\u003c/mark> that comprise 17 seconds of warped vocals and empty, stretched-out space, imparting an uneasy mood."},{"en":"imparting an uneasy mood","zh":"赋予音乐一种不安气氛","source":"True to this remit, Cunningham feeds us a pair of arch opening gambits that comprise 17 seconds of warped vocals and empty, stretched-out space, imparting an uneasy mood.","sourceHtml":"True to this remit, Cunningham feeds us a pair of arch opening gambits that comprise 17 seconds of warped vocals and empty, stretched-out space, \u003cmark>imparting an uneasy mood\u003c/mark>."},{"en":"traverse further into the record’s broken-up soundworld","zh":"继续深入穿行于唱片破碎的声音世界","source":"As we traverse further into the record’s broken-up soundworld, a bigger picture starts to form, one where Casisdead’s reality-splashed raps are hooked to swooping jungle foundations and “Overchord” bubbles over with the blues and dissonant, after-dark Detroit frequencies.","sourceHtml":"As we \u003cmark>traverse further into the record’s broken-up soundworld\u003c/mark>, a bigger picture starts to form, one where Casisdead’s reality-splashed raps are hooked to swooping jungle foundations and “Overchord” bubbles over with the blues and dissonant, after-dark Detroit frequencies."},{"en":"reality-splashed raps are hooked to swooping jungle foundations","zh":"沾着现实质感的说唱被挂接到俯冲般的丛林舞曲地基上","source":"As we traverse further into the record’s broken-up soundworld, a bigger picture starts to form, one where Casisdead’s reality-splashed raps are hooked to swooping jungle foundations and “Overchord” bubbles over with the blues and dissonant, after-dark Detroit frequencies.","sourceHtml":"As we traverse further into the record’s broken-up soundworld, a bigger picture starts to form, one where Casisdead’s \u003cmark>reality-splashed raps are hooked to swooping jungle foundations\u003c/mark> and “Overchord” bubbles over with the blues and dissonant, after-dark Detroit frequencies."},{"en":"bubbles over with the blues and dissonant, after-dark Detroit frequencies","zh":"翻涌出布鲁斯气息、不协和音与深夜底特律频率","source":"As we traverse further into the record’s broken-up soundworld, a bigger picture starts to form, one where Casisdead’s reality-splashed raps are hooked to swooping jungle foundations and “Overchord” bubbles over with the blues and dissonant, after-dark Detroit frequencies.","sourceHtml":"As we traverse further into the record’s broken-up soundworld, a bigger picture starts to form, one where Casisdead’s reality-splashed raps are hooked to swooping jungle foundations and “Overchord” \u003cmark>bubbles over with the blues and dissonant, after-dark Detroit frequencies\u003c/mark>."},{"en":"keeps its foot on the dance music pedal","zh":"继续踩住舞曲的油门，不让节奏动力减弱","source":"The latter half of the record keeps its foot on the dance music pedal, punctuating sharp synth sequences with an exclamatory rumble of thunder (“Cosmo”).","sourceHtml":"The latter half of the record \u003cmark>keeps its foot on the dance music pedal\u003c/mark>, punctuating sharp synth sequences with an exclamatory rumble of thunder (“Cosmo”)."},{"en":"exclamatory rumble of thunder","zh":"像感叹号一样突然强调句子的雷鸣","source":"The latter half of the record keeps its foot on the dance music pedal, punctuating sharp synth sequences with an exclamatory rumble of thunder (“Cosmo”).","sourceHtml":"The latter half of the record keeps its foot on the dance music pedal, punctuating sharp synth sequences with an \u003cmark>exclamatory rumble of thunder\u003c/mark> (“Cosmo”)."},{"en":"coalesces into a slice of Four Tet-style looped euphoria","zh":"逐渐聚合成一小段循环推进的狂喜","source":"Elsewhere, the steady thump of deep house on “Withending” coalesces into a slice of Four Tet-style looped euphoria—but naturally there’s some mangled chatter throwing a spanner in the smoothness.","sourceHtml":"Elsewhere, the steady thump of deep house on “Withending” \u003cmark>coalesces into a slice of Four Tet-style looped euphoria\u003c/mark>—but naturally there’s some mangled chatter throwing a spanner in the smoothness."},{"en":"throwing a spanner in the smoothness","zh":"往顺滑的运转中扔进扳手，故意制造故障和阻碍","source":"Elsewhere, the steady thump of deep house on “Withending” coalesces into a slice of Four Tet-style looped euphoria—but naturally there’s some mangled chatter throwing a spanner in the smoothness.","sourceHtml":"Elsewhere, the steady thump of deep house on “Withending” coalesces into a slice of Four Tet-style looped euphoria—but naturally there’s some mangled chatter \u003cmark>throwing a spanner in the smoothness\u003c/mark>."},{"en":"are pitched against","zh":"被安排成彼此对照、较劲","source":"Later, glitchy, sputtering textures and ambient pads are pitched against the waterlogged spoken word of Manchester savant du jour Rainy Miller, whose “Out of time/ Out of sync” hiccups could be a mantra for the record as a whole.","sourceHtml":"Later, glitchy, sputtering textures and ambient pads \u003cmark>are pitched against\u003c/mark> the waterlogged spoken word of Manchester savant du jour Rainy Miller, whose “Out of time/ Out of sync” hiccups could be a mantra for the record as a whole."},{"en":"savant du jour","zh":"当下最受瞩目的奇才","source":"Later, glitchy, sputtering textures and ambient pads are pitched against the waterlogged spoken word of Manchester savant du jour Rainy Miller, whose “Out of time/ Out of sync” hiccups could be a mantra for the record as a whole.","sourceHtml":"Later, glitchy, sputtering textures and ambient pads are pitched against the waterlogged spoken word of Manchester \u003cmark>savant du jour\u003c/mark> Rainy Miller, whose “Out of time/ Out of sync” hiccups could be a mantra for the record as a whole."},{"en":"a mantra for the record as a whole","zh":"足以概括整张唱片的反复箴言","source":"Later, glitchy, sputtering textures and ambient pads are pitched against the waterlogged spoken word of Manchester savant du jour Rainy Miller, whose “Out of time/ Out of sync” hiccups could be a mantra for the record as a whole.","sourceHtml":"Later, glitchy, sputtering textures and ambient pads are pitched against the waterlogged spoken word of Manchester savant du jour Rainy Miller, whose “Out of time/ Out of sync” hiccups could be \u003cmark>a mantra for the record as a whole\u003c/mark>."},{"en":"finale epic","zh":"史诗般宏大的终曲","source":"This finale epic—titled “Sheets,” and taking up over 16 minutes of airtime—bounces a distorted kick drum like a football against a moving wall of footwork-style syncopations.","sourceHtml":"This \u003cmark>finale epic\u003c/mark>—titled “Sheets,” and taking up over 16 minutes of airtime—bounces a distorted kick drum like a football against a moving wall of footwork-style syncopations."},{"en":"taking up over 16 minutes of airtime","zh":"占据十六分多钟的播放时长","source":"This finale epic—titled “Sheets,” and taking up over 16 minutes of airtime—bounces a distorted kick drum like a football against a moving wall of footwork-style syncopations.","sourceHtml":"This finale epic—titled “Sheets,” and \u003cmark>taking up over 16 minutes of airtime\u003c/mark>—bounces a distorted kick drum like a football against a moving wall of footwork-style syncopations."},{"en":"drops in a five-minute denouement","zh":"在结尾放入一段五分钟的收束","source":"Towards the end, Cunningham drops in a five-minute denouement of crashing waves that you wish would last a lifetime, while the Frank Ocean-worthy croon that cuts in is so hauntingly intense it could part water.","sourceHtml":"Towards the end, Cunningham \u003cmark>drops in a five-minute denouement\u003c/mark> of crashing waves that you wish would last a lifetime, while the Frank Ocean-worthy croon that cuts in is so hauntingly intense it could part water."},{"en":"could part water","zh":"仿佛能将水分开","source":"Towards the end, Cunningham drops in a five-minute denouement of crashing waves that you wish would last a lifetime, while the Frank Ocean-worthy croon that cuts in is so hauntingly intense it could part water.","sourceHtml":"Towards the end, Cunningham drops in a five-minute denouement of crashing waves that you wish would last a lifetime, while the Frank Ocean-worthy croon that cuts in is so hauntingly intense it \u003cmark>could part water\u003c/mark>."},{"en":"mighty slab of “inter-dimensional electronic composition”","zh":"一大块厚重、有分量的“跨维度电子作曲”","source":"Another mighty slab of “inter-dimensional electronic composition” from an avant-garde A-lister.","sourceHtml":"Another \u003cmark>mighty slab of “inter-dimensional electronic composition”\u003c/mark> from an avant-garde A-lister."},{"en":"avant-garde A-lister","zh":"先锋艺术领域的一线人物","source":"Another mighty slab of “inter-dimensional electronic composition” from an avant-garde A-lister.","sourceHtml":"Another mighty slab of “inter-dimensional electronic composition” from an avant-garde A-lister."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
</body>
