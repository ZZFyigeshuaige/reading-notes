<script>
let cards = [{"en":"kick around","zh":"在这里指某个词或想法“流传了一阵子”，带有它已不新鲜的语感","source":"Surely it’s not “indie sleaze,” a theme-party dress code that’s been kicking around for years.","sourceHtml":"Surely it’s not “indie sleaze,” a theme-party dress code that’s been \u003cmark>kicking around\u003c/mark> for years."},{"en":"blend in","zh":"把一种元素融入整体","source":"Today’s sleaziest indie producers are blending in cloud rap, 2010s EDM, and hyperpop to assemble dance-pop music that sounds simultaneously dirty, sweet, and Xeroxed to hell.","sourceHtml":"Today’s sleaziest indie producers are \u003cmark>blending in\u003c/mark> cloud rap, 2010s EDM, and hyperpop to assemble dance-pop music that sounds simultaneously dirty, sweet, and Xeroxed to hell."},{"en":"Xeroxed to hell","zh":"很有画面感的比喻","source":"Today’s sleaziest indie producers are blending in cloud rap, 2010s EDM, and hyperpop to assemble dance-pop music that sounds simultaneously dirty, sweet, and Xeroxed to hell.","sourceHtml":"Today’s sleaziest indie producers are blending in cloud rap, 2010s EDM, and hyperpop to assemble dance-pop music that sounds simultaneously dirty, sweet, and \u003cmark>Xeroxed to hell\u003c/mark>."},{"en":"burgeoning acts","zh":"正在快速成长、开始受到关注的艺人或组合","source":"It’s the sound associated with burgeoning acts like Snow Strippers, Frost Children, MGNA Crrrta, and Fcukers; it’s everywhere on the season’s standout new alt-pop records, in slushy and sarcastic synth tracks from Slayyyter, Ninajirachi, Six Sex, and Tiffany Day; it’s the sound of still-underground stars like Cannelle, Suzy Sheer, Joey Cash, Somewhere Special, and the Twins.","sourceHtml":"It’s the sound associated with \u003cmark>burgeoning acts\u003c/mark> like Snow Strippers, Frost Children, MGNA Crrrta, and Fcukers; it’s everywhere on the season’s standout new alt-pop records, in slushy and sarcastic synth tracks from Slayyyter, Ninajirachi, Six Sex, and Tiffany Day; it’s the sound of still-underground stars like Cannelle, Suzy Sheer, Joey Cash, Somewhere Special, and the Twins."},{"en":"standout new alt-pop records","zh":"一批格外抢眼的新另类流行乐专辑","source":"It’s the sound associated with burgeoning acts like Snow Strippers, Frost Children, MGNA Crrrta, and Fcukers; it’s everywhere on the season’s standout new alt-pop records, in slushy and sarcastic synth tracks from Slayyyter, Ninajirachi, Six Sex, and Tiffany Day; it’s the sound of still-underground stars like Cannelle, Suzy Sheer, Joey Cash, Somewhere Special, and the Twins.","sourceHtml":"It’s the sound associated with burgeoning acts like Snow Strippers, Frost Children, MGNA Crrrta, and Fcukers; it’s everywhere on the season’s \u003cmark>standout new alt-pop records\u003c/mark>, in slushy and sarcastic synth tracks from Slayyyter, Ninajirachi, Six Sex, and Tiffany Day; it’s the sound of still-underground stars like Cannelle, Suzy Sheer, Joey Cash, Somewhere Special, and the Twins."},{"en":"slushy and sarcastic synth tracks","zh":"本指半融的雪泥，这里借来描写合成器音色模糊、黏滞、略显污浊","source":"It’s the sound associated with burgeoning acts like Snow Strippers, Frost Children, MGNA Crrrta, and Fcukers; it’s everywhere on the season’s standout new alt-pop records, in slushy and sarcastic synth tracks from Slayyyter, Ninajirachi, Six Sex, and Tiffany Day; it’s the sound of still-underground stars like Cannelle, Suzy Sheer, Joey Cash, Somewhere Special, and the Twins.","sourceHtml":"It’s the sound associated with burgeoning acts like Snow Strippers, Frost Children, MGNA Crrrta, and Fcukers; it’s everywhere on the season’s standout new alt-pop records, in \u003cmark>slushy and sarcastic synth tracks\u003c/mark> from Slayyyter, Ninajirachi, Six Sex, and Tiffany Day; it’s the sound of still-underground stars like Cannelle, Suzy Sheer, Joey Cash, Somewhere Special, and the Twins."},{"en":"lump these sounds together","zh":"把这些声音笼统地归为一类","source":"People have been trying to lump these sounds together somehow.","sourceHtml":"People have been trying to \u003cmark>lump these sounds together\u003c/mark> somehow."},{"en":"galaxy-brained","zh":"互联网俚语，原本常带讽刺，形容一种看似高深、实则过度复杂的推理","source":"“the blog-house end of the indie sleaze continuum is exemplified by the cloudier textures of snow strippers and fakemink,” the galaxy-brained musician friends& wrote last year, clearly hearing it too.","sourceHtml":"“the blog-house end of the indie sleaze continuum is exemplified by the cloudier textures of snow strippers and fakemink,” the \u003cmark>galaxy-brained\u003c/mark> musician friends&amp; wrote last year, clearly hearing it too."},{"en":"same-yet-different set of acts","zh":"一批既相似又各不相同的艺人","source":"A similar same-yet-different set of acts played Palomosa Festival in Montreal this spring, featuring headliners MGMT (DJ set) and fakemink, plus Xaviersobased and Thaiboy Digital, POiSON GiRLFRiEND and Dylan Brady, Canelle and ear.","sourceHtml":"A similar \u003cmark>same-yet-different set of acts\u003c/mark> played Palomosa Festival in Montreal this spring, featuring headliners MGMT (DJ set) and fakemink, plus Xaviersobased and Thaiboy Digital, POiSON GiRLFRiEND and Dylan Brady, Canelle and ear."},{"en":"tap into a very zeitgeisty idea of what goes together","zh":"捕捉并利用一种极具当下时代气息的“搭配逻辑”","source":"“They’re tapping into a very zeitgeisty idea of what goes together, generationally.”","sourceHtml":"“They’re \u003cmark>tapping into a very zeitgeisty idea of what goes together\u003c/mark>, generationally.”"},{"en":"reimagining of electroclash","zh":"不是单纯复刻 ，而是从当下的声音与文化环境出发，对它重新想象、重新设计","source":"What we’re witnessing is this decade’s great reimagining of electroclash.","sourceHtml":"What we’re witnessing is this decade’s great \u003cmark>reimagining of electroclash\u003c/mark>."},{"en":"fuel","zh":"作动词，意为“为……添加燃料／推动……”，常用来说趋势、争论或复兴运动","source":"It is helping to fuel both an ongoing revival of the classic sound and a new manifestation—an evolution that feels nostalgic for Daft Punk and Drain Gang in equal measure.","sourceHtml":"It is helping to \u003cmark>fuel\u003c/mark> both an ongoing revival of the classic sound and a new manifestation—an evolution that feels nostalgic for Daft Punk and Drain Gang in equal measure."},{"en":"summon a new segment","zh":"把一个新的听众群体“召唤”过来","source":"The “indie sleaze” trend and the massive success of Charli xcx’s BRAT helped to summon a new segment of the world’s pop fans to a particular era of club classics, dialed up with a noisy, bass-boosted edge primed by years of mainstage dance, hip-hop, and hyperpop.","sourceHtml":"The “indie sleaze” trend and the massive success of Charli xcx’s BRAT helped to \u003cmark>summon a new segment\u003c/mark> of the world’s pop fans to a particular era of club classics, dialed up with a noisy, bass-boosted edge primed by years of mainstage dance, hip-hop, and hyperpop."},{"en":"dialed up with a noisy, bass-boosted edge primed by","zh":"在某种经验的铺垫下，把噪声、低频与冲击力“调高”","source":"The “indie sleaze” trend and the massive success of Charli xcx’s BRAT helped to summon a new segment of the world’s pop fans to a particular era of club classics, dialed up with a noisy, bass-boosted edge primed by years of mainstage dance, hip-hop, and hyperpop.","sourceHtml":"The “indie sleaze” trend and the massive success of Charli xcx’s BRAT helped to summon a new segment of the world’s pop fans to a particular era of club classics, \u003cmark>dialed up with a noisy, bass-boosted edge primed by\u003c/mark> years of mainstage dance, hip-hop, and hyperpop."},{"en":"assimilated","zh":"将其他音乐元素吸收、消化进自己的语汇中，而不只是表面拼贴","source":"Nonsense hooks and Jersey club kicks and stupid drops and digicore glitch: It all fits into the grimy, clubby, approximately 130-bpm electroclash idiom, one that’s long since assimilated the massive electro-pop bangers c. 2007-2008 (“Time to Pretend,” “D.A.N.C.E.,” “Just Dance”).","sourceHtml":"Nonsense hooks and Jersey club kicks and stupid drops and digicore glitch: It all fits into the grimy, clubby, approximately 130-bpm electroclash idiom, one that’s long since \u003cmark>assimilated\u003c/mark> the massive electro-pop bangers c. 2007-2008 (“Time to Pretend,” “D.A.N.C.E.,” “Just Dance”)."},{"en":"stereofield blitzed with snow","zh":"整个立体声场被像电视雪花一样的噪点密集轰炸","source":"The aesthetic is glittery texture and low-res surveillance video, the stereofield blitzed with snow, the governing mindset a detached pose (and sometimes explicit vulnerability) as a protective adaptation amid the endless horrorscroll.","sourceHtml":"The aesthetic is glittery texture and low-res surveillance video, the \u003cmark>stereofield blitzed with snow\u003c/mark>, the governing mindset a detached pose (and sometimes explicit vulnerability) as a protective adaptation amid the endless horrorscroll."},{"en":"detached pose","zh":"一种刻意保持距离、仿佛毫不在意的姿态","source":"The aesthetic is glittery texture and low-res surveillance video, the stereofield blitzed with snow, the governing mindset a detached pose (and sometimes explicit vulnerability) as a protective adaptation amid the endless horrorscroll.","sourceHtml":"The aesthetic is glittery texture and low-res surveillance video, the stereofield blitzed with snow, the governing mindset a \u003cmark>detached pose\u003c/mark> (and sometimes explicit vulnerability) as a protective adaptation amid the endless horrorscroll."},{"en":"protective adaptation","zh":"为自我保护而形成的适应方式","source":"The aesthetic is glittery texture and low-res surveillance video, the stereofield blitzed with snow, the governing mindset a detached pose (and sometimes explicit vulnerability) as a protective adaptation amid the endless horrorscroll.","sourceHtml":"The aesthetic is glittery texture and low-res surveillance video, the stereofield blitzed with snow, the governing mindset a detached pose (and sometimes explicit vulnerability) as a \u003cmark>protective adaptation\u003c/mark> amid the endless horrorscroll."},{"en":"horrorscroll","zh":"作者将 与 拼在一起的新造词，指在社交媒体上永无止境地滑动，不断摄入灾难、战争、危机等令人恐惧的信息","source":"The aesthetic is glittery texture and low-res surveillance video, the stereofield blitzed with snow, the governing mindset a detached pose (and sometimes explicit vulnerability) as a protective adaptation amid the endless horrorscroll.","sourceHtml":"The aesthetic is glittery texture and low-res surveillance video, the stereofield blitzed with snow, the governing mindset a detached pose (and sometimes explicit vulnerability) as a protective adaptation amid the endless \u003cmark>horrorscroll\u003c/mark>."},{"en":"mix in a combination of","zh":"把若干不同成分掺入当下的音乐","source":"“There was some European, German stuff that was great, and certainly DJ Hell’s [International DeeJay] Gigolo Records had some tracks that were popular, but we really had to mix in a combination of the electro-disco-punk from the past and the latest stuff.” In 2001, impassioned by the sound and style of up-and-coming acts like Fischerspooner and Chicks on Speed, Tee took out an $80,000 loan and organized an Electroclash Festival in Williamsburg, Brooklyn.","sourceHtml":"“There was some European, German stuff that was great, and certainly DJ Hell’s [International DeeJay] Gigolo Records had some tracks that were popular, but we really had to \u003cmark>mix in a combination of\u003c/mark> the electro-disco-punk from the past and the latest stuff.” In 2001, impassioned by the sound and style of up-and-coming acts like Fischerspooner and Chicks on Speed, Tee took out an $80,000 loan and organized an Electroclash Festival in Williamsburg, Brooklyn."},{"en":"impassioned by","zh":"被某种声音激发出强烈热情","source":"“There was some European, German stuff that was great, and certainly DJ Hell’s [International DeeJay] Gigolo Records had some tracks that were popular, but we really had to mix in a combination of the electro-disco-punk from the past and the latest stuff.” In 2001, impassioned by the sound and style of up-and-coming acts like Fischerspooner and Chicks on Speed, Tee took out an $80,000 loan and organized an Electroclash Festival in Williamsburg, Brooklyn.","sourceHtm stival in Williamsburg, Brooklyn.","sourceHtml":"“There was some European, German stuff that was great, and certainly DJ Hell’s [International DeeJay] Gigolo Records had some tracks that were popular, but we really had to mix in a combination of the electro-disco-punk from the past and the latest stuff.” In 2001, impassioned by the sound and style of up-and-coming acts like Fischerspooner and Chicks on Speed, Tee \u003cmark>took out an $80,000 loan\u003c/mark> and organized an Electroclash Festival in Williamsburg, Brooklyn."},{"en":"garner attention","zh":"获得、吸引关注","source":"It garnered so much attention in alternative media (he mentions his then-roommate worked at Vice) that the name caught on more widely.","sourceHtml":"It \u003cmark>garnered so much attention\u003c/mark> in alternative media (he mentions his then-roommate worked at Vice) that the name caught on more widely."},{"en":"catch on","zh":"开始流行、被更多人接受","source":"Hyperclash is a hybrid, as was electroclash, when it was forming in the mid-’90s.","sourceHtml":"Hyperclash is a hybrid, as was electroclash, when it was forming in the mid-’90s."},{"en":"vampy, campy, fake European","zh":"妖媚挑逗、刻意夸张俗艳，再加上一种故作的欧洲腔","source":"The popular image of electroclash—vampy, campy, fake European—would find its way into chart-topping pop hits of the recession era while its scuzzier techno origins remained happily obscure.","sourceHtml":"The popular image of electroclash—\u003cmark>vampy, campy, fake European\u003c/mark>—would find its way into chart-topping pop hits of the recession era while its scuzzier techno origins remained happily obscure."},{"en":"find its way into","zh":"逐渐进入、渗入某个原本不属于它的领域","source":"The popular image of electroclash—vampy, campy, fake European—would find its way into chart-topping pop hits of the recession era while its scuzzier techno origins remained happily obscure.","sourceHtml":"The popular image of electroclash—vampy, campy, fake European—would \u003cmark>find its way into\u003c/mark> chart-topping pop hits of the recession era while its scuzzier techno origins remained happily obscure."},{"en":"scuzzier techno origins","zh":"更脏乱、粗糙、带地下感的 源头","source":"The popular image of electroclash—vampy, campy, fake European—would find its way into chart-topping pop hits of the recession era while its scuzzier techno origins remained happily obscure.","sourceHtml":"The popular image of electroclash—vampy, campy, fake European—would find its way into chart-topping pop hits of the recession era while its \u003cmark>scuzzier techno origins\u003c/mark> remained happily obscure."},{"en":"plastic, Andy Warhol-esque style of music","zh":"一种强调人工感、复制感、消费品光泽和自觉表演的音乐","source":"“I see it as being this sort of plastic, Andy Warhol-esque style of music that’s extremely performative, but it’s also extremely … dead-eyed in its attitude,” says the Dare’s Harrison Smith, whose polarizing but undeniable “Girls” helped put a nascent revival on the map in 2022.","sourceHtml":"“I see it as being this sort of \u003cmark>plastic, Andy Warhol-esque style of music\u003c/mark> that’s extremely performative, but it’s also extremely … dead-eyed in its attitude,” says the Dare’s Harrison Smith, whose polarizing but undeniable “Girls” helped put a nascent revival on the map in 2022."},{"en":"dead-eyed in its attitude","zh":"态度上空洞、麻木、不动声色","source":"“I see it as being this sort of plastic, Andy Warhol-esque style of music that’s extremely performative, but it’s also extremely … dead-eyed in its attitude,” says the Dare’s Harrison Smith, whose polarizing but undeniable “Girls” helped put a nascent revival on the map in 2022.","sourceHtml":"“I see it as being this sort of plastic, Andy Warhol-esque style of music that’s extremely performative, but it’s also extremely … \u003cmark>dead-eyed in its attitude\u003c/mark>,” says the Dare’s Harrison Smith, whose polarizing but undeniable “Girls” helped put a nascent revival on the map in 2022."},{"en":"polarizing but undeniable","zh":"评价极度两极化，但它的影响力或有效性 o so.”"},{"en":"incorporate","zh":"将外来元素纳入自身结构中","source":"Original electroclash incorporated serious-minded ’90s techno and chintzy ’80s pop with sardonic humor and real freaky attitude; its self-aware cultural omnivorism seemed shallow until you recognized that this was the very thing that made it seductive.","sourceHtml":"Original electroclash incorporated serious-minded ’90s techno and chintzy ’80s pop with sardonic humor and real freaky attitude; its self-aware cultural omnivorism seemed shallow until you recognized that this was the very thing that made it seductive."},{"en":"cultural omnivorism","zh":"“文化杂食”——不忠于单一圈层或品味等级，而是同时吸收高雅、通俗、地下与廉价元素","source":"Original electroclash incorporated serious-minded ’90s techno and chintzy ’80s pop with sardonic humor and real freaky attitude; its self-aware cultural omnivorism seemed shallow until you recognized that this was the very thing that made it seductive.","sourceHtml":"Original electroclash incorporated serious-minded ’90s techno and chintzy ’80s pop with sardonic humor and real freaky attitude; its self-aware \u003cmark>cultural omnivorism\u003c/mark> seemed shallow until you recognized that this was the very thing that made it seductive."},{"en":"pull a similar stunt with the component parts of","zh":"拿某类音乐的各个零件再玩一次类似的把戏","source":"Twenty years later, hyperpop pulled a similar stunt with the component parts of 2010s EDM and Y2K bubblegum.","sourceHtml":"Twenty years later, hyperpop \u003cmark>pulled a similar stunt with the component parts of\u003c/mark> 2010s EDM and Y2K bubblegum."},{"en":"as pure trend","zh":"单纯从潮流现象而非深层美学逻辑来看","source":"As pure trend, their fusion explains why Kim Petras is singing about Eurotrash on a Frost Children beat, why the young Australian pop duo Cat & Calmell rebranded as 2000s party monsters, why Kesha’s recent single “Origami” sounds kind of like it’s still 15 years ago, and why David Guetta and Marten Hørger made a song with Vitalic (it kinda goes).","sourceHtml":"\u003cmark>As pure trend\u003c/mark>, their fusion explains why Kim Petras is singing about Eurotrash on a Frost Children beat, why the young Australian pop duo Cat &amp; Calmell rebranded as 2000s party monsters, why Kesha’s recent single “Origami” sounds kind of like it’s still 15 years ago, and why David Guetta and Marten Hørger made a song with Vitalic (it kinda goes)."},{"en":"it kinda goes","zh":"口语评价，意为“还真挺好听／还真有点带劲”","source":"As pure trend, their fusion explains why Kim Petras is singing about Eurotrash on a Frost Children beat, why the young Australian pop duo Cat & Calmell rebranded as 2000s party monsters, why Kesha’s recent single “Origami” sounds kind of like it’s still 15 years ago, and why David Guetta and Marten Hørger made a song with Vitalic (it kinda goes).","sourceHtml":"As pure trend, their fusion explains why Kim Petras is singing about Eurotrash on a Frost Children beat, why the young Australian pop duo Cat &amp; Calmell rebranded as 2000s party monsters, why Kesha’s recent single “Origami” sounds kind of like it’s still 15 years ago, and why David Guetta and Marten Hørger made a song with Vitalic (\u003cmark>it kinda goes\u003c/mark>)."},{"en":"brash and obnoxious and feminine-coded","zh":"高调张扬、惹人反感，同时在文化上被标记为“女性化”","source":"Like its predecessors, hyperclash is brash and obnoxious and feminine-coded.","sourceHtml":"Like its predecessors, hyperclash is \u003cmark>brash and obnoxious and feminine-coded\u003c/mark>."},{"en":"prone to glamorize dysfunction","zh":"容易把失序、自毁、不健康的生活美化成迷人风格","source":"It knows too much and it’s always down to party anyway; it’s messy and fun and prone to glamorize dysfunction.","sourceHtml":"It knows too much and it’s always down to party anyway; it’s messy and fun and \u003cmark>prone to glamorize dysfunction\u003c/mark>."},{"en":"credit to all originators, imitators, and downtown scenesters","zh":"“所有先驱、模仿者和市中心圈内人士都有功劳”","source":"Credit to all originators, imitators, and downtown scenesters, but the smoldering embers of dirtbag millennial dance music culture these past 10 years owe a lot to Crystal Castles.","sourceHtml":"\u003cmark>Credit to all originators, imitators, and downtown scenesters\u003c/mark>, but the smoldering embers of dirtbag millennial dance music culture these past 10 years owe a lot to Crystal Castles."},{"en":"smoldering embers","zh":"尚在暗中燃烧、并未完全熄灭的余烬","source":"Credit to all originators, imitators, and downtown scenesters, but the smoldering embers of dirtbag millennial dance music culture these past 10 years owe a lot to Crystal Castles.","sourceHtml":"Credit to all originators, imitators, and downtown scenesters, but the \u003cmark>smoldering embers\u003c/mark> of dirtbag millennial dance music culture these past 10 years owe a lot to Crystal Castles."},{"en":"owe a lot to","zh":"很大程度上得益于、应当归功于","source":"Credit to all originators, imitators, and downtown scenesters, but the smoldering embers of dirtbag millennial dance music culture these past 10 years owe a lot to Crystal Castles.","sourceHtml":"Credit to all originators, imitators, and downtown scenesters, but the smoldering embers of dirtbag millennial dance music culture these past 10 years \u003cmark>owe a lot to\u003c/mark> Crystal Castles."},{"en":"spawn soundalike acts from here to Siberia","zh":"在极广范围内催生了大量声音相似的组合","source":"Despite Alice Glass’ serious allegations against Ethan Kath and the band’s eventual demise, their catalog retains an obsessive fanbase and spawns soundalike acts from here to Siberia.","sourceHtml":"Despite Alice Glass’ serious allegations against Ethan Kath and the band’s eventual demise, their catalog retains an obsessive fanbase and \u003cmark>spawns soundalike acts from here to Siberia\u003c/mark>."},{"en":"hypnotic crunch","zh":"催眠般反复、同时带着破碎压迫感的声音","source":"The true electroclash purist may argue that Crystal Castles don’t qualify, but their hypnotic crunch is nonetheless one of the loudest influences in the emerging scene, maybe the single biggest antecedent for hyperclash."," ght with anxiety\u003c/mark>, like Brutalismus 3000 and Boyz Noise’s “I Bring My Gun to the Function,” or else ambivalent about human connection, as with Ninajirachi’s boast, “I want to fuck my computer/Because no one in the world does it better.” The drugs are scarier."},{"en":"ambivalent about human connection","zh":"对与人建立关系同时存在渴望与排斥","source":"It is less likely to be overtly erotic and more likely to be fraught with anxiety, like Brutalismus 3000 and Boyz Noise’s “I Bring My Gun to the Function,” or else ambivalent about human connection, as with Ninajirachi’s boast, “I want to fuck my computer/Because no one in the world does it better.” The drugs are scarier.","sourceHtml":"It is less likely to be overtly erotic and more likely to be fraught with anxiety, like Brutalismus 3000 and Boyz Noise’s “I Bring My Gun to the Function,” or else \u003cmark>ambivalent about human connection\u003c/mark>, as with Ninajirachi’s boast, “I want to fuck my computer/Because no one in the world does it better.” The drugs are scarier."},{"en":"tend to be narrower and less subversive","zh":"往往更狭隘，也更缺少挑战社会规范的力量","source":"What sex appeal does exist tends to be narrower and less subversive: heavy on images of young women with their faces covered and bodies exposed, a stagey, eroticized vulnerability reminiscent of the scene-girl fashion shoots of the Myspace and Tumblr eras.","sourceHtml":"What sex appeal does exist \u003cmark>tends to be narrower and less subversive\u003c/mark>: heavy on images of young women with their faces covered and bodies exposed, a stagey, eroticized vulnerability reminiscent of the scene-girl fashion shoots of the Myspace and Tumblr eras."},{"en":"stagey, eroticized vulnerability","zh":"刻意摆拍、被加工成情色对象的脆弱","source":"What sex appeal does exist tends to be narrower and less subversive: heavy on images of young women with their faces covered and bodies exposed, a stagey, eroticized vulnerability reminiscent of the scene-girl fashion shoots of the Myspace and Tumblr eras.","sourceHtml":"What sex appeal does exist tends to be narrower and less subversive: heavy on images of young women with their faces covered and bodies exposed, a \u003cmark>stagey, eroticized vulnerability\u003c/mark> reminiscent of the scene-girl fashion shoots of the Myspace and Tumblr eras."},{"en":"lose touch with double entendre","zh":"逐渐不再懂得如何使用双关，尤其是含蓄的性暗示","source":"Electroclash was fashion too—sometimes derided as more aesthetic than music—but recently it’s as if after “Air on a G String” we started to lose touch with double entendre.","sourceHtml":"Electroclash was fashion too—sometimes derided as more aesthetic than music—but recently it’s as if after “Air on a G String” we started to \u003cmark>lose touch with double entendre\u003c/mark>."},{"en":"true degeneracy requires a little more imagination","zh":"真正的堕落需要更多想象力","source":"True degeneracy requires a little more imagination.","sourceHtml":"\u003cmark>True degeneracy requires a little more imagination.\u003c/mark>"},{"en":"a cop-out","zh":"回避难题的借口或省事做法","source":"For years now we’ve been talking about “genreless” music, so much so that it’s becoming a cop-out.","sourceHtml":"For years now we’ve been talking about “genreless” music, so much so that it’s becoming \u003cmark>a cop-out\u003c/mark>."},{"en":"the pendulum is back","zh":"风向像摆锤一样摆了回来","source":"The pendulum is back with new writing on the evolution of laptop twee and the hazy sound of cloud-rock; hyperclash shares their sense of post-internet multiplicity and unpolished, out-of-focus aesthetic.","sourceHtml":"\u003cmark>The pendulum is back\u003c/mark> with new writing on the evolution of laptop twee and the hazy sound of cloud-rock; hyperclash shares their sense of post-internet multiplicity and unpolished, out-of-focus aesthetic."},{"en":"post-internet multiplicity","zh":"后互联网时代多种来源、风格和时间层同时并存的状态","source":"The pendulum is back with new writing on the evolution of laptop twee and the hazy sound of cloud-rock; hyperclash shares their sense of post-internet multiplicity and unpolished, out-of-focus aesthetic.","sourceHtml":"The pendulum is back with new writing on the evolution of laptop twee and the hazy sound of cloud-rock; hyperclash shares their sense of \u003cmark>post-internet multiplicity\u003c/mark> and unpolished, out-of-focus aesthetic."},{"en":"link rot","zh":"网页被删除、网站关闭或结构改变后，旧链接逐渐失效的现象","source":"Dance pop gets less respect, but it’s only shallow if you lack context, which is currently being lost to link rot.","sourceHtml":"Dance pop gets less respect, but it’s only shallow if you lack context, which is currently being lost to \u003cmark>link rot\u003c/mark>."},{"en":"when bloghouse came back, there weren’t that many blogs left to hear it","zh":"等 复兴时，当年支撑它的博客生态已所剩无几","source":"Before the release of BRAT in 2024, two Paste writers observed a “third wave” of electroclash “still in its infancy,” citing early releases from Snow Strippers and Frost Children, but when bloghouse came back, there weren’t that many blogs left to hear it. (If you really want to commit to the lifestyle, try Crushed Magazine.)","sourceHtml":"Before the release of BRAT in 2024, two Paste writers observed a “third wave” of electroclash “still in its infancy,” citing early releases from Snow Strippers and Frost Children, but \u003cmark>when bloghouse came back, there weren’t that many blogs left to hear it\u003c/mark>. (If you really want to commit to the lifestyle, try Crushed Magazine.)"},{"en":"commit to the lifestyle","zh":"不只听音乐，而是彻底投入它附带的穿着、夜生活、媒体与圈子文化","source":"Before the release of BRAT in 2024, two Paste writers observed a “third wave” of electroclash “still in its infancy,” citing early releases from Snow Strippers and Frost Children, but when bloghouse came back, there weren’t that many blogs left to hear it. (If you really want to commit to the lifestyle, try Crushed Magazine.)","sourceHtml":"Before the release of BRAT in 2024, two Paste writers observed a “third wave” of electroclash “still in its infancy,” citing early releases from Snow Strippers and Frost Children, but when bloghouse came back, there weren’t that many blogs left to hear it. (If you really want to \u003cmark>commit to the lifestyle\u003c/mark>, try Crushed Magazine.)"},{"en":"short-lived, media-created trend","zh":"寿命短暂、主要由媒体命名和报道所制造的潮流","source":"Is hyperclash a short-lived, media-created trend?","sourceHtml":"Is hyperclash a \u003cmark>short-lived, media-created trend\u003c/mark>?"},{"en":"creative destruction","zh":"创造性破坏，即新形态通过打碎、改造旧形态而产生","source":"We’re lucky to get to experience this kind of creative destruction at the same time that so many classic electroclash acts are still thriving.","sourceHtml":"We’re lucky to get to experience this kind of \u003cmark>creative destruction\u003c/mark> at the same time that so many classic electroclash acts are still thriving."},{"en":"go down better and better","zh":"越来越受现场听众欢迎","source":"In DJ sets, “the last couple years, electroclash has been going down better and better,” says New York’s Daniel Fisher, of Physical Therapy and Allergy Season.","sourceHtml":"In DJ sets, “the last couple years, electroclash has been \u003cmark>going down better and better\u003c/mark>,” says New York’s Daniel Fisher, of Physical Therapy and Allergy Season."},{"en":"go into the deeper cuts","zh":"开始播放专辑里更冷门、不是主打歌的曲目","source":"“I love to play the Junkie XL remix of Fischerspooner’s ‘Emerge’ and some 23 year old will be like, ‘What is this?’ … I’ve had to go into the deeper cuts because of the revival.”","sourceHtml":"“I love to play the Junkie XL remix of Fischerspooner’s ‘Emerge’ and some 23 year old will be like, ‘What is this?’ … I’ve had to \u003cmark>go into the deeper cuts\u003c/mark> because of the revival.”"},{"en":"overexposed and underexplained","zh":"曝光过多、解释过少","source":"It’s because electroclash has been so overexposed and underexplained, so badly remembered and eagerly contested, that it’s met both the rush of mass adoption and the pressure to reinvent itself, to recapture the glamour and mystique of a supposedly more carefree past.","sourceHtml":"It’s because electroclash has been so \u003cmark>overexposed and underexplained\u003c/mark>, so badly remembered and eagerly contested, that it’s met both the rush of mass adoption and the pressure to reinvent itself, to recapture the glamour and mystique of a supposedly more carefree past."},{"en":"rush of mass adoption","zh":"大众突然一拥而上、大规模接受某种风格的浪潮","source":"It’s because electroclash has been so overexposed and underexplained, so badly remembered and eagerly contested, that it’s met both the rush of mass adoption and the pressure to reinvent itself, to recapture the glamour and mystique of a supposedly more carefree past.","sourceHtml":"It’s because electroclash has been so overexposed and underexplained, so badly remembered and eagerly contested, that it’s met both the \u003cmark>rush of mass adoption\u003c/mark> and the pressure to reinvent itself, to recapture the glamour and mystique of a supposedly more carefree past."},{"en":"recapture the glamour and mystique","zh":"重新捕获已经流失的华丽感与神秘感","source":"It’s because electroclash has been so overexposed and underexplained, so badly remembered and eagerly contested, that it’s met both the rush of mass adoption and the pressure to reinvent itself, to recapture the glamour and mystique of a supposedly more carefree past.","sourceHtml":"It’s because electroclash has been so overexposed and underexplained, so badly remembered and eagerly contested, that it’s met both the rush of mass adoption and the pressure to reinvent itself, to \u003cmark>recapture the glamour and mystique\u003c/mark> of a supposedly more carefree past."},{"en":"collective inability to imagine an aesthetic future","zh":"整个文化集体似乎都失去了想象未来美学的能力","source":"“I can’t speak for everybody, but it seems like a collective inability to imagine an aesthetic future,” observes deBasement’s Margo XS of the style’s resurgence.","sourceHtml":"“I can’t speak for everybody, but it seems like a \u003cmark>collective inability to imagine an aesthetic future\u003c/mark>,” observes deBasement’s Margo XS of the style’s resurgence."},{"en":"perceived freedom","zh":"事后回望时感知到的自由，不等于当时真实存在的自由","source":"And I think that there is a certain yearning for the type of—maybe it wasn’t free at the time, but the perceived freedom of that early social media time where everything wasn’t documented.”","sourceHtml":"And I think that there is a certain yearning for the type of—maybe it wasn’t free at the time, but the \u003cmark>perceived freedom\u003c/mark> of that early social media time where everything wasn’t documented.”"},{"en":"nowhere else to go and no one coming to save us","zh":"已经没有别的去处，也没有救兵会出现","source":"That feeling—nowhere else to go and no one coming to save us—has informed the DIY spirit of 2000s electroclash, the fatalism of witch house and sadboy rap, and the YOLO of festival EDM.","sourceHtml":"That feeling—\u003cmark>nowhere else to go and no one coming to save us\u003c/mark>—has informed the DIY spirit of 2000s electroclash, the fatalism of witch house and sadboy rap, and the YOLO of festival EDM."},{"en":"religiously honoring those existing categories","zh":"像信守宗教教条一样，严格维护现有曲风边界","source":"But how do we imagine the future if we’re religiously honoring those existing categories?","sourceHtml":"But how do we imagine the future if we’re \u003cmark>religiously honoring those existing categories\u003c/mark>?"},{"en":"chafing staleness of mainstream pop","zh":"主流流行乐陈腐到令人感到摩擦、刺痛","source":"Here’s one more word to describe our aesthetic present: Hyperclash has something to show us about the chafing staleness of mainstream pop, the atomization of internet culture, and how to crack an intergenerational nostalgia loop.","sourceHtml":"Here’s one more word to describe our aesthetic present: Hyperclash has something to show us about the \u003cmark>chafing staleness of mainstream pop\u003c/mark>, the atomization of internet culture, and how to crack an intergenerational nostalgia loop."},{"en":"atomization of internet culture","zh":"互联网文化碎裂成一个个彼此隔绝的小圈层与个体","source":"Here’s one more word to describe our aesthetic present: Hyperclash has something to show us about the chafing staleness of mainstream pop, the atomization of internet culture, and how to crack an intergenerational nostalgia loop.","sourceHtml":"Here’s one more word to describe our aesthetic present: Hyperclash has something to show us about the chafing staleness of mainstream pop, the \u003cmark>atomization of internet culture\u003c/mark>, and how to crack an intergenerational nostalgia loop."},{"en":"crack an intergenerational nostalgia loop","zh":"打破不同代际反复回收过去的怀旧循环","source":"Here’s one more word to describe our aesthetic present: Hyperclash has something to show us about the chafing staleness of mainstream pop, the atomization of internet culture, and how to crack an intergenerational nostalgia loop.","sourceHtml":"Here’s one more word to describe our aesthetic present: Hyperclash has something to show us about the chafing staleness of mainstream pop, the atomization of internet culture, and how to \u003cmark>crack an intergenerational nostalgia loop\u003c/mark>."},{"en":"necessary friction that separates an active scene from a fossilized revival","zh":"区分活跃场景与僵化复古的必要摩擦力","source":"That’s the necessary friction that separates an active scene from a fossilized revival.","sourceHtml":"That’s the \u003cmark>necessary friction that separates an active scene from a fossilized revival\u003c/mark>."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
</body>
