<script>
let cards = [{"en":"should be on","zh":"按安排就该登台演出","source":"Pavement should be on in 37 minutes.","sourceHtml":"Pavement \u003cmark>should be on\u003c/mark> in 37 minutes."},{"en":"be a production","zh":"办起来费了好大一番周折","source":"Getting here for this one-off gig—the last show of their improbable second reunion, which began in 2022—has been a production: Guitarist Spiral Stairs came in from Australia, where he’s lived for four years, while singer Stephen Malkmus came from Chicago, days after dropping off his youngest daughter, Sunday, at a Philadelphia college.","sourceHtml":"Getting here for this one-off gig—the last show of their improbable second reunion, which began in 2022—\u003cmark>has been a production\u003c/mark>: Guitarist Spiral Stairs came in from Australia, where he’s lived for four years, while singer Stephen Malkmus came from Chicago, days after dropping off his youngest daughter, Sunday, at a Philadelphia college."},{"en":"scan like a primer","zh":"读起来像是一份入门指南","source":"Bob Nastanovich, Pavement’s auxiliary drummer and tireless hypeman onstage and off, drove the hour north from the spot he recently bought in Macon, having shaped a 15-song setlist that scans like a Pavement primer.","sourceHtml":"Bob Nastanovich, Pavement’s auxiliary drummer and tireless hypeman onstage and off, drove the hour north from the spot he recently bought in Macon, having shaped a 15-song setlist that \u003cmark>scans like a Pavement primer\u003c/mark>."},{"en":"barely hold on to third","zh":"勉强保住第三名","source":"“The show’s right here, my man.” I put $20 on Brinxy, as Nastanovich calls him, who barely holds on to third.","sourceHtml":"“The show’s right here, my man.” I put $20 on Brinxy, as Nastanovich calls him, who \u003cmark>barely holds on to third\u003c/mark>."},{"en":"walk with the full fee","zh":"走的时候把全额报酬拿到手","source":"Up front, after all, Ibold is clutching his bag of beers; the band will walk tonight with their full fee, a few hundred grand according to industry sources, a lot more than they ever made back then.","sourceHtml":"Up front, after all, Ibold is clutching his bag of beers; the band \u003cmark>will walk tonight with their full fee\u003c/mark>, a few hundred grand according to industry sources, a lot more than they ever made back then."},{"en":"make the trek","zh":"专程跋涉赶来","source":"A crew of Nastanovich’s Macon friends made the trek, while a North Carolina contingent includes the cofounder of the company that had long printed Pavement’s merch.","sourceHtml":"A crew of Nastanovich’s Macon friends \u003cmark>made the trek\u003c/mark>, while a North Carolina contingent includes the cofounder of the company that had long printed Pavement’s merch."},{"en":"not be feeling it","zh":"当时提不起兴致或没进入状态","source":"“Stephen said this afternoon, ‘I hope this gets canceled.’ You saw him at sound check—he wasn’t feeling it,” he says.","sourceHtml":"“Stephen said this afternoon, ‘I hope this gets canceled.’ You saw him at sound check—\u003cmark>he wasn’t feeling it\u003c/mark>,” he says."},{"en":"an inveterate showman","zh":"走到哪儿都爱把场面变成表演的人","source":"An inveterate showman, he would greet every concertgoer at the door or hand them celery sticks or mashed potatoes or even pennies as they entered; he partied so hard on tour he once fell backward from his drums through a curtain behind an eight-foot stage in Atlanta, though he crawled back up to the kit and finished the gig anyway.","sourceHtml":"\u003cmark>An inveterate showman\u003c/mark>, he would greet every concertgoer at the door or hand them celery sticks or mashed potatoes or even pennies as they entered; he partied so hard on tour he once fell backward from his drums through a curtain behind an eight-foot stage in Atlanta, though he crawled back up to the kit and finished the gig anyway."},{"en":"keep time","zh":"稳稳地维持节拍","source":"They recruited Nastanovich as a supporting drummer—his only real qualification being that he could keep time—and Ibold, who first picked up a bass at 26 and nearly 40 years later hesitates to call himself a bassist.","sourceHtml":"They recruited Nastanovich as a supporting drummer—his only real qualification being that he could \u003cmark>keep time\u003c/mark>—and Ibold, who first picked up a bass at 26 and nearly 40 years later hesitates to call himself a bassist."},{"en":"a metonym for indie rock","zh":"一个名字就能代指出独立摇滚","source":"Pavement is perhaps the most efficient metonym for indie rock too.","sourceHtml":"Pavement is perhaps \u003cmark>the most efficient metonym for indie rock\u003c/mark> too."},{"en":"ramshackle approach","zh":"松散、摇摇晃晃的做法","source":"The band’s inscrutable lyrics and ramshackle approach make for songs that feel like unintentional and effortless anthems, rock ’n’ roll castoffs that catalyzed new possibilities.","sourceHtml":"The band’s inscrutable lyrics and \u003cmark>ramshackle approach\u003c/mark> make for songs that feel like unintentional and effortless anthems, rock ’n’ roll castoffs that catalyzed new possibilities."},{"en":"bumper music","zh":"广播节目用于进出一段内容的转场音乐","source":"In the quarter-century since they first quit, their appeal has become wildly trans-generational: They are Gen X icons whose “5-4=Unity” is used as NPR bumper music at least a dozen times each day and whose former EP obscurity “Harness Your Hopes” was sucked into the streaming algorithm and has gone viral at least twice during the past decade.","sourceHtml":"In the quarter-century since they first quit, their appeal has become wildly trans-generational: They are Gen X icons whose “5-4=Unity” is used as NPR \u003cmark>bumper music\u003c/mark> at least a dozen times each day and whose former EP obscurity “Harness Your Hopes” was sucked into the streaming algorithm and has gone viral at least twice during the past decade."},{"en":"fit-check trend","zh":"在短视频里展示当日穿搭的风潮","source":"It most famously soundtracked the Utah fit-check trend, where a shaggy-haired Utah teen with a cross in his TikTok handle stood in front of his pickup wearing a camo shirt.","sourceHtml":"It most famously soundtracked the Utah \u003cmark>fit-check trend\u003c/mark>, where a shaggy-haired Utah teen with a cross in his TikTok handle stood in front of his pickup wearing a camo shirt."},{"en":"lean into it","zh":"顺势接受并主动投入其中","source":"It was inane internet bullshit, but Pavement leaned into it.","sourceHtml":"It was inane internet bullshit, but Pavement \u003cmark>leaned into it\u003c/mark>."},{"en":"lampoon something","zh":"用夸张戏仿公开揶揄某事","source":"And for Pavements, Alex Ross Perry’s 2024 movie about the band, the director staged an Off Broadway musical of its songs, built a half-fake memorabilia museum, and assembled a comedic cast that included Joe Keery and Tim Heidecker just to lampoon how seriously classic-rock bio-pics take themselves and their subjects.","sourceHtml":"And for Pavements, Alex Ross Perry’s 2024 movie about the band, the director staged an Off Broadway musical of its songs, built a half-fake memorabilia museum, and assembled a comedic cast that included Joe Keery and Tim Heidecker just to \u003cmark>lampoon how seriously classic-rock bio-pics take themselves\u003c/mark> and their subjects."},{"en":"stare down existential questions","zh":"直面一连串关乎自身存续的问题","source":"The rest of the band flew up and rendezvoused to rehearse for a recording session, several people not in but around Pavement told me. (“No comment,” anyone I asked in the band’s organization said, often with a smile.) As Pavement reach the end of the fifth year of their second reunion, the indie-rock exemplars are staring down a series of existential questions: How long can you play the past before it becomes only a cash-in?","sourceHtml":"The rest of the band flew up and rendezvoused to rehearse for a recording session, several people not in but around Pavement told me. (“No comment,” anyone I asked in the band’s organization said, often with a smile.) As Pavement reach the end of the fifth year of their second reunion, the indie-rock exemplars are \u003cmark>staring down a series of existential questions\u003c/mark>: How long can you play the past before it becomes only a cash-in?"},{"en":"a cash-in","zh":"趁热度或名气捞一笔钱的行动","source":"The rest of the band flew up and rendezvoused to rehearse for a recording session, several people not in but around Pavement told me. (“No comment,” anyone I asked in the band’s organization said, often with a smile.) As Pavement reach the end of the fifth year of their second reunion, the indie-rock exemplars are staring down a series of existential questions: How long can you play the past before it becomes only a cash-in?","sourceHtml":"The rest of the band flew up and rendezvoused to rehearse for a recording session, several people not in but around Pavement told me. (“No comment,” anyone I asked in the band’s organization said, often with a smile.) As Pavement reach the end of the fifth year of their second reunion, the indie-rock exemplars are staring down a series of existential questions: How long can you play the past before it \u003cmark>becomes only a cash-in\u003c/mark>?"},{"en":"something writ large","zh":"某种现象的整体或放大体现","source":"He laughs in a way that reminds me of the 27-year-old smart aleck who, in 1994, used the last verse of one of Pavement’s most magnetic songs, “Range Life,” to rib the Smashing Pumpkins’ weird ascent and the Stone Temple Pilots’ devilish beauty and rock stardom writ large, at the very moment they seemed on the precipice of stardom themselves, before it all slowly unraveled.","sourceHtml":"He laughs in a way that reminds me of the 27-year-old smart aleck who, in 1994, used the last verse of one of Pavement’s most magnetic songs, “Range Life,” to rib the Smashing Pumpkins’ weird ascent and the Stone Temple Pilots’ devilish beauty and \u003cmark>rock stardom writ large\u003c/mark>, at the very moment they seemed on the precipice of stardom themselves, before it all slowly unraveled."},{"en":"on the precipice of stardom","zh":"站在即将成名的边缘","source":"He laughs in a way that reminds me of the 27-year-old smart aleck who, in 1994, used the last verse of one of Pavement’s most magnetic songs, “Range Life,” to rib the Smashing Pumpkins’ weird ascent and the Stone Temple Pilots’ devilish beauty and rock stardom writ large, at the very moment they seemed on the precipice of stardom themselves, before it all slowly unraveled.","sourceHtml":"He laughs in a way that reminds me of the 27-year-old smart aleck who, in 1994, used the last verse of one of Pavement’s most magnetic songs, “Range Life,” to rib the Smashing Pumpkins’ weird ascent and the Stone Temple Pilots’ devilish beauty and rock stardom writ large, at the very moment they seemed \u003cmark>on the precipice of stardom\u003c/mark> themselves, before it all slowly unraveled."},{"en":"be en route","zh":"正在途中","source":"He pans his camera to show me his gold record for “Harness Your Hopes,” noting its platinum counterpart is en route.","sourceHtml":"He pans his camera to show me his gold record for “Harness Your Hopes,” noting its platinum counterpart \u003cmark>is en route\u003c/mark>."},{"en":"be weighed down by something","zh":"被某件事拖累、压得喘不过气","source":"I’m not weighed down by it.","sourceHtml":"I’m not \u003cmark>weighed down by it\u003c/mark>."},{"en":"press a seven-inch single","zh":"压制一张七英寸黑胶单曲","source":"In early 1989, Stairs mailed three letters with one question: How do you press a seven-inch single when you don’t have a record deal?","sourceHtml":"In early 1989, Stairs mailed three letters with one question: How do you \u003cmark>press a seven-inch single\u003c/mark> when you don’t have a record deal?"},{"en":"get a record mastered","zh":"给唱片做母带处理","source":"“The only response I got back was from SST—a Black Flag poster with a handwritten note from Henry Rollins, saying go to this place to get your record mastered or something,” Stairs remembers (others remember it differently), referring to a pressing plant in a nondescript LA suburb.","sourceHtml":"“The only response I got back was from SST—a Black Flag poster with a handwritten note from Henry Rollins, saying go to this place to \u003cmark>get your record mastered\u003c/mark> or something,” Stairs remembers (others remember it differently), referring to a pressing plant in a nondescript LA suburb."},{"en":"let someone in on something","zh":"让某人也知道内情或领会其中门道","source":"They called their EP Slay Tracks: 1933–1969, a title that obfuscated their story from the start and also instantly let listeners in on their sense of mischief and play.","sourceHtml":"They called their EP Slay Tracks: 1933–1969, a title that obfuscated their story from the start and also instantly \u003cmark>let listeners in on\u003c/mark> their sense of mischief and play."},{"en":"ad hoc label","zh":"为当前需要临时设立的厂牌","source":"There was so little information on the record sleeve that Cosloy couldn’t tell if the band’s name was Pavement or Treble Kicker, their ad hoc label.","sourceHtml":"There was so little information on the record sleeve that Cosloy couldn’t tell if the band’s name was Pavement or Treble Kicker, their \u003cmark>ad hoc label\u003c/mark>."},{"en":"capture people’s imagination","zh":"深深吸引人、激发他们的想象和兴趣","source":"If it was good enough to capture people’s imagination, shit would explode rather quickly,” Cosloy says.","sourceHtml":"If it was good enough to \u003cmark>capture people’s imagination\u003c/mark>, shit would explode rather quickly,” Cosloy says."},{"en":"man the recording gear","zh":"负责操作录音设备","source":"Stairs and Malkmus manned the recording gear for one another in Young’s studio.","sourceHtml":"Stairs and Malkmus \u003cmark>manned the recording gear\u003c/mark> for one another in Young’s studio."},{"en":"play it to death","zh":"把某首歌或唱片反复放到极致","source":"“We played it to death.","sourceHtml":"“We \u003cmark>played it to death\u003c/mark>."},{"en":"a six-figure advance","zh":"一笔达到六位数的预付款","source":"The way Cosloy tells it, Pavement had sent a tape to Rough Trade, rumored to have awarded the Butthole Surfers a six-figure advance.","sourceHtml":"The way Cosloy tells it, Pavement had sent a tape to Rough Trade, rumored to have awarded the Butthole Surfers \u003cmark>a six-figure advance\u003c/mark>."},{"en":"out of spite","zh":"出于怨气或存心赌一口气","source":"When Rough Trade offered Pavement much less, they chose Matador, as if out of spite.","sourceHtml":"When Rough Trade offered Pavement much less, they chose Matador, as if \u003cmark>out of spite\u003c/mark>."},{"en":"run a rave","zh":"刊出一篇赞不绝口的评论","source":"A month before it was released, in April 1992, Spin ran a rave: “There’s no cover on my XL II—no song titles, no lyrics, no personnel list.","sourceHtml":"A month before it was released, in April 1992, Spin \u003cmark>ran a rave\u003c/mark>: “There’s no cover on my XL II—no song titles, no lyrics, no personnel list."},{"en":"preorders pour in","zh":"预订订单大量涌入","source":"All I have is music, played over and over again.” Some 5,000 preorders poured in, with Matador dumping so much money into fulfilling requests they didn’t pay rent; the day boxes of Slanted and Enchanted arrived in their tiny Manhattan office, so did the cops, bearing an eviction notice.","sourceHtml":"All I have is music, played over and over again.” Some 5,000 \u003cmark>preorders poured in\u003c/mark>, with Matador dumping so much money into fulfilling requests they didn’t pay rent; the day boxes of Slanted and Enchanted arrived in their tiny Manhattan office, so did the cops, bearing an eviction notice."},{"en":"crash on someone’s couch","zh":"临时借宿在某人的沙发上","source":"Malkmus had recently moved to New York with less than $1,000, crashing on the couch of Nastanovich, his University of Virginia chum who had come to the city to drive a bus.","sourceHtml":"Malkmus had recently moved to New York with less than $1,000, \u003cmark>crashing on the couch of\u003c/mark> Nastanovich, his University of Virginia chum who had come to the city to drive a bus."},{"en":"go off the rails","zh":"乱套、偏离正常状态","source":"He asked Nastanovich to join Pavement, to keep the beat whenever Young went off the rails.","sourceHtml":"He asked Nastanovich to join Pavement, to keep the beat whenever Young \u003cmark>went off the rails\u003c/mark>."},{"en":"heckled","zh":"在演出中朝台上喊话起哄","source":"Two years earlier, Malkmus, Nastanovich, and David Berman—also a pal from the University of Virginia, still a few years from releasing his first songs as Silver Jews—had heckled Nirvana so much during a New York show that the band and its fans got pissed.","sourceHtml":"Two years earlier, Malkmus, Nastanovich, and David Berman—also a pal from the University of Virginia, still a few years from releasing his first songs as Silver Jews—had \u003cmark>heckled\u003c/mark> Nirvana so much during a New York show that the band and its fans got pissed."},{"en":"underdogs","zh":"不被看好、明显处于劣势的一方","source":"We felt like real underdogs.”","sourceHtml":"We felt like \u003cmark>real underdogs\u003c/mark>.”"},{"en":"keep your sticks warm","zh":"鼓棒别放凉，随时准备接手","source":"“So Stephen says, ‘If Gary goes, keep your sticks warm.’ ”","sourceHtml":"“So Stephen says, ‘If Gary goes, \u003cmark>keep your sticks warm\u003c/mark>.’ ”"},{"en":"be thrust into something","zh":"突然被推入某个处境","source":"West was thrust into one of rock’s most talked-about new bands, but he didn’t feel much pressure.","sourceHtml":"West \u003cmark>was thrust into\u003c/mark> one of rock’s most talked-about new bands, but he didn’t feel much pressure."},{"en":"a lightning rod for critical acclaim","zh":"让评论界的赞誉集中涌向它的焦点","source":"West was right: Released on Valentine’s Day 1994, Crooked Rain, Crooked Rain—named for a Berman cartoon drawing that hung on the wall of the Jersey City apartment he shared with Malkmus and Nastanovich—was a lightning rod for critical acclaim.","sourceHtml":"West was right: Released on Valentine’s Day 1994, Crooked Rain, Crooked Rain—named for a Berman cartoon drawing that hung on the wall of the Jersey City apartment he shared with Malkmus and Nastanovich—was \u003cmark>a lightning rod for critical acclaim\u003c/mark>."},{"en":"the yardstick by which others are judged","zh":"用来衡量其他作品的标尺","source":"Melody Maker put Malkmus on the cover, with Everett True writing it was “the album of 1994, the yardstick by which all others are judged.","sourceHtml":"Melody Maker put Malkmus on the cover, with Everett True writing it was “the album of 1994, \u003cmark>the yardstick by which all others are judged\u003c/mark>."},{"en":"a ramshackle country burner","zh":"松散摇晃、却烧得起来的乡村风歌曲","source":"“Heaven Is a Truck” was a ramshackle country burner with lyrics that read like surrealistic self-doubt; “Unfair” was a tantrum about California politics catchy enough to make you care about the state’s byzantine water rights.","sourceHtml":"“Heaven Is a Truck” was \u003cmark>a ramshackle country burner\u003c/mark> with lyrics that read like surrealistic self-doubt; “Unfair” was a tantrum about California politics catchy enough to make you care about the state’s byzantine water rights."},{"en":"punch above one’s weight","zh":"以较小的实力或体量打出更高水平的成绩","source":"It was the sound of those indie-rock underdogs punching above their weight and winning, talking shit on tracks, that would stick around.","sourceHtml":"It was the sound of those indie-rock underdogs \u003cmark>punching above their weight\u003c/mark> and winning, talking shit on tracks, that would stick around."},{"en":"to wit","zh":"具体来说，举一个现成的例子","source":"To wit, “Gold Soundz” remains one of those perfect songs where everyone can hum the same blissful melody and memorize the same twisted lyrics—“Because you’re empty, and I’m empty / And you can never quarantine the past”—and still take something entirely different from the experience.","sourceHtml":"\u003cmark>To wit\u003c/mark>, “Gold Soundz” remains one of those perfect songs where everyone can hum the same blissful melody and memorize the same twisted lyrics—“Because you’re empty, and I’m empty / And you can never quarantine the past”—and still take something entirely different from the experience."},{"en":"had made it","zh":"当时已经闯出了名堂","source":"Stairs finally thought Pavement had made it, because, in interviews, they got to talk about the bands he loved, how Sonic Youth or R.E.M. or Dinosaur Jr. had helped shape them.","sourceHtml":"Stairs finally thought Pavement \u003cmark>had made it\u003c/mark>, because, in interviews, they got to talk about the bands he loved, how Sonic Youth or R.E.M. or Dinosaur Jr. had helped shape them."},{"en":"set the world alight","zh":"让世人轰动、惊艳四方","source":"Malkmus once wrote, “We didn’t quite set the world half-alight like I thought we would.” Goggin had been right too: Pavement, at least to date, have never made a bigger record, whether talking sales or acclaim.","sourceHtml":"Malkmus once wrote, “We didn’t quite \u003cmark>set the world half-alight\u003c/mark> like I thought we would.” Goggin had been right too: Pavement, at least to date, have never made a bigger record, whether talking sales or acclaim."},{"en":"moon the crowd","zh":"朝观众露屁股","source":"Stairs pulled down his shorts and mooned the crowd, like a fuck-you to this whole corruptible star-making machine.","sourceHtml":"Stairs pulled down his shorts and \u003cmark>mooned the crowd\u003c/mark>, like a fuck-you to this whole corruptible star-making machine."},{"en":"a fixer-upper","zh":"买下后还得花工夫修缮的房子","source":"They found an antebellum fixer-upper, not far from his parents’ farm.","sourceHtml":"They found \u003cmark>an antebellum fixer-upper\u003c/mark>, not far from his parents’ farm."},{"en":"put in an offer","zh":"正式提出购房报价","source":"They put in an offer.","sourceHtml":"They \u003cmark>put in an offer\u003c/mark>."},{"en":"voice crumbling","zh":"嗓音撑不住、一下垮掉","source":"When Pavement stepped onstage in the Mojave Desert around 5 p.m. on October 10, 1999, it was still 102 degrees, the sun so relentless they were already sweating when they opened with “Gold Soundz.” They couldn’t finish the song, Malkmus’s voice crumbling every time he reached for a high note.","sourceHtml":"When Pavement stepped onstage in the Mojave Desert around 5 p.m. on October 10, 1999, it was still 102 degrees, the sun so relentless they were already sweating when they opened with “Gold Soundz.” They couldn’t finish the song, Malkmus’s \u003cmark>voice crumbling\u003c/mark> every time he reached for a high note."},{"en":"rip","zh":"以强劲的速度和力度猛奏","source":"He nods along and grins as they rip, like it’s a late--afternoon jolt of caffeine.","sourceHtml":"He nods along and grins \u003cmark>as they rip\u003c/mark>, like it’s a late--afternoon jolt of caffeine."},{"en":"your voice is letting you down","zh":"想唱的时候嗓子却掉链子","source":"“But then your voice is letting you down.","sourceHtml":"“But then \u003cmark>your voice is letting you down\u003c/mark>."},{"en":"duck outsize contracts","zh":"避开大得异乎寻常的合同","source":"Unlike many of their indie-rock peers, Pavement rejected every major-label caller, ducking outsize contracts.","sourceHtml":"Unlike many of their indie-rock peers, Pavement rejected every major-label caller, \u003cmark>ducking outsize contracts\u003c/mark>."},{"en":"blow a show off","zh":"直接翘掉原本答应的演出","source":"“If I was John Cougar, I would have blown this show off, or Radiohead,” Malkmus told the crowd.","sourceHtml":"“If I was John Cougar, I would have \u003cmark>blown this show off\u003c/mark>, or Radiohead,” Malkmus told the crowd."},{"en":"a marquee producer","zh":"名字本身就有号召力的知名制作人","source":"Four months earlier, they’d released Terror Twilight, a brilliant and nuanced record and the first they’d made with a marquee producer, Nigel Godrich.","sourceHtml":"Four months earlier, they’d released Terror Twilight, a brilliant and nuanced record and the first they’d made with \u003cmark>a marquee producer\u003c/mark>, Nigel Godrich."},{"en":"tilting power dynamic","zh":"力量对比越来越向一方倾斜","source":"But their relationship with Godrich underlined Pavement’s tilting power dynamic.","sourceHtml":"But their relationship with Godrich underlined Pavement’s \u003cmark>tilting power dynamic\u003c/mark>."},{"en":"rinse-and-repeat exhaustion","zh":"因同一套流程循环往复而生的疲惫","source":"But Malkmus tells me about the rinse-and-repeat exhaustion of releasing five albums in seven years, how reporters who barely knew his work lined up to ask the same questions.","sourceHtml":"But Malkmus tells me about the \u003cmark>rinse-and-repeat exhaustion\u003c/mark> of releasing five albums in seven years, how reporters who barely knew his work lined up to ask the same questions."},{"en":"turn it on","zh":"有意识地拿出热络、能应付场面的状态","source":"“I’m socially awkward sometimes, and it takes me a lot of energy, like anyone, to turn it on.","sourceHtml":"“I’m socially awkward sometimes, and it takes me a lot of energy, like anyone, \u003cmark>to turn it on\u003c/mark>."},{"en":"not really land","zh":"没真正传到人心里、没激起什么反响","source":"“It was me wanting to hold on to stuff like doing music, and Preston School stuff wasn’t really landing,” he admits, sighing.","sourceHtml":"“It was me wanting to hold on to stuff like doing music, and Preston School stuff \u003cmark>wasn’t really landing\u003c/mark>,” he admits, sighing."},{"en":"months shy of a decade","zh":"离满十年还差几个月","source":"On July 2, 2009, months shy of a decade since Pavement’s unceremonious farewell, Malkmus had dinner with his booking agent, David “Boche” Viecelli, before a Jicks show in Chicago.","sourceHtml":"On July 2, 2009, \u003cmark>months shy of a decade\u003c/mark> since Pavement’s unceremonious farewell, Malkmus had dinner with his booking agent, David “Boche” Viecelli, before a Jicks show in Chicago."},{"en":"have merit on that basis","zh":"单凭这一点就值得做","source":"Because if you don’t think it has merit on that basis, you’re not gonna be happy.’ ”","sourceHtml":"Because if you don’t think it \u003cmark>has merit on that basis\u003c/mark>, you’re not gonna be happy.’ ”"},{"en":"log hours","zh":"累计投入一定数量的工时","source":"The next day, the Jicks played in Des Moines, where Nastanovich was logging up to 70 hours a week at the same racetrack where we watch Brinx Job run.","sourceHtml":"The next day, the Jicks played in Des Moines, where Nastanovich \u003cmark>was logging up to 70 hours a week\u003c/mark> at the same racetrack where we watch Brinx Job run."},{"en":"indie-rock communion","zh":"独立摇滚听众共享的一场近乎仪式的体验","source":"I saw one of their summer gigs and remember how vindicating but absurd it all seemed—the former because sharing those songs with so many other people felt like some delayed indie-rock communion, the latter because Pavement gave no signs this was more than an indie-rock nostalgia play, not some avenue into the future.","sourceHtml":"I saw one of their summer gigs and remember how vindicating but absurd it all seemed—the former because sharing those songs with so many other people felt like \u003cmark>some delayed indie-rock communion\u003c/mark>, the latter because Pavement gave no signs this was more than an indie-rock nostalgia play, not some avenue into the future."},{"en":"a nostalgia play","zh":"把怀旧当成主要卖点的一招","source":"I saw one of their summer gigs and remember how vindicating but absurd it all seemed—the former because sharing those songs with so many other people felt like some delayed indie-rock communion, the latter because Pavement gave no signs this was more than an indie-rock nostalgia play, not some avenue into the future.","sourceHtml":"I saw one of their summer gigs and remember how vindicating but absurd it all seemed—the former because sharing those songs with so many other people felt like some delayed indie-rock communion, the latter because Pavement gave no signs this was more than \u003cmark>an indie-rock nostalgia play\u003c/mark>, not some avenue into the future."},{"en":"leave it all out on the stage","zh":"在台上把力气和心劲全都豁出去","source":"“We left it all out on the stage, and then we had to drive all that way to Las Vegas.","sourceHtml":"“We \u003cmark>left it all out on the stage\u003c/mark>, and then we had to drive all that way to Las Vegas."},{"en":"be slated to go","zh":"按安排将要前往","source":"Viecelli tells me that Malkmus and Stairs sorted through the confusion five minutes after the gig, but the implication remained: Yes, Pavement were slated to go to South America, but this was the second ending, maybe the last.","sourceHtml":"Viecelli tells me that Malkmus and Stairs sorted through the confusion five minutes after the gig, but the implication remained: Yes, Pavement \u003cmark>were slated to go\u003c/mark> to South America, but this was the second ending, maybe the last."},{"en":"by design","zh":"有意为之、原本就这么安排","source":"Whether by dumb misunderstanding or mere design, Pavement would once again not take the logical next step and keep touring or start recording, like, say, their reunited peers in Pixies or Dinosaur Jr.","sourceHtml":"Whether \u003cmark>by dumb misunderstanding or mere design\u003c/mark>, Pavement would once again not take the logical next step and keep touring or start recording, like, say, their reunited peers in Pixies or Dinosaur Jr."},{"en":"ephemera","zh":"原本只供短期使用、后来被留存下来的零碎物件","source":"A memorabilia magpie, Stairs started compiling a book of Pavement ephemera, since it was all over.","sourceHtml":"A memorabilia magpie, Stairs started compiling a book of \u003cmark>Pavement ephemera\u003c/mark>, since it was all over."},{"en":"end on a sour note","zh":"以不快的气氛收场","source":"“We ended on a sour note, so I didn’t expect anything to happen again,” says Nastanovich.","sourceHtml":"“We \u003cmark>ended on a sour note\u003c/mark>, so I didn’t expect anything to happen again,” says Nastanovich."},{"en":"the workhorse","zh":"一群人里持续扛下大量工作的人","source":"He is Pavement’s workhorse, waking up daily at 5 a.m. to make coffee, sit in a sauna, and practice Pavement songs for at least an hour.","sourceHtml":"He is \u003cmark>Pavement’s workhorse\u003c/mark>, waking up daily at 5 a.m. to make coffee, sit in a sauna, and practice Pavement songs for at least an hour."},{"en":"border on mania","zh":"接近狂热或着迷的地步","source":"He has a joy for playing drums, bordering on mania.”","sourceHtml":"He has a joy for playing drums, \u003cmark>bordering on mania\u003c/mark>.”"},{"en":"dampen the sound","zh":"把声音收住，减少振动和余响","source":"He tucks bits of blue gel around the rim of each piece to dampen the sound, then takes readings with a drum tensiometer to make sure everything is tuned.","sourceHtml":"He tucks bits of blue gel around the rim of each piece to \u003cmark>dampen the sound\u003c/mark>, then takes readings with a drum tensiometer to make sure everything is tuned."},{"en":"take readings","zh":"用仪器读出测量数值","source":"He tucks bits of blue gel around the rim of each piece to dampen the sound, then takes readings with a drum tensiometer to make sure everything is tuned.","sourceHtml":"He tucks bits of blue gel around the rim of each piece to dampen the sound, then \u003cmark>takes readings\u003c/mark> with a drum tensiometer to make sure everything is tuned."},{"en":"upend expectations","zh":"彻底打乱人们原有的预期","source":"Once a band that delighted in upending expectations, Pavement now pay close attention to what people want to hear.","sourceHtml":"Once a band that delighted in \u003cmark>upending expectations\u003c/mark>, Pavement now pay close attention to what people want to hear."},{"en":"the prize in a Cracker Jack box","zh":"一盒零食里藏着的小奖品","source":"In the ’90s, they played “Harness Your Hopes” maybe a half-dozen times, though no one recalls doing so; in the past five years, they’ve performed it at almost every show, moving it through the setlist like the prize in a Cracker Jack box.","sourceHtml":"In the ’90s, they played “Harness Your Hopes” maybe a half-dozen times, though no one recalls doing so; in the past five years, they’ve performed it at almost every show, moving it through the setlist like \u003cmark>the prize in a Cracker Jack box\u003c/mark>."},{"en":"alien tuning","zh":"反常得像来自另一个世界的调弦","source":"When Pavement started talking about what songs they might bring to their second reunion in 2022, Malkmus was against “Stop Breathin’.” But in November 2021, a niche YouTube guitar tutorial he loves, Cool Chords, dissected its alien tuning and unorthodox structure, the host Mike Godette analyzing every note like a religious scholar might parse Moses’s sermons in Deuteronomy.","sourceHtml":"When Pavement started talking about what songs they might bring to their second reunion in 2022, Malkmus was against “Stop Breathin’.” But in November 2021, a niche YouTube guitar tutorial he loves, Cool Chords, dissected its \u003cmark>alien tuning\u003c/mark> and unorthodox structure, the host Mike Godette analyzing every note like a religious scholar might parse Moses’s sermons in Deuteronomy."},{"en":"linger in the pocket","zh":"在队友形成的保护圈里从容多等片刻","source":"Nastanovich suggests this tremendous shift in attitude and approach stems directly from Malkmus, whose late-20s nervousness has eased, who has relaxed like a quarterback comfortable with lingering in the pocket a little longer.","sourceHtml":"Nastanovich suggests this tremendous shift in attitude and approach stems directly from Malkmus, whose late-20s nervousness has eased, who has relaxed like a quarterback comfortable with \u003cmark>lingering in the pocket\u003c/mark> a little longer."},{"en":"open up for a band","zh":"在一支乐队前面登台暖场","source":"We’ve been asked three times to open up for them,” he says, laughing. (Weezer say it was once.) “It just doesn’t sound like fun to us.","sourceHtml":"We’ve been asked three times \u003cmark>to open up for them\u003c/mark>,” he says, laughing. (Weezer say it was once.) “It just doesn’t sound like fun to us."},{"en":"sashay through","zh":"踩着轻松而有派头的步子走过一段","source":"They were eight songs into the set, sashaying through “Gold Soundz,” when Nastanovich decided to gallivant around the stage with his tambourine.","sourceHtml":"They were eight songs into the set, \u003cmark>sashaying through\u003c/mark> “Gold Soundz,” when Nastanovich decided to gallivant around the stage with his tambourine."},{"en":"the lip of the stage","zh":"舞台的前沿","source":"The lights were weird, so he misjudged the lip of the stage, plummeting nearly seven feet into the pit.","sourceHtml":"The lights were weird, so he \u003cmark>misjudged the lip of the stage\u003c/mark>, plummeting nearly seven feet into the pit."},{"en":"one’s leg balloons","zh":"腿像吹气球那样迅速肿起来","source":"Nastanovich finished the tour, including two New Zealand dates and a meeting with Chris Knox, of indie-rock forebears Tall Dwarfs. (“A real pleasure,” he says.) Flying back to the States, though, his leg ballooned so much he worried he might die.","sourceHtml":"Nastanovich finished the tour, including two New Zealand dates and a meeting with Chris Knox, of indie-rock forebears Tall Dwarfs. (“A real pleasure,” he says.) Flying back to the States, though, \u003cmark>his leg ballooned\u003c/mark> so much he worried he might die."},{"en":"get out of here alive","zh":"能活着从这里出去","source":"“Is there any way to get out of here alive?” Malkmus asks as he leans in close to Ibold, gold chain dangling over a white T-shirt.","sourceHtml":"“Is there any way to \u003cmark>get out of here alive\u003c/mark>?” Malkmus asks as he leans in close to Ibold, gold chain dangling over a white T-shirt."},{"en":"dance with death","zh":"不断与死亡打照面","source":"The booze, the drugs, the gun he bought on tour, the time he jumped into a pool on his wedding day and stayed at the bottom until someone dove in after him: Young’s lifestyle suggested he was always dancing with death.","sourceHtml":"The booze, the drugs, the gun he bought on tour, the time he jumped into a pool on his wedding day and stayed at the bottom until someone dove in after him: Young’s lifestyle suggested he was always \u003cmark>dancing with death\u003c/mark>."},{"en":"badmouth someone","zh":"讲某人的坏话","source":"After Pavement’s 2010 reunion, Stairs went eight years without speaking to Young because he’d badmouthed West.","sourceHtml":"After Pavement’s 2010 reunion, Stairs went eight years without speaking to Young because he’d \u003cmark>badmouthed West\u003c/mark>."},{"en":"an unflinching and poignant documentary","zh":"直面难堪细节又让人心酸的纪录片","source":"Stairs later served as the executive producer for Louder Than You Think, an unflinching and poignant documentary about Young’s lifetime of rebellion, named for the studio where Pavement was accidentally born.","sourceHtml":"Stairs later served as the executive producer for Louder Than You Think, \u003cmark>an unflinching and poignant documentary\u003c/mark> about Young’s lifetime of rebellion, named for the studio where Pavement was accidentally born."},{"en":"a legacy band","zh":"凭经典曲库与多年声望延续演出的老牌乐队","source":"These are the acts of a legacy band, bulwarks built of the past to guard against the uncertainty of the future—mortality, sickness, Malkmus again deciding he’s not having fun anymore.","sourceHtml":"These are the acts of \u003cmark>a legacy band\u003c/mark>, bulwarks built of the past to guard against the uncertainty of the future—mortality, sickness, Malkmus again deciding he’s not having fun anymore."},{"en":"flubs","zh":"小失误、偶然演砸的地方","source":"They have done well by their past, at least, playing the best shows of their career by many appraisals—two-hour sets with few flubs, finally finding a consistency that counters lingering slacker lore.","sourceHtml":"They have done well by their past, at least, playing the best shows of their career by many appraisals—two-hour sets with \u003cmark>few flubs\u003c/mark>, finally finding a consistency that counters lingering slacker lore."},{"en":"lingering slacker lore","zh":"多年仍未散去的散漫传说","source":"They have done well by their past, at least, playing the best shows of their career by many appraisals—two-hour sets with few flubs, finally finding a consistency that counters lingering slacker lore.","sourceHtml":"They have done well by their past, at least, playing the best shows of their career by many appraisals—two-hour sets with few flubs, finally finding a consistency that counters \u003cmark>lingering slacker lore\u003c/mark>."},{"en":"the better part of a decade","zh":"将近十年中的大部分时间","source":"That is, could Pavement talk college basketball and tennis and food and memories for the better part of a decade before committing to a next act?","sourceHtml":"That is, could Pavement talk college basketball and tennis and food and memories for \u003cmark>the better part of a decade\u003c/mark> before committing to a next act?"},{"en":"commit to a next act","zh":"下决心进入事业或人生的下一幕","source":"That is, could Pavement talk college basketball and tennis and food and memories for the better part of a decade before committing to a next act?","sourceHtml":"That is, could Pavement talk college basketball and tennis and food and memories for the better part of a decade before \u003cmark>committing to a next act\u003c/mark>?"},{"en":"pressure-cooked","zh":"处在压力不断积攒、像被闷在高压锅里的状态","source":"“Back then, it was more pressure-cooked.","sourceHtml":"“Back then, it was \u003cmark>more pressure-cooked\u003c/mark>."},{"en":"a never-ending merry-go-round","zh":"一场没完没了、让人下不来的循环","source":"There was potential for resentment and fatigue, a never-ending merry-go-round,” Malkmus tells me one morning, calling from an off-grid cabin West built near the home he found the day after Lollapalooza turned muddy, the day Pavement’s first ending came into view.","sourceHtml":"There was potential for resentment and fatigue, \u003cmark>a never-ending merry-go-round\u003c/mark>,” Malkmus tells me one morning, calling from an off-grid cabin West built near the home he found the day after Lollapalooza turned muddy, the day Pavement’s first ending came into view."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
