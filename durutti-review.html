<script>
let cards = [{"en":"abrasive angularity","zh":"字面是“粗粝的棱角感”","source":"When post-punk first emerged in the late ’70s, abrasive angularity was more or less mandatory.","sourceHtml":"When post-punk first emerged in the late ’70s, \u003cmark>abrasive angularity\u003c/mark> was more or less mandatory."},{"en":"at odds with their jagged peers","zh":"与那些声音尖锐、断裂感强的同辈格格不入","source":"Led by guitar genius Vini Reilly, they responded to the creative freedom of post-punk with delicate, melancholic ambient music at odds with their jagged peers.","sourceHtml":"Led by guitar genius Vini Reilly, they responded to the creative freedom of post-punk with delicate, melancholic ambient music \u003cmark>at odds with their jagged peers\u003c/mark>."},{"en":"trace the roots of","zh":"追溯……的根源或发展源头","source":"To trace the roots of The Durutti Column, who return with their first studio album in 16 years, you have to go back to the mid-’70s, when Manchester’s punk scene first coalesced.","sourceHtml":"To \u003cmark>trace the roots of\u003c/mark> The Durutti Column, who return with their first studio album in 16 years, you have to go back to the mid-’70s, when Manchester’s punk scene first coalesced."},{"en":"coalesced","zh":"原意为分散的事物“汇合、凝聚”","source":"To trace the roots of The Durutti Column, who return with their first studio album in 16 years, you have to go back to the mid-’70s, when Manchester’s punk scene first coalesced.","sourceHtml":"To trace the roots of The Durutti Column, who return with their first studio album in 16 years, you have to go back to the mid-’70s, when Manchester’s punk scene first \u003cmark>coalesced\u003c/mark>."},{"en":"hatching a plan","zh":"正在秘密或逐步酝酿一个计划","source":"Along with his management partner and future Factory Records co-founder Alan Erasmus, Tony Wilson was hatching a plan for a new group that would feature members of the rock parody outfit Alberto y Lost Trios Paranoias and punk band Fast Breeder, who Erasmus managed.","sourceHtml":"Along with his management partner and future Factory Records co-founder Alan Erasmus, Tony Wilson was \u003cmark>hatching a plan\u003c/mark> for a new group that would feature members of the rock parody outfit Alberto y Lost Trios Paranoias and punk band Fast Breeder, who Erasmus managed."},{"en":"enlisted the guitarist","zh":"招募这位吉他手加入","source":"Impressed by Vini Reilly’s playing with Manchester punk group The Nosebleeds, Wilson enlisted the guitarist in the newly formed group which he’d named Durutti Column, after a Situationist comic strip by French activist André Bertrand that was plastered all over the city of Strasbourg in October 1966 during protests by students of the University.","sourceHtml":"Impressed by Vini Reilly’s playing with Manchester punk group The Nosebleeds, Wilson \u003cmark>enlisted the guitarist\u003c/mark> in the newly formed group which he’d named Durutti Column, after a Situationist comic strip by French activist André Bertrand that was plastered all over the city of Strasbourg in October 1966 during protests by students of the University."},{"en":"plastered all over","zh":"到处密集张贴","source":"Impressed by Vini Reilly’s playing with Manchester punk group The Nosebleeds, Wilson enlisted the guitarist in the newly formed group which he’d named Durutti Column, after a Situationist comic strip by French activist André Bertrand that was plastered all over the city of Strasbourg in October 1966 during protests by students of the University.","sourceHtml":"Impressed by Vini Reilly’s playing with Manchester punk group The Nosebleeds, Wilson enlisted the guitarist in the newly formed group which he’d named Durutti Column, after a Situationist comic strip by French activist André Bertrand that was \u003cmark>plastered all over\u003c/mark> the city of Strasbourg in October 1966 during protests by students of the University."},{"en":"set up","zh":"此段出现两次，第一次是“筹办（演出之夜）”，第二次是“创办（独立厂牌）”","source":"Wilson and Erasmus set up their first Factory night in the Russell Club in Hulme, South Manchester, on May 26, 1978, and put the mis-spelled The Durutti Column at the top of the bill.","sourceHtml":"Wilson and Erasmus \u003cmark>set up\u003c/mark> their first Factory night in the Russell Club in Hulme, South Manchester, on May 26, 1978, and put the mis-spelled The Durutti Column at the top of the bill."},{"en":"at the top of the bill","zh":"位列演出名单最上方，即担任头牌","source":"Wilson and Erasmus set up their first Factory night in the Russell Club in Hulme, South Manchester, on May 26, 1978, and put the mis-spelled The Durutti Column at the top of the bill.","sourceHtml":"Wilson and Erasmus set up their first Factory night in the Russell Club in Hulme, South Manchester, on May 26, 1978, and put the mis-spelled The Durutti Column \u003cmark>at the top of the bill\u003c/mark>."},{"en":"find a home for his new group","zh":"为新乐队找到归属","source":"Unable to find a home for his new group, Wilson suggested to Erasmus that they set up their own independent label.","sourceHtml":"Unable to \u003cmark>find a home for his new group\u003c/mark>, Wilson suggested to Erasmus that they set up their own independent label."},{"en":"looking for a way out","zh":"正在寻找退出的途径","source":"But by the time The Durutti Column’s “No Communication” / “Thin Ice (Detail)” was featured alongside Joy Division’s “Digital” / “Glass” on the Martin Hannett-produced A Factory Sample EP, Vini Reilly was already looking for a way out.","sourceHtml":"But by the time The Durutti Column’s “No Communication” / “Thin Ice (Detail)” was featured alongside Joy Division’s “Digital” / “Glass” on the Martin Hannett-produced A Factory Sample EP, Vini Reilly was already \u003cmark>looking for a way out\u003c/mark>."},{"en":"as the sole member of","zh":"作为……唯一的成员","source":"He left the band, but somehow, Tony Wilson convinced him to return as the sole member of The Durutti Column after his former colleagues departed to form the cult post-punk group The Mothmen.","sourceHtml":"He left the band, but somehow, Tony Wilson convinced him to return \u003cmark>as the sole member of\u003c/mark> The Durutti Column after his former colleagues departed to form the cult post-punk group The Mothmen."},{"en":"frail in health and slipping deeper into depression","zh":"身体虚弱，且一步步陷入更深的抑郁","source":"“To return to the original anarchic ideas.” Frail in health and slipping deeper into depression, Reilly entered Cargo Studios, Rochdale, with legendary Factory Records producer Martin Hannett in August 1979.","sourceHtml":"“To return to the original anarchic ideas.” \u003cmark>Frail in health and slipping deeper into depression\u003c/mark>, Reilly entered Cargo Studios, Rochdale, with legendary Factory Records producer Martin Hannett in August 1979."},{"en":"strap on the guitar","zh":"把吉他背到身上准备演奏","source":"“Occasionally, Vini would strap on the guitar and play some notes onto the tracks.","sourceHtml":"“Occasionally, Vini would \u003cmark>strap on the guitar\u003c/mark> and play some notes onto the tracks."},{"en":"pored over the primitive electronics","zh":"全神贯注地钻研那些原始电子设备","source":"But it was hard to get Martin to notice as he pored over the primitive electronics.”","sourceHtml":"But it was hard to get Martin to notice as he \u003cmark>pored over the primitive electronics\u003c/mark>.”"},{"en":"a landmark in post-punk ambient music","zh":"后朋克氛围音乐的里程碑","source":"Despite the distance between the two, they created one of Factory Records’s great early albums; a landmark in post-punk ambient music with Reilly’s fragile guitar arpeggios suspended in space by Hannett’s delay and reverb.","sourceHtml":"Despite the distance between the two, they created one of Factory Records’s great early albums; \u003cmark>a landmark in post-punk ambient music\u003c/mark> with Reilly’s fragile guitar arpeggios suspended in space by Hannett’s delay and reverb."},{"en":"fragile guitar arpeggios suspended in space","zh":"脆弱纤细的吉他琶音悬浮在空间中","source":"Despite the distance between the two, they created one of Factory Records’s great early albums; a landmark in post-punk ambient music with Reilly’s fragile guitar arpeggios suspended in space by Hannett’s delay and reverb.","sourceHtml":"Despite the distance between the two, they created one of Factory Records’s great early albums; a landmark in post-punk ambient music with Reilly’s \u003cmark>fragile guitar arpeggios suspended in space\u003c/mark> by Hannett’s delay and reverb."},{"en":"treatment of drums","zh":"对鼓声的处理","source":"But it was Hannett’s treatment of drums that most impressed Reilly.","sourceHtml":"But it was Hannett’s \u003cmark>treatment of drums\u003c/mark> that most impressed Reilly."},{"en":"envisaged the final sound","zh":"预先构想出最终的声音","source":"“I don’t know how he could have possibly envisaged the final sound.”","sourceHtml":"“I don’t know how he could have possibly \u003cmark>envisaged the final sound\u003c/mark>.”"},{"en":"in contrast to the tenderness of the music","zh":"与音乐的温柔形成对照","source":"In contrast to the tenderness of the music, Tony Wilson came up with the idea of a coarse sandpaper sleeve, inspired by a 1959 Situationist publication by Guy Debord, that would destroy any albums placed next to it.","sourceHtml":"\u003cmark>In contrast to the tenderness of the music\u003c/mark>, Tony Wilson came up with the idea of a coarse sandpaper sleeve, inspired by a 1959 Situationist publication by Guy Debord, that would destroy any albums placed next to it."},{"en":"coarse sandpaper sleeve","zh":"粗砂纸唱片封套","source":"In contrast to the tenderness of the music, Tony Wilson came up with the idea of a coarse sandpaper sleeve, inspired by a 1959 Situationist publication by Guy Debord, that would destroy any albums placed next to it.","sourceHtml":"In contrast to the tenderness of the music, Tony Wilson came up with the idea of a \u003cmark>coarse sandpaper sleeve\u003c/mark>, inspired by a 1959 Situationist publication by Guy Debord, that would destroy any albums placed next to it."},{"en":"transitional","zh":"过渡性的、承前启后的","source":"The Durutti Column’s second album would be transitional.","sourceHtml":"The Durutti Column’s second album would be \u003cmark>transitional\u003c/mark>."},{"en":"jazz-oriented","zh":"以爵士乐为取向的","source":"The jazz-oriented Mitchell, a hugely respected and influential figure in the city’s music scene (whom Wilson referred to as “the real Mr.","sourceHtml":"The \u003cmark>jazz-oriented\u003c/mark> Mitchell, a hugely respected and influential figure in the city’s music scene (whom Wilson referred to as “the real Mr."},{"en":"spontaneity and rhythmic sensibilities to complement","zh":"以即兴性和节奏感补足……","source":"Manchester”), had the spontaneity and rhythmic sensibilities to complement Reilly’s tender harmonies and intricate melodies.","sourceHtml":"Manchester”), had the \u003cmark>spontaneity and rhythmic sensibilities to complement\u003c/mark> Reilly’s tender harmonies and intricate melodies."},{"en":"part ways with","zh":"与……分道扬镳、结束合作","source":"Released on Factory in November 1981, LC also saw Reilly part ways with Martin Hannett, producing the album himself on a TEAC four-track tape recorder in his bedroom while living with his mother, feeding his guitar and primitive drum machine through a Roland RE-201 Space Echo unit that became part of his signature sound.","sourceHtml":"Released on Factory in November 1981, LC also saw Reilly \u003cmark>part ways with\u003c/mark> Martin Hannett, producing the album himself on a TEAC four-track tape recorder in his bedroom while living with his mother, feeding his guitar and primitive drum machine through a Roland RE-201 Space Echo unit that became part of his signature sound."},{"en":"feeding his guitar and primitive drum machine through","zh":"把吉他和简陋鼓机的信号送入某台设备进行处理","source":"Released on Factory in November 1981, LC also saw Reilly part ways with Martin Hannett, producing the album himself on a TEAC four-track tape recorder in his bedroom while living with his mother, feeding his guitar and primitive drum machine through a Roland RE-201 Space Echo unit that became part of his signature sound.","sourceHtml":"Released on Factory in November 1981, LC also saw Reilly part ways with Martin Hannett, producing the album himself on a TEAC four-track tape recorder in his bedroom while living with his mother, \u003cmark>feeding his guitar and primitive drum machine through\u003c/mark> a Roland RE-201 Space Echo unit that became part of his signature sound."},{"en":"signature sound","zh":"标志性声音","source":"Released on Factory in November 1981, LC also saw Reilly part ways with Martin Hannett, producing the album himself on a TEAC four-track tape recorder in his bedroom while living with his mother, feeding his guitar and primitive drum machine through a Roland RE-201 Space Echo unit that became part of his signature sound.","sourceHtml":"Released on Factory in November 1981, LC also saw Reilly part ways with Martin Hannett, producing the album himself on a TEAC four-track tape recorder in his bedroom while living with his mother, feeding his guitar and primitive drum machine through a Roland RE-201 Space Echo unit that became part of his \u003cmark>signature sound\u003c/mark>."},{"en":"as beautifully fragile as his guitar playing","zh":"像他的吉他演奏一样，呈现出动人的脆弱感","source":"It was also the first of The Durutti Column’s albums to feature Reilly singing, his voice as beautifully fragile as his guitar playing.","sourceHtml":"It was also the first of The Durutti Column’s albums to feature Reilly singing, his voice \u003cmark>as beautifully fragile as his guitar playing\u003c/mark>."},{"en":"pastoral ambiance","zh":"田园式氛围","source":"Recorded at Strawberry Studio in Stockport, six miles south east of Manchester, and produced by Martin Hannett’s regular engineer Chris Nagle, the 1983 album continued the pastoral ambiance of LC with the addition of A Certain Ratio’s trumpeter Simon Topping and the cor anglais (an instrument similar to an oboe) of Maunagh Fleming.","sourceHtml":"Recorded at Strawberry Studio in Stockport, six miles south east of Manchester, and produced by Martin Hannett’s regular engineer Chris Nagle, the 1983 album continued the \u003cmark>pastoral ambiance\u003c/mark> of LC with the addition of A Certain Ratio’s trumpeter Simon Topping and the cor anglais (an instrument similar to an oboe) of Maunagh Fleming."},{"en":"offshoot","zh":"分支、衍生机构","source":"In November 1983, Reilly traveled to Daylight Studio in Brussels to record an album for Factory Benelux, the Manchester label’s Belgian offshoot.","sourceHtml":"In November 1983, Reilly traveled to Daylight Studio in Brussels to record an album for Factory Benelux, the Manchester label’s Belgian \u003cmark>offshoot\u003c/mark>."},{"en":"haunting neo-classical piece","zh":"令人久久难忘、带有幽灵般萦绕感的新古典作品","source":"The studio recordings included a haunting neo-classical piece for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to wrest the reins of classical music away from middle-class wankers in dinner suits”—abandoned the album Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and set out to position him as a contemporary classical composer.","sourceHtml":"The studio recordings included a \u003cmark>haunting neo-classical piece\u003c/mark> for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to wrest the reins of classical music away from middle-class wankers in dinner suits”—abandoned the album Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and set out to position him as a contemporary classical composer."},{"en":"wrest the reins of classical music away from","zh":"从……手里强行夺过古典音乐的缰绳","source":"The studio recordings included a haunting neo-classical piece for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to wrest the reins of classical music away from middle-class wankers in dinner suits”—abandoned the album Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and set out to position him as a contemporary classical composer.","sourceHtml":"The studio recordings included a haunting neo-classical piece for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to \u003cmark>wrest the reins of classical music away from\u003c/mark> middle-class wankers in dinner suits”—abandoned the album Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and set out to position him as a contemporary classical composer."},{"en":"abandoned the album","zh":"放弃／搁置这张专辑","source":"The studio recordings included a haunting neo-classical piece for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to wrest the reins of classical music away from middle-class wankers in dinner suits”—abandoned the album Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and set out to position him as a contemporary classical composer.","sourceHtml":"The studio recordings included a haunting neo-classical piece for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to wrest the reins of classical music away from middle-class wankers in dinner suits”—\u003cmark>abandoned the album\u003c/mark> Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and set out to position him as a contemporary classical composer."},{"en":"set out to position him as","zh":"着手把他定位、塑造成……","source":"The studio recordings included a haunting neo-classical piece for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to wrest the reins of classical music away from middle-class wankers in dinner suits”—abandoned the album Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and set out to position him as a contemporary classical composer.","sourceHtml":"The studio recordings included a haunting neo-classical piece for piano and viola entitled “Dune.” Tony Wilson—who would go on to launch Factory Classical in 1989, “to wrest the reins of classical music away from middle-class wankers in dinner suits”—abandoned the album Reilly had made (released retrospectively in 2012 as Short Stories for Pauline) and \u003cmark>set out to position him as\u003c/mark> a contemporary classical composer."},{"en":"was lauded as a landmark in neo-classical music","zh":"被高度赞誉为新古典音乐的里程碑","source":"Reininger and John Metcalfe on violas; Caroline Lavelle on cello; Richard Henry on trombone; Tim Kellett on trumpet; and Maunagh Fleming on cor anglais, Without Mercy was lauded as a landmark in neo-classical music on its release on Factory Records in October 1984.","sourceHtml":"Reininger and John Metcalfe on violas; Caroline Lavelle on cello; Richard Henry on trombone; Tim Kellett on trumpet; and Maunagh Fleming on cor anglais, Without Mercy \u003cmark>was lauded as a landmark in neo-classical music\u003c/mark> on its release on Factory Records in October 1984."},{"en":"a long association with the group","zh":"与乐队长久的合作关系","source":"The album’s design, featuring a painting by Henri Matisse, was the first in a long association with the group by the 8vo collective (Simon Johnston, Mark Holt, and Hamish Muir).","sourceHtml":"The album’s design, featuring a painting by Henri Matisse, was the first in a \u003cmark>long association with the group\u003c/mark> by the 8vo collective (Simon Johnston, Mark Holt, and Hamish Muir)."},{"en":"sweeping viola","zh":"铺展而来、具有宽阔运动感的中提琴声部","source":"The sweeping viola on “For Pauline” that opens The Durutti Column’s 1986 follow-up Circuses and Bread would suggest that Reilly was aiming to take on the mantle of Factory Records’s neo-classical star.","sourceHtml":"The \u003cmark>sweeping viola\u003c/mark> on “For Pauline” that opens The Durutti Column’s 1986 follow-up Circuses and Bread would suggest that Reilly was aiming to take on the mantle of Factory Records’s neo-classical star."},{"en":"take on the mantle of","zh":"接过……的衣钵、承担……的角色","source":"The sweeping viola on “For Pauline” that opens The Durutti Column’s 1986 follow-up Circuses and Bread would suggest that Reilly was aiming to take on the mantle of Factory Records’s neo-classical star.","sourceHtml":"The sweeping viola on “For Pauline” that opens The Durutti Column’s 1986 follow-up Circuses and Bread would suggest that Reilly was aiming to \u003cmark>take on the mantle of\u003c/mark> Factory Records’s neo-classical star."},{"en":"hard electronic edges","zh":"冷硬而锋利的电子质感","source":"But from the hard electronic edges of “Dance II” to the melancholic majesty of “Royal Infirmary,” this was to be The Durutti Column’s most eclectic and un-pigeon-hole-able album to date.","sourceHtml":"But from the \u003cmark>hard electronic edges\u003c/mark> of “Dance II” to the melancholic majesty of “Royal Infirmary,” this was to be The Durutti Column’s most eclectic and un-pigeon-hole-able album to date."},{"en":"melancholic majesty","zh":"忧郁的宏伟／庄严感","source":"But from the hard electronic edges of “Dance II” to the melancholic majesty of “Royal Infirmary,” this was to be The Durutti Column’s most eclectic and un-pigeon-hole-able album to date.","sourceHtml":"But from the hard electronic edges of “Dance II” to the \u003cmark>melancholic majesty\u003c/mark> of “Royal Infirmary,” this was to be The Durutti Column’s most eclectic and un-pigeon-hole-able album to date."},{"en":"un-pigeon-hole-able","zh":"难以塞进固定类别的，亦即难以归类","source":"But from the hard electronic edges of “Dance II” to the melancholic majesty of “Royal Infirmary,” this was to be The Durutti Column’s most eclectic and un-pigeon-hole-able album to date.","sourceHtml":"But from the hard electronic edges of “Dance II” to the melancholic majesty of “Royal Infirmary,” this was to be The Durutti Column’s most eclectic and \u003cmark>un-pigeon-hole-a let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
