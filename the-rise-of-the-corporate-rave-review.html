let cards = [{"en":"blue-skied morning","zh":"晴空湛蓝的早晨","source":"On a blue-skied morning in March, gentle house music wafts from inside the Brooklyn lounge bar Superior Ingredients.","sourceHtml":"On a \u003cmark>blue-skied morning\u003c/mark> in March, gentle house music wafts from inside the Brooklyn lounge bar Superior Ingredients."},{"en":"wafts from","zh":"从……轻轻飘来","source":"On a blue-skied morning in March, gentle house music wafts from inside the Brooklyn lounge bar Superior Ingredients.","sourceHtml":"On a blue-skied morning in March, gentle house music \u003cmark>wafts from\u003c/mark> inside the Brooklyn lounge bar Superior Ingredients."},{"en":"flash my ticket to","zh":"向……迅速亮一下门票","source":"When I get to the door, I flash my ticket to the bouncer and scurry past a sign that reads “WELCOME TO FRIENDSHIP” until a smiling woman with sequined UGGs chases me down for a hug.","sourceHtml":"When I get to the door, I \u003cmark>flash my ticket to\u003c/mark> the bouncer and scurry past a sign that reads “WELCOME TO FRIENDSHIP” until a smiling woman with sequined UGGs chases me down for a hug."},{"en":"chases me down for a hug","zh":"追上我，只为给我一个拥抱","source":"When I get to the door, I flash my ticket to the bouncer and scurry past a sign that reads “WELCOME TO FRIENDSHIP” until a smiling woman with sequined UGGs chases me down for a hug.","sourceHtml":"When I get to the door, I flash my ticket to the bouncer and scurry past a sign that reads “WELCOME TO FRIENDSHIP” until a smiling woman with sequined UGGs \u003cmark>chases me down for a hug\u003c/mark>."},{"en":"underway","zh":"已经开始、正在进行","source":"Inside the venue’s sun room, a pre-rave yoga session is already underway.","sourceHtml":"Inside the venue’s sun room, a pre-rave yoga session is already \u003cmark>underway\u003c/mark>."},{"en":"guides us through","zh":"带领我们完成……","source":"As a mashup of Rihanna’s “Kiss It Better” and Luther Vandross’ “Never Too Much” plays over the speakers, a perky instructor guides us through 20 squat jumps.","sourceHtml":"As a mashup of Rihanna’s “Kiss It Better” and Luther Vandross’ “Never Too Much” plays over the speakers, a perky instructor \u003cmark>guides us through\u003c/mark> 20 squat jumps."},{"en":"closing with a shavasana","zh":"以挺尸式收尾","source":"After closing with a shavasana, she shouts, “Are y’all ready to dance?!” before a DJ in an aloha shirt throws on a tech-house remix of Fleetwood Mac’s “Dreams.” Later, a five-person band featuring a white guy slapping a giant hand drum climbs onto the stage to perform an acoustic version of “Crazy Frog.” “I haven’t felt this good in a while,” Alex, a 36-year-old from Queens, tells me mid-song.","sourceHtml":"After \u003cmark>closing with a shavasana\u003c/mark>, she shouts, “Are y’all ready to dance?!” before a DJ in an aloha shirt throws on a tech-house remix of Fleetwood Mac’s “Dreams.” Later, a five-person band featuring a white guy slapping a giant hand drum climbs onto the stage to perform an acoustic version of “Crazy Frog.” “I haven’t felt this good in a while,” Alex, a 36-year-old from Queens, tells me mid-song."},{"en":"throws on","zh":"随手放起（某首歌）","source":"After closing with a shavasana, she shouts, “Are y’all ready to dance?!” before a DJ in an aloha shirt throws on a tech-house remix of Fleetwood Mac’s “Dreams.” Later, a five-person band featuring a white guy slapping a giant hand drum climbs onto the stage to perform an acoustic version of “Crazy Frog.” “I haven’t felt this good in a while,” Alex, a 36-year-old from Queens, tells me mid-song.","sourceHtml":"After closing with a shavasana, she shouts, “Are y’all ready to dance?!” before a DJ in an aloha shirt \u003cmark>throws on\u003c/mark> a tech-house remix of Fleetwood Mac’s “Dreams.” Later, a five-person band featuring a white guy slapping a giant hand drum climbs onto the stage to perform an acoustic version of “Crazy Frog.” “I haven’t felt this good in a while,” Alex, a 36-year-old from Queens, tells me mid-song."},{"en":"slapping a giant hand drum","zh":"用力拍打一面巨大的手鼓","source":"After closing with a shavasana, she shouts, “Are y’all ready to dance?!” before a DJ in an aloha shirt throws on a tech-house remix of Fleetwood Mac’s “Dreams.” Later, a five-person band featuring a white guy slapping a giant hand drum climbs onto the stage to perform an acoustic version of “Crazy Frog.” “I haven’t felt this good in a while,” Alex, a 36-year-old from Queens, tells me mid-song.","sourceHtml":"After closing with a shavasana, she shouts, “Are y’all ready to dance?!” before a DJ in an aloha shirt throws on a tech-house remix of Fleetwood Mac’s “Dreams.” Later, a five-person band featuring a white guy \u003cmark>slapping a giant hand drum\u003c/mark> climbs onto the stage to perform an acoustic version of “Crazy Frog.” “I haven’t felt this good in a while,” Alex, a 36-year-old from Queens, tells me mid-song."},{"en":"unprompted sober-rave hug","zh":"未经请求便送上的清醒派对拥抱","source":"“It’s only with friends that you can open up.” He then gives me my second unprompted sober-rave hug of the day.","sourceHtml":"“It’s only with friends that you can open up.” He then gives me my second \u003cmark>unprompted sober-rave hug\u003c/mark> of the day."},{"en":"signifier of unsanctioned parties","zh":"未经许可派对的标志","source":"Once a signifier of unsanctioned parties, the word rave has never been more ubiquitous.","sourceHtml":"Once a \u003cmark>signifier of unsanctioned parties\u003c/mark>, the word rave has never been more ubiquitous."},{"en":"echoes of its subversive origins","zh":"其颠覆性起源留下的回声","source":"While there are still echoes of its subversive origins in the current Brooklyn DIY scene—warehouse nights listed with a TBA location on Resident Advisor, beach raves announced via flyers circulated on Discord—if you get sucked into the right algorithm, “rave” quickly loses meaning.","sourceHtml":"While there are still \u003cmark>echoes of its subversive origins\u003c/mark> in the current Brooklyn DIY scene—warehouse nights listed with a TBA location on Resident Advisor, beach raves announced via flyers circulated on Discord—if you get sucked into the right algorithm, “rave” quickly loses meaning."},{"en":"get sucked into the right algorithm","zh":"被某一种推荐算法吸进去","source":"While there are still echoes of its subversive origins in the current Brooklyn DIY scene—warehouse nights listed with a TBA location on Resident Advisor, beach raves announced via flyers circulated on Discord—if you get sucked into the right algorithm, “rave” quickly loses meaning.","sourceHtml":"While there are still echoes of its subversive origins in the current Brooklyn DIY scene—warehouse nights listed with a TBA location on Resident Advisor, beach raves announced via flyers circulated on Discord—if you \u003cmark>get sucked into the right algorithm\u003c/mark>, “rave” quickly loses meaning."},{"en":"decked out in produce swag","zh":"穿戴着全套农产品主题周边","source":"Aldi rave, with revelers arriving “decked out in produce swag.” Unlike IYKYK events, where nocturnal freaks roam free and a gruff bouncer might threaten banishment for a dancefloor selfie, cameras are strongly encouraged.","sourceHtml":"Aldi rave, with revelers arriving “\u003cmark>decked out in produce swag\u003c/mark>.” Unlike IYKYK events, where nocturnal freaks roam free and a gruff bouncer might threaten banishment for a dancefloor selfie, cameras are strongly encouraged."},{"en":"IYKYK events","zh":"“懂的都懂”的活动","source":"Aldi rave, with revelers arriving “decked out in produce swag.” Unlike IYKYK events, where nocturnal freaks roam free and a gruff bouncer might threaten banishment for a dancefloor selfie, cameras are strongly encouraged.","sourceHtml":"Aldi rave, with revelers arriving “decked out in produce swag.” Unlike \u003cmark>IYKYK events\u003c/mark>, where nocturnal freaks roam free and a gruff bouncer might threaten banishment for a dancefloor selfie, cameras are strongly encouraged."},{"en":"threaten banishment for a dancefloor selfie","zh":"威胁因一张舞池自拍而将人驱逐并拉黑","source":"Aldi rave, with revelers arriving “decked out in produce swag.” Unlike IYKYK events, where nocturnal freaks roam free and a gruff bouncer might threaten banishment for a dancefloor selfie, cameras are strongly encouraged.","sourceHtml":"Aldi rave, with revelers arriving “decked out in produce swag.” Unlike IYKYK events, where nocturnal freaks roam free and a gruff bouncer might \u003cmark>threaten banishment for a dancefloor selfie\u003c/mark>, cameras are strongly encouraged."},{"en":"rejected conformity","zh":"拒绝顺从主流规范","source":"Raving is a youth movement that has always rejected conformity.","sourceHtml":"Raving is a youth movement that has always \u003cmark>rejected conformity\u003c/mark>."},{"en":"in the face of","zh":"面对……","source":"For decades, in the face of economic, social, and political decline, factions of queer, Black, and lost children have skulked around paradisal jungle gyms by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by the establishment, paving the way for punkish innovations across electronic music and fashion.","sourceHtml":"For decades, \u003cmark>in the face of\u003c/mark> economic, social, and political decline, factions of queer, Black, and lost children have skulked around paradisal jungle gyms by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by the establishment, paving the way for punkish innovations across electronic music and fashion."},{"en":"skulked around paradisal jungle gyms","zh":"潜行于天堂般的游乐场","source":"For decades, in the face of economic, social, and political decline, factions of queer, Black, and lost children have skulked around paradisal jungle gyms by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by the establishment, paving the way for punkish innovations across electronic music and fashion.","sourceHtml":"For decades, in the face of economic, social, and political decline, factions of queer, Black, and lost children have \u003cmark>skulked around paradisal jungle gyms\u003c/mark> by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by the establishment, paving the way for punkish innovations across electronic music and fashion."},{"en":"the establishment","zh":"掌握权力的既有体制、主流建制","source":"For decades, in the face of economic, social, and political decline, factions of queer, Black, and lost children have skulked around paradisal jungle gyms by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by the establishment, paving the way for punkish innovations across electronic music and fashion.","sourceHtml":"For decades, in the face of economic, social, and political decline, factions of queer, Black, and lost children have skulked around paradisal jungle gyms by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by \u003cmark>the establishment\u003c/mark>, paving the way for punkish innovations across electronic music and fashion."},{"en":"paving the way for","zh":"为……铺平道路、创造条件","source":"For decades, in the face of economic, social, and political decline, factions of queer, Black, and lost children have skulked around paradisal jungle gyms by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by the establishment, paving the way for punkish innovations across electronic music and fashion.","sourceHtml":"For decades, in the face of economic, social, and political decline, factions of queer, Black, and lost children have skulked around paradisal jungle gyms by way of bunkers, wild forests, and abandoned buildings, anywhere that couldn’t easily be accessed by the establishment, \u003cmark>paving the way for\u003c/mark> punkish innovations across electronic music and fashion."},{"en":"lean deep left","zh":"在政治上明显偏向激进左翼","source":"On the political spectrum, ravers lean deep left—in a society that criminalizes the use of mind-altering substances and loud music, you don’t become a promoter because you want to get rich.","sourceHtml":"On the political spectrum, ravers \u003cmark>lean deep left\u003c/mark>—in a society that criminalizes the use of mind-altering substances and loud music, you don’t become a promoter because you want to get rich."},{"en":"get out of the red","zh":"摆脱赤字、停止亏损","source":"A great rave will more often than not barely get out of the red, only to be shut down in the first few hours.","sourceHtml":"A great rave will more often than not barely \u003cmark>get out of the red\u003c/mark>, only to be shut down in the first few hours."},{"en":"pegged as","zh":"被认定／界定为……","source":"In the early 14th century, to rave was “to dream; wander here and there, prowl; behave madly, be crazy.” By 1989, it would be pegged as a “mass party with loud, fast electronic music, and often psychedelic drugs,” a definition still widely used today.","sourceHtml":"In the early 14th century, to rave was “to dream; wander here and there, prowl; behave madly, be crazy.” By 1989, it would be \u003cmark>pegged as\u003c/mark> a “mass party with loud, fast electronic music, and often psychedelic drugs,” a definition still widely used today."},{"en":"sparked a bright but short flame of acid house","zh":"点燃了一簇明亮却短暂的迷幻浩室火焰","source":"Raving can be traced to the late 1980s, when artists like DJ Pierre and Spanky sparked a bright but short flame of acid house in Chicago clubs, manipulating synthesizers to create squelchy beats dancers could jack their bodies to.","sourceHtml":"Raving can be traced to the late 1980s, when artists like DJ Pierre and Spanky \u003cmark>sparked a bright but short flame of acid house\u003c/mark> in Chicago clubs, manipulating synthesizers to create squelchy beats dancers could jack their bodies to."},{"en":"squelchy beats","zh":"湿黏、咕啾作响的节拍","source":"Raving can be traced to the late 1980s, when artists like DJ Pierre and Spanky sparked a bright but short flame of acid house in Chicago clubs, manipulating synthesizers to create squelchy beats dancers could jack their bodies to.","sourceHtml":"Raving can be traced to the late 1980s, when artists like DJ Pierre and Spanky sparked a bright but short flame of acid house in Chicago clubs, manipulating synthesizers to create \u003cmark>squelchy beats\u003c/mark> dancers could jack their bodies to."},{"en":"jack their bodies to","zh":"随着节拍猛烈扭动身体","source":"Raving can be traced to the late 1980s, when artists like DJ Pierre and Spanky sparked a bright but short flame of acid house in Chicago clubs, manipulating synthesizers to create squelchy beats dancers could jack their bodies to.","sourceHtml":"Raving can be traced to the late 1980s, when artists like DJ Pierre and Spanky sparked a bright but short flame of acid house in Chicago clubs, manipulating synthesizers to create squelchy beats dancers could \u003cmark>jack their bodies to\u003c/mark>."},{"en":"fizzle out","zh":"逐渐衰退，最后无声消散","source":"When a police crackdown forced the scene to fizzle out, raving travelled to illegal squats in the UK, where, in 1988, in the so-called Second Summer of Love, it was framed as a rebellion to the working-class deterioration of the Thatcher era.","sourceHtml":"When a police crackdown forced the scene to \u003cmark>fizzle out\u003c/mark>, raving travelled to illegal squats in the UK, where, in 1988, in the so-called Second Summer of Love, it was framed as a rebellion to the working-class deterioration of the Thatcher era."},{"en":"acid-laced full-moon raves","zh":"浸透迷幻气息的满月派对","source":"A few years later, it journeyed back to America: In New York, Frankie Bones’ and Adam X’s Storm Raves took place in dilapidated apartments on Coney Island Avenue; in the Bay Area, a group of English DJs called Wicked threw acid-laced full-moon raves surrounded by bonfires; and in the Midwest, an abundance of open fields and warehouses in cities like Detroit and Columbus allowed raves to surge.","sourceHtml":"A few years later, it journeyed back to America: In New York, Frankie Bones’ and Adam X’s Storm Raves took place in dilapidated apartments on Coney Island Avenue; in the Bay Area, a group of English DJs called Wicked threw \u003cmark>acid-laced full-moon raves\u003c/mark> surrounded by bonfires; and in the Midwest, an abundance of open fields and warehouses in cities like Detroit and Columbus allowed raves to surge."},{"en":"screeching dopamine hits","zh":"尖啸式的多巴胺猛击","source":"It experienced another Stateside boom in the 2010s, thanks to DJs like Skrillex and Deadmau5, who transformed UK dubstep into screeching dopamine hits called brostep, boosting the genre all the way to the mosh pits of America’s newly supersized EDM festivals—and, in the process, turning the idea of raving into an extremely profitable business.","sourceHtml":"It experienced another Stateside boom in the 2010s, thanks to DJs like Skrillex and Deadmau5, who transformed UK dubstep into \u003cmark>screeching dopamine hits\u003c/mark> called brostep, boosting the genre all the way to the mosh pits of America’s newly supersized EDM festivals—and, in the process, turning the idea of raving into an extremely profitable business."},{"en":"finding its footing","zh":"逐渐站稳脚跟","source":"At the same time brostep was finding its footing, I was a teenager partying in an equally flourishing underground DIY scene in New York.","sourceHtml":"At the same time brostep was \u003cmark>finding its footing\u003c/mark>, I was a teenager partying in an equally flourishing underground DIY scene in New York."},{"en":"off-the-grid events","zh":"脱离正规系统、难以被监管追踪的活动","source":"The Cabaret Law, the city’s infamous Prohibition era “no-dancing” ordinance, was still in effect, which meant most off-the-grid events were clandestine and word-of-mouth.","sourceHtml":"The Cabaret Law, the city’s infamous Prohibition era “no-dancing” ordinance, was still in effect, which meant most \u003cmark>off-the-grid events\u003c/mark> were clandestine and word-of-mouth."},{"en":"precariously climbing a wooden ladder","zh":"冒着风险、摇摇晃晃地爬一架木梯","source":"By my twenties, I spent summers abroad at raves in a school gymnasium in London, in a marisquería in CDMX, and in a building in Lisbon that could only be entered by precariously climbing a wooden ladder.","sourceHtml":"By my twenties, I spent summers abroad at raves in a school gymnasium in London, in a marisquería in CDMX, and in a building in Lisbon that could only be entered by \u003cmark>precariously climbing a wooden ladder\u003c/mark>."},{"en":"scrappy, long nights and mornings","zh":"简陋粗粝、一路延续到清晨的漫长聚会","source":"The most memorable raves were scrappy, long nights and mornings typically fueled by candy-colored pills that helped me work my legs until sunrise.","sourceHtml":"The most memorable raves were \u003cmark>scrappy, long nights and mornings\u003c/mark> typically fueled by candy-colored pills that helped me work my legs until sunrise."},{"en":"fueled by candy-colored pills","zh":"由糖果色药丸提供动力","source":"The most memorable raves were scrappy, long nights and mornings typically fueled by candy-colored pills that helped me work my legs until sunrise.","sourceHtml":"The most memorable raves were scrappy, long nights and mornings typically \u003cmark>fueled by candy-colored pills\u003c/mark> that helped me work my legs until sunrise."},{"en":"the antithesis of","zh":"……的彻底对立面","source":"Not every mainstream rave in 2026 is the antithesis of underground parties past and present, but Daybreaker comes close, both in its devotion to sobriety and in how much money the organizers claim to make (the company claims to pull in seven figures annually).","sourceHtml":"Not every mainstream rave in 2026 is \u003cmark>the antithesis of\u003c/mark> underground parties past and present, but Daybreaker comes close, both in its devotion to sobriety and in how much money the organizers claim to make (the company claims to pull in seven figures annually)."},{"en":"comes close","zh":"几乎就是如此、相差无几","source":"Not every mainstream rave in 2026 is the antithesis of underground parties past and present, but Daybreaker comes close, both in its devotion to sobriety and in how much money the organizers claim to make (the company claims to pull in seven figures annually).","sourceHtml":"Not every mainstream rave in 2026 is the antithesis of underground parties past and present, but Daybreaker \u003cmark>comes close\u003c/mark>, both in its devotion to sobriety and in how much money the organizers claim to make (the company claims to pull in seven figures annually)."},{"en":"pull in seven figures annually","zh":"每年进账七位数","source":"Not every mainstream rave in 2026 is the antithesis of underground parties past and present, but Daybreaker comes close, both in its devotion to sobriety and in how much money the organizers claim to make (the company claims to pull in seven figures annually).","sourceHtml":"Not every mainstream rave in 2026 is the antithesis of underground parties past and present, but Daybreaker comes close, both in its devotion to sobriety and in how much money the organizers claim to make (the company claims to \u003cmark>pull in seven figures annually\u003c/mark>)."},{"en":"bolstered by handsome wellness sponsors","zh":"得到财力可观的健康品牌赞助商扶持","source":"I later ask Agrawal about those who criticize organizations like hers—which freely use the term rave while being bolstered by handsome wellness sponsors like AG1—versus the current, primarily queer and racially marginalized underground system that can struggle to turn a profit.","sourceHtml":"I later ask Agrawal about those who criticize organizations like hers—which freely use the term rave while being \u003cmark>bolstered by handsome wellness sponsors\u003c/mark> like AG1—versus the current, primarily queer and racially marginalized underground system that can struggle to turn a profit."},{"en":"drinking your profits away","zh":"喝酒把利润挥霍掉","source":"“Are you just drinking your profits away?","sourceHtml":"“Are you just \u003cmark>drinking your profits away\u003c/mark>?"},{"en":"big-tent communal mindset","zh":"尽可能包容各类人群的社群理念","source":"Plenty of similar parties benefit from the same big-tent communal mindset.","sourceHtml":"Plenty of similar parties benefit from the same \u003cmark>big-tent communal mindset\u003c/mark>."},{"en":"giddy to support","zh":"兴奋雀跃地前来支持","source":"Take the Midnight Rave at House of Yes, where attendees are giddy to support the promoters, Kseniya Sovenko and Mary Wolff, better known on social media as NYC Rave Girls.","sourceHtml":"Take the Midnight Rave at House of Yes, where attendees are \u003cmark>giddy to support\u003c/mark> the promoters, Kseniya Sovenko and Mary Wolff, better known on social media as NYC Rave Girls."},{"en":"priding themselves on rave etiquette","zh":"以自己重视并熟知锐舞礼仪为傲","source":"Priding themselves on rave etiquette, the two thirtysomethings promote electronic music gigs via TikTok and Instagram, preaching “girls to the front” while shimmying to polite techno.","sourceHtml":"\u003cmark>Priding themselves on rave etiquette\u003c/mark>, the two thirtysomethings promote electronic music gigs via TikTok and Instagram, preaching “girls to the front” while shimmying to polite techno."},{"en":"shimmying to polite techno","zh":"随着“温和规矩的铁克诺舞曲”轻快扭动","source":"Priding themselves on rave etiquette, the two thirtysomethings promote electronic music gigs via TikTok and Instagram, preaching “girls to the front” while shimmying to polite techno.","sourceHtml":"Priding themselves on rave etiquette, the two thirtysomethings promote electronic music gigs via TikTok and Instagram, preaching “girls to the front” while \u003cmark>shimmying to polite techno\u003c/mark>."},{"en":"use the word loosely","zh":"宽泛、不严格地使用这个词","source":"Even our parties, most of the time, are not raves.” Instead, she says, they use the word loosely to capture “the spirit of raving and the essence of it, this idea of showing up to dance and taking care of the people around you.” Indeed, during these events, I rarely spoke to a person who didn’t look like they were having the time of their life.","sourceHtml":"Even our parties, most of the time, are not raves.” Instead, she says, they \u003cmark>use the word loosely\u003c/mark> to capture “the spirit of raving and the essence of it, this idea of showing up to dance and taking care of the people around you.” Indeed, during these events, I rarely spoke to a person who didn’t look like they were having the time of their life."},{"en":"showing up to dance and taking care of the people around you","zh":"到场跳舞，并照顾身边的人","source":"Even our parties, most of the time, are not raves.” Instead, she says, they use the word loosely to capture “the spirit of raving and the essence of it, this idea of showing up to dance and taking care of the people around you.” Indeed, during these events, I rarely spoke to a person who didn’t look like they were having the time of their life.","sourceHtml":"Even our parties, most of the time, are not raves.” Instead, she says, they use the word loosely to capture “the spirit of raving and the essence of it, this idea of \u003cmark>showing up to dance and taking care of the people around you\u003c/mark>.” Indeed, during these events, I rarely spoke to a person who didn’t look like they were having the time of their life."},{"en":"having the time of their life","zh":"正度过无比快乐的时光","source":"Even our parties, most of the time, are not raves.” Instead, she says, they use the word loosely to capture “the spirit of raving and the essence of it, this idea of showing up to dance and taking care of the people around you.” Indeed, during these events, I rarely spoke to a person who didn’t look like they were having the time of their life.","sourceHtml":"Even our parties, most of the time, are not raves.” Instead, she says, they use the word loosely to capture “the spirit of raving and the essence of it, this idea of showing up to dance and taking care of the people around you.” Indeed, during these events, I rarely spoke to a person who didn’t look like they were \u003cmark>having the time of their life\u003c/mark>."},{"en":"got what they wanted out of it","zh":"从中得到了自己想要的东西","source":"And many of them got what they wanted out of it: a tight-knit family, or at the very least the appearance of one.","sourceHtml":"And many of them \u003cmark>got what they wanted out of it\u003c/mark>: a tight-knit family, or at the very least the appearance of one."},{"en":"the appearance of one","zh":"至少拥有一个“看起来像家庭”的群体","source":"And many of them got what they wanted out of it: a tight-knit family, or at the very least the appearance of one.","sourceHtml":"And many of them got what they wanted out of it: a tight-knit family, or at the very least \u003cmark>the appearance of one\u003c/mark>."},{"en":"a new beacon of wellness culture","zh":"健康生活文化的一座新灯塔","source":"Conversations with people like Christina left me questioning whether this format of raving is really just a new beacon of wellness culture.","sourceHtml":"Conversations with people like Christina left me questioning whether this format of raving is really just \u003cmark>a new beacon of wellness culture\u003c/mark>."},{"en":"lean darker","zh":"在风格和氛围上偏向黑暗","source":"Historically, the music at the raves I’ve attended tends to lean darker: techno, acid, electroclash, the kinds of sounds that rearrange your brain when you’re stomping on the concrete of a warehouse floor.","sourceHtml":"Historically, the music at the raves I’ve attended tends to \u003cmark>lean darker\u003c/mark>: techno, acid, electroclash, the kinds of sounds that rearrange your brain when you’re stomping on the concrete of a warehouse floor."},{"en":"rearrange your brain","zh":"仿佛重新排列你的大脑","source":"Historically, the music at the raves I’ve attended tends to lean darker: techno, acid, electroclash, the kinds of sounds that rearrange your brain when you’re stomping on the concrete of a warehouse floor.","sourceHtml":"Historically, the music at the raves I’ve attended tends to lean darker: techno, acid, electroclash, the kinds of sounds that \u003cmark>rearrange your brain\u003c/mark> when you’re stomping on the concrete of a warehouse floor."},{"en":"maximizing your mindstate","zh":"把精神状态优化到最佳","source":"But at these new feel-good raves, maximizing your mindstate appears to be more important than the music you’re actually listening to.","sourceHtml":"But at these new feel-good raves, \u003cmark>maximizing your mindstate\u003c/mark> appears to be more important than the music you’re actually listening to."},{"en":"feel joy in your bones","zh":"从骨子里感受到喜悦","source":"“Something that you can sing along to, music with words, music that you can feel joy in your bones,” as Agrawal explains it.","sourceHtml":"“Something that you can sing along to, music with words, music that you can \u003cmark>feel joy in your bones\u003c/mark>,” as Agrawal explains it."},{"en":"isn’t much cause for concern","zh":"不太值得担忧","source":"For some longtime ravers, this approach isn’t much cause for concern.","sourceHtml":"For some longtime ravers, this approach \u003cmark>isn’t much cause for concern\u003c/mark>."},{"en":"a prevailing sentiment","zh":"一种占主导、相当普遍的看法","source":"There’s a prevailing sentiment that as long as newcomers are going to their own raves, they aren’t going to the ones that truly matter.","sourceHtml":"There’s \u003cmark>a prevailing sentiment\u003c/mark> that as long as newcomers are going to their own raves, they aren’t going to the ones that truly matter."},{"en":"the ones that truly matter","zh":"那些“真正重要”的派对","source":"There’s a prevailing sentiment that as long as newcomers are going to their own raves, they aren’t going to the ones that truly matter.","sourceHtml":"There’s a prevailing sentiment that as long as newcomers are going to their own raves, they aren’t going to \u003cmark>the ones that truly matter\u003c/mark>."},{"en":"a little too open to novice ravers","zh":"对锐舞新手开放得有些过头","source":"Yet events thrown by organizers like NYC Rave Girls have received criticism for making the scene a little too open to novice ravers, dampening the night for educated dancers who have been supporting raves for years.","sourceHtml":"Yet events thrown by organizers like NYC Rave Girls have received criticism for making the scene \u003cmark>a little too open to novice ravers\u003c/mark>, dampening the night for educated dancers who have been supporting raves for years."},{"en":"dampening the night","zh":"削弱整晚的兴致与强度","source":"Yet events thrown by organizers like NYC Rave Girls have received criticism for making the scene a little too open to novice ravers, dampening the night for educated dancers who have been supporting raves for years.","sourceHtml":"Yet events thrown by organizers like NYC Rave Girls have received criticism for making the scene a little too open to novice ravers, \u003cmark>dampening the night\u003c/mark> for educated dancers who have been supporting raves for years."},{"en":"an influx of","zh":"……的大量涌入","source":"“I have noticed an influx of kind of inexperienced, cis white girls showing up at parties I go to,” says McKenzie Wark, the author of Raving, an autofictional book exploring the queer rave scene in New York.","sourceHtml":"“I have noticed \u003cmark>an influx of\u003c/mark> kind of inexperienced, cis white girls showing up at parties I go to,” says McKenzie Wark, the author of Raving, an autofictional book exploring the queer rave scene in New York."},{"en":"unprepared to handle themselves at a debaucherous all-nighter","zh":"没准备好在放纵不羁的通宵派对中妥善应对","source":"While she doesn’t mind raves becoming increasingly ubiquitous, she worries that newcomers, accustomed to pop-up raves at restaurants and bathhouses, will find themselves unprepared to handle themselves at a debaucherous all-nighter.","sourceHtml":"While she doesn’t mind raves becoming increasingly ubiquitous, she worries that newcomers, accustomed to pop-up raves at restaurants and bathhouses, will find themselves \u003cmark>unprepared to handle themselves at a debaucherous all-nighter\u003c/mark>."},{"en":"a little bit of daylight between","zh":"在两者之间留出一点清楚可见的距离","source":"I just want a little bit of daylight between where I want to go and where beginners are going to go.","sourceHtml":"I just want \u003cmark>a little bit of daylight between\u003c/mark> where I want to go and where beginners are going to go."},{"en":"rejects that line of thought","zh":"不接受那套思路或推理","source":"Sovenko, however, rejects that line of thought.","sourceHtml":"Sovenko, however, \u003cmark>rejects that line of thought\u003c/mark>."},{"en":"need to stay open","zh":"必须维持营业","source":"“They don’t consider the fact that all the clubs in New York need to stay open.","sourceHtml":"“They don’t consider the fact that all the clubs in New York \u003cmark>need to stay open\u003c/mark>."},{"en":"wouldn’t survive","zh":"将无法生存下去","source":"If it was truly gatekept, those spaces wouldn’t survive.”","sourceHtml":"If it was truly gatekept, those spaces \u003cmark>wouldn’t survive\u003c/mark>.”"},{"en":"belongs at the center of mainstream culture","zh":"理应处于主流文化的中心","source":"For Laura Villasenin, founder of the luxury shoe brand MIISTA—and a former raver who used to attend underground raves in Hackney Wick warehouses—raving belongs at the center of mainstream culture; she considers the trend a natural response to a society still rebuilding itself after COVID lockdown.","sourceHtml":"For Laura Villasenin, founder of the luxury shoe brand MIISTA—and a former raver who used to attend underground raves in Hackney Wick warehouses—raving \u003cmark>belongs at the center of mainstream culture\u003c/mark>; she considers the trend a natural response to a society still rebuilding itself after COVID lockdown."},{"en":"a natural response to","zh":"对……自然而然的回应","source":"For Laura Villasenin, founder of the luxury shoe brand MIISTA—and a former raver who used to attend underground raves in Hackney Wick warehouses—raving belongs at the center of mainstream culture; she considers the trend a natural response to a society still rebuilding itself after COVID lockdown.","sourceHtml":"For Laura Villasenin, founder of the luxury shoe brand MIISTA—and a former raver who used to attend underground raves in Hackney Wick warehouses—raving belongs at the center of mainstream culture; she considers the trend \u003cmark>a natural response to\u003c/mark> a society still rebuilding itself after COVID lockdown."},{"en":"a desire for community connection","zh":"与社群建立联结的渴望","source":"“It comes from a desire for community connection,” she adds.","sourceHtml":"“It comes from \u003cmark>a desire for community connection\u003c/mark>,” she adds."},{"en":"dreamt up a pop-up rave","zh":"构想、策划出一场快闪锐舞活动","source":"This past spring, Villasenin dreamt up a pop-up rave in Los Angeles at a clothing factory, where a gallery wall loudly declared “RAVING REPAIRS THE SOUL.","sourceHtml":"This past spring, Villasenin \u003cmark>dreamt up a pop-up rave\u003c/mark> in Los Angeles at a clothing factory, where a gallery wall loudly declared “RAVING REPAIRS THE SOUL."},{"en":"blaring","zh":"震耳欲聋地播放","source":"IT BRINGS US TOGETHER.” Footage of the event showed a baile funk edit of Denise Belfon’s “Work” blaring as models decked out in oversized black sunglasses and dark, avant-minimalist outfits swung their hips on sewing tables.","sourceHtml":"IT BRINGS US TOGETHER.” Footage of the event showed a baile funk edit of Denise Belfon’s “Work” \u003cmark>blaring\u003c/mark> as models decked out in oversized black sunglasses and dark, avant-minimalist outfits swung their hips on sewing tables."},{"en":"decked out in","zh":"穿戴着全套……","source":"IT BRINGS US TOGETHER.” Footage of the event showed a baile funk edit of Denise Belfon’s “Work” blaring as models decked out in oversized black sunglasses and dark, avant-minimalist outfits swung their hips on sewing tables.","sourceHtml":"IT BRINGS US TOGETHER.” Footage of the event showed a baile funk edit of Denise Belfon’s “Work” blaring as models \u003cmark>decked out in\u003c/mark> oversized black sunglasses and dark, avant-minimalist outfits swung their hips on sewing tables."},{"en":"free of charge","zh":"免费","source":"Below them, tailors dressed in white button-ups diligently mended items the guests brought, a service MIISTA provided free of charge.","sourceHtml":"Below them, tailors dressed in white button-ups diligently mended items the guests brought, a service MIISTA provided \u003cmark>free of charge\u003c/mark>."},{"en":"didn’t have the hallmarks of a true DIY rave","zh":"不具备真正自组织锐舞的典型标志","source":"But, like Midnight Rave, if the MIISTA event didn’t have the hallmarks of a true DIY rave, why not just call it a party?","sourceHtml":"But, like Midnight Rave, if the MIISTA event \u003cmark>didn’t have the hallmarks of a true DIY rave\u003c/mark>, why not just call it a party?"},{"en":"be credited to","zh":"被归因于……、被认为是……带来的","source":"Beyond post-pandemic freedom, the recent rave explosion can also be credited to BRAT, Charli XCX’s 2024 album that glamorized raving as an It Girl activity. (“365 party girl bumping that/Shall we do a little key?/Shall we have a little line?” she raps on “365” with a breezy, fabulous air that seduces you into her lifestyle even if you’ve never touched a stimulant in your life.) A week after my Daybreaker experience, I slip into a warehouse on a dark street in Gowanus for Heated Rivalry Rave, a party catering to the fandom of the steamy sports-romance series on HBO.","sourceHtml":"Beyond post-pandemic freedom, the recent rave explosion can also \u003cmark>be credited to\u003c/mark> BRAT, Charli XCX’s 2024 album that glamorized raving as an It Girl activity. (“365 party girl bumping that/Shall we do a little key?/Shall we have a little line?” she raps on “365” with a breezy, fabulous air that seduces rk>having a blast\u003c/mark> with her girlfriends."},{"en":"like-minded attendees","zh":"想法、趣味相近的参加者","source":"By the end of my rave journey, I was comforted by the knowledge that there is a space for people—newcomers, veteran partygoers like Estephani—to discover the joys of dancing among like-minded attendees.","sourceHtml":"By the end of my rave journey, I was comforted by the knowledge that there is a space for people—newcomers, veteran partygoers like Estephani—to discover the joys of dancing among \u003cmark>like-minded attendees\u003c/mark>."},{"en":"tucked myself into an Uber home","zh":"把自己安顿进回家的网约车","source":"As I tucked myself into an Uber home from the Heated Rivalry rave, I fuzzily recalled my own first non-rave rave experience in 2014 at a Pacha event, wearing a peach Forever 21 crop top and sipping a non-alcoholic spritz while surrounded by fog and 18-year-old boys swaying to Top 40 hits.","sourceHtml":"As I \u003cmark>tucked myself into an Uber home\u003c/mark> from the Heated Rivalry rave, I fuzzily recalled my own first non-rave rave experience in 2014 at a Pacha event, wearing a peach Forever 21 crop top and sipping a non-alcoholic spritz while surrounded by fog and 18-year-old boys swaying to Top 40 hits."},{"en":"non-rave rave experience","zh":"“名为锐舞、其实并不算锐舞”的体验","source":"As I tucked myself into an Uber home from the Heated Rivalry rave, I fuzzily recalled my own first non-rave rave experience in 2014 at a Pacha event, wearing a peach Forever 21 crop top and sipping a non-alcoholic spritz while surrounded by fog and 18-year-old boys swaying to Top 40 hits.","sourceHtml":"As I tucked myself into an Uber home from the Heated Rivalry rave, I fuzzily recalled my own first \u003cmark>non-rave rave experience\u003c/mark> in 2014 at a Pacha event, wearing a peach Forever 21 crop top and sipping a non-alcoholic spritz while surrounded by fog and 18-year-old boys swaying to Top 40 hits."},{"en":"exhilaration climbed up my spine","zh":"兴奋感沿着脊柱向上攀升","so opular HBO show."},{"en":"screeching sing-along","zh":"尖声大合唱","source":"For some, that means experiencing spiritual transcendence from having the perfect concoction of songs melded together in a discreet location; for others, it looks more like a screeching sing-along to Ariana Grande’s “Break Free” as a DJ flings merch from a popular HBO show.","sourceHtml":"For some, that means experiencing spiritual transcendence from having the perfect concoction of songs melded together in a discreet location; for others, it looks more like a \u003cmark>screeching sing-along\u003c/mark> to Ariana Grande’s “Break Free” as a DJ flings merch from a popular HBO show."},{"en":"brought it together around a central theme","zh":"围绕一个中心主题把各种元素组织起来","source":"“Rave culture itself is about community, music, gathering, and we brought it together around a central theme,” Heated Rivalry Rave’s founder, Tu Vu, tells me.","sourceHtml":"“Rave culture itself is about community, music, gathering, and we \u003cmark>brought it together around a central theme\u003c/mark>,” Heated Rivalry Rave’s founder, Tu Vu, tells me."},{"en":"came up in the old rave scene","zh":"在旧式锐舞场景中成长、积累经验","source":"As someone who came up in the old rave scene, he considers the current state of high-profile raves a natural progression for the art form.","sourceHtml":"As someone who \u003cmark>came up in the old rave scene\u003c/mark>, he considers the current state of high-profile raves a natural progression for the art form."},{"en":"a natural progression for the art form","zh":"这种艺术形式自然发展的下一阶段","source":"As someone who came up in the old rave scene, he considers the current state of high-profile raves a natural progression for the art form.","sourceHtml":"As someone who came up in the old rave scene, he considers the current state of high-profile raves \u003cmark>a natural progression for the art form\u003c/mark>."},{"en":"look back at the architecture of raves","zh":"回看锐舞文化的基本结构","source":"If you look back at the architecture of raves, it doesn’t have to mean anything in particular.”","sourceHtml":"If you \u003cmark>look back at the architecture of raves\u003c/mark>, it doesn’t have to mean anything in particular.”"}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
