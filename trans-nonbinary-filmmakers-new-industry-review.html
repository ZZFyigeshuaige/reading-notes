ve\u003c/mark> of a trans coming out story—I didn’t really know if there was any sort of audience for that,” Drew tells Variety."},{"en":"an audience for something","zh":"愿意观看并回应某类作品的受众","source":"“There had been other trans directors, but something that was that fiercely independent and coming at it from this personal perspective of a trans coming out story—I didn’t really know if there was any sort of audience for that,” Drew tells Variety.","sourceHtml":"“There had been other trans directors, but something that was that fiercely independent and coming at it from this personal perspective of a trans coming out story—I didn’t really know if there was \u003cmark>any sort of audience for that\u003c/mark>,” Drew tells Variety."},{"en":"genre-leaning films","zh":"明显倾向类型片的作品，如恐怖、科幻、奇幻或超级英雄电影","source":"Like many trans and nonbinary filmmakers making original, often genre-leaning films that resonate with queer audiences, Drew began connecting with other like-minded creatives after screening “The People’s Joker” at festivals like the Toronto International Film Festival and Fantastic Fest.","sourceHtml":"Like many trans and nonbinary filmmakers making original, often \u003cmark>genre-leaning films\u003c/mark> that resonate with queer audiences, Drew began connecting with other like-minded creatives after screening “The People’s Joker” at festivals like the Toronto International Film Festival and Fantastic Fest."},{"en":"resonate with queer audiences","zh":"在酷儿观众中引发深层共鸣","source":"Like many trans and nonbinary filmmakers making original, often genre-leaning films that resonate with queer audiences, Drew began connecting with other like-minded creatives after screening “The People’s Joker” at festivals like the Toronto International Film Festival and Fantastic Fest.","sourceHtml":"Like many trans and nonbinary filmmakers making original, often genre-leaning films that \u003cmark>resonate with queer audiences\u003c/mark>, Drew began connecting with other like-minded creatives after screening “The People’s Joker” at festivals like the Toronto International Film Festival and Fantastic Fest."},{"en":"like-minded creatives","zh":"创作理念或价值取向相近的创作者","source":"Like many trans and nonbinary filmmakers making original, often genre-leaning films that resonate with queer audiences, Drew began connecting with other like-minded creatives after screening “The People’s Joker” at festivals like the Toronto International Film Festival and Fantastic Fest.","sourceHtml":"Like many trans and nonbinary filmmakers making original, often genre-leaning films that resonate with queer audiences, Drew began connecting with other \u003cmark>like-minded creatives\u003c/mark> after screening “The People’s Joker” at festivals like the Toronto International Film Festival and Fantastic Fest."},{"en":"third spaces for a community to grow","zh":"让社群成长的第三空间","source":"Outside of online spaces, LGBTQ+ festivals like Outfest and Frameline have provided the necessary third spaces for this filmmaking community to grow.","sourceHtml":"Outside of online spaces, LGBTQ+ festivals like Outfest and Frameline have provided the necessary \u003cmark>third spaces for this filmmaking community to grow\u003c/mark>."},{"en":"bring an emerging group into the spotlight","zh":"让一个新兴群体进入聚光灯下、获得 公众关注","source":"From Jane Schoenbrun (“Teenage Sex and Death at Camp Miasma”), Louise Weard (“Castration Movie”), Alice Maio Mackay (“The Serpent’s Skin”), Avalon Fast (“Camp”) to Drew (“The People’s Joker”), the past five years have brought this emerging group of trans and nonbinary artists into the spotlight.","sourceHtml":"From Jane Schoenbrun (“Teenage Sex and Death at Camp Miasma”), Louise Weard (“Castration Movie”), Alice Maio Mackay (“The Serpent’s Skin”), Avalon Fast (“Camp”) to Drew (“The People’s Joker”), the past five years have \u003cmark>brought this emerging group of trans and nonbinary artists into the spotlight\u003c/mark>."},{"en":"navigate the challenges of doing something","zh":"设法穿行、  for all of us\u003c/mark>.”"},{"en":"manifest something for everyone","zh":"把某种现实“显化”给所有人","source":"“Not every filmmaker has that in this dystopian version of Hollywood that the last generation of filmmakers manifested for all of us.”","sourceHtml":"“Not every filmmaker has that in \u003cmark>this dystopian version of Hollywood that the last generation of filmmakers manifested for all of us\u003c/mark>.”"},{"en":"struggle to create space for someone","zh":"难以为某个群体提供实际生存与发展的空间","source":"These artists are working in an industry that continually struggles to create space for trans and nonbinary filmmakers, from financing to theatrical distribution.","sourceHtml":"These artists are working in an industry that \u003cmark>continually struggles to create space for\u003c/mark> trans and nonbinary filmmakers, from financing to theatrical distribution."},{"en":"in large part, come from","zh":"很大程度上源自……，用来指出主要但非唯一的原因","source":"A recent GLAAD report titled “Where We Are in Film” found that there were zero trans characters featured in 2025 releases from the top 10 U.S. distributors; this lack of representation, in large part, comes from a lack of trans directors making big-budget movies.","sourceHtml":"A recent GLAAD report titled “Where We Are in Film” found that there were zero trans characters featured in 2025 releases from the top 10 U.S. distributors; this lack of representation, \u003cmark>in large part, comes from a lack of trans directors making big-budget movies\u003c/mark>."},{"en":"representation shrinks even more","zh":"代表性进一步缩减","source":"That representation shrinks even more when looking at trans directors of color.","sourceHtml":"That representation \u003cmark>shrinks even more\u003c/mark> when looking at trans directors of color."},{"en":"step up","zh":"在需要时站出来承担责任、采取更有力行动","source":"“Executives have to step up, not only to increase representation, but to maintain relevance with audiences.","sourceHtml":"“Executives have to \u003cmark>step up\u003c/mark>, not only to increase representation, but to maintain relevance with audiences."},{"en":"maintain relevance with audiences","zh":"维持对观众的现实意义与吸引力","source":"“Executives have to step up, not only to increase representation, but to maintain relevance with audiences.","sourceHtml":"“Executives have to step up, not only to increase representation, but to \u003cmark>maintain relevance with audiences\u003c/mark>."},{"en":"a homogeneity to the type of filmmaker succeeding","zh":"成功者的类型呈现同质化","source":"“There’s a homogeneity to the type of trans filmmaker we’re seeing succeed right now that’s not 100% reflective of the diversity of the trans community,” Weard adds.","sourceHtml":"“There’s \u003cmark>a homogeneity to the type of trans filmmaker we’re seeing succeed right now\u003c/mark> that’s not 100% reflective of the diversity of the trans community,” Weard adds."},{"en":"be reflective of the diversity of a community","zh":"能够反映某一社群内部的多样性","source":"“There’s a homogeneity to the type of trans filmmaker we’re seeing succeed right now that’s not 100% reflective of the diversity of the trans community,” Weard adds.","sourceHtml":"“There’s a homogeneity to the type of trans filmmaker we’re seeing succeed right now that’s not 100% \u003cmark>reflective\u003c/mark> of the \u003cmark>diversity\u003c/mark> of the trans \u003cmark>community\u003c/mark>,” Weard adds."},{"en":"make strides with bigger-budget features","zh":"在较高预算长片领域取得显著进展","source":"One trans filmmaker who has made strides with bigger-budget features is Schoenbrun.","sourceHtml":"One trans filmmaker who has \u003cmark>made strides with bigger-budget features\u003c/mark> is Schoenbrun."},{"en":"begin one’s theatrical run","zh":"开启院线放映周期","source":"Their horror comedy “Teenage Sex and Death at Camp Miasma,” which stars Gillian Anderson and Hannah Einbinder, began its theatrical run this past weekend following a high-profile world premiere at Cannes.","sourceHtml":"Their horror comedy “Teenage Sex and Death at Camp Miasma, at out loud\u003c/mark> to you in Variety feels like, what an asshole thing to do!"},{"en":"participate in a noxious system","zh":"参与一个有毒、有害的制度","source":"I’m choosing to participate in this noxious system without any other people like me,” they add.","sourceHtml":"I’m choosing to \u003cmark>participate in this noxious system\u003c/mark> without any other people like me,” they add."},{"en":"carve out a path","zh":"在缺少现成路线时艰难开辟一条道路","source":"“I have carved out a path that’s different from a lot of my trans peers, and that should just be part of the conversation.”","sourceHtml":"“I have \u003cmark>carved out a path\u003c/mark> that’s different from a lot of my trans peers, and that should just be part of the conversation.”"},{"en":"be part of the conversation","zh":"应被纳入公开讨论，不被个人成功叙事轻易遮盖","source":"“I have carved out a path that’s different from a lot of my trans peers, and that should just be part of the conversation.”","sourceHtml":"“I have carved out a path that’s different from a lot of my trans peers, and that should just be \u003cmark>part of the conversation\u003c/mark>.”"},{"en":"connect a circle of filmmakers most closely","zh":"最紧密地联结起一圈电影创作者","source":"The film that connects this circle of trans and nonbinary filmmakers most closely is Weard’s “Castration Movie” anthology, the third of which explores what happens in a relationship after Izzy’s (Fast) partner comes out as trans—an experience that has rarely been depicted in film.","sourceHtml":"The film that \u003cmark>connects this circle of trans and nonbinary filmmakers most closely\u003c/mark> is Weard’s “Castration Movie” anthology, the third of which explores what happens in a relationship after Izzy’s (Fast) partner comes out as trans—an experience that has rarely been depicted in film."},{"en":"rarely be depicted in film","zh":"极少在电影中被描绘，强调某种生活经验长期处于影像 叙事的空白地带","source":"The film that connects this circle of trans and nonbinary filmmakers most closely is Weard’s “Castration Movie” anthology, the third of which explores what happens in a relationship after Izzy’s (Fast) partner comes out as trans—an experience that has rarely been depicted in film.","sourceHtml":"The film that connects this circle of trans and nonbinary filmmakers most closely is Weard’s “Castration Movie” anthology, the third of which explores what happens in a relationship after Izzy’s (Fast) partner comes out as trans—an experience that has \u003cmark>rarely been depicted in film\u003c/mark>."},{"en":"be drawn to ugly perspectives","zh":"被令人不适、道德上难以认同或通常遭到回避的 视角吸引","source":"Throughout all three “Castration” chapters, Weard says she has been drawn to “ugly perspectives” in the world.","sourceHtml":"Throughout all three “Castration” chapters, Weard says she has been \u003cmark>drawn to “ugly perspectives”\u003c/mark> in the world."},{"en":"claim feminism at the expense of trans people’s rights","zh":"以牺牲跨性别者权利为 代价，声称自己维护女性主义","source":"“With this one, the idea of the TERF and the type of person who would claim feminism at the expense of trans people’s rights is a perspective very distant from mine,” Weard says.","sourceHtml":"“With this one, the idea of the TERF and the type of person who would \u003cmark>claim feminism at the expense of trans people’s rights\u003c/mark> is a perspective very distant from mine,” Weard says."},{"en":"it comes down to an idea","zh":"问题最终归结为某个核心观念","source":"“In researching the role, it came down to this idea of equating male violence with this fear of trans people, where these women might see a trans woman as the scary men in their life who have preyed on them in the past.”","sourceHtml":"“In researching the role, \u003cmark>it came down to this idea of equating male violence with this fear of trans people\u003c/mark>, where these women might see a trans woman as the scary men in their life who have preyed on them in the past.”"},{"en":"equate male violence with fear of trans people","zh":"把男性暴力与对跨性别者的恐惧 等同起来","source":"“In researching the role, it came down to this idea of equating male violence with this fear of trans people, where these women might see a trans woman as the scary men in their life who have preyed on them in the past.”","sourceHtml":"“In researching the role, \u003cmark>it came down to this idea of equating male violence with this fear of trans people\u003c/mark>, where these women might see a trans woman as the scary men in their life who have preyed on them in the past.”"},{"en":"prey on someone","zh":"捕食、利用或伤害较脆弱的人，常指带有操控与暴力的行为","source":"“In researching the role, it came down to this idea of equating male violence with this fear of trans people, where these women might see a trans woman as the scary men in their life who have preyed on them in the past.”","sourceHtml":"“In researching the role, it came down to this idea of equating male violence with this fear of trans people, where these women might see a trans woman as the scary men in their life who have \u003cmark>preyed on them in the past\u003c/mark>.”"},{"en":"a DIY-style anthology","zh":"一套以自主、低成本、非大厂流程制作的选集系列","source":"Weard’s DIY-style anthology has become a crucial epicenter of contemporary trans artists, featuring everyone from Schoenbrun to Drew to Mackay in various roles.","sourceHtml":"Weard’s \u003cmark>DIY-style anthology has become a crucial epicenter of contemporary trans artists\u003c/mark>, featuring everyone from Schoenbrun to Drew to Mackay in various roles."},{"en":"a crucial epicenter of contemporary trans artists","zh":"当代跨性别艺术家至关重要的 汇聚中心","source":"Weard’s DIY-style anthology has become a crucial epicenter of contemporary trans artists, featuring everyone from Schoenbrun to Drew to Mackay in various roles.","sourceHtml":"Weard’s \u003cmark>DIY-style anthology has become a crucial epicenter of contemporary trans artists\u003c/mark>, featuring everyone from Schoenbrun to Drew to Mackay in various roles."},{"en":"embrace a perspective that is hard to understand","zh":"主动接纳一个难以理解、无法 迅速讨人喜欢的视角","source":"Weard also embraces the perspective of a trans character that’s “hard to understand” at times.","sourceHtml":"Weard also \u003cmark>embraces the perspective of a trans character that’s “hard to understand”\u003c/mark> at times."},{"en":"a totem for the embarrassing start of transition","zh":"性别过渡初期尴尬阶段的象征","source":"“She’s this totem for the embarrassing start of transition that I think a lot of trans people go through.”","sourceHtml":"“She’s this \u003cmark>totem for the embarrassing start of transition\u003c/mark> that I think a lot of trans people go through.”"},{"en":"a prolific filmmaker","zh":"作品产量高、持续创作活跃的电影人","source":"As one of the most prolific trans filmmakers making movies right now, Schoenbrun takes the initiative to have emerging directors and writers shadow on set.","sourceHtml":"As one of the most \u003cmark>prolific trans filmmakers\u003c/mark> making movies right now, Schoenbrun takes the initiative to have emerging directors and writers shadow on set."},{"en":"take the initiative to have emerging directors shadow on set","zh":"主动安排新导演进入 片场跟组学习","source":"As one of the most prolific trans filmmakers making movies right now, Schoenbrun takes the initiative to have emerging directors and writers shadow on set.","sourceHtml":"As one of the most prolific trans filmmakers making movies right now, Schoenbrun \u003cmark>takes the initiative to have emerging directors and writers shadow on set\u003c/mark>."},{"en":"go on to write and direct","zh":"随后进一步完成编剧和导演工作，常用于描述早期经历 如何通向后来的职业成果","source":"Eva Victor, for instance, shadowed on “I Saw the TV Glow” before going on to write and direct their award-winning indie breakout “Sorry, Baby,” while “The Serpent’s Skin” and “Our Effed Up World” director Mackay shadowed on “Camp Miasma.”","sourceHtml":"Eva Victor, for instance, shadowed on “I Saw the TV Glow” before \u003cmark>going on to write and direct\u003c/mark> their award-winning indie breakout “Sorry, Baby,” while “The Serpent’s Skin” and “Our Effed Up World” director Mackay shadowed on “Camp Miasma.”"},{"en":"compete with each other","zh":"彼此争夺同一机会或资源","source":"Mackay says, “We’re not competing with each other; we’re all trying to do our own thing but have this community to lean back on and be supported by.”","sourceHtml":"Mackay says, “We’re not \u003cmark>competing with each other\u003c/mark>; we’re all trying to do our own thing but have this community to lean back on and be supported by.”"},{"en":"do one’s own thing","zh":"按自己的方向创作，不要求社群成员共享统一风格或立场","source":"Mackay says, “We’re not competing with each other; we’re all trying to do our own thing but have this community to lean back on and be supported by.”","sourceHtml":"Mackay says, “We’re not competing with each other; we’re all trying to \u003cmark>do our own thing\u003c/mark> but have this community to lean back on and be supported by.”"},{"en":"have a community to lean back on","zh":"拥有一个可以倚靠、提供安全感与实际支持的 社群","source":"Mackay says, “We’re not competing with each other; we’re all trying to do our own thing but have this community to lean back on and be supported by.”","sourceHtml":"Mackay says, “We’re not competing with each other; we’re all trying to do our own thing but have this community to \u003cmark>lean back on and be supported by\u003c/mark>.”"},{"en":"put someone on the map","zh":"让某人获得广泛注意、在行业版图上建立明确位置","source":"After making “We’re All Going to the World’s Fair,” which put Schoenbrun on the map in 2021 after Sundance, they have intentionally placed “more boundaries” around them.","sourceHtml":"After making “We’re All Going to the World’s Fair,” which \u003cmark>put Schoenbrun on the map\u003c/mark> in 2021 after Sundance, they have intentionally placed “more boundaries” around them."},{"en":"place more boundaries around oneself","zh":"为自己的时间、关系与可提供的帮助设立 更多界限","source":"After making “We’re All Going to the World’s Fair,” which put Schoenbrun on the map in 2021 after Sundance, they have intentionally placed “more boundaries” around them.","sourceHtml":"After making “We’re All Going to the World’s Fair,” which put Schoenbrun on the map in 2021 after Sundance, they have intentionally \u003cmark>placed “more boundaries” around them\u003c/mark>."},{"en":"be a little transactional","zh":"带有一些交换、利益或职业互惠性质","source":"“Even while I have a circle of really close friends and artists who I admire and love and want to be collaborating with and supporting in this way, there’s something that’s always going to be a little transactional about it,” Schoenbrun says.","sourceHtml":"“Even while I have a circle of really close friends and artists who I admire and love and want to be collaborating with and supporting in this way, there’s something that’s always going to be \u003cmark>a little transactional about it\u003c/mark>,” Schoenbrun says."},{"en":"be matched with someone as a mentor","zh":"通过正式计划与某位导师配对","source":"Thanks to the Fatales Forward program, emerging filmmaker Sepi Mashiahof was matched with Schoenbrun as a mentor.","sourceHtml":"Thanks to the Fatales Forward program, emerging filmmaker Sepi Mashiahof was \u003cmark>matched with Schoenbrun as a mentor\u003c/mark>."},{"en":"be promoted to script coordinator","zh":"晋升为剧本协调员，负责版本管理、修改记录及 编剧部门与制作部门之间的信息协调","source":"Since then, Mashiahof worked as Schoenbrun’s assistant on “I Saw the TV Glow” and was promoted to script coordinator on “Camp Miasma.”","sourceHtml":"Since then, Mashiahof worked as Schoenbrun’s assistant on “I Saw the TV Glow” and was \u003cmark>promoted to script coordinator\u003c/mark> on “Camp Miasma.”"},{"en":"be open and receptive to other people’s ideas","zh":"对他人的想法保持开放，并愿意真正 接收、考虑甚至纳入作品","source":"“What I learned from Jane is how much they love and are so open and receptive to the ideas of the people around them,” Mashiahof says.","sourceHtml":"“What I learned from Jane is how much they love and are so \u003cmark>open and receptive to the ideas of the people around them\u003c/mark>,” Mashiahof says."},{"en":"take great pains to do something","zh":"为做成某事投入巨大精力、极其费心","source":"Haven, who starred in both “I Saw the TV Glow” and “Camp Miasma” and has directed multiple short films, explains that they’ve seen Schoenbrun take “great pains” to raise money.","sourceHtml":"Haven, who starred in both “I Saw the TV Glow” and “Camp Miasma” and has directed multiple short films, explains that they’ve seen Schoenbrun \u003cmark>take “great pains” to raise money\u003c/mark>."},{"en":"explain oneself","zh":"反复说明自己的身份、意图或行为，使别人理解或接受","source":"“This comes from explaining themselves, through working really diligently to connect with financiers about this universal pain that they work into their films, and I think there’s something in it that cannot be bought or sold,” Haven says.","sourceHtml":"“This comes from \u003cmark>explaining themselves\u003c/mark>, through working really diligently to connect with financiers about this universal pain that they work into their films, and I think there’s something in it that cannot be bought or sold,” Haven says."},{"en":"connect with financiers about a universal pain worked into one’s films","zh":"围绕被 编织进电影的普遍痛苦，与出资人建立理解","source":"“This comes from explaining themselves, through working really diligently to connect with financiers about this universal pain that they work into their films, and I think there’s something in it that cannot be bought or sold,” Haven says.","sourceHtml":"“This comes from explaining themselves, through working really diligently to \u003cmark>connect with financiers about this universal pain that they work into their films\u003c/mark>, and I think there’s something in it that cannot be bought or sold,” Haven says."},{"en":"cannot be bought or sold","zh":"无法被金钱购买或出售，指作品中不应被市场价值完全 吞没的经验、真诚与精神内核","source":"“This comes from explaining themselves, through working really diligently to connect with financiers about this universal pain that they work into their films, and I think there’s something in it that cannot be bought or sold,” Haven says.","sourceHtml":"“This comes from explaining themselves, through working really diligently to connect with financiers about this universal pain that they work into their films, and I think there’s something in it that \u003cmark>cannot be bought or sold\u003c/mark>,” Haven says."},{"en":"self-sustain as artists","zh":"让自己作为艺术家获得足够收入，能够持续生活与创作","source":"“Of course, we are connected to an industry that is about making money, that is about self-sustaining as artists, but ultimately it becomes more and more about what cannot be bought or sold and what is eternal to us as artists.”","sourceHtml":"“Of course, we are connected to an industry that is about making money, that is about \u003cmark>self-sustaining as artists\u003c/mark>, but ultimately it becomes more and more about what cannot be bought or sold and what is eternal to us as artists.”"},{"en":"what is eternal to us as artists","zh":"对艺术家而言持久、不可替代的核心关切","source":"“Of course, we are connected to an industry that is about making money, that is about self-sustaining as artists, but ultimately it becomes more and more about what cannot be bought or sold and what is eternal to us as artists.”","sourceHtml":"“Of course, we are connected to an industry that is about making money, that is about self-sustaining as artists, but ultimately it becomes more and more about what cannot be bought or sold and \u003cmark>what is eternal to us as artists\u003c/mark>.”"},{"en":"be deeply reflected in one’s work","zh":"深刻反映在某人的作品中，不一定是一一对应的 自传，而可能转化为人物处境与结构冲突","source":"Schoenbrun’s experience as an openly trans filmmaker is deeply reflected in their work, particularly with the journey that “Camp Miasma” protagonist Kris (Hannah Einbinder) takes in fighting to get her vision understood by studio executives.","sourceHtml":"Schoenbrun’s experience as an openly trans filmmaker is \u003cmark>deeply reflected in their work\u003c/mark>, particularly with the journey that “Camp Miasma” protagonist Kris (Hannah Einbinder) takes in fighting to get her vision understood by studio executives."},{"en":"fight to get one’s vision understood by executives","zh":"奋力让掌权者理解自己的创作 愿景","source":"Schoenbrun’s experience as an openly trans filmmaker is deeply reflected in their work, particularly with the journey that “Camp Miasma” protagonist Kris (Hannah Einbinder) takes in fighting to get her vision understood by studio executives.","sourceHtml":"Schoenbrun’s experience as an openly trans filmmaker is deeply reflected in their work, particularly with the journey that “Camp Miasma” protagonist Kris (Hannah Einbinder) takes in \u003cmark>fighting to get her vision understood by studio executives\u003c/mark>."},{"en":"do a general","zh":"参加不针对某个确定项目的行业常规会面，双方主要了解彼此、讨论 兴趣，并为未来合作建立关系","source":"Schoenbrun explains: “Anytime I’m on a Zoom with Hollywood, with people who I’m maybe going to work with on something, or doing a general, my transness is going to be in the room.","sourceHtml":"Schoenbrun explains: “Anytime I’m on a Zoom with Hollywood, with people who I’m maybe going to work with on something, or \u003cmark>doing a general\u003c/mark>, my transness is going to be in the room."},{"en":"one’s identity is in the room","zh":"某人的身份始终在场并影响互动，即使没有被明说， 也无法像多数群体身份那样被当成中性背景","source":"Schoenbrun explains: “Anytime I’m on a Zoom with Hollywood, with people who I’m maybe going to work with on something, or doing a general, my transness is going to be in the room.","sourceHtml":"Schoenbrun explains: “Anytime I’m on a Zoom with Hollywood, with people who I’m maybe going to work with on something, or doing a general, my transness is going to be \u003cmark>in the room\u003c/mark>."},{"en":"on the other side of the call","zh":"在通话另一端，借此呈现谁坐在掌握决定权的位置","source":"Even if they have the best intentions, it’s a particular minority experience in that there are no other trans people on the other side of the call.","sourceHtml":"Even if they have the best intentions, it’s a particular minority experience in that there are no other trans people \u003cmark>on the other side of the call\u003c/mark>."},{"en":"be given power","zh":"被赋予实际决策、资源分配或否决权，而不只是拥有一个职位名称","source":"And they’re not actually being given any power, they’re there in a tokenized way.”","sourceHtml":"And they’re not actually \u003cmark>being given any power\u003c/mark>, they’re there in a tokenized way.”"},{"en":"in a tokenized way","zh":"以象征性代表的方式被纳入，用少数个体制造多元表象，却不 改变真正的权力结构","source":"And they’re not actually being given any power, they’re there in a tokenized way.”","sourceHtml":"And they’re not actually being given any power, they’re there \u003cmark>in a tokenized way\u003c/mark>.”"},{"en":"get a second feature off the ground","zh":"让第二部长片从构想进入实际运转","source":"But getting a second feature off the ground has proven difficult.","sourceHtml":"But \u003cmark>getting a second feature off the ground\u003c/mark> has proven difficult."},{"en":"get a ton of buzz out of its festival run","zh":"从电影节巡展中获得大量话题与关注","source":"“My first movie was a huge critical success, got a ton of buzz out of its festival run, had a Streisand effect because of its legal baggage, it won multiple awards,” Drew says.","sourceHtml":"“My first movie was a huge critical success, \u003cmark>got a ton of buzz out of its festival run\u003c/mark>, had a Streisand effect because of its legal baggage, it won multiple awards,” Drew says."},{"en":"Streisand effect because of its legal baggage","zh":"法律上的压制或争议反而让作品传播得更广","source":"“My first movie was a huge critical success, got a ton of buzz out of its festival run, had a Streisand effect because of its legal baggage, it won multiple awards,” Drew says.","sourceHtml":"“My first movie was a huge critical success, got a ton of buzz out of its festival run, had a \u003cmark>Streisand effect because of its legal baggage\u003c/mark>, it won multiple awards,” Drew says."},{"en":"shepherd","zh":"牵头并一路推动项目完成，兼有引领和照管之意","source":"“In another era, that probably could have meant that Disney or Paramount or fucking Star Wars, one of these people would be coming to me and saying, ‘We have this thing we want you to shepherd.’”","sourceHtml":"“In another era, that probably could have meant that Disney or Paramount or fucking Star Wars, one of these people would be coming to me and saying, ‘We have this thing we want you to \u003cmark>shepherd\u003c/mark>.’”"},{"en":"media consolidation","zh":"媒体整合或所有权集中，越来越多渠道由少数集团控制","source":"She continues: “I don’t know if I’m just too aggressive and trans and hairy-arm pitted for that to happen, but I do know that didn’t happen to me — I assume kind of partially because of media consolidation, also because of the subject matter of my first movie.","sourceHtml":"She continues: “I don’t know if I’m just too aggressive and trans and hairy-arm pitted for that to happen, but I do know that didn’t happen to me — I assume kind of partially because of \u003cmark>media consolidation\u003c/mark>, also because of the subject matter of my first movie."},{"en":"quasi-inaccessible to a major studio","zh":"对大制片厂而言近乎无法接受或采用","source":"And the fact that I made a movie that was very explicitly about my experience as a trans woman and as an artist, which is another thing that makes it quasi-inaccessible to a major studio.”","sourceHtml":"And the fact that I made a movie that was very explicitly about my experience as a trans woman and as an artist, which is another thing that makes it \u003cmark>quasi-inaccessible to a major studio\u003c/mark>.”"},{"en":"inaugural Found Footage Feature Fund award","zh":"首届“拾得录像长片基金奖”","source":"Drew’s next feature, the horror comedy “Trandemic,” recently earned a $25,000 cash grant from the Duplass Brothers’ inaugural Found Footage Feature Fund award, and has reportedly already attracted interest from distributors.","sourceHtml":"Drew’s next feature, the horror comedy “Trandemic,” recently earned a $25,000 cash grant from the Duplass Brothers’ \u003cmark>inaugural Found Footage Feature Fund award\u003c/mark>, and has reportedly already attracted interest from distributors."},{"en":"attract interest from distributors","zh":"引起发行商兴趣","source":"Drew’s next feature, the horror comedy “Trandemic,” recently earned a $25,000 cash grant from the Duplass Brothers’ inaugural Found Footage Feature Fund award, and has reportedly already attracted interest from distributors.","sourceHtml":"Drew’s next feature, the horror comedy “Trandemic,” recently earned a $25,000 cash grant from the Duplass Brothers’ inaugural Found Footage Feature Fund award, and has reportedly already \u003cmark>attracted interest from distributors\u003c/mark>."},{"en":"a filmmaker in their own right","zh":"本身就是一名真正独立成立的电影人，而不只以演员身份存在","source":"In addition to performing in films like “Castration Movie” and “Camp Miasma,” Fast is a filmmaker in their own right, making their debut with “Honeycomb” back in 2022 for just $5,000 with a group of friends.","sourceHtml":"In addition to performing in films like “Castration Movie” and “Camp Miasma,” Fast is \u003cmark>a filmmaker in their own right\u003c/mark>, making their debut with “Honeycomb” back in 2022 for just $5,000 with a group of friends."},{"en":"take a supernatural, witchy turn","zh":"情节转向超自然、带女巫气息的发展","source":"Things, of course, take a supernatural, witchy turn.","sourceHtml":"Things, of course, \u003cmark>take a supernatural, witchy turn\u003c/mark>."},{"en":"have no ambitions to work with more money","zh":"无意把更高预算当作职业目标","source":"Despite getting a higher budget for “Camp,” which was distributed by Dark Sky Films and played at festivals like Frameline, Fast doesn’t have any ambitions to work with more money on future projects.","sourceHtml":"Despite getting a higher budget for “Camp,” which was distributed by Dark Sky Films and played at festivals like Frameline, Fast doesn’t have any \u003cmark>ambitions to work with more money\u003c/mark> on future projects."},{"en":"become industrialized","zh":"被工业化","source":"“I really want to have a good life and I don’t want my life to become industrialized.","sourceHtml":"“I really want to have a good life and I don’t want my life to \u003cmark>become industrialized\u003c/mark>."},{"en":"sustain myself through service work","zh":"通过服务业工作维持生计","source":"“For me, I’m able to sustain myself through service work, I’m comfortable doing that, I don’t mind it.","sourceHtml":"“For me, I’m able to \u003cmark>sustain myself through service work\u003c/mark>, I’m comfortable doing that, I don’t mind it."},{"en":"micro budgets","zh":"微型预算，远低于常规独立电影的资金规模","source":"If I can continue making films for micro budgets with my friends, these are the things that I find inspiring and that I get real joy out of.”","sourceHtml":"If I can continue making films for \u003cmark>micro budgets\u003c/mark> with my friends, these are the things that I find inspiring and that I get real joy out of.”"},{"en":"maintain their voice","zh":"守住自己的艺术立场与主导权","source":"Even with “Camp,” Fast admits they had a “really hard time” maintaining their voice.","sourceHtml":"Even with “Camp,” Fast admits they had a “really hard time” \u003cmark>maintaining their voice\u003c/mark>."},{"en":"be opposed to sacrificing any of my vision","zh":"坚决反对牺牲任何一部分创作愿景","source":"“I’m so opposed to sacrificing any of my vision for something to be better understood or for our distributors to be happy or for the producers to feel involved in the process or whatever,” Fast says.","sourceHtml":"“I’m so \u003cmark>opposed to sacrificing any of my vision\u003c/mark> for something to be better understood or for our distributors to be happy or for the producers to feel involved in the process or whatever,” Fast says."},{"en":"through to the other side without the vision being too mangled","zh":"把项目熬到完成，同时避免创作构想被过度扭曲","source":"“I got ‘Camp’ through to the other side without the vision being too mangled, but fuck, it was such a fight.","sourceHtml":"“I got ‘Camp’ \u003cmark>through to the other side without the vision being too mangled\u003c/mark>, but fuck, it was such a fight."},{"en":"heavily rely on crowdfunding to bring projects to life","zh":"高度依赖众筹把项目变成现实","source":"To date, she has heavily relied on crowdfunding to bring her projects to life.","sourceHtml":"To date, she has \u003cmark>heavily relied on crowdfunding to bring her projects to life\u003c/mark>."},{"en":"at such a micro scale","zh":"处于极小的规模","source":"“I feel very grateful to have been able to make the films I have made, but it’s been at such a micro scale.","sourceHtml":"“I feel very grateful to have been able to make the films I have made, but it’s been \u003cmark>at such a micro scale\u003c/mark>."},{"en":"in the few million-dollar range","zh":"处于数百万美元的预算区间","source":"I don’t necessarily want to do the next Marvel movie and have a trillion dollars, but I want to make something in the few million-dollar range,” Mackay says.","sourceHtml":"I don’t necessarily want to do the next Marvel movie and have a trillion dollars, but I want to make something \u003cmark>in the few million-dollar range\u003c/mark>,” Mackay says."},{"en":"move out of the micro-budget space","zh":"脱离微预算制作领域，进入更稳定、资源更多的层级","source":"“That’s the dream to keep growing and moving out of the micro-budget space.”","sourceHtml":"“That’s the dream to keep growing and \u003cmark>moving out of the micro-budget space\u003c/mark>.”"},{"en":"body of work","zh":"某位创作者迄今积累的整体作品，而不是单独一部电影","source":"Many of Mackay’s films are streaming on Shudder, which has helped her body of work connect with horror fans around the world.","sourceHtml":"Many of Mackay’s films are streaming on Shudder, which has helped her \u003cmark>body of work connect with horror fans around the world\u003c/mark>."},{"en":"connect with horror fans around the world","zh":"与全球恐怖片观众建立联系、获得观看者","source":"Many of Mackay’s films are streaming on Shudder, which has helped her body of work connect with horror fans around the world.","sourceHtml":"Many of Mackay’s films are streaming on Shudder, which has helped her \u003cmark>body of work connect with horror fans around the world\u003c/mark>."},{"en":"pick up a film","zh":"发行商或平台购入一部电影的发行、播映权","source":"“I mean, they literally picked up my first film that I made with no money when I was 16, and that was not something that I ever dreamed of,” Mackay says.","sourceHtml":"“I mean, they literally \u003cmark>picked up my first film\u003c/mark> that I made with no money when I was 16, and that was not something that I ever dreamed of,” Mackay says."},{"en":"grapple with the realities of a shifting industry","zh":"艰难应对行业变化带来的现实","source":"As if making movies wasn’t already hard enough, trans storytellers working in independent spaces are now grappling with the realities of a shifting industry in which studios are consolidating, leading many in Hollywood to sign open letters speaking out against the looming Paramount-Warner Bros. merger.","sourceHtml":"As if making movies wasn’t already hard enough, trans storytellers working in independent spaces are now \u003cmark>grappling with the realities of a shifting industry\u003c/mark> in which studios are consolidating, leading many in Hollywood to sign open letters speaking out against the looming Paramount-Warner Bros. merger."},{"en":"looming merger","zh":"迫近、即将发生且令人不安的合并","source":"As if making movies wasn’t already hard enough, trans storytellers working in independent spaces are now grappling with the realities of a shifting industry in which studios are consolidating, leading many in Hollywood to sign open letters speaking out against the looming Paramount-Warner Bros. merger.","sourceHtml":"As if making movies wasn’t already hard enough, trans storytellers working in independent spaces are now grappling with the realities of a shifting industry in which studios are consolidating, leading many in Hollywood to sign open letters speaking out against the \u003cmark>looming Paramount-Warner Bros. merger\u003c/mark>."},{"en":"rightward shift","zh":"政治或文化立场向右翼移动","source":"The merger has also ignited fears about a rightward shift.","sourceHtml":"The merger has also ignited fears about a \u003cmark>rightward shift\u003c/mark>."},{"en":"carve out a space for themselves","zh":"在缺乏现成位置时艰难开辟属于自己的空间","source":"But the reality is that many trans and nonbinary filmmakers have already had to carve out a space for themselves separate from the studio system.","sourceHtml":"But the reality is that many trans and nonbinary filmmakers have already had to \u003cmark>carve out a space for themselves separate from the studio system\u003c/mark>."},{"en":"separate from the studio system","zh":"独立于制片厂体系，而不只是处在它的边缘","source":"But the reality is that many trans and nonbinary filmmakers have already had to carve out a space for themselves separate from the studio system.","sourceHtml":"But the reality is that many trans and nonbinary filmmakers have already had to \u003cmark>carve out a space for themselves separate from the studio system\u003c/mark>."},{"en":"literal monopoly","zh":"实实在在的垄断，而非夸张说法","source":"“This literal monopoly that’s existed, to me, adds value to independent filmmakers.","sourceHtml":"“This \u003cmark>literal monopoly\u003c/mark> that’s existed, to me, adds value to independent filmmakers."},{"en":"add value to independent filmmakers","zh":"提升独立电影人的稀缺性与价值","source":"“This literal monopoly that’s existed, to me, adds value to independent filmmakers.","sourceHtml":"“This literal monopoly that’s existed, to me, \u003cmark>adds value to independent filmmakers\u003c/mark>."},{"en":"capitalist hellscape","zh":"“资本主义地狱景象”，带强烈批判与黑色幽默色彩","source":"“The capitalist hellscape that we’re in makes me feel more empowered as an independent filmmaker because my perspective has value.”","sourceHtml":"“The \u003cmark>capitalist hellscape\u003c/mark> that we’re in makes me feel more empowered as an independent filmmaker because my perspective has value.”"},{"en":"be undeterred by","zh":"不因困难或威胁而退缩、改变方向","source":"Alex Schmider, GLAAD’s senior director of entertainment and a producer behind “Disclosure” and “Changing the Game,” says he is “inspired” by contemporary trans artists: “They are undeterred by lack of funding, institutional support, and traditional distribution.","sourceHtml":"Alex Schmider, GLAAD’s senior director of entertainment and a producer behind “Disclosure” and “Changing the Game,” says he is “inspired” by contemporary trans artists: “They are \u003cmark>undeterred by lack of funding, institutional support, and traditional distribution\u003c/mark>."},{"en":"institutional support","zh":"来自制片公司、基金、行业组织等制度性机构的支持","source":"Alex Schmider, GLAAD’s senior director of entertainment and a producer behind “Disclosure” and “Changing the Game,” says he is “inspired” by contemporary trans artists: “They are undeterred by lack of funding, institutional support, and traditional distribution.","sourceHtml":"Alex Schmider, GLAAD’s senior director of entertainment and a producer behind “Disclosure” and “Changing the Game,” says he is “inspired” by contemporary trans artists: “They are \u003cmark>undeterred by lack of funding, institutional support, and traditional distribution\u003c/mark>."},{"en":"traditional distribution","zh":"院线、电视和大型发行商等传统发行渠道","source":"Alex Schmider, GLAAD’s senior director of entertainment and a producer behind “Disclosure” and “Changing the Game,” says he is “inspired” by contemporary trans artists: “They are undeterred by lack of funding, institutional support, and traditional distribution.","sourceHtml":"Alex Schmider, GLAAD’s senior director of entertainment and a producer behind “Disclosure” and “Changing the Game,” says he is “inspired” by contemporary trans artists: “They are \u003cmark>undeterred by lack of funding, institutional support, and traditional distribution\u003c/mark>."},{"en":"exist in these indie spaces","zh":"在独立电影的空间与网络中生存、工作","source":"Drew says: “The benefit of mostly existing in these indie spaces is that we get to tell our own story and get to control the narrative a little bit.","sourceHtml":"Drew says: “The benefit of mostly \u003cmark>existing in these indie spaces\u003c/mark> is that we get to tell our own story and get to control the narrative a little bit."},{"en":"tell our own story","zh":"由当事群体亲自讲述自己的故事","source":"Drew says: “The benefit of mostly existing in these indie spaces is that we get to tell our own story and get to control the narrative a little bit.","sourceHtml":"Drew says: “The benefit of mostly existing in these indie spaces is that we get to \u003cmark>tell our own story\u003c/mark> and get to control the narrative a little bit."},{"en":"control the narrative","zh":"掌握故事如何被定义和解释的话语权","source":"Drew says: “The benefit of mostly existing in these indie spaces is that we get to tell our own story and get to control the narrative a little bit.","sourceHtml":"Drew says: “The benefit of mostly existing in these indie spaces is that we get to tell our own story and get to \u003cmark>control the narrative\u003c/mark> a little bit."},{"en":"be helmed by cisgender directors","zh":"由顺性别导演执导、掌舵","source":"There was a wave not too long ago when Hollywood tried to tell stories about trans people, usually helmed by cisgender directors.","sourceHtml":"There was a wave not too long ago when Hollywood tried to tell stories about trans people, usually \u003cmark>helmed by cisgender directors\u003c/mark>."},{"en":"media landscape","zh":"媒体生态，包括市场偏好、机构结构和文化氛围","source":"But in today’s media landscape, no directors working with major studios are interested.","sourceHtml":"But in today’s \u003cmark>media\u003c/mark> \u003cmark>landscape\u003c/mark>, no directors working with major studios are interested."},{"en":"pitch ideas in mainstream spaces","zh":"在主流行业会议中向制片方推介项目创意","source":"“When I’ve pitched ideas in mainstream spaces and there is a trans lead, the feedback I’ve gotten sometimes is, ‘This is too niche.’ Which is frustrating, I guess, but it’s only frustrating because it appeared differently when the trans tipping point was happening with ‘Transparent’ on TV.”","sourceHtml":"“When I’ve \u003cmark>pitched ideas in mainstream spaces\u003c/mark> and there is a trans lead, the feedback I’ve gotten sometimes is, ‘This is too niche.’ Which is frustrating, I guess, but it’s only frustrating because it appeared differently when the trans tipping point was happening with ‘Transparent’ on TV.”"},{"en":"too niche","zh":"受众过窄、小众到不具商业可行性","source":"“When I’ve pitched ideas in mainstream spaces and there is a trans lead, the feedback I’ve gotten sometimes is, ‘This is too niche.’ Which is frustrating, I guess, but it’s only frustrating because it appeared differently when the trans tipping point was happening with ‘Transparent’ on TV.”","sourceHtml":"“When I’ve pitched ideas in mainstream spaces and there is a trans lead, the feedback I’ve gotten sometimes is, ‘This is \u003cmark>too niche\u003c/mark>.’ Which is frustrating, I guess, but it’s only frustrating because it appeared differently when the trans tipping point was happening with ‘Transparent’ on TV.”"},{"en":"trans tipping point","zh":"“跨性别临界点”，指跨性别议题似乎跨过门槛、进入广泛公共视野的时刻","source":"“When I’ve pitched ideas in mainstream spaces and there is a trans lead, the feedback I’ve gotten sometimes is, ‘This is too niche.’ Which is frustrating, I guess, but it’s only frustrating because it appeared differently when the trans tipping point was happening with ‘Transparent’ on TV.”","sourceHtml":"“When I’ve pitched ideas in mainstream spaces and there is a trans lead, the feedback I’ve gotten sometimes is, ‘This is too niche.’ Which is frustrating, I guess, but it’s only frustrating because it appeared differently when the \u003cmark>trans tipping point\u003c/mark> was happening with ‘Transparent’ on TV.”"},{"en":"prominently center a film around a character","zh":"明确把某个人物置于电影叙事中心","source":"A recent example of a cisgender director prominently centering their film around a trans character was Jacques Audiard’s musical “Emilia Pérez.” Despite earning 13 Oscar nominations, that film faced significant pushback from the LGBTQ+ community.","sourceHtml":"A recent example of a cisgender director \u003cmark>prominently centering their film around a trans character\u003c/mark> was Jacques Audiard’s musical “Emilia Pérez.” Despite earning 13 Oscar nominations, that film faced significant pushback from the LGBTQ+ community."},{"en":"pushback from a community","zh":"来自某个群体的反对、抵制或批评","source":"A recent example of a cisgender director prominently centering their film around a trans character was Jacques Audiard’s musical “Emilia Pérez.” Despite earning 13 Oscar nominations, that film faced significant pushback from the LGBTQ+ community.","sourceHtml":"A recent example of a cisgender director prominently centering their film around a trans character was Jacques Audiard’s musical “Emilia Pérez.” Despite earning 13 Oscar nominations, that film faced significant \u003cmark>pushback from the LGBTQ+ community\u003c/mark>."},{"en":"voyeuristic perspective","zh":"窥视式视角，把人物当作供外部观看与猎奇的对象","source":"Haven says, “It’s a film from the voyeuristic perspective, and so it makes transness into something that is fascinating, titillating, perverse.","sourceHtml":"Haven says, “It’s a film from the \u003cmark>voyeuristic perspective\u003c/mark>, and so it makes transness into something that is fascinating, titillating, perverse."},{"en":"fascinating, titillating, perverse","zh":"“猎奇、挑逗、反常”，三个词共同模拟外部凝视给跨性别经验附加的感官色彩","source":"Haven says, “It’s a film from the voyeuristic perspective, and so it makes transness into something that is fascinating, titillating, perverse.","sourceHtml":"Haven says, “It’s a film from the voyeuristic perspective, and so it makes transness into something that is \u003cmark>fascinating, titillating, perverse\u003c/mark>."},{"en":"hit at the core of","zh":"击中、触及某事物最核心的部分","source":"But it doesn’t hit at the core of what I understand transness to be, which is in direct opposition to the message that things cannot change.","sourceHtml":"But it doesn’t \u003cmark>hit at the core of what I understand transness to be\u003c/mark>, which is in direct opposition to the message that things cannot change."},{"en":"align with a strange imagination","zh":"与某种怪异的想象或预设相吻合、彼此强化","source":"Mashiahof adds that when cisgender directors tell trans stories, they happen to align with the “strange imagination” that a man is pretending to be a woman.","sourceHtml":"Mashiahof adds that when cisgender directors tell trans stories, they happen to \u003cmark>align with the “strange imagination” that a man is pretending to be a woman\u003c/mark>."},{"en":"shift the onus onto society versus the person","zh":"把责任或问题的归属从个人转移到社会","source":"“When trans filmmakers are given the opportunity to tell a story, it actually warps that and shifts the onus of that weirdness onto society versus the person.”","sourceHtml":"“When trans filmmakers are given the opportunity to tell a story, it actually \u003cmark>warps that and shifts the onus of that weirdness onto society versus the person\u003c/mark>.”"},{"en":"warp","zh":"扭转、改变原有形态","source":"“When trans filmmakers are given the opportunity to tell a story, it actually warps that and shifts the onus of that weirdness onto society versus the person.”","sourceHtml":"“When trans filmmakers are given the opportunity to tell a story, it actually \u003cmark>warps that and shifts the onus of that weirdness onto society versus the person\u003c/mark>.”"},{"en":"be born out of","zh":"从某种经历、需求或危机中诞生","source":"Born out of filmmaker and programmer Elizabeth Purchell’s “moment of crisis,” Muscle Distribution was founded in 2025 as the only trans-owned distribution label.","sourceHtml":"\u003cmark>Born out of\u003c/mark> filmmaker and programmer Elizabeth Purchell’s “moment of crisis,” Muscle Distribution was founded in 2025 as the only trans-owned distribution label."},{"en":"go-to stop","zh":"人们有某类需求时首先想到的去处或渠道","source":"In the past year, Muscle has become the go-to stop for micro-budget films from trans filmmakers like “Castration Movie,” as well as two of Fast’s films, “Honeycomb” and the upcoming release “Drinking and Driving.”","sourceHtml":"In the past year, Muscle has become the \u003cmark>go-to stop\u003c/mark> for micro-budget films from trans filmmakers like “Castration Movie,” as well as two of Fast’s films, “Honeycomb” and the upcoming release “Drinking and Driving.”"},{"en":"trans-owned distribution label","zh":"由跨性别者拥有并掌控的电影发行厂牌","source":"Born out of filmmaker and programmer Elizabeth Purchell’s “moment of crisis,” Muscle Distribution was founded in 2025 as the only trans-owned distribution label.","sourceHtml":"Born out of filmmaker and programmer Elizabeth Purchell’s “moment of crisis,” Muscle \u003cmark>Distribution\u003c/mark> was founded in 2025 as the only trans-owned \u003cmark>distribution\u003c/mark> \u003cmark>label\u003c/mark>."},{"en":"ultimate gimmick","zh":"最大的噱头或卖点","source":"“The ultimate gimmick is seeing a trans movie in a theater because they’re not really being made, programmers aren’t showing them and no one wants to get behind them in a meaningful way,” Purchell says.","sourceHtml":"“The \u003cmark>ultimate gimmick\u003c/mark> is seeing a trans movie in a theater because they’re not really being made, programmers aren’t showing them and no one wants to get behind them in a meaningful way,” Purchell says."},{"en":"get behind something in a meaningful way","zh":"以资金、发行或实际行动真正支持某事，而非口头表态","source":"“The ultimate gimmick is seeing a trans movie in a theater because they’re not really being made, programmers aren’t showing them and no one wants to get behind them in a meaningful way,” Purchell says.","sourceHtml":"“The ultimate gimmick is seeing a trans movie in a theater because they’re not really being made, programmers aren’t showing them and no one wants to \u003cmark>get behind them in a meaningful way\u003c/mark>,” Purchell says."},{"en":"something really is happening","zh":"某种真实的变化正在形成","source":"Something really is happening.”","sourceHtml":"\u003cmark>Something really is happening\u003c/mark>.”"},{"en":"take the approach of doing something","zh":"采取某种做法或路径","source":"Some filmmakers in this space have also taken the approach of making their films widely available online with a “pay what you wish” model, which Weard has done with all three “Castration” films.","sourceHtml":"Some filmmakers in this space have also \u003cmark>taken the approach of making their films widely available online\u003c/mark> with a “pay what you wish” model, which Weard has done with all three “Castration” films."},{"en":"pay what you wish","zh":"随心付费，由观众自行决定支付金额","source":"Some filmmakers in this space have also taken the approach of making their films widely available online with a “pay what you wish” model, which Weard has done with all three “Castration” films.","sourceHtml":"Some filmmakers in this space have also taken the approach of making their films widely available online with a “\u003cmark>pay what you wish\u003c/mark>” model, which Weard has done with all three “Castration” films."},{"en":"be designed for online first","zh":"从策划阶段就把线上传播设为首要渠道，而非院线失败后的补救","source":"“It was definitely a project that was always designed for online first.","sourceHtml":"“It was definitely a project that was always \u003cmark>designed for online first\u003c/mark>."},{"en":"a fun bonus","zh":"意外得到的额外好处，不是衡量项目成败的必要条件","source":"Anything else has been a fun bonus,” she says.","sourceHtml":"Anything else has been a \u003cmark>fun\u003c/mark> \u003cmark>bonus\u003c/mark>,” she says."},{"en":"walk around at the market and at these pavilions","zh":"在电影市场和展馆中活动","source":"“I was just at the Cannes Film Festival and I saw so many trans people walking around at the market and at these pavilions,” she says.","sourceHtml":"“I was just at the Cannes Film Festival and I saw so many trans people \u003cmark>walking around at the market and at these pavilions\u003c/mark>,” she says."},{"en":"be blown away","zh":"深受震撼、惊喜到难以置信","source":"“I was so blown away.","sourceHtml":"“I was so \u003cmark>blown away\u003c/mark>."},{"en":"put out work against the odds","zh":"在胜算很低、阻力重重的情况下仍持续推出作品","source":"Looking around at the community they’ve found and the work their friends are putting out against the odds, Haven says that “we’re creating a new industry.”","sourceHtml":"Looking around at the community they’ve found and the work their friends are \u003cmark>putting out against the odds\u003c/mark>, Haven says that “we’re creating a new industry.”"},{"en":"create a new industry","zh":"创造一套新的行业","source":"Looking around at the community they’ve found and the work their friends are putting out against the odds, Haven says that “we’re creating a new industry.”","sourceHtml":"Looking around at the community they’ve found and the work their friends are putting out against the odds, Haven says that “\u003cmark>we’re creating a new industry\u003c/mark>.”"},{"en":"can’t be co-opted and can’t be bought","zh":"无法被既有权力吸纳、挪用，也无法用资本收买","source":"“I think there’s a lot of power in it because it can’t be co-opted and it can’t be bought,” they conclude.","sourceHtml":"“I think there’s a lot of power in it because it \u003cmark>can’t be co-opted and it can’t be bought\u003c/mark>,” they conclude."},{"en":"take transness and sell it to us","zh":"把群体自身的经验占有、商品化，再作为产品卖回给这个群体","source":"“We went through a really confusing era where big industry was trying to take transness and sell it to us, but it actually just doesn’t sell because transness threatens a lot of the structures that we know.","sourceHtml":"“We went through a really confusing era where big industry was trying to \u003cmark>take transness and sell it to us\u003c/mark>, but it actually just doesn’t sell because transness threatens a lot of the structures that we know."},{"en":"threaten the structures that we know","zh":"动摇人们习以为常的制度与分类方式","source":"“We went through a really confusing era where big industry was trying to take transness and sell it to us, but it actually just doesn’t sell because transness threatens a lot of the structures that we know.","sourceHtml":"“We went through a really confusing era where big industry was trying to take transness and sell it to us, but it actually just doesn’t sell because transness \u003cmark>threatens a lot of the structures that we know\u003c/mark>."},{"en":"reinvent it on our own","zh":"不依赖主流定义，靠自己重新构想并建立它","source":"We are in a place, now, where we’re able to reinvent it on our own.”","sourceHtml":"We are in a place, now, where we’re able to \u003cmark>reinvent it on our own\u003c/mark>.”"}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
