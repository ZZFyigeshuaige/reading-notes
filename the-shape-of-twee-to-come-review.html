<script>
let cards = [{"en":"serve as shorthand for","zh":"充当……的简便指称","source":"Since the mid-1980s, “twee” has affectionately—or pejoratively—served as shorthand for a specific set of musical and visual cues: thinning cardigans, warbling cassettes, doodled portraits, and arrangements that echo the jangly quirks of ‘60s sunshine pop.","sourceHtml":"Since the mid-1980s, “twee” has affectionately—or pejoratively—\u003cmark>served as shorthand for\u003c/mark> a specific set of musical and visual cues: thinning cardigans, warbling cassettes, doodled portraits, and arrangements that echo the jangly quirks of ‘60s sunshine pop."},{"en":"fly the twee banner","zh":"高举某一流派的旗帜、公开以该流派自居","source":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists flying the twee banner while purveying wildly different sounds, from the raw catharsis of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths.","sourceHtml":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists \u003cmark>flying the twee banner\u003c/mark> while purveying wildly different sounds, from the raw catharsis of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths."},{"en":"purvey wildly different sounds","zh":"推出、传播彼此大不相同的声音","source":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists flying the twee banner while purveying wildly different sounds, from the raw catharsis of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths.","sourceHtml":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists flying the twee banner while \u003cmark>purveying wildly different sounds\u003c/mark>, from the raw catharsis of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths."},{"en":"raw catharsis","zh":"不加修饰、直接外露的情绪宣泄","source":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists flying the twee banner while purveying wildly different sounds, from the raw catharsis of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths.","sourceHtml":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists flying the twee banner while purveying wildly different sounds, from the \u003cmark>raw\u003c/mark> \u003cmark>catharsis\u003c/mark> of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths."},{"en":"the laptop twee set","zh":"这一群体或圈子","source":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists flying the twee banner while purveying wildly different sounds, from the raw catharsis of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths.","sourceHtml":"Though the aesthetic has certainly evolved alongside broader shifts in indie tastes, recent years have seen an explosion of new artists \u003cmark>flying the twee banner\u003c/mark> while purveying wildly different sounds, from the raw catharsis of tweemo to the laptop twee set’s affinity for tinkering with toy-like synths."},{"en":"breathless blogging","zh":"语气急促、兴奋、信息密集的博客写作","source":"It’s a cold March evening and friends& bandleader JC Grame, whose influential playlists and breathless Instagram story-based blogging have helped establish “laptop twee” as a nascent microgenre, sends me a voice message.","sourceHtml":"It’s a cold March evening and friends&amp; bandleader JC Grame, whose influential playlists and \u003cmark>breathless\u003c/mark> Instagram story-based \u003cmark>blogging\u003c/mark> have helped establish “laptop twee” as a nascent microgenre, sends me a voice message."},{"en":"nascent microgenre","zh":"刚刚萌芽的微型流派","source":"It’s a cold March evening and friends& bandleader JC Grame, whose influential playlists and breathless Instagram story-based blogging have helped establish “laptop twee” as a nascent microgenre, sends me a voice message.","sourceHtml":"It’s a cold March evening and friends&amp; bandleader JC Grame, whose influential playlists and breathless Instagram story-based blogging have helped establish “laptop twee” as a \u003cmark>nascent microgenre\u003c/mark>, sends me a voice message."},{"en":"portmanteau","zh":"混成词，即把两个词的声音和意义拼合为一个新词","source":"Weeks after the quiet launch of his dawk26 label (which is a portmanteau of “Digital Audio Workstation” and “rock”), he tells me that he and dawk26’s members are pacing around, plotting the future of twee from a dimly-lit kitchen if I’d like to join.","sourceHtml":"Weeks after the quiet launch of his dawk26 label (which is a \u003cmark>portmanteau\u003c/mark> of “Digital Audio Workstation” and “rock”), he tells me that he and dawk26’s members are pacing around, plotting the future of twee from a dimly-lit kitchen if I’d like to join."},{"en":"hop on a Zoom call","zh":"很快接入一场视频通话","source":"I would, and when I hop on a Zoom call, he’s sitting cross-legged in a circle with Mason Mann of Josephine’s Next Million Miles, River Everett (aka clust.r), and Brock Bierly of $quib.","sourceHtml":"I would, and when I \u003cmark>hop on a Zoom call\u003c/mark>, he’s sitting cross-legged in a circle with Mason Mann of Josephine’s Next Million Miles, River Everett (aka clust.r), and Brock Bierly of $quib."},{"en":"plot the future of","zh":"谋划……的未来","source":"Weeks after the quiet launch of his dawk26 label (which is a portmanteau of “Digital Audio Workstation” and “rock”), he tells me that he and dawk26’s members are pacing around, plotting the future of twee from a dimly-lit kitchen if I’d like to join.","sourceHtml":"Weeks after the quiet launch of his dawk26 label (which is a portmanteau of “Digital Audio Workstation” and “rock”), he tells me that he and dawk26’s members are pacing around, plotting the \u003cmark>future\u003c/mark> of twee from a dimly-lit kitchen if I’d like to join."},{"en":"revel in intimate, lo-fi compression","zh":"尽情享受亲密而低保真的压缩质感","source":"Many of the early bands associated with the “twee” tag—Rocketship, Beat Happening, The Magnetic Fields—reveled in intimate, lo-fi compression, at least partially because they were using the most affordable materials available in order to chase artistic ambitions beyond their means (and sometimes their musical abilities).","sourceHtml":"Many of the early bands associated with the “twee” tag—Rocketship, Beat Happening, The Magnetic Fields—\u003cmark>reveled in intimate, lo-fi compression\u003c/mark>, at least partially because they were using the most affordable materials available in order to chase artistic ambitions beyond their means (and sometimes their musical abilities)."},{"en":"chase artistic ambitions beyond one’s means","zh":"在自身财力所不及的情况下 追逐艺术抱负","source":"Many of the early bands associated with the “twee” tag—Rocketship, Beat Happening, The Magnetic Fields—reveled in intimate, lo-fi compression, at least partially because they were using the most affordable materials available in order to chase artistic ambitions beyond their means (and sometimes their musical abilities).","sourceHtml":"Many of the early bands associated with the “twee” tag—Rocketship, Beat Happening, The Magnetic Fields—reveled in intimate, lo-fi compression, at least partially because they were using the most affordable materials available in order to \u003cmark>chase artistic ambitions beyond their means\u003c/mark> (and sometimes their musical abilities)."},{"en":"carry the torch for analog warble","zh":"延续模拟录音摇晃不稳的声音传统","source":"While a new generation of lo-fi traditionalists like the excellent Touch Girl Apple Blossom and Good Flying Birds have carried the torch for analog warble, dawk26’s vision of laptop twee posits that cracked software and makeshift desktop studios are the contemporary equivalent to the cheap four-track in terms of accessibility.","sourceHtml":"While a new generation of lo-fi traditionalists like the excellent Touch Girl Apple Blossom and Good Flying Birds have \u003cmark>carried the torch for analog warble\u003c/mark>, dawk26’s vision of laptop twee posits that cracked software and makeshift desktop studios are the contemporary equivalent to the cheap four-track in terms of accessibility."},{"en":"posit that","zh":"提出并主张某一观点，常用于评论或论证性写作","source":"While a new generation of lo-fi traditionalists like the excellent Touch Girl Apple Blossom and Good Flying Birds have carried the torch for analog warble, dawk26’s vision of laptop twee posits that cracked software and makeshift desktop studios are the contemporary equivalent to the cheap four-track in terms of accessibility.","sourceHtml":"While a new generation of lo-fi traditionalists like the excellent Touch Girl Apple Blossom and Good Flying Birds have carried the torch for analog warble, dawk26’s vision of laptop twee \u003cmark>posits that\u003c/mark> cracked software and makeshift desktop studios are the contemporary equivalent to the cheap four-track in terms of accessibility."},{"en":"the contemporary equivalent to the cheap four-track","zh":"当代与廉价四轨录音机 功能地位相当的事物","source":"While a new generation of lo-fi traditionalists like the excellent Touch Girl Apple Blossom and Good Flying Birds have carried the torch for analog warble, dawk26’s vision of laptop twee posits that cracked software and makeshift desktop studios are the contemporary equivalent to the cheap four-track in terms of accessibility.","sourceHtml":"While a new generation of lo-fi traditionalists like the excellent Touch Girl Apple Blossom and Good Flying Birds have carried the torch for analog warble, dawk26’s vision of laptop twee posits that cracked software and makeshift desktop studios are the \u003cmark>contemporary\u003c/mark> \u003cmark>equivalent\u003c/mark> to the \u003cmark>cheap\u003c/mark> four-track in terms of accessibility."},{"en":"ricochet in all directions","zh":"向四面八方反弹","source":"Buckle Up, the debut album by Josephine’s Next Million Miles, for example, isn’t quite lo-fi: it’s crisp and dense with wriggles, bloops and clicks that are easily perceptible in the mix, ricocheting in all directions as songs fragment and go on strange tangents.","sourceHtml":"Buckle Up, the debut album by Josephine’s Next Million Miles, for example, isn’t quite lo-fi: it’s crisp and dense with wriggles, bloops and clicks that are easily perceptible in the mix, \u003cmark>ricocheting in all directions\u003c/mark> as songs fragment and go on strange tangents."},{"en":"go on strange tangents","zh":"突然偏离原本路线，转入奇怪的支线","source":"Buckle Up, the debut album by Josephine’s Next Million Miles, for example, isn’t quite lo-fi: it’s crisp and dense with wriggles, bloops and clicks that are easily perceptible in the mix, ricocheting in all directions as songs fragment and go on strange tangents.","sourceHtml":"Buckle Up, the debut album by Josephine’s Next Million Miles, for example, isn’t quite lo-fi: it’s crisp and dense with wriggles, bloops and clicks that are easily perceptible in the mix, ricocheting in all directions as songs fragment and \u003cmark>go on strange tangents\u003c/mark>."},{"en":"intimacy and interiority","zh":"亲密感与内在性","source":"“There’s a lot of intimacy and interiority,” Mann adds.","sourceHtml":"“There’s a lot of \u003cmark>intimacy and interiority\u003c/mark>,” Mann adds."},{"en":"fixate on the cute aesthetics","zh":"只盯着可爱美学不放、把注意力过度集中于其上","source":"“I think a lot of people fixate on the cute aesthetics of it.","sourceHtml":"“I think a lot of people \u003cmark>fixate on the cute aesthetics\u003c/mark> of it."},{"en":"foundational element","zh":"奠基性的核心元素，即一个风格成立所依靠的深层特征","source":"But I think, like, for almost all classic twee like The Field Mice or Beat Happening, the foundational element is a deep depression.","sourceHtml":"But I think, like, for almost all classic twee like The Field Mice or Beat Happening, the \u003cmark>foundational element\u003c/mark> is a deep depression."},{"en":"hysterical-realist novel of an album","zh":"一张像“歇斯底里现实主义小说”的专辑","source":"If folx, friends&’s sprawling, 112-track hysterical-realist novel of an album, is twee, Bierly says it’s because it fully embraces a willingness to be cringed at.","sourceHtml":"If folx, friends&amp;’s sprawling, 112-track \u003cmark>hysterical-realist novel of an album\u003c/mark>, is twee, Bierly says it’s because it fully embraces a willingness to be cringed at."},{"en":"a willingness to be cringed at","zh":"愿意承受别人替自己尴尬、觉得自己很“尬”","source":"If folx, friends&’s sprawling, 112-track hysterical-realist novel of an album, is twee, Bierly says it’s because it fully embraces a willingness to be cringed at.","sourceHtml":"If folx, friends&amp;’s sprawling, 112-track hysterical-realist novel of an album, is twee, Bierly says it’s because it fully embraces \u003cmark>a willingness to be cringed at\u003c/mark>."},{"en":"in the tradition of","zh":"延续……的创作传统、与……一脉相承","source":"In the tradition of the wordy and winkingly conceptual work by Elephant 6, and auteurs like of Montreal and The Olivia Tremor Control, it’s a manically assembled web of academic references, video game samples, and deconstructed folk-pop songs primed for a Millennial whoop.","sourceHtml":"\u003cmark>In the tradition of\u003c/mark> the wordy and winkingly conceptual work by Elephant 6, and auteurs like of Montreal and The Olivia Tremor Control, it’s a manically assembled web of academic references, video game samples, and deconstructed folk-pop songs primed for a Millennial whoop."},{"en":"a manically assembled web of","zh":"躁狂般拼装起来的一张……之网","source":"In the tradition of the wordy and winkingly conceptual work by Elephant 6, and auteurs like of Montreal and The Olivia Tremor Control, it’s a manically assembled web of academic references, video game samples, and deconstructed folk-pop songs primed for a Millennial whoop.","sourceHtml":"In the tradition of the wordy and winkingly conceptual work by Elephant 6, and auteurs like of Montreal and The Olivia Tremor Control, it’s a \u003cmark>manically assembled web of\u003c/mark> academic references, video game samples, and deconstructed folk-pop songs primed for a Millennial whoop."},{"en":"primed for a Millennial whoop","zh":"已蓄势准备引出一声“千禧一代欢呼”","source":"In the tradition of the wordy and winkingly conceptual work by Elephant 6, and auteurs like of Montreal and The Olivia Tremor Control, it’s a manically assembled web of academic references, video game samples, and deconstructed folk-pop songs primed for a Millennial whoop.","sourceHtml":"In the tradition of the wordy and winkingly conceptual work by Elephant 6, and auteurs like of Montreal and The Olivia Tremor Control, it’s a manically assembled web of academic references, video game samples, and deconstructed folk-pop songs \u003cmark>primed for a Millennial whoop\u003c/mark>."},{"en":"unabashedly dorky","zh":"毫不难为情地宅、笨拙而书呆子气","source":"It’s unabashedly dorky.","sourceHtml":"It’s \u003cmark>unabashedly dorky\u003c/mark>."},{"en":"hamartia","zh":"源自古希腊悲剧理论，通常指促使人物走向失败的判断失误或性格 缺陷","source":"“It’s hamartia,” Bierly says.","sourceHtml":"“It’s \u003cmark>hamartia\u003c/mark>,” Bierly says."},{"en":"miss the foundational part of twee","zh":"没有抓住这一流派的根基","source":"“A lot of bands miss the foundational part of twee, which is the willingness to be embarrassing,” says Mann.","sourceHtml":"“A lot of bands \u003cmark>miss the foundational part of twee\u003c/mark>, which is the willingness to be embarrassing,” says Mann."},{"en":"the willingness to be embarrassing","zh":"愿意让自己显得尴尬","source":"“A lot of bands miss the foundational part of twee, which is the willingness to be embarrassing,” says Mann.","sourceHtml":"“A lot of bands miss the foundational part of twee, which is the \u003cmark>willingness\u003c/mark> to be \u003cmark>embarrassing\u003c/mark>,” says Mann."},{"en":"while on a store run","zh":"趁出门去商店快速采购时","source":"“Karen Carpenter was a good Femcel,” Rowan Miles tells me over the phone while on a store run, sending a photo of a squeeze bottle of some sort of liquid candy called Souracha.","sourceHtml":"“Karen Carpenter was a good Femcel,” Rowan Miles tells me \u003cmark>over the phone while on a store run\u003c/mark>, sending a photo of a squeeze bottle of some sort of liquid candy called Souracha."},{"en":"What’s the bit?","zh":"“那一段怎么说来着？","source":"“What’s the bit? ‘What do you get when you kiss a guy?","sourceHtml":"“\u003cmark>What’s\u003c/mark> the \u003cmark>bit\u003c/mark>? ‘\u003cmark>What\u003c/mark> do you get when you kiss a guy?"},{"en":"shape the aesthetic of","zh":"塑造……的整体美学，不仅包括音乐，也可涵盖封面、 影像、服装和作品的概念呈现","source":"Miles had a major role in shaping the aesthetic of two of this year’s best twee albums, both as one-half of London pop duo The Femcels and as the Nico stand-in on Worldpeace DMT’s The Velvet Underground & Rowan.","sourceHtml":"Miles had a major role in \u003cmark>shaping the aesthetic of\u003c/mark> two of this year’s best twee albums, both as one-half of London pop duo The Femcels and as the Nico stand-in on Worldpeace DMT’s The Velvet Underground &amp; Rowan."},{"en":"the Nico stand-in","zh":"替代某位经典成员、占据相似位置的人","source":"Miles had a major role in shaping the aesthetic of two of this year’s best twee albums, both as one-half of London pop duo The Femcels and as the Nico stand-in on Worldpeace DMT’s The Velvet Underground & Rowan.","sourceHtml":"Miles had a major role in shaping the aesthetic of two of this year’s best twee albums, both as one-half of London pop duo The Femcels and as \u003cmark>the Nico stand-in\u003c/mark> on Worldpeace DMT’s The Velvet Underground &amp; Rowan."},{"en":"bridge two eras defined by optimistic technological leaps","zh":"跨接两个由乐观技术 飞跃定义的时代：一个是六十年代的录音室实验，另一个是博客年代的笔记本电脑制作","source":"On each record, Miles-and-company bridge two eras defined by optimistic technological leaps, finding common ground between the crafty, MacBook-assisted pop of blog-era acts like Matt & Kim and the psychedelic maximalism of ‘60s artists exploring the capabilities of the LP.","sourceHtml":"On each record, Miles-and-company \u003cmark>bridge two eras defined by optimistic technological leaps\u003c/mark>, finding common ground between the crafty, MacBook-assisted pop of blog-era acts like Matt &amp; Kim and the psychedelic maximalism of ‘60s artists exploring the capabilities of the LP."},{"en":"free-associative bursts","zh":"自由联想式的短促爆发","source":"Sequenced in short, free-associative bursts that recall The White Album, the records revel in the quirky tension that forms when organic sounds brush up against silicone textures.","sourceHtml":"Sequenced in short, \u003cmark>free-associative bursts\u003c/mark> that recall The White Album, the records revel in the quirky tension that forms when organic sounds brush up against silicone textures."},{"en":"revel in the quirky tension","zh":"尽情享受那种古怪的张力","source":"Sequenced in short, free-associative bursts that recall The White Album, the records revel in the quirky tension that forms when organic sounds brush up against silicone textures.","sourceHtml":"Sequenced in short, free-associative bursts that recall The White Album, the records \u003cmark>revel in the quirky tension\u003c/mark> that forms when organic sounds brush up against silicone textures."},{"en":"brush up against","zh":"与……擦碰、紧贴在一起","source":"Sequenced in short, free-associative bursts that recall The White Album, the records revel in the quirky tension that forms when organic sounds brush up against silicone textures.","sourceHtml":"Sequenced in short, free-associative bursts that recall The White Album, the records revel in the quirky tension that forms when organic sounds \u003cmark>brush up against\u003c/mark> silicone textures."},{"en":"unvarnished waveforms","zh":"未加修饰、未经抛光的电子波形","source":"Unvarnished waveforms buzz out from behind acoustic chords like a colony of bees.","sourceHtml":"\u003cmark>Unvarnished waveforms\u003c/mark> buzz out from behind acoustic chords like a colony of bees."},{"en":"pay homage to the classics","zh":"向经典致敬","source":"As the Femcels’ and Worldpeace DMT’s rock canon-referencing album covers suggest, each project is about paying homage to the classics with the tools most accessible to them.","sourceHtml":"As the Femcels’ and Worldpeace DMT’s rock canon-referencing album covers suggest, each project is about \u003cmark>paying homage to the classics\u003c/mark> with the tools most accessible to them."},{"en":"a Mod-gone-kawaii homage to","zh":"一次“从 变成 ”的致敬","source":"“I’m basically a Beatles historian,” Miles says of the cover art for The Femcels’ I Have to Get Hotter, which is a Mod-gone-kawaii homage to Sgt.","sourceHtml":"“I’m basically a Beatles historian,” Miles says of the cover art for The Femcels’ I Have to Get Hotter, which is a \u003cmark>Mod-gone-kawaii homage to\u003c/mark> Sgt."},{"en":"affinity for cute, collaged artistry","zh":"对可爱拼贴式艺术有天然亲近感","source":"Smaller ‘60s girl bands like The Feminine Complex and The GTOs.” Much of the Femcels’ affinity for cute, collaged artistry also stems from Miles’s childhood, looking up to her older sister.","sourceHtml":"Smaller ‘60s girl bands like The Feminine Complex and The GTOs.” Much of the Femcels’ \u003cmark>affinity for cute, collaged artistry\u003c/mark> also stems from Miles’s childhood, looking up to her older sister."},{"en":"stem from","zh":"源自、由……产生，常用来交代某种倾向的深层来源","source":"Smaller ‘60s girl bands like The Feminine Complex and The GTOs.” Much of the Femcels’ affinity for cute, collaged artistry also stems from Miles’s childhood, looking up to her older sister.","sourceHtml":"Smaller ‘60s girl bands like The Feminine Complex and The GTOs.” Much of the Femcels’ affinity for cute, collaged artistry also \u003cmark>stems from\u003c/mark> Miles’s childhood, looking up to her older sister."},{"en":"look up to","zh":"仰慕、敬佩并把某人当作榜样","source":"Smaller ‘60s girl bands like The Feminine Complex and The GTOs.” Much of the Femcels’ affinity for cute, collaged artistry also stems from Miles’s childhood, looking up to her older sister.","sourceHtml":"Smaller ‘60s girl bands like The Feminine Complex and The GTOs.” Much of the Femcels’ affinity for cute, collaged artistry also stems from Miles’s childhood, \u003cmark>looking up to\u003c/mark> her older sister."},{"en":"theatrical new material","zh":"带有戏剧化、舞台化特征的新作品","source":"Presently, she’s working on theatrical new material with Worldpeace DMT’s Leo Fincham.","sourceHtml":"Presently, she’s working on \u003cmark>theatrical new material\u003c/mark> with Worldpeace DMT’s Leo Fincham."},{"en":"it’d be sick","zh":"那会非常酷、非常棒","source":"I think The Femcels could make their own version of those and it’d be sick.”","sourceHtml":"I think The Femcels could make their own version of those and \u003cmark>it’d be sick\u003c/mark>.”"},{"en":"sparky guitar pop","zh":"活泼、明亮、迸发火花般的吉他流行","source":"When Katryn and Ryan Stanley started making music as Sugar World in the late 2010s, their early recordings resembled the kind of sparky guitar pop you’d find on a Sarah Records compilation, with echoing lead riffs and gentle drum machine loops behind boy-girl harmonies.","sourceHtml":"When Katryn and Ryan Stanley started making music as Sugar World in the late 2010s, their early recordings resembled the kind of \u003cmark>sparky guitar pop\u003c/mark> you’d find on a Sarah Records compilation, with echoing lead riffs and gentle drum machine loops behind boy-girl harmonies."},{"en":"harder-hitting electronic music","zh":"冲击力更强、更重击的电子音乐，通常意味 更有攻击性的鼓组、低频、响度或失真","source":"Since the release of their debut LP, Lost & Found, however, they’ve gradually brought more and more influence from harder-hitting electronic music.","sourceHtml":"Since the release of their debut LP, Lost &amp; Found, however, they’ve gradually brought more and more influence from \u003cmark>harder-hitting electronic music\u003c/mark>."},{"en":"the secret world of bedroom pop","zh":"卧室流行音乐的隐秘小世界","source":"While that album’s final track brought SOPHIE’s proto-hyperpop classic “B Who I Want 2 B” into the secret world of bedroom pop, the singles leading up to Sugar World’s sophomore album, supercassettevision, have taken the inverse approach.","sourceHtml":"While that album’s final track brought SOPHIE’s proto-hyperpop classic “B Who I Want 2 B” into \u003cmark>the secret world of bedroom pop\u003c/mark>, the singles leading up to Sugar World’s sophomore album, supercassettevision, have taken the inverse approach."},{"en":"take the inverse approach","zh":"采取恰好相反的路径","source":"While that album’s final track brought SOPHIE’s proto-hyperpop classic “B Who I Want 2 B” into the secret world of bedroom pop, the singles leading up to Sugar World’s sophomore album, supercassettevision, have taken the inverse approach.","sourceHtml":"While that album’s final track brought SOPHIE’s proto-hyperpop classic “B Who I Want 2 B” into the secret world of bedroom pop, the singles leading up to Sugar World’s sophomore album, supercassettevision, have \u003cmark>taken the inverse approach\u003c/mark>."},{"en":"scuzzy sweetness","zh":"脏乱粗粝的甜美感","source":"With the scuzzy sweetness of twee punk bands like Tiger Trap and Henry’s Dress still at the center of their songcraft, their new music is glitchy and powerful, powered by clubby drum breaks and heaps of digital distortion.","sourceHtml":"With the \u003cmark>scuzzy sweetness\u003c/mark> of twee punk bands like Tiger Trap and Henry’s Dress still at the center of their songcraft, their new music is glitchy and powerful, powered by clubby drum breaks and heaps of digital distortion."},{"en":"clubby drum breaks","zh":"很有俱乐部音乐气息的碎拍段落","source":"With the scuzzy sweetness of twee punk bands like Tiger Trap and Henry’s Dress still at the center of their songcraft, their new music is glitchy and powerful, powered by clubby drum breaks and heaps of digital distortion.","sourceHtml":"With the scuzzy sweetness of twee punk bands like Tiger Trap and Henry’s Dress still at the center of their songcraft, their new music is glitchy and powerful, powered by \u003cmark>clubby\u003c/mark> \u003cmark>drum\u003c/mark> \u003cmark>breaks\u003c/mark> and heaps of digital distortion."},{"en":"push the limits of distortion","zh":"把失真的极限继续向外推","source":"“For me, it’s a lot of stuff happening in underground rap, where there are a lot of self-produced artists who do things that push the limits of distortion.","sourceHtml":"“For me, it’s a lot of stuff happening in underground rap, where there are a lot of self-produced artists who do things that \u003cmark>push the limits of distortion\u003c/mark>."},{"en":"flat","zh":"此处主要形容声音动态被强烈压缩或削顶后，波形和听感都趋于“扁平”","source":"Making stuff that’s really loud or flat or bitcrushed.”","sourceHtml":"Making stuff that’s really loud or \u003cmark>flat\u003c/mark> or bitcrushed.”"},{"en":"bitcrushed","zh":"经过位深压缩处理的","source":"Making stuff that’s really loud or flat or bitcrushed.”","sourceHtml":"Making stuff that’s really loud or flat or \u003cmark>bitcrushed\u003c/mark>.”"},{"en":"a loose through line of technology","zh":"一条以技术为主题、较为松散的贯穿线索","source":"“Lyrically, there’s also kind of a loose through line of technology,” Katryn adds.","sourceHtml":"“Lyrically, there’s also kind of \u003cmark>a loose through line of technology\u003c/mark>,” Katryn adds."},{"en":"open one’s horizons","zh":"拓宽眼界或创作边界","source":"We used to do more breakup songs or love songs, but now we’re opening our horizons.”","sourceHtml":"We used to do more breakup songs or love songs, but now we’re \u003cmark>opening our horizons\u003c/mark>.”"},{"en":"strains of twee","zh":"某一流派的不同支系或变种","source":"Multiple strains of twee have also crossed over into emo’s underground.","sourceHtml":"Multiple \u003cmark>strains of twee\u003c/mark> have also crossed over into emo’s underground."},{"en":"cross over into emo’s underground","zh":"跨界进入另一流派的地下场景","source":"Multiple strains of twee have also crossed over into emo’s underground.","sourceHtml":"Multiple strains of twee have also \u003cmark>crossed over into emo’s underground\u003c/mark>."},{"en":"blunt the aggression of cathartic post-hardcore songwriting","zh":"削钝宣泄型 后硬核创作的攻击性","source":"The wave of bedroom screamo artists that emerged in the early 2020s, which included bands like Your Arms Are My Cocoon and Calendar Year, blunted the aggression of cathartic post-hardcore songwriting with low-pass filters and cuddly lo-fi arrangements that weren’t far off from what you’d hear on an ear record today.","sourceHtml":"The wave of bedroom screamo artists that emerged in the early 2020s, which included bands like Your Arms Are My Cocoon and Calendar Year, \u003cmark>blunted the aggression of cathartic post-hardcore songwriting\u003c/mark> with low-pass filters and cuddly lo-fi arrangements that weren’t far off from what you’d hear on an ear record today."},{"en":"cuddly lo-fi arrangements","zh":"让人想要拥抱的低保真编曲","source":"The wave of bedroom screamo artists that emerged in the early 2020s, which included bands like Your Arms Are My Cocoon and Calendar Year, blunted the aggression of cathartic post-hardcore songwriting with low-pass filters and cuddly lo-fi arrangements that weren’t far off from what you’d hear on an ear record today.","sourceHtml":"The wave of bedroom screamo artists that emerged in the early 2020s, which included bands like Your Arms Are My Cocoon and Calendar Year, blunted the aggression of cathartic post-hardcore songwriting with low-pass filters and \u003cmark>cuddly lo-fi arrangements\u003c/mark> that weren’t far off from what you’d hear on an ear record today."},{"en":"detours into hoarse shrieking and clicky hi-hats","zh":"偶尔绕入沙哑尖叫和清脆 踩镲的岔路","source":"While the occasional detours into hoarse shrieking and clicky hi-hats are clear cues from Your Arms Are My Cocoon’s playbook, Zeke Reiss’s work as b7lanket puts a kinder, gentler spin on the bedroom skramz playlist, decorating his tracks with cute, pitched-up vocals and creaky synths that sound like they’re leaking from toys with dying batteries.","sourceHtml":"While the occasional \u003cmark>detours into hoarse shrieking and clicky hi-hats\u003c/mark> are clear cues from Your Arms Are My Cocoon’s playbook, Zeke Reiss’s work as b7lanket puts a kinder, gentler spin on the bedroom skramz playlist, decorating his tracks with cute, pitched-up vocals and creaky synths that sound like they’re leaking from toys with dying batteries."},{"en":"put a kinder, gentler spin on","zh":"给……一种更温和、更友善的新诠释","source":"While the occasional detours into hoarse shrieking and clicky hi-hats are clear cues from Your Arms Are My Cocoon’s playbook, Zeke Reiss’s work as b7lanket puts a kinder, gentler spin on the bedroom skramz playlist, decorating his tracks with cute, pitched-up vocals and creaky synths that sound like they’re leaking from toys with dying batteries.","sourceHtml":"While the occasional detours into hoarse shrieking and clicky hi-hats are clear cues from Your Arms Are My Cocoon’s playbook, Zeke Reiss’s work as b7lanket \u003cmark>puts a kinder, gentler spin on\u003c/mark> the bedroom skramz playlist, decorating his tracks with cute, pitched-up vocals and creaky synths that sound like they’re leaking from toys with dying batteries."},{"en":"leak from toys with dying batteries","zh":"像从电池快耗尽的玩具中漏出来","source":"While the occasional detours into hoarse shrieking and clicky hi-hats are clear cues from Your Arms Are My Cocoon’s playbook, Zeke Reiss’s work as b7lanket puts a kinder, gentler spin on the bedroom skramz playlist, decorating his tracks with cute, pitched-up vocals and creaky synths that sound like they’re leaking from toys with dying batteries.","sourceHtml":"While the occasional detours into hoarse shrieking and clicky hi-hats are clear cues from Your Arms Are My Cocoon’s playbook, Zeke Reiss’s work as b7lanket puts a kinder, gentler spin on the bedroom skramz playlist, decorating his tracks with cute, pitched-up vocals and creaky synths that sound like they’re \u003cmark>leaking from toys with dying batteries\u003c/mark>."},{"en":"a piercing coat of low-bit distortion","zh":"一层尖锐刺耳的低位深失真","source":"The piercing coat of low-bit distortion coating his 2025 frogtopia EP sometimes reminds me of the squelchy textures of Animal Collective’s Danse Manatee filtered through the lens of pop music: it’s a bit uncanny, but quite cute.","sourceHtml":"The \u003cmark>piercing coat of low-bit distortion\u003c/mark> coating his 2025 frogtopia EP sometimes reminds me of the squelchy textures of Animal Collective’s Danse Manatee filtered through the lens of pop music: it’s a bit uncanny, but quite cute."},{"en":"squelchy textures","zh":"湿黏、挤压、咕叽作响的声音肌理","source":"The piercing coat of low-bit distortion coating his 2025 frogtopia EP sometimes reminds me of the squelchy textures of Animal Collective’s Danse Manatee filtered through the lens of pop music: it’s a bit uncanny, but quite cute.","sourceHtml":"The piercing coat of low-bit distortion coating his 2025 frogtopia EP sometimes reminds me of the \u003cmark>squelchy textures\u003c/mark> of Animal Collective’s Danse Manatee filtered through the lens of pop music: it’s a bit uncanny, but quite cute."},{"en":"filtered through the lens of pop music","zh":"经过流行音乐视角的过滤","source":"The piercing coat of low-bit distortion coating his 2025 frogtopia EP sometimes reminds me of the squelchy textures of Animal Collective’s Danse Manatee filtered through the lens of pop music: it’s a bit uncanny, but quite cute.","sourceHtml":"The piercing coat of low-bit distortion coating his 2025 frogtopia EP sometimes reminds me of the squelchy textures of Animal Collective’s Danse Manatee \u003cmark>filtered through the lens of pop music\u003c/mark>: it’s a bit uncanny, but quite cute."},{"en":"Gen Z touchstones","zh":"年轻一代具有代表性的文化参照物","source":"Reiss says his friends have often compared his music to 3DS games and the Adventure Time scores, but neither of these Gen Z touchstones were a part of his childhood.","sourceHtml":"Reiss says his friends have often compared his music to 3DS games and the Adventure Time scores, but neither of these \u003cmark>Gen Z touchstones\u003c/mark> were a part of his childhood."},{"en":"be shaped by a scene and someone’s artistry","zh":"受到某个音乐场景与个人艺术实践 的共同塑造","source":"The aesthetic of b7lanket is predominantly shaped by the bedroom skramz scene and his mom’s artistry: “She writes picture books, so I think I grew up with a big appreciation for that illustration style,” Reiss says.","sourceHtml":"The aesthetic of b7lanket is predominantly \u003cmark>shaped by the bedroom skramz scene and his mom’s artistry\u003c/mark>: “She writes picture books, so I think I grew up with a big appreciation for that illustration style,” Reiss says."},{"en":"collage from old picture books","zh":"利用旧绘本中的素材进行拼贴","source":"“She also runs a craft blog…I love to collage from old picture books from the thrift store and make stop motion videos with recycled cardboard, fabric, and buttons.”","sourceHtml":"“She also runs a craft blog…I love to \u003cmark>collage\u003c/mark> from \u003cmark>old\u003c/mark> \u003cmark>picture\u003c/mark> \u003cmark>books\u003c/mark> from the thrift store and make stop motion videos with recycled cardboard, fabric, and buttons.”"},{"en":"the resurgence of interest in","zh":"对……的兴趣重新兴起","source":"2025 also saw the resurgence of interest in the softer, hookier, and more band-centric ethos of second wave emo, perhaps as a reaction to both the DAW-assisted genre chaos of fifth wave emo and aggression of heavy movements like deathcore.","sourceHtml":"2025 also saw \u003cmark>the resurgence of interest in\u003c/mark> the softer, hookier, and more band-centric ethos of second wave emo, perhaps as a reaction to both the DAW-assisted genre chaos of fifth wave emo and aggression of heavy movements like deathcore."},{"en":"band-centric ethos","zh":"以乐队为中心的创作理念，重视成员之间的现场演奏、 吉他—贝斯—鼓结构和合奏感，与电脑内高度碎片化的制作形成对照","source":"2025 also saw the resurgence of interest in the softer, hookier, and more band-centric ethos of second wave emo, perhaps as a reaction to both the DAW-assisted genre chaos of fifth wave emo and aggression of heavy movements like deathcore.","sourceHtml":"2025 also saw the resurgence of interest in the softer, hookier, and more band-centric \u003cmark>ethos\u003c/mark> of second wave emo, perhaps as a reaction to both the DAW-assisted genre chaos of fifth wave emo and aggression of heavy movements like deathcore."},{"en":"genre chaos","zh":"流派混沌","source":"2025 also saw the resurgence of interest in the softer, hookier, and more band-centric ethos of second wave emo, perhaps as a reaction to both the DAW-assisted genre chaos of fifth wave emo and aggression of heavy movements like deathcore.","sourceHtml":"2025 also saw the resurgence of interest in the softer, hookier, and more band-centric ethos of second wave emo, perhaps as a reaction to both the DAW-assisted \u003cmark>genre chaos\u003c/mark> of fifth wave emo and aggression of heavy movements like deathcore."},{"en":"warm arpeggios","zh":"温暖的琶音，即和弦音被依次拨响所形成的柔和、流动的吉他 织体","source":"Tweemo bands like California’s First Day Back, Washington’s Mini Golf Water Feature, and Texas’s My Point of You express a tenderness that’s not unlike b7lanket’s, but do so through the warm arpeggios of early Promise Ring and the gentle ache of Go Sailor.","sourceHtml":"Tweemo bands like California’s First Day Back, Washington’s Mini Golf Water Feature, and Texas’s My Point of You express a tenderness that’s not unlike b7lanket’s, but do so through the \u003cmark>warm arpeggios\u003c/mark> of early Promise Ring and the gentle ache of Go Sailor."},{"en":"gentle ache","zh":"轻柔的隐痛","source":"Tweemo bands like California’s First Day Back, Washington’s Mini Golf Water Feature, and Texas’s My Point of You express a tenderness that’s not unlike b7lanket’s, but do so through the warm arpeggios of early Promise Ring and the gentle ache of Go Sailor.","sourceHtml":"Tweemo bands like California’s First Day Back, Washington’s Mini Golf Water Feature, and Texas’s My Point of You express a tenderness that’s not unlike b7lanket’s, but do so through the warm arpeggios of early Promise Ring and the \u003cmark>gentle ache\u003c/mark> of Go Sailor."},{"en":"scream-centric music","zh":"以嘶吼为重心的音乐","source":"“I think the interest in softer music comes from people being tired of scream-centric music,” says My Point of You’s Frida Valenzuela.","sourceHtml":"“I think the interest in softer music comes from people being tired of \u003cmark>scream-centric music\u003c/mark>,” says My Point of You’s Frida Valenzuela."},{"en":"come in waves","zh":"一波一波地出现，形容潮流并非线性更替，而是周期性涌现","source":"“Everything comes in waves, and it’s just about time this comes back around.","sourceHtml":"“Everything \u003cmark>comes in waves\u003c/mark>, and it’s just about time this comes back around."},{"en":"come back around","zh":"转一圈后重新回来、再次流行","source":"“Everything comes in waves, and it’s just about time this comes back around.","sourceHtml":"“Everything comes in waves, and it’s just about time this \u003cmark>comes back around\u003c/mark>."},{"en":"sounds are cyclical","zh":"声音与风格会周期性回归","source":"But even if sounds are cyclical, it’s the emotional core of twee that’s kept the movement alive for the past four decades.","sourceHtml":"But even if \u003cmark>sounds are cyclical\u003c/mark>, it’s the emotional core of twee that’s kept the movement alive for the past four decades."},{"en":"the emotional core of twee","zh":"某一流派的情感核心，指亲密、温柔、孤独和不怕暴露 脆弱的共同精神，而不是开衫、磁带或合成器等表面符号","source":"But even if sounds are cyclical, it’s the emotional core of twee that’s kept the movement alive for the past four decades.","sourceHtml":"But even if sounds are cyclical, it’s \u003cmark>the emotional core of twee\u003c/mark> that’s kept the movement alive for the past four decades."},{"en":"bare one’s soul with pride","zh":"骄傲地袒露灵魂，毫不遮掩地表达最私密、脆弱的 感受","source":"Whether it’s analog or digital, expressing one’s tenderness or cringiest impulses, it’s the willingness to bare one’s soul with pride, especially if the result is embarrassing or dorky, that makes twee feel timelessly powerful.","sourceHtml":"Whether it’s analog or digital, expressing one’s tenderness or cringiest impulses, it’s \u003cmark>the willingness to bare one’s soul with pride\u003c/mark>, especially if the result is embarrassing or dorky, that makes twee feel timelessly powerful."},{"en":"timelessly powerful","zh":"拥有不受时代限制的力量","source":"Whether it’s analog or digital, expressing one’s tenderness or cringiest impulses, it’s the willingness to bare one’s soul with pride, especially if the result is embarrassing or dorky, that makes twee feel timelessly powerful.","sourceHtml":"Whether it’s analog or digital, expressing one’s tenderness or cringiest impulses, it’s the willingness to bare one’s soul with pride, especially if the result is embarrassing or dorky, that makes twee feel \u003cmark>timelessly powerful\u003c/mark>."},{"en":"isolating and individualizing","zh":"使人孤立，并把人拆分成各自为单位的个体","source":"“The world as a whole and the digital world especially can feel super isolating and individualizing,” says Reiss.","sourceHtml":"“The world as a whole and the digital world especially can feel super \u003cmark>isolating and individualizing\u003c/mark>,” says Reiss."},{"en":"build a sense of intimacy, love, and joy out of an online perspective","zh":"从线上 生活的视角与材料中，建造亲密、爱和喜悦","source":"“I think people are excited to find a style of music that tries to build a sense of intimacy, love, and joy out of an online perspective that can bring us together with a collective hope for the future.”","sourceHtml":"“I think people are excited to find a style of music that tries to \u003cmark>build a sense of intimacy, love, and joy out of an online perspective\u003c/mark> that can bring us together with a collective hope for the future.”"},{"en":"a collective hope for the future","zh":"对未来共有的、集体性的希望","source":"“I think people are excited to find a style of music that tries to build a sense of intimacy, love, and joy out of an online perspective that can bring us together with a collective hope for the future.”","sourceHtml":"“I think people are excited to find a style of music that tries to build a sense of intimacy, love, and joy out of an online perspective that can bring us together with \u003cmark>a collective hope for the future\u003c/mark>.”"}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
