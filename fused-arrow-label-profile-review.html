bout his high level of organization and how easy he is to work with, citing his willingness to \u003cmark>follow their creative curiosity\u003c/mark>."},{"en":"draw on those skills","zh":"调用、运用已有技能来处理新的任务","source":"Fusaro’s day job is in operations, and he is able to draw on those skills in his work with the label, making incredibly detailed spreadsheets for every Fused Arrow release.","sourceHtml":"Fusaro’s day job is in operations, and he is able to \u003cmark>draw on those skills\u003c/mark> in his work with the label, making incredibly detailed spreadsheets for every Fused Arrow release."},{"en":"an impressive, ever-growing catalogue","zh":"令人瞩目且持续扩大的作品目录","source":"Here are a few highlights from Fused Arrow’s impressive, ever-growing catalogue.","sourceHtml":"Here are a few highlights from Fused Arrow’s \u003cmark>impressive, ever-growing catalogue\u003c/mark>."},{"en":"we work on really dope shit over here","zh":"“我们这里做的东西真的很棒”","source":"As Fusaro puts it, “Most people do not know me to be a cocky guy, but we work on really dope shit over here.”","sourceHtml":"As Fusaro puts it, “Most people do not know me to be a cocky guy, but \u003cmark>we work on really dope shit over here\u003c/mark>.”"},{"en":"come back online after a shutdown","zh":"在停摆后逐渐恢复运作","source":"Cargo Cults, the duo of Alaska and Zilla Rocca, started work on Kingdom Music for the Hard Rocks in 2022, as the world began to slowly come back online after the shock and shutdown of Covid-19.","sourceHtml":"Cargo Cults, the duo of Alaska and Zilla Rocca, started work on Kingdom Music for the Hard Rocks in 2022, as the world began to slowly \u003cmark>come back online after the shock and shutdown of Covid-19\u003c/mark>."},{"en":"a time of reflection","zh":"一段回顾经历、重新思考生活的时期","source":"“It was a time of reflection,” Alaska says.","sourceHtml":"“It was a \u003cmark>time\u003c/mark> of \u003cmark>reflection\u003c/mark>,” Alaska says."},{"en":"wrestle with ideas of one’s mortality","zh":"艰难面对、反复思考自己终将死亡这件事","source":"“I had a few friends that passed away from brain aneurysms or heart issues, and both Zilla and I are getting to the age where you start wrestling with these ideas of your mortality.” Alaska is in his 50s, and there aren’t too many rap records that specifically deal with what life feels like for someone solidly in middle age.","sourceHtml":"“I had a few friends that passed away from brain aneurysms or heart issues, and both Zilla and I are \u003cmark>getting to the age where you start wrestling with these ideas of your mortality\u003c/mark>.” Alaska is in his 50s, and there aren’t too many rap records that specifically deal with what life feels like for someone solidly in middle age."},{"en":"solidly in middle age","zh":"明确、实实在在地处于中年，而不是刚刚接近这个阶段","source":"“I had a few friends that passed away from brain aneurysms or heart issues, and both Zilla and I are getting to the age where you start wrestling with these ideas of your mortality.” Alaska is in his 50s, and there aren’t too many rap records that specifically deal with what life feels like for someone solidly in middle age.","sourceHtml":"“I had a few friends that passed away from brain aneurysms or heart issues, and both Zilla and I are getting to the age where you start wrestling with these ideas of your mortality.” Alaska is in his 50s, and there aren’t too many rap records that specifically deal with what life feels like for someone \u003cmark>solidly in middle age\u003c/mark>."},{"en":"for all its sober assessments","zh":"尽管作品进行了许多严肃、不加美化的审视","source":"But for all its sober assessments, Kingdom is still a lot of fun.","sourceHtml":"But \u003cmark>for all its sober assessments\u003c/mark>, Kingdom is still a lot of fun."},{"en":"harken back to formative sounds","zh":"让人回想起奠定某种风格基础的早期声音","source":"Zilla’s production harkens back to the formative sounds of late ‘80s and early ‘90s hip-hop, and Alaska revels in the wizened shit talk that comes with age, sounding happy to be alive, and happy to be making music.","sourceHtml":"Zilla’s production \u003cmark>harkens back to the formative sounds of late ‘80s and early ‘90s hip-hop\u003c/mark>, and Alaska revels in the wizened shit talk that comes with age, sounding happy to be alive, and happy to be making music."},{"en":"revel in the wizened shit talk that comes with age","zh":"尽情享受由年龄和阅历赋予的老练吹嘘与挖苦","source":"Zilla’s production harkens back to the formative sounds of late ‘80s and early ‘90s hip-hop, and Alaska revels in the wizened shit talk that comes with age, sounding happy to be alive, and happy to be making music.","sourceHtml":"Zilla’s production harkens back to the formative sounds of late ‘80s and early ‘90s hip-hop, and Alaska \u003cmark>revels in the wizened shit talk that comes with age\u003c/mark>, sounding happy to be alive, and happy to be making music."},{"en":"the second outing from two artists","zh":"两位艺术家的第二次合作成果","source":"This is the second outing from Alaska and Steel Tipped Dove, the first being The Structural Dynamics of Flow, which was Fused Arrow’s third release.","sourceHtml":"This is \u003cmark>the second outing from Alaska and Steel Tipped Dove\u003c/mark>, the first being The Structural Dynamics of Flow, which was Fused Arrow’s third release."},{"en":"have excellent chemistry","zh":"两位合作者之间拥有自然、互相激发的默契","source":"As on Structural Dynamics, the two have excellent chemistry, with Dove providing warm, atmospheric beats that Alaska sinks into.","sourceHtml":"As on Structural Dynamics, the two have \u003cmark>excellent chemistry\u003c/mark>, with Dove providing warm, atmospheric beats that Alaska sinks into."},{"en":"warm, atmospheric beats that someone sinks into","zh":"温暖且有空间氛围的节拍，让说唱者的声音舒适地嵌入其中","source":"As on Structural Dynamics, the two have excellent chemistry, with Dove providing warm, atmospheric beats that Alaska sinks into.","sourceHtml":"As on Structural Dynamics, the two have excellent chemistry, with Dove providing \u003cmark>warm, atmospheric beats that Alaska sinks into\u003c/mark>."},{"en":"the encroaching realities of life’s end","zh":"人生终点逐步迫近、越来越无法忽视的现实","source":"Much like the Cargo Cults album, Reverberations deals with aging and all of the things that come with it: recovered memories, the deaths of friends, the encroaching realities of life’s end, and a real concern for future generations.","sourceHtml":"Much like the Cargo Cults album, Reverberations deals with aging and all of the things that come with it: recovered memories, the deaths of friends, \u003cmark>the encroaching realities of life’s end\u003c/mark>, and a real concern for future generations."},{"en":"a keen observer of the world","zh":"对世界观察敏锐的人","source":"Alaska’s a keen observer of the world, as well as being continuously inquisitive of his own life and experiences.","sourceHtml":"Alaska’s \u003cmark>a keen observer of the world\u003c/mark>, as well as being continuously inquisitive of his own life and experiences."},{"en":"be continuously inquisitive of one’s own life","zh":"对自己的生活持续抱有探究欲，不把既有解释视为定论","source":"Alaska’s a keen observer of the world, as well as being continuously inquisitive of his own life and experiences.","sourceHtml":"Alaska’s a keen observer of the world, as well as being \u003cmark>continuously inquisitive of his own life and experiences\u003c/mark>."},{"en":"be steeped in dread","zh":"完全浸透在恐惧、忧虑的氛围中","source":"The world can be a bleak place, and Another Planet, the duo of New York rappers phiik and Lungs, are steeped in that dread.","sourceHtml":"The world can be a bleak place, and Another Planet, the duo of New York rappers phiik and Lungs, are \u003cmark>steeped in that dread\u003c/mark>."},{"en":"wild-eyed paranoiacs connecting a wall of photos with red string","zh":"瞪眼的偏执狂用红线串联照片","source":"Both rap like wild-eyed paranoiacs connecting a wall of photos with red string, Lungs unspooling furious punctuation-free run-on sentences and phiik bobbing and weaving like Gyaraga blasting alien ships.","sourceHtml":"Both rap like \u003cmark>wild-eyed paranoiacs connecting a wall of photos with red string\u003c/mark>, Lungs unspooling furious punctuation-free run-on sentences and phiik bobbing and weaving like Gyaraga blasting alien ships."},{"en":"unspool punctuation-free run-on sentences","zh":"像放开线轴一样倾泻没有标点的超长句","source":"Both rap like wild-eyed paranoiacs connecting a wall of photos with red string, Lungs unspooling furious punctuation-free run-on sentences and phiik bobbing and weaving like Gyaraga blasting alien ships.","sourceHtml":"Both rap like wild-eyed paranoiacs connecting a wall of photos with red string, Lungs \u003cmark>unspooling furious punctuation-free run-on sentences\u003c/mark> and phiik bobbing and weaving like Gyaraga blasting alien ships."},{"en":"bob and weave","zh":"左右闪躲、灵活穿行，原本常形容拳击步法","source":"The world can be a bleak place, and Another Planet, the duo of New York rappers phiik and Lungs, are steeped in that dread.","sourceHtml":"The world can be a bleak place, and Another Planet, the duo of New York rappers phiik and Lungs, are steeped in that dread."},{"en":"close compatriot","zh":"关系密切、志趣相投的同道或伙伴","source":"Close compatriot Fatboi Sharif introduced the pair to Dove, and they were blown away by his beats.","sourceHtml":"\u003cmark>Close\u003c/mark> \u003cmark>compatriot\u003c/mark> Fatboi Sharif introduced the pair to Dove, and they were blown away by his beats."},{"en":"be blown away by the beats","zh":"被节拍强烈震撼、立即折服","source":"Close compatriot Fatboi Sharif introduced the pair to Dove, and they were blown away by his beats.","sourceHtml":"Close compatriot Fatboi Sharif introduced the pair to Dove, and they were \u003cmark>blown away by his beats\u003c/mark>."},{"en":"concoct a savory psychedelic stew","zh":"调制出一锅滋味丰富的迷幻炖菜","source":"They made the quick trip from Sunset Park up to Dove’s studio (“Like three train stops,” Lungs explains) every few weeks to record, and after a year and a half or so, they’d concocted the savory psychedelic stew that is People Are Not Your Friends.","sourceHtml":"They made the quick trip from Sunset Park up to Dove’s studio (“Like three train stops,” Lungs explains) every few weeks to record, and after a year and a half or so, they’d \u003cmark>concocted the savory psychedelic stew\u003c/mark> that is People Are Not Your Friends."},{"en":"beats shudder and quake","zh":"节拍仿佛物体般剧烈颤动、震荡，突出低频和纹理的不稳定感","source":"Dove’s beats shudder and quake, drums phasing through sheets of feedback, unidentifiable percussion clanging like a construction site in hell.","sourceHtml":"Dove’s beats \u003cmark>shudder and quake\u003c/mark>, drums phasing through sheets of feedback, unidentifiable percussion clanging like a construction site in hell."},{"en":"phase through sheets of feedback","zh":"鼓声以相位变化穿过层层反馈噪音","source":"Dove’s beats shudder and quake, drums phasing through sheets of feedback, unidentifiable percussion clanging like a construction site in hell.","sourceHtml":"Dove’s beats shudder and quake, drums \u003cmark>phasing through sheets of feedback\u003c/mark>, unidentifiable percussion clanging like a construction site in hell."},{"en":"clang like a construction site in hell","zh":"像地狱工地一样发出刺耳金属撞击声","source":"Dove’s beats shudder and quake, drums phasing through sheets of feedback, unidentifiable percussion clanging like a construction site in hell.","sourceHtml":"Dove’s beats shudder and quake, drums phasing through sheets of feedback, unidentifiable percussion \u003cmark>clanging like a construction site in hell\u003c/mark>."},{"en":"drink from a firehose","zh":"一次接收远超处理能力的信息或刺激","source":"It’s like drinking from a firehose but constantly coming back for more.","sourceHtml":"It’s like \u003cmark>drinking from a firehose but constantly coming back for more\u003c/mark>."},{"en":"an album goes everywhere","zh":"一张专辑不断转向、涉足许多风格和声音区域，难以预测","source":"This album goes everywhere.","sourceHtml":"This album \u003cmark>goes everywhere\u003c/mark>."},{"en":"the most fully-realized version of a style","zh":"某种风格最完整、最充分实现的形态","sour ed and detailed than usual, touching on the sense of alienation you feel in suburbs with no sidewalks, the pressing weight of anxiety, and the small joys of remembering you’re alive.","sourceHtml":"Defcee’s \u003cmark>writerly verses\u003c/mark> are even more animated and detailed than usual, touching on the sense of alienation you feel in suburbs with no sidewalks, the pressing weight of anxiety, and the small joys of remembering you’re alive."},{"en":"the pressing weight of anxiety","zh":"焦虑持续逼迫、压在身上的沉重感","source":"Defcee’s writerly verses are even more animated and detailed than usual, touching on the sense of alienation you feel in suburbs with no sidewalks, the pressing weight of anxiety, and the small joys of remembering you’re alive.","sourceHtml":"Defcee’s writerly verses are even more animated and detailed than usual, touching on the sense of alienation you feel in suburbs with no sidewalks, \u003cmark>the pressing weight of anxiety\u003c/mark>, and the small joys of remembering you’re alive."},{"en":"airy, spacious beats","zh":"留白充足、各音色之间距离宽松的节拍，听感通透而不拥挤","source":"Dove offers airy, spacious beats with heavy bag drums, giving Defcee plenty of room to roam around.","sourceHtml":"Dove offers \u003cmark>airy, spacious beats with heavy bag drums\u003c/mark>, giving Defcee plenty of room to roam around."},{"en":"heavy bag drums","zh":"像拳击重沙袋受到击打般厚重、结实的鼓声","source":"Dove offers airy, spacious beats with heavy bag drums, giving Defcee plenty of room to roam around.","sourceHtml":"Dove offers \u003cmark>airy, spacious beats with heavy bag drums\u003c/mark>, giving Defcee plenty of room to roam around."},{"en":"give a rapper room to roam around","zh":"在编曲和节奏中留下足够空间，让说唱者自由改变语流、停顿和重音位置","source":"Dove offers airy, spacious beats with heavy bag drums, giving Defcee plenty of room to roam around.","sourceHtml":"Dove offers airy, spacious beats with heavy bag drums, giving Defcee \u003cmark>plenty of room to roam around\u003c/mark>."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
