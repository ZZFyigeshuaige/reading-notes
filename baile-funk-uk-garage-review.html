rground clubs in London of late—even if, as cultural host and journalist Gabriela Vallim posited in this must-read 2025 piece for Mixmag, many clubbers remain unaware of its roots.","sourceHtml":"Baile funk has been firing up the underground clubs in London \u003cmark>of late\u003c/mark>—even if, as cultural host and journalist Gabriela Vallim posited in this must-read 2025 piece for Mixmag, many clubbers remain unaware of its roots."},{"en":"synthesize Brazilian and UK club sounds","zh":"把巴西与英国俱乐部音乐的声音 元素综合、融合起来","source":"Chediak—whose Speedtest, co-run with Diogo Queiroz, has been synthesizing Brazilian and UK club sounds for the past four years—suggests baile funk’s growing dominion is part of “this moment that Latin American culture is having.” He cites the increasing popularity of Spanish and Portuguese-language music, saying, “I feel like people in general are a little bit over the American way of doing pop music, and the way we do it here—for me at least—it’s very interesting.”","sourceHtml":"Chediak—whose Speedtest, co-run with Diogo Queiroz, has been \u003cmark>synthesizing Brazilian and UK club sounds\u003c/mark> for the past four years—suggests baile funk’s growing dominion is part of “this moment that Latin American culture is having.” He cites the increasing popularity of Spanish and Portuguese-language music, saying, “I feel like people in general are a little bit over the American way of doing pop music, and the way we do it here—for me at least—it’s very interesting.”"},{"en":"growing dominion","zh":"日益扩大的支配范围或影响力","source":"Chediak—whose Speedtest, co-run with Diogo Queiroz, has been synthesizing Brazilian and UK club sounds for the past four years—suggests baile funk’s growing dominion is part of “this moment that Latin American culture is having.” He cites the increasing popularity of Spanish and Portuguese-language music, saying, “I feel like people in general are a little bit over the American way of doing pop music, and the way we do it here—f d Todd Edwards and other outposts of the genre.","sourceHtml":"From there, he made the leap to “Sincere” hitmaker MJ Cole and quickly began schooling himself in everything UKG, including the garage house of New Jersey legend Todd Edwards and other \u003cmark>outposts of the genre\u003c/mark>."},{"en":"musical orienteering","zh":"音乐上的定向探索","source":"Early in his musical orienteering, Chediak was drawn to the unique chemistry between UK garage (which has been enjoying a renaissance in recent years) and baile funk, and this sonic buddying up has gone on to steer much of his work as a producer, executive producer, DJ, label owner, and general bass music nerd.","sourceHtml":"Early in his \u003cmark>musical orienteering\u003c/mark>, Chediak was drawn to the unique chemistry between UK garage (which has been enjoying a renaissance in recent years) and baile funk, and this sonic buddying up has gone on to steer much of his work as a producer, executive producer, DJ, label owner, and general bass music nerd."},{"en":"sonic buddying up","zh":"两种声音结伴、联手","source":"Early in his musical orienteering, Chediak was drawn to the unique chemistry between UK garage (which has been enjoying a renaissance in recent years) and baile funk, and this sonic buddying up has gone on to steer much of his work as a producer, executive producer, DJ, label owner, and general bass music nerd.","sourceHtml":"Early in his musical orienteering, Chediak was drawn to the unique chemistry between UK garage (which has been enjoying a renaissance in recent years) and baile funk, and this \u003cmark>sonic buddying up\u003c/mark> has gone on to steer much of his work as a producer, executive producer, DJ, label owner, and general bass music nerd."},{"en":"steer much of one’s work","zh":"为某人的大量工作引导方向","source":"Early in his musical orienteering, Chediak was drawn to the unique chemistry between UK garage (which has been enjoying a renaissance in recent years) and baile funk, and this sonic buddying up has gone on to steer much of his work as a producer, executive producer, DJ, label owner, and general bass music nerd.","sourceHtml":"Early in his musical orienteering, Chediak was drawn to the unique chemistry between UK garage (which has been enjoying a renaissance in recent years) and baile funk, and this sonic buddying up has gone on to \u003cmark>steer much of his work\u003c/mark> as a producer, executive producer, DJ, label owner, and general bass music nerd."},{"en":"reference point","zh":"创作时用来定位、比较或获取灵感的参照","source":"Alongside the tamborzão beat of baile funk, and the repetitious rhymes of its accompanying MCs, Chediak also looks to other Brazilian styles like tecno brega (which loosely translates as “cheesy techno” or “tacky techno”), samba, and forró as reference points when cooking up his hybrid sounds.","sourceHtml":"Alongside the tamborzão beat of baile funk, and the repetitious rhymes of its accompanying MCs, Chediak also looks to other Brazilian styles like tecno brega (which loosely translates as “cheesy techno” or “tacky techno”), samba, and forró as \u003cmark>reference points\u003c/mark> when cooking up his hybrid sounds."},{"en":"cook up hybrid sounds","zh":"“烹制”混合声音","source":"Alongside the tamborzão beat of baile funk, and the repetitious rhymes of its accompanying MCs, Chediak also looks to other Brazilian styles like tecno brega (which loosely translates as “cheesy techno” or “tacky techno”), samba, and forró as reference points when cooking up his hybrid sounds.","sourceHtml":"Alongside the tamborzão beat of baile funk, and the repetitious rhymes of its accompanying MCs, Chediak also looks to other Brazilian styles like tecno brega (which loosely translates as “cheesy techno” or “tacky techno”), samba, and forró as reference points when \u003cmark>cooking up his hybrid sounds\u003c/mark>."},{"en":"case in point","zh":"一个能够直接证明前述观点的典型例子","source":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony.","sourceHtml":"\u003cmark>Case in point\u003c/mark>: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony."},{"en":"fuse A with B","zh":"把两种不同元素熔合成一个整体，常用于描述跨风格音乐","source":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony.","sourceHtml":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony."},{"en":"heater","zh":"俱乐部与音乐媒体口语，指能迅速点燃舞池、能量很强的作品","source":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony.","sourceHtml":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive \u003cmark>heater\u003c/mark> etched in stone by vocals from Brazilian MC Ebony."},{"en":"etch something in stone","zh":"本义为把内容刻在石头上","source":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony.","sourceHtml":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater \u003cmark>etched in stone by\u003c/mark> vocals from Brazilian MC Ebony."},{"en":"sputter into life","zh":"咳嗽、噼啪作响般地启动起来","source":"But there’s more to the label than that familiar garage swing: drum & bass, jungle, and footwork—anything that makes a decent soundsystem sputter into life—have all popped up on Speedtest releases.","sourceHtml":"But there’s more to the label than that familiar garage swing: drum &amp; bass, jungle, and footwork—anything that makes a decent soundsystem \u003cmark>sputter into life\u003c/mark>—have all popped up on Speedtest releases."},{"en":"pop up on a release","zh":"意外或不时出现在某张发行作品中","source":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony.","sourceHtml":"Case in point: “BRASILEIRINHA,” released on Speedtest in February, fuses the bouncy syncopated beats of UKG with “the unmistakable energy” of funk carioca for a short, snappy, expressive heater etched in stone by vocals from Brazilian MC Ebony."},{"en":"cobweb-obliterating, breakneck BPMs","zh":"快得仿佛能清除蛛网、危险到要折断 脖子的速度","source":"Proof can be found in Taleko’s ELHAU EP, four tracks of cobweb-obliterating, breakneck BPMs and dubstep-friendly wobble bass.","sourceHtml":"Proof can be found in Taleko’s ELHAU EP, four tracks of \u003cmark>cobweb-obliterating, breakneck BPMs\u003c/mark> and dubstep-friendly wobble bass."},{"en":"graft A onto B","zh":"把 嫁接到 上，强调两种来源不同的声音被实验性地连接","source":"Place it alongside gabrieldvarte & georgeluqas’s gorgeous “Drum n’Berimbau,” which grafts the eponymous single-stringed bow instrument used in capoeira onto Amen breaks and other electronic plot twists, and the label’s experimental credentials really stack up.","sourceHtml":"Place it alongside gabrieldvarte &amp; georgeluqas’s gorgeous “Drum n’Berimbau,” which \u003cmark>grafts\u003c/mark> the eponymous single-stringed bow instrument used in capoeira onto Amen breaks and other electronic plot twists, and the label’s experimental credentials really stack up."},{"en":"plot twist","zh":"情节转折","source":"Place it alongside gabrieldvarte & georgeluqas’s gorgeous “Drum n’Berimbau,” which grafts the eponymous single-stringed bow instrument used in capoeira onto Amen breaks and other electronic plot twists, and the label’s experimental credentials really stack up.","sourceHtml":"Place it alongside gabrieldvarte &amp; georgeluqas’s gorgeous “Drum n’Berimbau,” which grafts the eponymous single-stringed bow instrument used in capoeira onto Amen breaks and other electronic \u003cmark>plot twists\u003c/mark>, and the label’s experimental credentials really stack up."},{"en":"one’s experimental credentials stack up","zh":"某人的实验资历或实力经得起检验、 累积起来相当有说服力","source":"Place it alongside gabrieldvarte & georgeluqas’s gorgeous “Drum n’Berimbau,” which grafts the eponymous single-stringed bow instrument used in capoeira onto Amen breaks and other electronic plot twists, and the label’s experimental credentials really stack up.","sourceHtml":"Place it alongside gabrieldvarte &amp; georgeluqas’s gorgeous “Drum n’Berimbau,” which grafts the eponymous single-stringed bow instrument used in capoeira onto Amen breaks and other electronic plot twists, and the label’s \u003cmark>experimental credentials really stack up\u003c/mark>."},{"en":"special relationship","zh":"两个国家或文化之间长期、紧密且具有历史意义的特殊 联系","source":"As it happens, the special relationship between the UK’s breaks-infused dance and Brazilian musical traditions stretches back for decades.","sourceHtml":"As it happens, the \u003cmark>special relationship\u003c/mark> between the UK’s breaks-infused dance and Brazilian musical traditions stretches back for decades."},{"en":"stretch back for decades","zh":"向过去延伸数十年，即拥有数十年的历史","source":"As it happens, the il’s underground club scene—with a particular penchant for bass—cannot be overstated."},{"en":"a particular penchant for","zh":"对某物有格外强烈、稳定的偏爱","source":"Although Badsista’s glow-in-the-dark funk-pumpers drink from the fountain of rave and techno, the São Paulo DJ and producer’s omnipresence in Brazil’s underground club scene—with a particular penchant for bass—cannot be overstated.","sourceHtml":"Although Badsista’s glow-in-the-dark funk-pumpers drink from the fountain of rave and techno, the São Paulo DJ and producer’s omnipresence in Brazil’s underground club scene—with \u003cmark>a particular penchant for bass\u003c/mark>—cannot be overstated."},{"en":"cannot be overstated","zh":"无论怎样强调都不算过分，表示其重要性极高","source":"Although Badsista’s glow-in-the-dark funk-pumpers drink from the fountain of rave and techno, the São Paulo DJ and producer’s omnipresence in Brazil’s underground club scene—with a particular penchant for bass—cannot be overstated.","sourceHtml":"Although Badsista’s glow-in-the-dark funk-pumpers drink from the fountain of rave and techno, the São Paulo DJ and producer’s omnipresence in Brazil’s underground club scene—with a particular penchant for bass—\u003cmark>cannot be overstated\u003c/mark>."},{"en":"work with the likes of","zh":"与……等知名或具有代表性的人物合作","source":"HITS DE VERÃO (SUMMER HITS) vol. 1 is an early release for the Brazilian innovator and BANDIDA crew co-founder, who has since worked with the likes of Ellen Alien, Linn da Quebrada, and Kelela.","sourceHtml":"HITS DE VERÃO (SUMMER HITS) vol. 1 is an early release for the Brazilian innovator and BANDIDA crew co-founder, who has since \u003cmark>worked with the likes of\u003c/mark> Ellen Alien, Linn da Quebrada, and Kelela."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
