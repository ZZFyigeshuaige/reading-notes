Html":"### 英文原文"},{"en":"surface in the orbit of","zh":"在某个团体或厂牌的周边圈子中崭露头角","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"attract the ear of","zh":"吸引某类听众的注意","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"snarling and cavernous","zh":"带着咆哮感，同时空间深广如洞穴","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"lilting grooves","zh":"轻盈摇曳、富于起伏的律动","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"dazed chords","zh":"朦胧恍惚的和弦","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"crafted from leather and elastic","zh":"仿佛由皮革和弹性材料制成","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"establish one’s footing","zh":"站稳脚跟、确立自己的位置","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"a precocious teenager","zh":"早熟且才华早现的青少年","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"slinky","zh":"柔滑蜿蜒、略带性感","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"whispery voices and pearly textures laid over beats","zh":"耳语般的人声与珍珠般的音色纹理铺在节拍之上","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"remain in forward motion","zh":"始终保持向前运动","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"crispy and pristine","zh":"清脆而洁净","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"have a knack for","zh":"特别擅长、天生会处理某件事","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"nuanced darkness","zh":"具有细微层次的阴暗氛围","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"a commanding solo producer","zh":"掌控力强、令人信服的独立制作人","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"proggy","zh":"带有 倾向的","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"bewitching in its repetition","zh":"在反复循环中产生迷人甚至如施魔法般的效果","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"stumble upon","zh":"偶然发现、无意间接触到","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"have a mastery of","zh":"熟练掌握、精通","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"favor a compact process","zh":"偏好紧凑精简的工作流程","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"laser-y melodies","zh":"如激光般明亮、锐利且线条清晰的旋律","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"mingle with sharp sequencing","zh":"与锋利清晰的音序交融","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"at its funkiest","zh":"处于最有放克律动、最让身体摆动的状态","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"join forces","zh":"联手合作","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"push something to euphoric heights","zh":"把某物推向高度欣快、近乎狂喜的境地","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"bubbly","zh":"轻快活泼、像气泡般跳跃","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"propel translucent synth stabs","zh":"推动半透明质感的合成器短促击奏不断前进","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"throaty synthesizer","zh":"带有低沉喉音、略显沙哑共鸣的合成器音色","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"stripped back, but boisterous","zh":"元素被精简到很少，却仍喧闹有力、精力旺盛","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"unrestrained","zh":"不受拘束的、毫不收敛的","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"balance approachability with the avant-garde","zh":"在易于接近的听感与先锋实验之间取得平衡","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"as abrasive as it is insistent","zh":"既粗粝刺耳，又执拗有力","source":"### 英文原文","sourceHtml":"### 英文原文"},{"en":"be united by a sense of jumpiness","zh":"由一种跳跃不安的感觉贯穿并连成整体","source":"### 英文原文","sourceHtml":"### 英文原文"}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
