ested because two songs (“Danceteria” and “LES Girl”) are about that same downtown scene/milieu, and so I wondered what you thought of her musical documentation of that time.","sourceHtml":"Maybe not, since you try to save space for your own music in your brain—I’m just interested because two songs (“Danceteria” and “LES Girl”) are about that same downtown scene/milieu, and so I wondered what you thought of her \u003cmark>musical documentation of that time\u003c/mark>."},{"en":"follow someone’s stuff","zh":"持续留意某位创作者的新作品和动态，语气随意","source":"I watched The Queen’s Grindr Times Square live show, and I loved it—I hadn’t been following her stuff for a while, so I was curious to hear the new tracks.","sourceHtml":"I watched The Queen’s Grindr Times Square live show, and I loved it—I hadn’t been \u003cmark>following her stuff\u003c/mark> for a while, so I was curious to hear the new tracks."},{"en":"an infectious beat","zh":"极易感染听众、让身体不由自主跟着动的节拍","source":"“Danceteria” is simply fabulous—the production is sparkling, and the beat is muy infectious as it should be.","sourceHtml":"“Danceteria” is simply fabulous—the production is sparkling, and the beat is \u003cmark>muy infectious\u003c/mark> as it should be."},{"en":"be taken back to","zh":"被声音、气味或感觉瞬间带回某段过去，强调非自愿而鲜明的记忆重现","source":"I’m taken back to the Ice Palace after the Quaalude hits: the lights are blinding, and the sweat of a hundred gyrating queens hits you like a shared Rush bottle!","sourceHtml":"\u003cmark>I’m taken back to\u003c/mark> the Ice Palace after the Quaalude hits: the lights are blinding, and the sweat of a hundred gyrating queens hits you like a shared Rush bottle!"},{"en":"gyrating queens","zh":"扭动身体跳舞的酷儿男性","source":"I’m taken back to the Ice Palace after the Quaalude hits: the lights are blinding, and the sweat of a hundred gyrating queens hits you like a shared Rush bottle!","sourceHtml":"I’m taken back to the Ice Palace after the Quaalude hits: the lights are blinding, and the sweat of a hundred \u003cmark>gyrating queens\u003c/mark> hits you like a shared Rush bottle!"},{"en":"hit someone like...","zh":"像某种强烈事物一样迎面冲击某人","source":"I’m taken back to the Ice Palace after the Quaalude hits: the lights are blinding, and the sweat of a hundred gyrating queens hits you like a shared Rush bottle!","sourceHtml":"I’m taken back to the Ice Palace after the Quaalude \u003cmark>hits\u003c/mark>: the lights are blinding, and the sweat of a hundred gyrating queens \u003cmark>hits\u003c/mark> you \u003cmark>like\u003c/mark> a shared Rush bottle!"},{"en":"booker","zh":"负责挑选艺人、协商并安排现场演出的策划人","source":"History note: Jim Fourrat (now gay historian/activist who is still around) was the booker for Danceteria at that time—he booked both Madonna and Arthur Russell and was the first midtown booker to support Arthur.","sourceHtml":"History note: Jim Fourrat (now gay historian/activist who is still around) was \u003cmark>the booker for Danceteria\u003c/mark> at that time—he booked both Madonna and Arthur Russell and was the first midtown booker to support Arthur."},{"en":"a hot trendy scene","zh":"当时最受关注、最时髦的人群与场所构成的文化圈","source":"I used to go there regularly because it was a hot trendy scene.","sourceHtml":"I used to go there regularly because it was \u003cmark>a hot trendy scene\u003c/mark>."},{"en":"doorman","zh":"夜店门卫","source":"Jim later became the doorman for the Palladium nightclub; then he went on to do A&R for Atlantic.","sourceHtml":"Jim later became \u003cmark>the doorman\u003c/mark> for the Palladium nightclub; then he went on to do A&amp;R for Atlantic."},{"en":"A&R","zh":"，唱片公司负责发现、签约艺人并协助发展作品与定位的部门","source":"History note: Jim Fourrat (now gay historian/activist who is still around) was the booker for Danceteria at that time—he booked both Madonna and Arthur Russell and was the first midtown booker to support Arthur.","sourceHtml":"History note: Jim Fourrat (now gay historian/activist who is still around) was the booker for Danceteria at that time—he booked both Madonna and Arthur Russell and was the first midtown booker to support Arthur."},{"en":"sign an artist","zh":"唱片公司与艺人签约，而非普通的“签字”","source":"I said, “I want to be the male Sade!” but he didn’t convince the bosses to sign me.","sourceHtml":"I said, “I want to be the male Sade!” but he didn’t convince the bosses to \u003cmark>sign\u003c/mark> me."},{"en":"the male Sade","zh":"对自身市场定位的高度浓缩：像 一样优雅、感性、制作精致且具有流行吸引力","source":"I said, “I want to be the male Sade!” but he didn’t convince the bosses to sign me.","sourceHtml":"I said, “I want to be \u003cmark>the male Sade!\u003c/mark>” but he didn’t convince the bosses to sign me."},{"en":"public statement","zh":"针对公共事件正式发布的声明，通常用于解释立场或回应争议","source":"The following was taken from a phone conversation on September 30, 2026, after Hall’s public statement about following AI accounts on the Chinese social media platform Xiaohongshu, also known as Red Note.","sourceHtml":"The following was taken from a phone conversation on September 30, 2026, after Hall’s \u003cmark>public\u003c/mark> \u003cmark>statement\u003c/mark> about following AI accounts on the Chinese social media platform Xiaohongshu, also known as Red Note."},{"en":"had just died","zh":"刚刚去世","source":"Hall’s mother had just died; she was 104.","sourceHtml":"Hall’s mother \u003cmark>had\u003c/mark> \u003cmark>just\u003c/mark> died; she was 104."},{"en":"bittersweet","zh":"甜蜜与悲伤同时存在的","source":"It’s kind of bittersweet.","sourceHtml":"It’s kind of \u003cmark>bittersweet\u003c/mark>."},{"en":"not be doing well","zh":"身体或处境不佳","source":"I was in Orlando two weeks ago because I knew she wasn’t doing well, and so I went to kind of say goodbye.","sourceHtml":"I was in Orlando two weeks ago because I knew she \u003cmark>wasn’t doing well\u003c/mark>, and so I went to kind of say goodbye."},{"en":"say goodbye","zh":"这里不是普通道别，而是知道对方可能即将去世时作最后告别","source":"I was in Orlando two weeks ago because I knew she wasn’t doing well, and so I went to kind of say goodbye.","sourceHtml":"I was in Orlando two weeks ago because I knew she wasn’t doing well, and so I went to kind of \u003cmark>say goodbye\u003c/mark>."},{"en":"on a record","zh":"以正式录音作品中的形态被听见，与坐在身边的现场弹唱形成对照","source":"She hadn’t really heard me on a record.","sourceHtml":"She hadn’t really heard me \u003cmark>on a record\u003c/mark>."},{"en":"my biggest fan","zh":"最坚定、最热情支持自己的人，通常不只是普通意义上的听众","source":"She was my biggest fan, so she was really thrilled to find out, you know, all the craziness that has been happening with me, because she was sure that it was going to happen.","sourceHtml":"She was \u003cmark>my biggest fan\u003c/mark>, so she was really thrilled to find out, you know, all the craziness that has been happening with me, because she was sure that it was going to happen."},{"en":"a natural thing","zh":"在她看来顺理成章、本来就应该发生的结果","source":"She thought it was a natural thing, and she used to say, “Can’t I call up the radio stations and tell them to play your songs?” And also she literally supported me.","sourceHtml":"She thought it was \u003cmark>a natural thing\u003c/mark>, and she used to say, “Can’t I call up the radio stations and tell them to play your songs?” And also she literally supported me."},{"en":"literally support someone","zh":"这里特意指经济上实际供养某人，而不只是给予鼓励","source":"She thought it was a natural thing, and she used to say, “Can’t I call up the radio stations and tell them to play your songs?” And also she literally supported me.","sourceHtml":"She thought it was a natural thing, and she used to say, “Can’t I call up the radio stations and tell them to play your songs?” And also she \u003cmark>literally supported me\u003c/mark>."},{"en":"rather than leaving money in inheritance","zh":"与其在死后把钱作为遗产留下","source":"She used to give me money to just keep doing my music so I wouldn’t have to work, basically, and she did that for years, because her idea was, rather than leaving money in inheritance, to actually take care of her kids and help them while she was around.","sourceHtml":"She used to give me \u003cmark>money\u003c/mark> to just keep doing my music so I wouldn’t have to work, basically, and she did that for years, because her idea was, \u003cmark>rather\u003c/mark> \u003cmark>than\u003c/mark> \u003cmark>leaving\u003c/mark> \u003cmark>money\u003c/mark> in \u003cmark>inheritance\u003c/mark>, to actually take care of her kids and help them while she was around."},{"en":"while she was around","zh":"趁她仍然在世、仍能亲自看到帮助产生作用时","source":"She used to give me money to just keep doing my music so I wouldn’t have to work, basically, and she did that for years, because her idea was, rather than leaving money in inheritance, to actually take care of her kids and help them while she was around.","sourceHtml":"She used to give me money to just keep doing my music so I wouldn’t have to work, basically, and she did that for years, because her idea was, rather than leaving money in inheritance, to actually take care of her kids and help them \u003cmark>while she was around\u003c/mark>."},{"en":"get someone a gig","zh":"替音乐人联系、安排一场演出","source":"My booking agents were told that their priority was to get me a gig in Orlando so that my mother could go, because she wasn’t doing well, so they did that very quickly.","sourceHtml":"My booking agents were told that their priority was to \u003cmark>get me a gig in Orlando\u003c/mark> so that my mother could go, because she wasn’t doing well, so they did that very quickly."},{"en":"there’s no pressure","zh":"不必因外界期待而勉强去做，可以自由取消","source":"And the promoters said there’s no pressure if I wanted to cancel, but I really want to do it now, in her honor.","sourceHtml":"And the promoters said \u003cmark>there’s no pressure\u003c/mark> if I wanted to cancel, but I really want to do it now, in her honor."},{"en":"in someone’s honor","zh":"为表达敬意、纪念或庆祝某人而做某事","source":"And the promoters said there’s no pressure if I wanted to cancel, but I really want to do it now, in her honor.","sourceHtml":"And the promoters said there’s no pressure if I wanted to cancel, but I really want to do it now, \u003cmark>in her honor\u003c/mark>."},{"en":"controversy around something","zh":"围绕某事产生的公开争议","source":"There was some controversy around accounts you followed on a Chinese social media platform the other week.","sourceHtml":"There was some \u003cmark>controversy around\u003c/mark> accounts you followed on a Chinese social media platform the other week."},{"en":"meet your public","zh":"开始直接面对由听众、粉丝、批评者和媒体共同构成的公众","source":"You’ve kind of met your public now—you talked about the adoration you felt when the album came out, and this was a different kind of public scrutiny.","sourceHtml":"You’ve kind of \u003cmark>met your public now\u003c/mark>—you talked about the adoration you felt when the album came out, and this was a different kind of public scrutiny."},{"en":"public scrutiny","zh":"公众对一个人的行为进行密切检查和批评性审视","source":"You’ve kind of met your public now—you talked about the adoration you felt when the album came out, and this was a different kind of public scrutiny.","sourceHtml":"You’ve kind of met your public now—you talked about the adoration you felt when the album came out, and this was a different kind of \u003cmark>public scrutiny\u003c/mark>."},{"en":"navigate that world","zh":"在陌生而复杂的环境中判断方向、处理规则与风险","source":"I’m interested in what you’re learning about yourself as a public figure, about navigating that world.","sourceHtml":"I’m interested in what you’re learning about yourself as a public figure, about \u003cmark>navigating that world\u003c/mark>."},{"en":"startling","zh":"出乎意料、令人猛然一惊的","source":"It was startling because all the things that were happening on the internet, it’s like another world.","sourceHtml":"It was \u003cmark>startling\u003c/mark> because all the things that were happening on the internet, it’s like another world."},{"en":"see / feel something physically","zh":"让原本抽象、遥远的现象以身体可以感知的方式出现","source":"It was startling because seeing it physically, not only hearing the reaction but literally feeling it… The last [Nirosta Steel show] at [Night Club] 101, the guitars and the bass suddenly went out of tune, and I was like, “What is going on?” Because we didn’t have that problem in the earlier concerts.","sourceHtml":"It was startling because \u003cmark>seeing it physically\u003c/mark>, not only hearing the reaction but literally feeling it… The last [Nirosta Steel show] at [Night Club] 101, the guitars and the bass suddenly went out of tune, and I was like, “What is going on?” Because we didn’t have that problem in the earlier concerts."},{"en":"go out of tune","zh":"乐器失去准确音高、跑音","source":"It was startling because seeing it physically, not only hearing the reaction but literally feeling it… The last [Nirosta Steel show] at [Night Club] 101, the guitars and the bass suddenly went out of tune, and I was like, “What is going on?” Because we didn’t have that problem in the earlier concerts.","sourceHtml":"It was startling because seeing it physically, not only hearing the reaction but literally feeling it… The last [Nirosta Steel show] at [Night Club] 101, the guitars and the bass suddenly \u003cmark>went out of tune\u003c/mark>, and I was like, “What is going on?” Because we didn’t have that problem in the earlier concerts."},{"en":"what is going on?","zh":"面对异常状况时的“到底怎么回事？","source":"It was startling because seeing it physically, not only hearing the reaction but literally feeling it… The last [Nirosta Steel show] at [Night Club] 101, the guitars and the bass suddenly went out of tune, and I was like, “What is going on?” Because we didn’t have that problem in the earlier concerts.","sourceHtml":"It was startling because seeing it physically, not only hearing the reaction but literally feeling it… The last [Nirosta Steel show] at [Night Club] 101, the guitars and the bass suddenly went out of tune, and I was like, “\u003cmark>What\u003c/mark> is going on?” Because we didn’t have that problem in the earlier concerts."},{"en":"in a sweet way","zh":"以一种令人感到温暖、友善的方式，避免把 理解为厌恶","source":"Another thing was, when I would walk through the crowd to get to the stage at the beginning of the show, people were touching me, and that was kind of strange, in a sweet way—it was encouraging, patting me on the shoulder or saying, “Have a good show,” whatever.","sourceHtml":"Another thing was, when I would walk through the crowd to get to the stage at the beginning of the show, people were touching me, and that was kind of strange, \u003cmark>in a sweet way\u003c/mark>—it was encouraging, patting me on the shoulder or saying, “Have a good show,” whatever."},{"en":"pat someone on the shoulder","zh":"拍拍某人的肩膀，表示鼓励、支持或亲近","source":"Another thing was, when I would walk through the crowd to get to the stage at the beginning of the show, people were touching me, and that was kind of strange, in a sweet way—it was encouraging, patting me on the shoulder or saying, “Have a good show,” whatever.","sourceHtml":"Another thing was, when I would walk through the crowd to get to the stage at the beginning of the show, people were touching me, and that was kind of strange, in a sweet way—it was encouraging, \u003cmark>patting me on the shoulder\u003c/mark> or saying, “Have a good show,” whatever."},{"en":"make out","zh":"长时间、热烈地接吻或亲热，比 更强调持续的身体亲密","source":"And then the other thing was that my friends who were in the audience told me that people in the audience were making out, not only dancing, but actually making out.","sourceHtml":"And then the other thing was that my friends who were in the audience told me that people in the audience were \u003cmark>making out\u003c/mark>, not only dancing, but actually making out."},{"en":"quiet people down","zh":"让嘈杂的人群逐渐安静下来","source":"The first song that I did was “Jovi Song,” to sort of quiet people down and get their attention.","sourceHtml":"The first song that I did was “Jovi Song,” to sort of \u003cmark>quiet people down and get their attention\u003c/mark>."},{"en":"goodwill","zh":"善意、支持与友好态度","source":"These physical reactions were kind of startling to me, because I had received a lot of goodwill through Instagram or whatever, but actually to feel it physically was really different, and that took a bit of adjustment.","sourceHtml":"These physical reactions were kind of startling to me, because I had received a lot of \u003cmark>goodwill\u003c/mark> through Instagram or whatever, but actually to feel it physically was really different, and that took a bit of adjustment."},{"en":"take a bit of adjustment","zh":"需要一段适应过程，尤其指心理和行为方式要重新校准","source":"These physical reactions were kind of startling to me, because I had received a lot of goodwill through Instagram or whatever, but actually to feel it physically was really different, and that took a bit of adjustment.","sourceHtml":"These physical reactions were kind of startling to me, because I had received a lot of goodwill through Instagram or whatever, but actually to feel it physically was really different, and that \u003cmark>took a bit of adjustment\u003c/mark>."},{"en":"take one’s picture with someone","zh":"与某人合影","source":"The other thing was really cute guys wanting to take their picture with me—that’s a nice thing, too, and also I found I have a lot of trans fans, which is really beautiful.","sourceHtml":"The other thing was really cute guys wanting to \u003cmark>take their picture with me\u003c/mark>—that’s a nice thing, too, and also I found I have a lot of trans fans, which is really beautiful."},{"en":"feel a connection to something","zh":"感到自己在情感、经验或身份上与某物产生共鸣","source":"Maybe that’s the most exciting part, because they feel some connection to, maybe the openness in my music, and also maybe my personality that’s coming through in interviews.","sourceHtml":"Maybe that’s the most exciting part, because they \u003cmark>feel some connection to\u003c/mark>, maybe the openness in my music, and also maybe my personality that’s coming through in interviews."},{"en":"come through","zh":"人的个性或情感透过言语、表演等媒介显现出来","source":"Maybe that’s the most exciting part, because they feel some connection to, maybe the openness in my music, and also maybe my personality that’s coming through in interviews.","sourceHtml":"Maybe that’s the most exciting part, because they feel some connection to, maybe the openness in my music, and also maybe my personality that’s \u003cmark>coming through in interviews\u003c/mark>."},{"en":"come up to someone","zh":"主动走到某人面前交谈或提出请求","source":"The other thing was really cute guys wanting to take their picture with me—that’s a nice thing, too, and also I found I have a lot of trans fans, which is really beautiful.","sourceHtml":"The other thing was really cute guys wanting to take their picture with me—that’s a nice thing, too, and also I found I have a lot of trans fans, which is really beautiful."},{"en":"bona fide","zh":"真正的、名副其实的，常带轻松而强调的语气","source":"And then I really realized I was a bona fide pop star when a girl asked me to sign her iPhone.","sourceHtml":"And then I really realized I was \u003cmark>a bona fide pop star\u003c/mark> when a girl asked me to sign her iPhone."},{"en":"take it all in stride","zh":"平稳、自然地接受变化，不因突然的成功或压力乱了步伐","source":"I’m just trying to take it all in stride.","sourceHtml":"I’m just trying to \u003cmark>take it all in stride\u003c/mark>."},{"en":"wanted to engage","zh":"想出面回应或参与这场讨论","source":"He wanted to engage—he’s a lawyer.","sourceHtml":"He \u003cmark>wanted to engage\u003c/mark>—he’s a lawyer."},{"en":"there was really nothing to it","zh":"其实没有什么实质内容","source":"As I said, my husband was really upset, more upset than I was, because I knew there was really nothing to it in terms of what I did or what I didn’t do.","sourceHtml":"As I said, my husband was really upset, more upset than I was, because I knew \u003cmark>there was really nothing to it\u003c/mark> in terms of what I did or what I didn’t do."},{"en":"put my head down","zh":"埋头专注做手头的事","source":"My attitude was to put my head down and just concentrate on the music, and just to be myself, because that’s what people like.","sourceHtml":"My attitude was to \u003cmark>put my head down\u003c/mark> and just concentrate on the music, and just to be myself, because that’s what people like."},{"en":"step away from","zh":"暂时离开或退出某项活动","source":"One thing I understand, which I didn’t understand before, is how some pop stars want to step away from social media, or even step away from performing, because it’s so exhausting.","sourceHtml":"One thing I understand, which I didn’t understand before, is how some pop stars want to \u003cmark>step away from\u003c/mark> social media, or even step away from performing, because it’s so exhausting."},{"en":"underground experimental hotspot","zh":"地下实验文化活跃的热门场所","source":"But I’m interested in what it felt like returning to the East Village, playing for these crowds of young people at this underground experimental hotspot that also used to be an underground experimental hotspot [as the Pyramid Club] as well.","sourceHtml":"But I’m interested in what it felt like returning to the East Village, playing for these crowds of young people at this \u003cmark>underground experimental hotspot\u003c/mark> that also used to be an underground experimental hotspot [as the Pyramid Club] as well."},{"en":"out of the blue","zh":"毫无预兆地，出乎意料地","source":"The most interesting part is that I’ve had several boyfriends appear from the past, totally out of the blue.","sourceHtml":"The most interesting part is that I’ve had several boyfriends appear from the past, totally \u003cmark>out of the blue\u003c/mark>."},{"en":"sprung it on him","zh":"事先没有透露，突然把这件事告诉对方","source":"So I sprung it on him, but he was very touched.","sourceHtml":"So I \u003cmark>sprung it on him\u003c/mark>, but he was very touched."},{"en":"chi-chi","zh":"时髦讲究，常带一点嫌其做派浮夸的意味","source":"The East Village is just full of young, rich people who are all very stylish and very sexy, and even Arthur’s building has two very chi-chi stores in it, so that was kind of surreal.","sourceHtml":"The East Village is just full of young, rich people who are all very stylish and very sexy, and even Arthur’s building has two very \u003cmark>chi-chi\u003c/mark> stores in it, so that was kind of surreal."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
