let cards = [{"en":"zip-tie something together","zh":"用扎带把东西捆在一起","source":"He eventually found two pieces from a vendor, zip-tied them together, and only then could he hike to the top of a mountain.","sourceHtml":"He eventually found two pieces from a vendor, \u003cmark>zip-tied them together\u003c/mark>, and only then could he hike to the top of a mountain."},{"en":"fuck with someone or something","zh":"喜欢或认同某人或某事","source":"I fuck with Jesus.”","sourceHtml":"I \u003cmark>fuck with Jesus\u003c/mark>.”"},{"en":"squirm between","zh":"在不同风格之间扭动游走","source":"Arogundade’s music squirms between cloud rap, dream pop, and experimental noise.","sourceHtml":"Arogundade’s music \u003cmark>squirms between\u003c/mark> cloud rap, dream pop, and experimental noise."},{"en":"a fey, fastidious tinkerer","zh":"气质飘忽出尘、反复琢磨细节的手艺人","source":"He’s been a cornerstone of Drain Gang since its birth in the early 2010s, a fey, fastidious tinkerer who quietly helped build the Swedish collective’s concepts, clothing, videos, and general direction.","sourceHtml":"He’s been a cornerstone of Drain Gang since its birth in the early 2010s, \u003cmark>a fey, fastidious tinkerer\u003c/mark> who quietly helped build the Swedish collective’s concepts, clothing, videos, and general direction."},{"en":"much to the chagrin of","zh":"让某人很是懊恼","source":"But until now, he’s only released one solo album, much to the chagrin of ravenous fans who archive his social posts like they’re sacred missives and investigate every pixel of an image for possible intel.","sourceHtml":"But until now, he’s only released one solo album, \u003cmark>much to the chagrin of\u003c/mark> ravenous fans who archive his social posts like they’re sacred missives and investigate every pixel of an image for possible intel."},{"en":"fried","zh":"离谱到像是脑子烧坏了","source":"“You can observe the degradation of children over time by visiting this sub,” one person once commented in reply to an especially fried Ecco2k analysis post on Reddit.","sourceHtml":"“You can observe the degradation of children over time by visiting this sub,” one person once commented in reply to an \u003cmark>especially fried\u003c/mark> Ecco2k analysis post on Reddit."},{"en":"a dizzying array of","zh":"种类或数量多得让人眼花缭乱","source":"Echo, out today, was recorded—and filmed—across six years and a dizzying array of countries.","sourceHtml":"Echo, out today, was recorded—and filmed—across six years and \u003cmark>a dizzying array of\u003c/mark> countries."},{"en":"touch starvation","zh":"长期缺少身体接触而产生的强烈渴望","source":"Echo’s protagonist, Echo, swims in fountains and hears birdsong in his bones; he cries about touch starvation and gets stopped at the border with flowers in his hand.","sourceHtml":"Echo’s protagonist, Echo, swims in fountains and hears birdsong in his bones; he cries about \u003cmark>touch starvation\u003c/mark> and gets stopped at the border with flowers in his hand."},{"en":"vertiginous","zh":"令人有眩晕感的","source":"Arogundade, the human wearing a shirt and grinning cheekily from a London apartment, keeps landing on the word “sublime,” specifically Edmund Burke’s philosophical definition: something “so beautiful and so grand in scale that it almost feels threatening.” The music tries to match that vertiginous feeling, with vocals like fairy hiccups and cloud rap beats that sound like falling out of the heavens.","sourceHtml":"Arogundade, the human wearing a shirt and grinning cheekily from a London apartment, keeps landing on the word “sublime,” specifically Edmund Burke’s philosophical definition: something “so beautiful and so grand in scale that it almost feels threatening.” The music tries to match \u003cmark>that vertiginous feeling\u003c/mark>, with vocals like fairy hiccups and cloud rap beats that sound like falling out of the heavens."},{"en":"Coriolis effect type beat","zh":"让人联想到地球自转的某种伴奏","source":"“When I first heard the ‘Sky Burial’ instrumental, I described it as a ‘Coriolis effect type beat.’ The feeling I get is like… it just invokes the whole Earth,” he marvels.","sourceHtml":"“When I first heard the ‘Sky Burial’ instrumental, I described it as a ‘\u003cmark>Coriolis effect type beat\u003c/mark>.’ The feeling I get is like… it just invokes the whole Earth,” he marvels."},{"en":"formless and precious","zh":"有些空泛又略显矫饰","source":"Arogundade points to a couplet from his song “Loveless Animal, Lawless Criminal” as the thesis of Echo: “How could I turn out so gentle when the world is so very cruel?/Still it is no less beautiful and one day it’ll kill me.” This might sound a tad formless and precious, but it’s deeply felt, and underlying everything is the life Arogundade spent feeling like an outcast: a Black kid in homogeneous Stockholm, a punk who wore makeup, the most lowkey member of a Swedish collective named Drain Gang that was mocked online (and later revered).","sourceHtml":"Arogundade points to a couplet from his song “Loveless Animal, Lawless Criminal” as the thesis of Echo: “How could I turn out so gentle when the world is so very cruel?/Still it is no less beautiful and one day it’ll kill me.” This might sound a tad \u003cmark>formless and precious\u003c/mark>, but it’s deeply felt, and underlying everything is the life Arogundade spent feeling like an outcast: a Black kid in homogeneous Stockholm, a punk who wore makeup, the most lowkey member of a Swedish collective named Drain Gang that was mocked online (and later revered)."},{"en":"put out the odd single","zh":"偶尔发一首单曲","source":"OG fans knew him as Drain Gang’s secret weapon, someone who worked behind the scenes and only secondarily put out the odd single (“All I wanna see is 1080p/But reality keep me on 240,” goes an early line).","sourceHtml":"OG fans knew him as Drain Gang’s secret weapon, someone who worked behind the scenes and only secondarily \u003cmark>put out the odd single\u003c/mark> (“All I wanna see is 1080p/But reality keep me on 240,” goes an early line)."},{"en":"shun the light","zh":"刻意避开公众视线","source":"He’s still a craftsman—he’s working on a line of ceramics, and a perfume that he’s spent 10 years developing—and fans still consider him the recluse in a collective known for shunning the light, a perfectionist who didn’t release a solo album until six years into his career.","sourceHtml":"He’s still a craftsman—he’s working on a line of ceramics, and a perfume that he’s spent 10 years developing—and fans still consider him the recluse in a collective known for \u003cmark>shunning the light\u003c/mark>, a perfectionist who didn’t release a solo album until six years into his career."},{"en":"giggly and damaged immediacy","zh":"带着笑声和伤痕、一下就能触到人的感觉","source":"His teammates Bladee and Thaiboy Digital were wounded and poetic, but Arogundade’s music had a giggly and damaged immediacy all his own, like a hurt angel locking eyes with you.","sourceHtml":"His teammates Bladee and Thaiboy Digital were wounded and poetic, but Arogundade’s music had a \u003cmark>giggly and damaged immediacy\u003c/mark> all his own, like a hurt angel locking eyes with you."},{"en":"score a film","zh":"为一部电影配乐","source":"Continuing an approach he tried on E’s “Fruit Bleed Juice,” Arogundade built the album like a composer scoring a film, producing music from footage collected on his travels.","sourceHtml":"Continuing an approach he tried on E’s “Fruit Bleed Juice,” Arogundade built the album like a composer \u003cmark>scoring a film\u003c/mark>, producing music from footage collected on his travels."},{"en":"flesh out the structures","zh":"把原本只有轮廓的结构充实起来","source":"He’d then flesh out the structures and write the songs while watching the footage on a screen.","sourceHtml":"He’d then \u003cmark>flesh out the structures\u003c/mark> and write the songs while watching the footage on a screen."},{"en":"sweat over something","zh":"为某件事费尽心力、反复打磨","source":"The work feels almost excruciatingly sweated over, to the point where I wonder to myself if trying to serve up the sublime as a buffet negates the idea of the sublime at all.","sourceHtml":"The work feels almost \u003cmark>excruciatingly sweated over\u003c/mark>, to the point where I wonder to myself if trying to serve up the sublime as a buffet negates the idea of the sublime at all."},{"en":"someone’s biggest opp","zh":"某人或某种做法最大的对头","source":"How funny that Stockholm produced both Spotify, the engine that devalued music and incentivizes constant data dumps, and the data dump’s biggest opp.","sourceHtml":"How funny that Stockholm produced both Spotify, the engine that devalued music and incentivizes constant data dumps, and \u003cmark>the data dump’s biggest opp\u003c/mark>."},{"en":"at someone’s disposal","zh":"可由某人随意支配","source":"But with so many years at his disposal to find serendipitous moments, he wasn’t forced to incorporate anything that he didn’t think was ultra-magical; he could make a dense collage out of what he believed were perfect clips.","sourceHtml":"But with so many years \u003cmark>at his disposal\u003c/mark> to find serendipitous moments, he wasn’t forced to incorporate anything that he didn’t think was ultra-magical; he could make a dense collage out of what he believed were perfect clips."},{"en":"serendipitous moments","zh":"无意间撞见的好时刻","source":"But with so many years at his disposal to find serendipitous moments, he wasn’t forced to incorporate anything that he didn’t think was ultra-magical; he could make a dense collage out of what he believed were perfect clips.","sourceHtml":"But with so many years at his disposal to find \u003cmark>serendipitous moments\u003c/mark>, he wasn’t forced to incorporate anything that he didn’t think was ultra-magical; he could make a dense collage out of what he believed were perfect clips."},{"en":"gesture toward experimentation","zh":"显露出尝试实验的倾向","source":"But Echo often feels like a grander version of E’s delicate cloud&B; it gestures toward experimentation, with flashes of electricity and stripped-back ballads, but everything has been softened into a kind of mature uniformity.","sourceHtml":"But Echo often feels like a grander version of E’s delicate cloud&amp;B; it \u003cmark>gestures toward experimentation\u003c/mark>, with flashes of electricity and stripped-back ballads, but everything has been softened into a kind of mature uniformity."},{"en":"stripped-back ballads","zh":"编配精简的抒情曲","source":"But Echo often feels like a grander version of E’s delicate cloud&B; it gestures toward experimentation, with flashes of electricity and stripped-back ballads, but everything has been softened into a kind of mature uniformity.","sourceHtml":"But Echo often feels like a grander version of E’s delicate cloud&amp;B; it gestures toward experimentation, with flashes of electricity and \u003cmark>stripped-back ballads\u003c/mark>, but everything has been softened into a kind of mature uniformity."},{"en":"cloud&B","zh":"带云雾质感的节奏布鲁斯","source":"But Echo often feels like a grander version of E’s delicate cloud&B; it gestures toward experimentation, with flashes of electricity and stripped-back ballads, but everything has been softened into a kind of mature uniformity.","sourceHtml":"But Echo often feels like a grander version of E’s \u003cmark>delicate cloud&amp;B\u003c/mark>; it gestures toward experimentation, with flashes of electricity and stripped-back ballads, but everything has been softened into a kind of mature uniformity."},{"en":"in one’s element","zh":"处于自己最自在、最擅长的状态","source":"Still, it’s a joy to hear him in his element again.","sourceHtml":"Still, it’s a joy to hear him \u003cmark>in his element\u003c/mark> again."},{"en":"triple entendre","zh":"一句话同时有三层含义","source":"He is once again “acid washing,” a cool triple entendre that suggests skincare, white jeans, and a soul whose impurities are blasted off.","sourceHtml":"He is once again “acid washing,” a cool \u003cmark>triple entendre\u003c/mark> that suggests skincare, white jeans, and a soul whose impurities are blasted off."},{"en":"have the final say","zh":"拥有最终决定权","source":"This was the first time he executive-produced on a full album, meaning he got his friends’ blessing to tweak their Ableton files and had the final say: “I don’t start every track, but I finish every track.”","sourceHtml":"This was the first time he executive-produced on a full album, meaning he got his friends’ blessing to tweak their Ableton files and \u003cmark>had the final say\u003c/mark>: “I don’t start every track, but I finish every track.”"},{"en":"get some bars off","zh":"把要唱的那几句说唱词发挥出来","source":"“I was trying to get these bars off,” he giggles.","sourceHtml":"“I was trying to \u003cmark>get these bars off\u003c/mark>,” he giggles."},{"en":"piss all over someone’s beat","zh":"把人家的伴奏糟蹋得一塌糊涂","source":"“You were always so nervous ’cause if he was gonna let you record, you can’t piss all over his beat.","sourceHtml":"“You were always so nervous ’cause if he was gonna let you record, you can’t \u003cmark>piss all over his beat\u003c/mark>."},{"en":"keening whale lament","zh":"高而悠长、像鲸鸣一样的哀声","source":"When Rosenberg sent him the beats for “Sky Burial” and “Echo,” which sounds like the keening whale lament of My Bloody Valentine’s “Touched” touched up into a trap beat, Arogundade thought to himself, Yeah, OK, this is the best production I’ve ever heard in my life, and I am not equipped to do what this track needs.","sourceHtml":"When Rosenberg sent him the beats for “Sky Burial” and “Echo,” which sounds like the \u003cmark>keening whale lament\u003c/mark> of My Bloody Valentine’s “Touched” touched up into a trap beat, Arogundade thought to himself, Yeah, OK, this is the best production I’ve ever heard in my life, and I am not equipped to do what this track needs."},{"en":"land on something","zh":"经过尝试后最终选定某种做法","source":"He wrote many different songs on those instrumental ideas until he landed on something that he felt the beat deserved.","sourceHtml":"He wrote many different songs on those instrumental ideas until he \u003cmark>landed on something\u003c/mark> that he felt the beat deserved."},{"en":"slip into vague artistspeak","zh":"不知不觉说起含糊的艺术家腔调","source":"He can sometimes slip into vague artistspeak (“I think my job and my responsibility is to protect the integrity of the work.","sourceHtml":"He can sometimes \u003cmark>slip into vague artistspeak\u003c/mark> (“I think my job and my responsibility is to protect the integrity of the work."},{"en":"do something justice","zh":"充分传达或呈现某事应有的分量","source":"But it feels like this manner comes less from a pompous place than necessity: “If I could do the idea or the feeling that I wanted to convey justice verbally and intellectually, then I would, but I can’t.","sourceHtml":"But it feels like this manner comes less from a pompous place than necessity: “If I could \u003cmark>do the idea or the feeling that I wanted to convey justice\u003c/mark> verbally and intellectually, then I would, but I can’t."},{"en":"textured, with sharp edges","zh":"肌理丰富、有锋利边缘感的","source":"Echo is “sandier, a lot more textured, with more sharp edges than E.","sourceHtml":"Echo is “\u003cmark>sandier, a lot more textured, with more sharp edges\u003c/mark> than E."},{"en":"field recordings","zh":"在现场环境中采集的声音","source":"“Swimming in Fountains” brims with field recordings: a train in Hong Kong, the walkie-talkie he carried while hiking in the mountains, a big body of water flowing down the mountain (“What’s the English word for this?","sourceHtml":"“Swimming in Fountains” brims with \u003cmark>field recordings\u003c/mark>: a train in Hong Kong, the walkie-talkie he carried while hiking in the mountains, a big body of water flowing down the mountain (“What’s the English word for this?"},{"en":"bombing tunnels","zh":"在隧道里大面积喷涂涂鸦","source":"There’s a spraying noise, which instantly recalls the years Arogundade spent bombing tunnels with Bladee in Stockholm.","sourceHtml":"There’s a spraying noise, which instantly recalls the years Arogundade spent \u003cmark>bombing tunnels\u003c/mark> with Bladee in Stockholm."},{"en":"topline","zh":"架在伴奏上的主旋律线","source":"So I was like, what if the spray is the topline?”","sourceHtml":"So I was like, what if the spray is \u003cmark>the topline\u003c/mark>?”"},{"en":"doubles as","zh":"同时还起到另一种作用","source":"“French Exit” doubles as a capsule of his unforgiving process.","sourceHtml":"“French Exit” \u003cmark>doubles as a capsule of his unforgiving process\u003c/mark>."},{"en":"come off as","zh":"给人的印象是某种样子","source":"“I’ve noticed that to some people the imagery comes off as apocalyptic or dystopian, which I can understand,” he says, “but to me it’s mostly about capturing the world as it is.” (Which is, I think to myself, quite apocalyptic and dystopian?)","sourceHtml":"“I’ve noticed that to some people the imagery \u003cmark>comes off as\u003c/mark> apocalyptic or dystopian, which I can understand,” he says, “but to me it’s mostly about capturing the world as it is.” (Which is, I think to myself, quite apocalyptic and dystopian?)"},{"en":"the long tail of something","zh":"某件事长期拖尾、至今仍有作用的余波","source":"When asked about political causes he cares about, Arogundade says he has and will always vote Left, calling out the recent surge of nationalism in Europe and scorning the countries that refuse to accept refugees whose lives were fucked up by the long tail of colonialism.","sourceHtml":"When asked about political causes he cares about, Arogundade says he has and will always vote Left, calling out the recent surge of nationalism in Europe and scorning the countries that refuse to accept refugees whose lives were fucked up by \u003cmark>the long tail of colonialism\u003c/mark>."},{"en":"be on benefits","zh":"靠政府福利救济维持生活","source":"“Especially for my mom, there were really difficult years when I was growing up where we were struggling a lot, we were on benefits.","sourceHtml":"“Especially for my mom, there were really difficult years when I was growing up where we were struggling a lot, \u003cmark>we were on benefits\u003c/mark>."},{"en":"trail off","zh":"话说到一半渐渐低下去、停住","source":"There were a few years where we just, didn’t really… yeah,” he trails off.","sourceHtml":"There were a few years where we just, didn’t really… yeah,” \u003cmark>he trails off\u003c/mark>."},{"en":"busk on the street","zh":"在街头卖艺","source":"He tells me a story about how a teacher from their school saw the two busking on the street in Stockholm, “banging this tambourine and playing nonsense on the guitar and screaming.","sourceHtml":"He tells me a story about how a teacher from their school saw the two \u003cmark>busking on the street\u003c/mark> in Stockholm, “banging this tambourine and playing nonsense on the guitar and screaming."},{"en":"put-on","zh":"故意装出来的一副样子","source":"His tenderness is also not a dramatic put-on.","sourceHtml":"His tenderness is also not a \u003cmark>dramatic put-on\u003c/mark>."},{"en":"angsty","zh":"带着焦灼不安和苦闷的","source":"Even with the inner warmth, Echo’s still angsty.","sourceHtml":"Even with the inner warmth, Echo’s still \u003cmark>angsty\u003c/mark>."},{"en":"headphone music","zh":"适合戴着耳机独自听的音乐","source":"“I always see it as headphone music, and that’s because that’s how I listen to stuff.","sourceHtml":"“I always see it as \u003cmark>headphone music\u003c/mark>, and that’s because that’s how I listen to stuff."},{"en":"formative figure","zh":"在一个人成长或创作起步时带来深远影响的人","source":"My favorite music is something that you would put on on the way home, when you’re walking or on the night bus.” As a 15 year old in the early 2010s, he and his friends would listen to Chief Keef and Waka Flocka Flame, but his real formative figure was Grimes.","sourceHtml":"My favorite music is something that you would put on on the way home, when you’re walking or on the night bus.” As a 15 year old in the early 2010s, he and his friends would listen to Chief Keef and Waka Flocka Flame, but his real \u003cmark>formative figure\u003c/mark> was Grimes."},{"en":"full-circle moments","zh":"兜了一圈、后来又和起点接上的时刻"," e impression that Drain Gang is “a lot druggier than we actually are in real life… people tend to think that we are just high all the time,” he laughs.","sourceHtml":"Growing older has given Arogundade a chance to reflect on the early misconceptions Drain Gang was saddled with, “that we are nihilistic or we’re an \u003cmark>internet-native collective\u003c/mark> somehow even though we all grew up together in the same city and none of us met online.” He also thinks that people are under the impression that Drain Gang is “a lot druggier than we actually are in real life… people tend to think that we are just high all the time,” he laughs."},{"en":"one’s life’s work","zh":"自己用一生投入的事业或作品","source":"“It’s crazy to have not only known somebody for that long, but also to have worked on your life’s work together for so long.”","sourceHtml":"“It’s crazy to have not only known somebody for that long, but also to have worked on \u003cmark>your life’s work\u003c/mark> together for so long.”"},{"en":"cult stars","zh":"拥有一群狂热忠实拥趸的明星","source":"Drain Gang and their Swedish friends have gone from outsider curios to cult stars.","sourceHtml":"Drain Gang and their Swedish friends have gone from outsider curios to \u003cmark>cult stars\u003c/mark>."},{"en":"pack a venue to the gills","zh":"把演出场地塞得水泄不通","source":"The first show I ever went to was Yung Lean with Drain Gang in 2017, at a moderately sized Greenpoint venue; in 2022, Drain Gang went on a world tour and packed the huge Knockdown Center in Queens to the gills.","sourceHtml":"The first show I ever went to was Yung Lean with Drain Gang in 2017, at a moderately sized Greenpoint venue; in 2022, Drain Gang went on a world tour and \u003cmark>packed the huge Knockdown Center in Queens to the gills\u003c/mark>."},{"en":"get one’s flowers","zh":"得到自己应得的赞赏和肯定","source":"Even though [Bladee’s] getting his flowers, we still feel a bit like a guilty pleasure, and it seems like that for a lot of people.","sourceHtml":"Even though [Bladee’s] \u003cmark>getting his flowers\u003c/mark>, we still feel a bit like a guilty pleasure, and it seems like that for a lot of people."},{"en":"a guilty pleasure","zh":"喜欢却有点不好意思承认的东西","source":"Even though [Bladee’s] getting his flowers, we still feel a bit like a guilty pleasure, and it seems like that for a lot of people.","sourceHtml":"Even though [Bladee’s] getting his flowers, we still feel a bit like \u003cmark>a guilty pleasure\u003c/mark>, and it seems like that for a lot of people."},{"en":"be wrapped up in crunch-time work","zh":"完全被最后冲刺阶段的工作占住","source":"He wasn’t sure, too wrapped up in crunch-time work to have any perspective yet.","sourceHtml":"He wasn’t sure, too \u003cmark>wrapped up in crunch-time work\u003c/mark> to have any perspective yet."},{"en":"kept to myself","zh":"把某样东西留给自己、不与人分享","source":"“I think 70% of everything I make is kept to myself,” he says.","sourceHtml":"“I think 70% of everything I make is \u003cmark>kept to myself\u003c/mark>,” he says."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
</body>
