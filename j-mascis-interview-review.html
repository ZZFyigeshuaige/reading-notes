let cards = [{"en":"make a pilgrimage","zh":"原义是“去朝圣”，这里半认真、半幽默地形容一家人年年固定前往同一个度假地，已经像一种仪式","source":"Every summer for the last 18 years, J Mascis’ family of three has made a pilgrimage four hours east across Massachusetts, from their home in Amherst to Provincetown, a fabulous vacation spot on the Cape’s northern tip.","sourceHtml":"Every summer for the last 18 years, J Mascis’ family of three has \u003cmark>made a pilgrimage\u003c/mark> four hours east across Massachusetts, from their home in Amherst to Provincetown, a fabulous vacation spot on the Cape’s northern tip."},{"en":"a procession of friends and family","zh":"一拨接一拨、接连不断的亲友","source":"For three weeks, they ride bikes, swim, and share suppers with a procession of friends and family.","sourceHtml":"For three weeks, they ride bikes, swim, and share suppers with \u003cmark>a procession of\u003c/mark> friends and family."},{"en":"wear someone out","zh":"把某人累垮、耗尽某人的精力","source":"When I stopped by in mid-August, Mascis admitted this year’s trip was wearing him out: His two sisters and brother had just spent a week nearby, trying their best to recreate the camaraderie of their childhoods spent in another town on the Cape.","sourceHtml":"When I stopped by in mid-August, Mascis admitted this year’s trip was \u003cmark>wearing him out\u003c/mark>: His two sisters and brother had just spent a week nearby, trying their best to recreate the camaraderie of their childhoods spent in another town on the Cape."},{"en":"a few doors down","zh":"隔几户、附近不远处","source":"Kim Gordon and Chloe Sevigny both have houses a few doors down, too; Daisy von Furth, who founded the fashion line X-girl with Gordon three decades ago, was crashing in the bedroom that Mascis’ son, Rory, recently vacated so he could start his first year at New York’s Pratt Institute.","sourceHtml":"Kim Gordon and Chloe Sevigny both have houses \u003cmark>a few doors down\u003c/mark>, too; Daisy von Furth, who founded the fashion line X-girl with Gordon three decades ago, was crashing in the bedroom that Mascis’ son, Rory, recently vacated so he could start his first year at New York’s Pratt Institute."},{"en":"crash in/at somewhere","zh":"口语中指临时借宿、凑合住下，语气比 更随意","source":"Kim Gordon and Chloe Sevigny both have houses a few doors down, too; Daisy von Furth, who founded the fashion line X-girl with Gordon three decades ago, was crashing in the bedroom that Mascis’ son, Rory, recently vacated so he could start his first year at New York’s Pratt Institute.","sourceHtml":"Kim Gordon and Chloe Sevigny both have houses a few doors down, too; Daisy von Furth, who founded the fashion line X-girl with Gordon three decades ago, was \u003cmark>crashing in\u003c/mark> the bedroom that Mascis’ son, Rory, recently vacated so he could start his first year at New York’s Pratt Institute."},{"en":"a vacation from this vacation","zh":"从“这场度假”中再休个假","source":"“I’m going to need a vacation from this vacation.”","sourceHtml":"“I’m going to need a \u003cmark>vacation\u003c/mark> from \u003cmark>this\u003c/mark> \u003cmark>vacation\u003c/mark>.”"},{"en":"be due somewhere","zh":"按安排应在某时抵达某地","source":"They were due, by week’s end, in New York, where Mascis would play several shows to mark the release of There Near, the ninth or 13th album by Mascis’ band, Dinosaur Jr., depending on how you do the math.","sourceHtml":"They were \u003cmark>due\u003c/mark>, by week’s end, in New York, where Mascis would play several shows to mark the release of There Near, the ninth or 13th album by Mascis’ band, Dinosaur Jr., depending on how you do the math."},{"en":"depending on how you do the math","zh":"取决于你怎么算","source":"They were due, by week’s end, in New York, where Mascis would play several shows to mark the release of There Near, the ninth or 13th album by Mascis’ band, Dinosaur Jr., depending on how you do the math.","sourceHtml":"They were due, by week’s end, in New York, where Mascis would play several shows to mark the release of There Near, the ninth or 13th album by Mascis’ band, Dinosaur Jr., \u003cmark>depending on how you do the math\u003c/mark>."},{"en":"squeeze everything into the car","zh":"把所有东西硬塞进车里","source":"But the pair worried they wouldn’t be able to squeeze everything into their car, so they asked a friend to haul some stuff to Amherst in his pickup.","sourceHtml":"But the pair worried they wouldn’t be able to \u003cmark>squeeze everything into\u003c/mark> their car, so they asked a friend to haul some stuff to Amherst in his pickup."},{"en":"like the dog owner who simply goes where it is led","zh":"通常是人遛狗，这里却是主人被狗领着走","source":"And then he decided he was going home with them, two days early, like the dog owner who simply goes where it is led.","sourceHtml":"And then he decided he was going home with them, two days early, \u003cmark>like\u003c/mark> the \u003cmark>dog\u003c/mark> \u003cmark>owner\u003c/mark> \u003cmark>who\u003c/mark> \u003cmark>simply\u003c/mark> goes \u003cmark>where\u003c/mark> it is led."},{"en":"I’m outta here","zh":"非常口语的“我走了／我撤了”， 是 的口语缩合，带有说走就走的干脆感","source":"“The minute that guitar and amp left, J was like, ‘I’m outta here.’ Kim and I were cracking up—take his amp away, and he’s gone,” Reichenheim tells me a few weeks later from her sun porch back in Amherst.","sourceHtml":"“The minute that guitar and amp left, J was like, ‘\u003cmark>I’m outta here\u003c/mark>.’ Kim and I were cracking up—take his amp away, and he’s gone,” Reichenheim tells me a few weeks later from her sun porch back in Amherst."},{"en":"crack up","zh":"笑得不行、笑翻了","source":"“The minute that guitar and amp left, J was like, ‘I’m outta here.’ Kim and I were cracking up—take his amp away, and he’s gone,” Reichenheim tells me a few weeks later from her sun porch back in Amherst.","sourceHtml":"“The minute that guitar and amp left, J was like, ‘I’m outta here.’ Kim and I were \u003cmark>cracking up\u003c/mark>—take his amp away, and he’s gone,” Reichenheim tells me a few weeks later from her sun porch back in Amherst."},{"en":"one giant guitar solo","zh":"妻子把他整个人生比作“一段巨大的吉他独奏”","source":"“His life is like one giant guitar solo.","sourceHtml":"“His life is like one \u003cmark>giant\u003c/mark> \u003cmark>guitar\u003c/mark> \u003cmark>solo\u003c/mark>."},{"en":"an unlikely but reliably invigorating guitar hero","zh":"一位“不太像吉他英雄”的吉他英雄，却总能稳定地带来振奋感","source":"During the last 42 years, Mascis has become an unlikely but reliably invigorating guitar hero.","sourceHtml":"During the last 42 years, Mascis has become \u003cmark>an unlikely but reliably invigorating guitar hero\u003c/mark>."},{"en":"recast A at B","zh":"把 重新塑造成 的样子","source":"With Dinosaur Jr., he has recast the exquisite ache of Neil Young at obliterative volume, with hooks that seem both effortless and ceaseless.","sourceHtml":"With Dinosaur Jr., he has \u003cmark>recast the exquisite ache of Neil Young at obliterative volume\u003c/mark>, with hooks that seem both effortless and ceaseless."},{"en":"exquisite ache","zh":"精致、细腻而动人的痛感","source":"With Dinosaur Jr., he has recast the exquisite ache of Neil Young at obliterative volume, with hooks that seem both effortless and ceaseless.","sourceHtml":"With Dinosaur Jr., he has \u003cmark>recast the exquisite ache of Neil Young at obliterative volume\u003c/mark>, with hooks that seem both effortless and ceaseless."},{"en":"obliterative volume","zh":"足以把一切轰平的音量","source":"With Dinosaur Jr., he has recast the exquisite ache of Neil Young at obliterative volume, with hooks that seem both effortless and ceaseless.","sourceHtml":"With Dinosaur Jr., he has \u003cmark>recast the exquisite ache of Neil Young at obliterative volume\u003c/mark>, with hooks that seem both effortless and ceaseless."},{"en":"an under-heralded folk-rock stylist","zh":"一位没有得到足够赞誉的民谣摇滚风格家","source":"A string of self-made solo records in recent years has showcased an under-heralded folk-rock stylist, too, a gentle singer who understands the frisson of an unhinged electric solo in an acoustic song.","sourceHtml":"A string of self-made solo records in recent years has showcased \u003cmark>an under-heralded folk-rock stylist\u003c/mark>, too, a gentle singer who understands the frisson of an unhinged electric solo in an acoustic song."},{"en":"the frisson of an unhinged electric solo in an acoustic song","zh":"原声歌曲中突然出现一段狂放电吉他独奏所带来的刺激与战栗","source":"A string of self-made solo records in recent years has showcased an under-heralded folk-rock stylist, too, a gentle singer who understands the frisson of an unhinged electric solo in an acoustic song.","sourceHtml":"A string of self-made solo records in recent years has showcased an under-heralded folk-rock stylist, too, a gentle singer who understands \u003cmark>the frisson of an unhinged electric solo in an acoustic song\u003c/mark>."},{"en":"hoist someone out of retirement","zh":"把某人“拉”出退休状态、促其复出","source":"He also helped hoist the Stooges’ Ron Asheton out of retirement before his death, started a band with Widespread Panic’s Dave Schools, and once sat in with Tony Bennett for a taping of MTV Unplugged, taking the lead on a song he admitted he’d never heard. (“The high and low point of my career,” he tells me, “because all my Italian relatives love Tony Bennett.","sourceHtml":"He also helped hoist the Stooges’ Ron Asheton \u003cmark>out of retirement\u003c/mark> before his death, started a band with Widespread Panic’s Dave Schools, and once sat in with Tony Bennett for a taping of MTV Unplugged, taking the lead on a song he admitted he’d never heard. (“The high and low point of my career,” he tells me, “because all my Italian relatives love Tony Bennett."},{"en":"sit in with","zh":"临时加入某位音乐人或乐队同台演奏，是现场音乐报道中的常见表达","source":"He also helped hoist the Stooges’ Ron Asheton out of retirement before his death, started a band with Widespread Panic’s Dave Schools, and once sat in with Tony Bennett for a taping of MTV Unplugged, taking the lead on a song he admitted he’d never heard. (“The high and low point of my career,” he tells me, “because all my Italian relatives love Tony Bennett.","sourceHtml":"He also helped hoist the Stooges’ Ron Asheton out of retirement before his death, started a band with Widespread Panic’s Dave Schools, and once sat in with Tony Bennett for a taping of MTV Unplugged, taking the lead on a song he admitted he’d never heard. (“The high and low point of my career,” he tells me, “because all my Italian relatives love Tony Bennett."},{"en":"wind up on the cutting room floor","zh":"最终被剪掉","source":"But I wound up on the cutting room floor.”) When Kurt Cobain asked him to join Nirvana in 1989, he essentially shrugged.","sourceHtml":"But I \u003cmark>wound up on the cutting room floor\u003c/mark>.”) When Kurt Cobain asked him to join Nirvana in 1989, he essentially shrugged."},{"en":"the floor phase","zh":"靠睡地板完成低成本巡演的阶段","source":"But I wound up on the cutting room floor.”) When Kurt Cobain asked him to join Nirvana in 1989, he essentially shrugged.","sourceHtml":"But I \u003cmark>wound up on the cutting room floor\u003c/mark>.”) When Kurt Cobain asked him to join Nirvana in 1989, he essentially shrugged."},{"en":"the trappings of a guitar god","zh":"吉他英雄身份附带的外在排场、姿态和符号","source":"Mascis, however, avoids the usual trappings of a guitar god.","sourceHtml":"Mascis, however, avoids \u003cmark>the usual trappings of a guitar god\u003c/mark>."},{"en":"exude no amount of cocksure bravado","zh":"完全不散发那种自以为是、盛气凌人的逞强气场","source":"He exudes no amount of cocksure bravado, admits he doesn’t know how to play anyone else’s songs unless he studies them first on YouTube, and, even at 60, seems to doubt that he’s even a very good guitarist.","sourceHtml":"He \u003cmark>exudes no amount of cocksure bravado\u003c/mark>, admits he doesn’t know how to play anyone else’s songs unless he studies them first on YouTube, and, even at 60, seems to doubt that he’s even a very good guitarist."},{"en":"Marshall stacks","zh":"由 音箱箱头和箱体叠成的高墙，是经典摇滚舞台音量与视觉威势的象征","source":"Onstage with Dinosaur Jr., he is largely still, save for his fingers and feet, standing like someone who hopes to be swallowed by the triple tower of Marshall stacks behind him.","sourceHtml":"Onstage with Dinosaur Jr., he is largely still, save for his fingers and feet, standing like someone who hopes to be swallowed by the triple tower of \u003cmark>Marshall\u003c/mark> \u003cmark>stacks\u003c/mark> behind him."},{"en":"become a punchline","zh":"沦为笑话或固定笑梗","source":"Throughout his career, Mascis has said so little to so many interviewers that it has become a punchline.","sourceHtml":"Throughout his career, Mascis has said so little to so many interviewers that it has become \u003cmark>a punchline\u003c/mark>."},{"en":"laconic, phlegmatic, apathetic, listless","zh":"四词都带“反应少”的表象，但侧重不同：寡言、冷静迟钝、漠不关心、缺乏活力","source":"The Guardian called him “laconic, phlegmatic, apathetic, listless” in 2024.","sourceHtml":"The Guardian called him “\u003cmark>laconic\u003c/mark>, \u003cmark>phlegmatic\u003c/mark>, \u003cmark>apathetic\u003c/mark>, \u003cmark>listless\u003c/mark>” in 2024."},{"en":"emotional repository","zh":"储存情感的容器或仓库","source":"But I’ve always heard Mascis’ enormous catalogue of songs as his vast emotional repository, the place where a taciturn guy and explosive guitarist has sunk a lifetime of lingering sadness without anyone ever really noticing.","sourceHtml":"But I’ve always heard Mascis’ enormous catalogue of songs as his vast \u003cmark>emotional repository\u003c/mark>, the place where a taciturn guy and explosive guitarist has sunk a lifetime of lingering sadness without anyone ever really noticing."},{"en":"sink a lifetime of lingering sadness into something","zh":"把一生挥之不去的悲伤沉入某物","source":"But I’ve always heard Mascis’ enormous catalogue of songs as his vast emotional repository, the place where a taciturn guy and explosive guitarist has sunk a lifetime of lingering sadness without anyone ever really noticing.","sourceHtml":"But I’ve always heard Mascis’ enormous catalogue of songs as his vast emotional repository, the place where a taciturn guy and explosive guitarist has \u003cmark>sunk a lifetime of lingering sadness\u003c/mark> without anyone ever really noticing."},{"en":"redouble its legacy","zh":"进一步大幅增强其历史影响与分量","source":"I wanted to know if that was right, especially because, in the last 20 years, he has accomplished one of rock’n’roll’s rarest feats: reuniting his classic indie rock band and redoubling its legacy by making some of the most compelling records of his lifetime.","sourceHtml":"I wanted to know if that was right, especially because, in the last 20 years, he has accomplished one of rock’n’roll’s rarest feats: reuniting his classic indie rock band and \u003cmark>redoubling its legacy\u003c/mark> by making some of the most compelling records of his lifetime."},{"en":"unimpeachable records","zh":"品质无可质疑、几乎挑不出毛病的唱片","source":"From 1985 to 1988, Mascis, bassist Lou Barlow, and drummer Murph issued a series of three unimpeachable records.","sourceHtml":"From 1985 to 1988, Mascis, bassist Lou Barlow, and drummer Murph issued a series of three \u003cmark>unimpeachable\u003c/mark> records."},{"en":"exemplar","zh":"典范、代表性范例","source":"But the original Dinosaur Jr. trio remains one of the true lasting exemplars of indie rock, as formative for alternative rock’s ascent in the ’90s as for the modern mix of indie rock and country exemplified by, say, Wednesday and M.J.","sourceHtml":"But the original Dinosaur Jr. trio remains one of the true lasting \u003cmark>exemplars\u003c/mark> of indie rock, as formative for alternative rock’s ascent in the ’90s as for the modern mix of indie rock and country exemplified by, say, Wednesday and M.J."},{"en":"formative for","zh":"对某种风格的形成具有塑造作用","source":"But the original Dinosaur Jr. trio remains one of the true lasting exemplars of indie rock, as formative for alternative rock’s ascent in the ’90s as for the modern mix of indie rock and country exemplified by, say, Wednesday and M.J.","sourceHtml":"But the original Dinosaur Jr. trio remains one of the true lasting exemplars of indie rock, as \u003cmark>formative\u003c/mark> for alternative rock’s ascent in the ’90s as for the modern mix of indie rock and country exemplified by, say, Wednesday and M.J."},{"en":"soundalike","zh":"声音很像某位音乐人或乐队的作品／模仿者，有时隐含“像得过头”的意味","source":"They still don’t really like each other.","sourceHtml":"They still don’t really like each other."},{"en":"sad songs at full blast","zh":"把悲伤的歌开到最大音量","source":"Stephen Malkmus echoed him: “You’re Living All Over Me gave us ideas about how to handle the classic rock we all grew up with.” Micah Nelson, the country music scion who plays the guitar Mascis helped design for Fender in Crazy Horse, told me Dinosaur Jr. makes “sad songs at full blast.”","sourceHtml":"Stephen Malkmus echoed him: “You’re Living All Over Me gave us ideas about how to handle the classic rock we all grew up with.” Micah Nelson, the country music scion who plays the guitar Mascis helped design for Fender in Crazy Horse, told me Dinosaur Jr. makes “\u003cmark>sad\u003c/mark> \u003cmark>songs\u003c/mark> at \u003cmark>full\u003c/mark> \u003cmark>blast\u003c/mark>.”"},{"en":"crash someone’s vacation","zh":"不请自来地闯入某人的假期","source":"So I crashed Mascis’ family vacation in Cape Cod.","sourceHtml":"So I \u003cmark>crashed Mascis’ family vacation\u003c/mark> in Cape Cod."},{"en":"depression had set in","zh":"抑郁逐渐出现并扎下根","source":"“But he must have enjoyed it.” He joked about how he might have acquired tennis elbow during an alien abduction, raved about recent additions to a guitar collection so vast he lost count long ago, and talked about how depression had set in when he was a teenager and never quite vanished.","sourceHtml":"“But he must have enjoyed it.” He joked about how he might have acquired tennis elbow during an alien abduction, raved about recent additions to a guitar collection so vast he lost count long ago, and talked about how \u003cmark>depression\u003c/mark> \u003cmark>had\u003c/mark> \u003cmark>set\u003c/mark> in when he was a teenager and never quite vanished."},{"en":"think about doing rather than simply doing","zh":"不断思考“要不要做、为什么做”，而不直接行动","source":"He talked about fatherhood and finding something like peace after his career fell apart in the late ’90s, the frustrations of tinnitus and our collective tendency to overanalyze everything we do, to think about doing rather than simply doing.","sourceHtml":"He talked \u003cmark>about\u003c/mark> fatherhood and finding something like peace after his career fell apart in the late ’90s, the frustrations of tinnitus and our collective tendency to overanalyze everything we do, to \u003cmark>think\u003c/mark> \u003cmark>about\u003c/mark> doing \u003cmark>rather\u003c/mark> \u003cmark>than\u003c/mark> \u003cmark>simply\u003c/mark> doing."},{"en":"the ups or the downs / just like to cruise","zh":"表面说骑车不爱爬坡或下坡，实际上也是人物隐喻：他厌恶人生的剧烈起伏，只想按自己的速度平稳向前","source":"“I just like to cruise.”","sourceHtml":"“I \u003cmark>just\u003c/mark> \u003cmark>like\u003c/mark> to \u003cmark>cruise\u003c/mark>.”"},{"en":"in-crowd","zh":"一个环境中最受欢迎、最有地位的核心小圈子","source":"Mascis remembers himself as part of the Amherst in-crowd, a smart and popular kid.","sourceHtml":"Mascis remembers himself as part of the Amherst \u003cmark>in-crowd\u003c/mark>, a smart and popular kid."},{"en":"a pivotal life memory","zh":"改变或塑造人生走向的关键记忆","source":"He was a strong infielder who loved the Boston Red Sox and still sees their 1975 World Series loss to the Cincinnati Reds as a pivotal life memory—that’s how he learned about disappointment.","sourceHtml":"He was a strong infielder who loved the Boston Red Sox and still sees their 1975 World Series loss to the Cincinnati Reds as \u003cmark>a pivotal life memory\u003c/mark>—that’s how he learned about disappointment."},{"en":"drop out of society / turn one’s back on society","zh":"退出主流社会／背弃社会","source":"In fact, when Mascis stops to consider it, that might have been why, when he was 13, he decided the time had come to drop out of society.","sourceHtml":"In fact, when Mascis stops to consider it, that might have been why, when he was 13, he decided the time had come to \u003cmark>drop out of society\u003c/mark>."},{"en":"a switch flipped","zh":"像开关突然被拨动一样，人的态度或状态骤然改变","source":"“It could have played a role?” He’d been strong in baseball tryouts that year, but suddenly a switch flipped.","sourceHtml":"“It could have played a role?” He’d been strong in baseball tryouts that year, but suddenly \u003cmark>a switch flipped\u003c/mark>."},{"en":"take the pressure off someone to do something","zh":"减轻某人必须做到某事的压力","source":"His older brother, Mike, was a good kid and an altar boy, taking the pressure off Mascis to excel at much of anything.","sourceHtml":"His older brother, Mike, was a good kid and an altar boy, \u003cmark>taking the pressure off Mascis to excel at much of anything\u003c/mark>."},{"en":"fend for oneself","zh":"在缺少照料或帮助的情况下自己照顾自己、独自应付生活","source":"He learned to fend for himself, find his own breakfast, and get himself to school.","sourceHtml":"He learned to \u003cmark>fend for himself\u003c/mark>, find his own breakfast, and get himself to school."},{"en":"cobble together","zh":"用零散、并不匹配的材料勉强拼出某物","source":"But she did help him cobble together a drum kit with pieces gifted by a family friend and augmented with parts picked up around town for $30 or so.","sourceHtml":"But she did help him \u003cmark>cobble together a drum kit\u003c/mark> with pieces gifted by a family friend and augmented with parts picked up around town for $30 or so."},{"en":"motley kit or not","zh":"不管这套鼓是否七拼八凑","source":"Motley kit or not, Mascis quickly became known as a drumming hotshot in Amherst.","sourceHtml":"\u003cmark>Motley kit or not\u003c/mark>, Mascis quickly became known as a drumming hotshot in Amherst."},{"en":"prop something up against something","zh":"把某物斜靠在另一物上支住","source":"He’d just bought his used kit from a pawnshop and played along to Jimi Hendrix and Steppenwolf in his bedroom with his mattress propped up against a window to soften the sound.","sourceHtml":"He’d just bought his used kit from a pawnshop and played along to Jimi Hendrix and Steppenwolf in his bedroom with his mattress \u003cmark>propped up against\u003c/mark> a window to soften the sound."},{"en":"skip class","zh":"翘课、逃课","source":"Motley kit or not, Mascis quickly became known as a drumming hotshot in Amherst.","sourceHtml":"Motley kit or not, Mascis quickly became known as a drumming hotshot in Amherst."},{"en":"rip into a solo","zh":"猛烈而充满能量地开始一段独奏","source":"“It was fascinating to see this guy who could play jazz just rip into these insane solos, half-jazz, half-hardcore.","sourceHtml":"“It was fascinating to see this guy who could play jazz just \u003cmark>rip into these insane solos\u003c/mark>, half-jazz, half-hardcore."},{"en":"a groupie for a band","zh":"热衷追随某支乐队的人","source":"Murph soon became a groupie for Deep Wound, the blistering hardcore quartet Mascis started with Barlow, another teenage guitarist from a nearby town named Westfield.","sourceHtml":"Murph soon became \u003cmark>a groupie for Deep Wound\u003c/mark>, the blistering hardcore quartet Mascis started with Barlow, another teenage guitarist from a nearby town named Westfield."},{"en":"blistering hardcore","zh":"迅猛、炽烈、极具攻击性的硬核朋克","source":"Murph soon became a groupie for Deep Wound, the blistering hardcore quartet Mascis started with Barlow, another teenage guitarist from a nearby town named Westfield.","sourceHtml":"Murph soon became a groupie for Deep Wound, the \u003cmark>blistering\u003c/mark> \u003cmark>hardcore\u003c/mark> quartet Mascis started with Barlow, another teenage guitarist from a nearby town named Westfield."},{"en":"put out a record","zh":"发行唱片，语气比 更口语","source":"But they lasted long enough to put out a nine-song 7\", appear on a compilation organized by Mascis’ new University of Massachusetts friend Gerard Cosloy, and get savaged by Steve Albini in a zine.","sourceHtml":"But they lasted long enough to \u003cmark>put out\u003c/mark> a nine-song 7&quot;, appear on a compilation organized by Mascis’ new University of Massachusetts friend Gerard Cosloy, and get savaged by Steve Albini in a zine."},{"en":"get savaged by a critic","zh":"遭评论者猛烈抨击","source":"But they lasted long enough to put out a nine-song 7\", appear on a compilation organized by Mascis’ new University of Massachusetts friend Gerard Cosloy, and get savaged by Steve Albini in a zine.","sourceHtml":"But they lasted long enough to put out a nine-song 7&quot;, appear on a compilation organized by Mascis’ new University of Massachusetts friend Gerard Cosloy, and \u003cmark>get savaged by\u003c/mark> Steve Albini in a zine."},{"en":"swallow one’s self-doubt","zh":"压下、默默忍住自我怀疑","source":"Barlow opted to swallow this self-doubt because he believed in Mascis’ musical vision.","sourceHtml":"Barlow opted to \u003cmark>swallow this self-doubt\u003c/mark> because he believed in Mascis’ musical vision."},{"en":"out of necessity","zh":"出于实际需要、不得已而为之","source":"Mascis had started writing songs in Deep Wound out of necessity, simply because they needed more material.","sourceHtml":"Mascis had started writing songs in Deep Wound \u003cmark>out of necessity\u003c/mark>, simply because they needed more material."},{"en":"something in between","zh":"介于两端之间的东西","source":"Mascis wanted to do something in between, Barlow remembers, something that was heavy but not metal.","sourceHtml":"Mascis wanted to do \u003cmark>something in between\u003c/mark>, Barlow remembers, something that was heavy but not metal."},{"en":"play high up the neck","zh":"在琴颈较高的把位演奏，通常产生更高的音域，使贝斯不只承担低频根音，还能与吉他形成旋律和摩擦","source":"The idea was for Barlow, now on bass, to play high up his instrument’s neck, pushing against the guitar’s lead.","sourceHtml":"The idea was for Barlow, now on bass, to play \u003cmark>high up his instrument’s neck\u003c/mark>, pushing against the guitar’s lead."},{"en":"mastermind","zh":"在幕后构思、策划并设计某事","source":"“The way I play bass to J’s guitar was something that J masterminded, and I completely believed in it.","sourceHtml":"“The way I play bass to J’s guitar was something that J \u003cmark>masterminded\u003c/mark>, and I completely believed in it."},{"en":"affix the Jr.","zh":"把 附加到名称后","source":"The band’s self-titled 1985 debut, called Dinosaur before a lawsuit forced them to affix the Jr., zig-zagged through ragged post-punk and raging psychedelia, spurred on by the stylistic breakthrough of Meat Puppets II.","sourceHtml":"The band’s self-titled 1985 debut, called Dinosaur before a lawsuit forced them to \u003cmark>affix the Jr.\u003c/mark>, zig-zagged through ragged post-punk and raging psychedelia, spurred on by the stylistic breakthrough of Meat Puppets II."},{"en":"zig-zag through styles","zh":"在不同风格间曲折穿行，强调作品不断快速转向","source":"The band’s self-titled 1985 debut, called Dinosaur before a lawsuit forced them to affix the Jr., zig-zagged through ragged post-punk and raging psychedelia, spurred on by the stylistic breakthrough of Meat Puppets II.","sourceHtml":"The band’s self-titled 1985 debut, called Dinosaur before a lawsuit forced them to affix the Jr., \u003cmark>zig-zagged through\u003c/mark> ragged post-punk and raging psychedelia, spurred on by the stylistic breakthrough of Meat Puppets II."},{"en":"spur something on","zh":"推动、刺激某事发展","source":"The band’s self-titled 1985 debut, called Dinosaur before a lawsuit forced them to affix the Jr., zig-zagged through ragged post-punk and raging psychedelia, spurred on by the stylistic breakthrough of Meat Puppets II.","sourceHtml":"The band’s self-titled 1985 debut, called Dinosaur before a lawsuit forced them to affix the Jr., zig-zagged through ragged post-punk and raging psychedelia, spurred on by the stylistic breakthrough of Meat Puppets II."},{"en":"mild underground fanfare","zh":"在地下音乐圈获得有限度的关注和喝彩","source":"Homestead Records, operated by Mascis’ new pal Cosloy, released it to mild underground fanfare.","sourceHtml":"Homestead Records, operated by Mascis’ new pal Cosloy, released it to \u003cmark>mild underground fanfare\u003c/mark>."},{"en":"signal a true arrival","zh":"真正宣告一位音乐人或乐队已经成熟并站稳位置，是乐评常用的“正式登场”表达","source":"But it was the honey-sweet hooks of 1987’s You’re Living All Over Me that signaled a true arrival.","sourceHtml":"But it was the honey-sweet hooks of 1987’s You’re Living All Over Me that \u003cmark>signaled a true arrival\u003c/mark>."},{"en":"collateral damage","zh":"原指军事行动造成的附带伤害","source":"“Gerard was kind of collateral damage to me achieving my goal,” says Mascis.","sourceHtml":"“Gerard was kind of \u003cmark>collateral\u003c/mark> \u003cmark>damage\u003c/mark> to me achieving my goal,” says Mascis."},{"en":"for fear of doing something","zh":"唯恐、以免发生某事","source":"Having navigated social anxiety since he was a kid, Barlow had learned to be silent in Mascis’ presence for fear of causing conflict.","sourceHtml":"Having navigated social anxiety since he was a kid, Barlow had learned to be silent in Mascis’ presence \u003cmark>for fear of causing conflict\u003c/mark>."},{"en":"catch someone’s ear / catch someone’s eye","zh":"分别是“引起某人的听觉注意”和“吸引某人的目光／兴趣”","source":"But his transfixing lo-fi montage, “Poledo,” which closed out You’re Living All Over Me, caught the ear of a Smith College DJ, Kathleen Billus.","sourceHtml":"But his transfixing lo-fi montage, “Poledo,” which closed out You’re Living All Over Me, \u003cmark>caught the ear of\u003c/mark> a Smith College DJ, Kathleen Billus."},{"en":"crawl out of one’s shell","zh":"慢慢走出封闭状态，开始变得自信、愿意表达","source":"I knew it bugged J, but I didn’t care.” For nearly four decades, Mascis has insisted he liked Barlow just fine until this point—until, as he puts it, the nerd who would have been shoved into lockers began to crawl out of his shell.","sourceHtml":"I knew it bugged J, but I didn’t care.” For nearly four decades, Mascis has insisted he liked Barlow just fine until this point—until, as he puts it, the nerd who would have been shoved into lockers began to \u003cmark>crawl out of his shell\u003c/mark>."},{"en":"off-putting","zh":"令人反感、不舒服或想保持距离","source":"“It was off-putting to me every time.” I ask him if it still is, and he grins: “Depends.”","sourceHtml":"“It was \u003cmark>off-putting\u003c/mark> to me every time.” I ask him if it still is, and he grins: “Depends.”"},{"en":"a long-simmering situation boils over","zh":"酝酿已久的局势终于沸腾并溢出","source":"Three months after Barlow met Billus, during a December show in Connecticut, he and Mascis fought on stage, lunging and screaming at one another while Murph cupped his hands over his eyes, trying to see this long-simmering situation boil over amid the stage lights. (Remarkably, you can watch the footage online; I always find myself almost cheering.) Mascis believed Barlow was ruining a song on purpose, trying to lash out.","sourceHtml":"Three months after Barlow met Billus, during a December show in Connecticut, he and Mascis fought on stage, lunging and screaming at one another while Murph cupped his hands over his eyes, trying to see this \u003cmark>long-simmering situation boil over\u003c/mark> amid the stage lights. (Remarkably, you can watch the footage online; I always find myself almost cheering.) Mascis believed Barlow was ruining a song on purpose, trying to lash out."},{"en":"lash out","zh":"因愤怒或受伤而猛烈攻击、发泄","source":"Three months after Barlow met Billus, during a December show in Connecticut, he and Mascis fought on stage, lunging and screaming at one another while Murph cupped his hands over his eyes, trying to see this long-simmering situation boil over amid the stage lights. (Remarkably, you can watch the footage online; I always find myself almost cheering.) Mascis believed Barlow was ruining a song on purpose, trying to lash out.","sourceHtml":"Three months after Barlow met Billus, during a December show in Connecticut, he and Mascis fought on stage, lunging and screaming at one another while he first iteration of Dinosaur Jr."},{"en":"when Lou left the band","zh":"字面是“ 离队时”","source":"“Oh, when Lou left the band,” he says, the phrase he always uses for the person he fired.","sourceHtml":"“Oh, \u003cmark>when\u003c/mark> \u003cmark>Lou\u003c/mark> \u003cmark>left\u003c/mark> the \u003cmark>band\u003c/mark>,” he says, the phrase he always uses for the person he fired."},{"en":"a weird ride","zh":"一段离奇、起伏不定的经历","source":"The ’90s were, for Mascis, a weird ride.","sourceHtml":"The ’90s were, for Mascis, \u003cmark>a weird ride\u003c/mark>."},{"en":"dial back the guitar","zh":"降低吉他的强度、音量或存在感","source":"He signed a major-label deal after Barlow left, finally getting his matching drum kit but strangely dialing back the guitar on their Sire debut, 1991’s Green Mind.","sourceHtml":"He signed a major-label deal after Barlow left, finally getting his matching drum kit but strangely \u003cmark>dialing back the guitar\u003c/mark> on their Sire debut, 1991’s Green Mind."},{"en":"opt out of","zh":"主动选择不参加","source":"“You think that’s how majors sound, but I had no idea.” Green Mind barely broke into the charts, but seven months later, the band he’d opted out of, Nirvana, began to dominate them.","sourceHtml":"“You think that’s how majors sound, but I had no idea.” Green Mind barely broke into the charts, but seven months later, the band he’d \u003cmark>opted out of\u003c/mark>, Nirvana, began to dominate them."},{"en":"harangue someone","zh":"对某人进行长时间、激烈的训斥或说教","source":"The ’90s were, for Mascis, a weird ride.","sourceHtml":"The ’90s were, for Mascis, a weird ride."},{"en":"the burning desire to make it","zh":"获得成功、闯出名堂的强烈欲望","source":"I didn’t have the burning desire to make it, to prove to those kids in high school I was whatever.” But the next-Nirvana expectation dogged Mascis through the ’90s, as it did so many of his peers.","sourceHtml":"I didn’t have \u003cmark>the burning desire to make it\u003c/mark>, to prove to those kids in high school I was whatever.” Bu c/mark>."},{"en":"the beginning of the end","zh":"终结的开端","source":"For the first time, Sire told Mascis that Dinosaur Jr.’s new album, Hand It Over, needed a hit; that was the beginning of the end.","sourceHtml":"For the first time, Sire told Mascis that Dinosaur Jr.’s new album, Hand It Over, needed a hit; that was \u003cmark>the beginning of the end\u003c/mark>."},{"en":"ups-and-downs","zh":"起起落落、顺境与逆境","source":"The ups-and-downs of a dozen years in Dinosaur Jr. and the ’90s at large had left their mark on Mascis.","sourceHtml":"The \u003cmark>ups-and-downs\u003c/mark> of a dozen years in Dinosaur Jr. and the ’90s at large had left their mark on Mascis."},{"en":"leave one’s mark on someone","zh":"在某人身上留下持久影响或创伤","source":"The ups-and-downs of a dozen years in Dinosaur Jr. and the ’90s at large had left their mark on Mascis.","sourceHtml":"The ups-and-downs of a dozen years in Dinosaur Jr. and the ’90s at large had \u003cmark>left their mark on\u003c/mark> Mascis."},{"en":"need all the help one can get","zh":"需要一切可能获得的帮助，暗示当事人已经难以靠自己应付","source":"“I was just kind of depressed, and I needed all the help I could get,” he remembers.","sourceHtml":"“I was just kind of depressed, and \u003cmark>I needed all the help I could get\u003c/mark>,” he remembers."},{"en":"helpful if not transformative","zh":"即便称不上彻底改变人生，至少确实有帮助","source":"It was helpful if not transformative.","sourceHtml":"It was helpful \u003cmark>if not transformative\u003c/mark>."},{"en":"engage","zh":"这里不是“参与活动”这么简单，而是指在精神和情感上真正投入、与体验发生连接","source":"He first tried to meet her in New York, but the event was too crowded for Mascis to engage.","sourceHtml":"He first tried to meet her in New York, but the event was too crowded for Mascis to \u003cmark>engage\u003c/mark>."},{"en":"it clicked","zh":"某件事突然变得能理解、有效或产生共鸣","source":"When he went again to see her in Boston, it clicked.","sourceHtml":"When he went again to see her in Boston, \u003cmark>it clicked\u003c/mark>."},{"en":"appeal to someone’s sensibility","zh":"契合某人的价值取向、审美或感受方式","source":"Reichenheim came from a long line of ministers, and she wanted to become a nurse; Amma’s ideas of self-sacrifice appealed to her sensibility.","sourceHtml":"Reichenheim came from a long line of ministers, and she wanted to become a nurse; Amma’s ideas of self-sacrifice \u003cmark>appealed to her sensibility\u003c/mark>."},{"en":"directive","zh":"明确的指示、训示","source":"Amma’s directive was simple but complicated: “Just be nice to people,” Mascis says, laughing and drumming on the kitchen table, a Carnelian bracelet tight around his left wrist.","sourceHtml":"Amma’s \u003cmark>directive\u003c/mark> was simple but complicated: “Just be nice to people,” Mascis says, laughing and drumming on the kitchen table, a Carnelian bracelet tight around his left wrist."},{"en":"I’m working on it. It’s a constant.","zh":"我正在努力，而且这是一项永无止境的功课","source":"I can be an asshole, but I’m working on it.","sourceHtml":"I can be an asshole, but I’m \u003cmark>working\u003c/mark> on it."},{"en":"book tours around someone’s appearances","zh":"围绕某人的公开活动来安排巡演日程，说明追随 并不是巡演途中的顺便拜访，而是行程规划的中心之一","source":"With the band done in late 1997, Mascis booked solo tours around Amma’s appearances, and he and Reichenheim followed her across the United States and Europe.","sourceHtml":"With the band done in late 1997, Mascis \u003cmark>booked solo tours around Amma’s appearances\u003c/mark>, and he and Reichenheim followed her across the United States and Europe."},{"en":"identify with the devotional intensity","zh":"对那种虔敬投入的强烈程度产生认同与共鸣","source":"She was never a Deadhead, but she identified with the devotional intensity from discovering and then trailing Amma, how it had changed both of their lives.","sourceHtml":"She was never a Deadhead, but she \u003cmark>identified with the devotional intensity\u003c/mark> from discovering and then trailing Amma, how it had changed both of their lives."},{"en":"come naturally to someone","zh":"对某人而言自然而然、不需勉强","source":"“Practicing some sort of spirituality came naturally to me, but in New York, that got lost in the shuffle of working, of trying to make things work.","sourceHtml":"“Practicing some sort of spirituality \u003cmark>came naturally to me\u003c/mark>, but in New York, that got lost in the shuffle of working, of trying to make things work."},{"en":"get lost in the shuffle","zh":"在忙乱和众多事务中被忽略、挤到一旁","source":"“Practicing some sort of spirituality came naturally to me, but in New York, that got lost in the shuffle of working, of trying to make things work.","sourceHtml":"“Practicing some sort of spirituality came naturally to me, but in New York, that \u003cmark>got lost in the shuffle\u003c/mark> of working, of trying to make things work."},{"en":"for weeks at a time","zh":"每次持续数周，强调这不是短暂观光","source":"“We connected in that way—‘Hey, there’s something else out there to explore about the world, about yourself.’” They began visiting India for weeks at a time, living in Amma’s ashram.","sourceHtml":"“We connected in that way—‘Hey, there’s something else out there to explore about the world, about yourself.’” They began visiting India \u003cmark>for weeks at a time\u003c/mark>, living in Amma’s ashram."},{"en":"officiate a wedding","zh":"主持婚礼，使婚姻仪式正式成立","source":"Amma officiated their wedding in 2004.","sourceHtml":"Amma \u003cmark>officiated their wedding\u003c/mark> in 2004."},{"en":"deliver a tidbit","zh":"透露一小条有用或有趣的信息","source":"As Christmas neared in December 2004, Mascis called Brian Schwartz to deliver a tidbit his new manager had craved for more than a year: Murph’s phone number, kind of, and the absolute key to a potential Dinosaur Jr. reunion.","sourceHtml":"As Christmas neared in December 2004, Mascis called Brian Schwartz to \u003cmark>deliver a tidbit\u003c/mark> his new manager had craved for more than a year: Murph’s phone number, kind of, and the absolute key to a potential Dinosaur Jr. reunion."},{"en":"the key to something","zh":"实现某事的关键","source":"As Christmas neared in December  the potential windfall to Mascis.","sourceHtml":"Without explicit permission, Schwartz began piecing together a prospective tour for the original Dinosaur trio, then presented it and the potential \u003cmark>windfall\u003c/mark> to Mascis."},{"en":"navigate a rough patch","zh":"设法熬过一段困难时期","source":"“I knew right away this was about a reunion, but I was still shocked, because I didn’t think it was ever going to happen,” remembers Murph, who was then navigating a rough patch of legal issues and substance abuse.","sourceHtml":"“I knew right away this was about a reunion, but I was still shocked, because I didn’t think it was ever going to happen,” remembers Murph, who was then \u003cmark>navigating a rough patch\u003c/mark> of legal issues and substance abuse."},{"en":"take it personal","zh":"口语形式，相当于标准表达 ，指把某事理解成针对自己的冒犯","source":"“I just figured J had moved on, and I didn’t take it personal.","sourceHtml":"“I just figured J had moved on, and I didn’t \u003cmark>take\u003c/mark> it \u003cmark>personal\u003c/mark>."},{"en":"the last piece of the puzzle","zh":"让整个计划得以完成的最后一项要素","source":"Murph was the last piece of the puzzle.","sourceHtml":"Murph was \u003cmark>the last piece of the puzzle\u003c/mark>."},{"en":"lurch ahead","zh":"踉跄、忽快忽慢地向前推进","source":"Barlow and Mascis’ uneasy reconciliation had been lurching ahead for years.","sourceHtml":"Barlow and Mascis’ uneasy reconciliation had been \u003cmark>lurching ahead\u003c/mark> for years."},{"en":"hardly a love-in","zh":"绝不是什么充满爱与和谐的场面","source":"In 2002, Barlow joined Mascis’ Stooges project with Ron and Scott Asheton in London. (The Guardian noted that the “I Wanna Be Your Dog” rendition was “hardly a love-in”).","sourceHtml":"In 2002, Barlow joined Mascis’ Stooges project with Ron and Scott Asheton in London. (The Guardian noted that the “I Wanna Be Your Dog” rendition was “\u003cmark>hardly\u003c/mark> a love-in”)."},{"en":"chastise","zh":"严厉责备、训斥","source":"Murph was the last piece of the puzzle.","sourceHtml":"Murph was the last piece of the puzzle."},{"en":"for things to move forward","zh":"为了让事情能够继续发展，不再卡在旧有冲突中","source":"“He had to apologize for being such a dick for things to move forward.” When I tell Barlow this a few days later, he smiles and doesn’t disagree; he does say, however, that Mascis may be “incapable of apologizing.”","sourceHtml":"“He had to apologize for being such a dick \u003cmark>for things to move forward\u003c/mark>.” When I tell Barlow this a few days later, he smiles and doesn’t disagree; he does say, however, that Mascis may be “incapable of apologizing.”"},{"en":"incapable of apologizing","zh":"不是“不愿意道歉”，而是“似乎没有道歉这种能力”","source":"“He had to apologize for being such a dick for things to move forward.” When I tell Barlow this a few days later, he smiles and doesn’t disagree; he does say, however, that Mascis may be “incapable of apologizing.”","sourceHtml":"“He had to apologize for being such a dick for things to move forward.” When I tell Barlow this a few days later, he smiles and doesn’t disagree; he does say, however, that Mascis may be “\u003cmark>incapable of apologizing\u003c/mark>.”"},{"en":"whimper to an end","zh":"不是轰然结束，而是呜咽着、疲弱地收场","source":"Dinosaur Jr. had whimpered to an end in late 1997 while Mascis made do with a different touring trio.","sourceHtml":"Dinosaur Jr. had \u003cmark>whimpered to an end\u003c/mark> in late 1997 while Mascis made do with a different touring trio."},{"en":"make do with","zh":"在没有理想选择时拿现有的人或物勉强应付","source":"Dinosaur Jr. had whimpered to an end in late 1997 while Mascis made do with a different touring trio.","sourceHtml":"Dinosaur Jr. had whimpered to an end in late 1997 while Mascis made do with a different touring trio."},{"en":"iteration","zh":"某个事物的一种版本或形态","source":"As soon as the original lineup reconvened, he realized this was the band he’d always needed, the best iteration of Dinosaur Jr. that had ever existed.","sourceHtml":"As soon as the original lineup reconvened, he realized this was the band he’d always needed, the best \u003cmark>iteration\u003c/mark> of Dinosaur Jr. that had ever existed."},{"en":"be saddled with someone","zh":"不得不长期背负、应付某人，像给马套上鞍一样难以摆脱","source":"“It’s annoying, because you’re saddled with these guys—god dammit, what the fuck?","sourceHtml":"“It’s annoying, because you’re \u003cmark>saddled with these guys\u003c/mark>—god dammit, what the fuck?"},{"en":"come up together","zh":"一起成长、一起在同一环境中发展起来","source":"“We came up together, learned how to play together, have a certain sound that is interesting.","sourceHtml":"“We \u003cmark>came up together\u003c/mark>, learned how to play together, have a certain sound that is interesting."},{"en":"prowl high on the bass’ neck","zh":"在贝斯高把位上游走","source":"And maybe they don’t know why.” Barlow thinks he knows why: The mold that Mascis built when he first started the band, with Barlow prowling high on the bass’ neck and both he and Murph pushing past the meter, as if trying to punch through every song’s rhythmic pockets.","sourceHtml":"And maybe they don’t know why.” Barlow thinks he knows why: The mold that Mascis built when he first started the band, with Barlow \u003cmark>prowling high on the bass’ neck\u003c/mark> and both he and Murph pushing past the meter, as if trying to punch through every song’s rhythmic pockets."},{"en":"push past the meter","zh":"把演奏推向拍号或规整节拍的边界之外，制造一种几乎要冲出去的紧迫感","source":"And maybe they don’t know why.” Barlow thinks he knows why: The mold that Mascis built when he first started the band, with Barlow prowling high on the bass’ neck and both he and Murph pushing past the meter, as if trying to punch through every song’s rhythmic pockets.","sourceHtml":"And maybe they don’t know why.” Barlow thinks he knows why: The mold that Mascis built when he first started the band, with Barlow prowling high on the bass’ neck and both he and Murph \u003cmark>pushing past the meter\u003c/mark>, as if trying to punch through every song’s rhythmic pockets."},{"en":"punch through rhythmic pockets","zh":"仿佛一拳击穿节奏原本容纳乐句的位置","source":"And maybe they don’t know why.” Barlow thinks he knows why: The mold that Mascis built when he first started the band, with Barlow prowling high on the bass’ neck and both he and Murph pushing past the meter, as if trying to punch through every song’s rhythmic pockets.","sourceHtml":"And maybe they don’t know why.” Barlow thinks he knows why: The mold that Mascis built when he first started the band, with Barlow prowling high on the bass’ neck and both he and Murph pushing past the meter, as if trying to \u003cmark>punch through every song’s rhythmic pockets\u003c/mark>."},{"en":"heavy music without the macho","zh":"沉重、响亮，却没有金属和硬摇滚常见的阳刚炫耀","source":"“We play heavy music without the macho,” Barlow says, “our greatest strength.”","sourceHtml":"“We play \u003cmark>heavy music without the macho\u003c/mark>,” Barlow says, “our greatest strength.”"},{"en":"consistent and cohesive","zh":"品质稳定，而且各部分结合成统一整体","source":"In that span, they have made six albums that don’t feel as wild or risky as their early work but are instead consistent and cohesive, somehow built every time on a half-dozen of the best hooks it seems Mascis has ever written.","sourceHtml":"In that span, they have made six albums that don’t feel as wild or risky as their early work but are instead \u003cmark>consistent and cohesive\u003c/mark>, somehow built every time on a half-dozen of the best hooks it seems Mascis has ever written."},{"en":"hook","zh":"容易抓住听众、令人记住的旋律或乐句，是流行音乐与摇滚评论中的高频词","source":"In that span, they have made six albums that don’t feel as wild or risky as their early work but are instead consistent and cohesive, somehow built every time on a half-dozen of the best hooks it seems Mascis has ever written.","sourceHtml":"In that span, they have made six albums that don’t feel as wild or risky as their early work but are instead consistent and cohesive, somehow built every time on \u003cmark>a half-dozen of the best hooks\u003c/mark> it seems Mascis has ever written."},{"en":"pick up a rapport","zh":"重新接上默契","source":"Really, they feel like exactly what they are—three people who have seen and endured the best and worst of each other gathering in Mascis’ upstairs bedroom every three-to-five years to pick up the kind of rapport they’ve only ever shared musically, never personally.","sourceHtml":"Really, they feel like exactly what they are—three people who have seen and endured the best and worst of each other gathering in Mascis’ upstairs bedroom every three-to-five years to \u003cmark>pick up the kind of rapport they’ve only ever shared musically, never personally\u003c/mark>."},{"en":"more like relatives than friends","zh":"更像亲戚而非朋友","source":"“We’re not distant,” Mascis says, “but we’re more like relatives than friends.” Barlow echoes him: “I was not in J’s sphere from the beginning to be J’s best buddy.","sourceHtml":"“We’re not distant,” Mascis says, “but \u003cmark>we’re more like relatives than friends\u003c/mark>.” Barlow echoes him: “I was not in J’s sphere from the beginning to be J’s best buddy."},{"en":"tour hard","zh":"长期、密集而高强度地巡演","source":"Dinosaur Jr. tours hard, having played nearly 1,300 shows since reforming.","sourceHtml":"Dinosaur Jr. \u003cmark>tours hard\u003c/mark>, having played nearly 1,300 shows since reforming."},{"en":"as a buffer","zh":"作为缓冲者，在关系紧张的人之间减轻尴尬或冲突","source":"Still, Murph reckons that, during that span, the three of them have dined together without someone else joining them as a buffer approximately once.","sourceHtml":"Still, Murph reckons that, during that span, the three of them have dined together without someone else joining them \u003cmark>as a buffer\u003c/mark> approximately once."},{"en":"an Addams Family vibe","zh":"一种《亚当斯一家》式的古怪、阴森而又黑色幽默的家庭气氛","source":"It had an Addams Family vibe,” Murph says, laughing so hard he closes his eyes for a while.","sourceHtml":"It had \u003cmark>an Addams Family vibe\u003c/mark>,” Murph says, laughing so hard he closes his eyes for a while."},{"en":"dysfunctional family","zh":"成员关系和沟通方式失调的家庭","source":"It had an Addams Family vibe,” Murph says, laughing so hard he closes his eyes for a while.","sourceHtml":"It had \u003cmark>an Addams Family vibe\u003c/mark>,” Murph says, laughing so hard he closes his eyes for a while."},{"en":"commit to something / each other","zh":"决定长期投入某件事／对彼此承担责任","source":"“But sometimes you just commit to something, commit to each other.”","sourceHtml":"“But sometimes you just \u003cmark>commit to something, commit to each other\u003c/mark>.”"},{"en":"one thing at a time","zh":"一次只处理一件事，不对更远未来作整体规划","source":"Schwartz tells me that he used to think about one Dinosaur Jr. tour or album at a time.","sourceHtml":"Schwartz tells me that he used to think about one Dinosaur Jr. tour or album \u003cmark>at a time\u003c/mark>."},{"en":"get sober","zh":"戒酒或戒除成瘾物质，进入清醒状态","source":"But Murph got sober in part so this trio could continue, and Barlow and Mascis tell me they intend to keep it going for as long as possible.","sourceHtml":"But Murph \u003cmark>got sober\u003c/mark> in part so this trio could continue, and Barlow and Mascis tell me they intend to keep it going for as long as possible."},{"en":"enough license for someone to try","zh":"已经足以让某人放手尝试","source":"That’s enough license for me to try.”","sourceHtml":"That’s \u003cmark>enough license for me to try\u003c/mark>.”"},{"en":"followed his guitar back to Amherst","zh":"跟着吉他回到阿默斯特，回扣开头“乐器一走，他也跟着走”的笑话","source":"Before he followed his guitar back to Amherst in late August, Mascis left Provincetown one other time.","sourceHtml":"Before he \u003cmark>followed his guitar back to Amherst\u003c/mark> in late August, Mascis left Provincetown one other time."},{"en":"drop someone off","zh":"开车把某人送到目的地后离开","source":"Toward the middle of their vacation, he, Reichenheim, and their son, Rory, headed home to pick up his stuff, then turned south to New York to drop their only child off for the start of college.","sourceHtml" rk>, to me and his child."},{"en":"soften","zh":"性格或态度变柔和，不再那么强硬、封闭","source":"He’s changed a lot in that way.” Nearly everyone tells me about some surprising way they’ve seen Mascis soften in the last two decades, how he’s deprioritized himself.","sourceHtml":"He’s changed a lot in that way.” Nearly everyone tells me about some surprising way they’ve seen Mascis \u003cmark>soften\u003c/mark> in the last two decades, how he’s deprioritized himself."},{"en":"deprioritize oneself","zh":"降低自身需求的优先级，不再把自己永远放在第一位","source":"Rory was born two years into the second life of Dinosaur Jr.","sourceHtml":"Rory was born two years into the second life of Dinosaur Jr."},{"en":"without issue","zh":"没有异议、争执或麻烦地","source":"When they reunited, Mascis put one of his amps on Barlow’s side of the stage; when Barlow protested, Mascis moved it immediately without issue.","sourceHtml":"When they reunited, Mascis put one of his amps on Barlow’s side of the stage; when Barlow protested, Mascis moved it immediately \u003cmark>without issue\u003c/mark>."},{"en":"social graces","zh":"让人际互动顺畅、得体的礼貌和社交技巧","source":"Mascis admits he has more “social graces” now, because Reichenheim, an extrovert who has seemingly never met a stranger, has instilled them in him.","sourceHtml":"Mascis admits he has more “\u003cmark>social graces\u003c/mark>” now, because Reichenheim, an extrovert who has seemingly never met a stranger, has instilled them in him."},{"en":"never meet a stranger","zh":"把任何陌生人都迅速当成熟人，形容一个人极其外向友善","source":"Mascis admits he has more “social graces” now, because Reichenheim, an extrovert who has seemingly never met a stranger, has instilled them in him.","sourceHtml":"Mascis admits he has more “social graces” now, because Reichenheim, an extrovert who has seemingly \u003cmark>never met a stranger\u003c/mark>, has instilled them in him."},{"en":"be set in one’s ways","zh":"习惯与行为模式已经固定，很难改变","source":"But he will turn 61 in December, and he is content knowing that he’s simply set in some of his ways.","sourceHtml":"But he will turn 61 in December, and he is content knowing that he’s simply \u003cmark>set in some of his ways\u003c/mark>."},{"en":"put off","zh":"感到不快、反感或受冷落","source":"“He was a little bit put off, but Luisa couldn’t handle it.","sourceHtml":"“He was a little bit \u003cmark>put off\u003c/mark>, but Luisa couldn’t handle it."},{"en":"well-adjusted / maladjusted / adjusted","zh":"指心理与社会适应良好， 指适应不良","source":"This may be my favorite thing about Mascis, the thing that makes him one of indie rock’s most interesting singers and songwriters four decades into it: He is neither particularly well-adjusted nor maladjusted.","sourceHtml":"This may be my favorite thing about Mascis, the thing that makes him one of indie rock’s most interesting singers and songwriters four decades into it: He is neither particularly well-adjusted nor \u003cmark>maladjusted\u003c/mark>."},{"en":"ill at ease","zh":"不自在、不安，无法在环境中彻底放松","source":"He is simply adjusted, moving in his peculiar way through a world that has made him ill at ease since the second-best math student in his middle school rebuffed him.","sourceHtml":"He is simply adjusted, moving in his peculiar way through a world that has made him \u003cmark>ill at ease\u003c/mark> since the second-best math student in his middle school rebuffed him."},{"en":"syllabic games meant to fill out a melody","zh":"为了填满旋律而进行的音节游戏","source":"Mascis doesn’t like to talk about lyrics and has long insisted that they don’t mean that much to him, that they are often other people’s stories or just syllabic games meant to fill out a melody.","sourceHtml":"Mascis doesn’t like to talk about lyrics and has long insisted that they don’t mean that much to him, that they are often other people’s stories or just \u003cmark>syllabic games meant to fill out a melody\u003c/mark>."},{"en":"I don’t peak too early / I don’t peak at all","zh":"我不会过早达到巅峰／我根本没有巅峰","source":"He smiles as he recites the first one, from the heartbreaking and beautiful “See You at the Movies”: “I don’t peak too early/I don’t peak at all.” In an era obsessed with infinite self-improvement, with maxxing every element of oneself, Mascis simply wants to keep doing the things he does, to keep moving through a life he didn’t really know he wanted to live at all.","sourceHtml":"He smiles as he recites the first one, from the heartbreaking and beautiful “See You at the Movies”: “\u003cmark>I don’t peak too early/I don’t peak at all.\u003c/mark>” In an era obsessed with infinite self-improvement, with maxxing every element of oneself, Mascis simply wants to keep doing the things he does, to keep moving through a life he didn’t really know he wanted to live at all."},{"en":"infinite self-improvement","zh":"永无止境的自我优化","source":"He smiles as he recites the first one, from the heartbreaking and beautiful “See You at the Movies”: “I don’t peak too early/I don’t peak at all.” In an era obsessed with infinite self-improvement, with maxxing every element of oneself, Mascis simply wants to keep doing the things he does, to keep moving through a life he didn’t really know he wanted to live at all.","sourceHtml":"He smiles as he recites the first one, from the heartbreaking and beautiful “See You at the Movies”: “I don’t peak too early/I don’t peak at all.” In an era obsessed with \u003cmark>infinite self-improvement\u003c/mark>, with maxxing every element of oneself, Mascis simply wants to keep doing the things he does, to keep moving through a life he didn’t really know he wanted to live at all."},{"en":"maxx every element of oneself","zh":"把自己的每一项特质都“拉满”","source":"He smiles as he recites the first one, from the heartbreaking and beautiful “See You at the Movies”: “I don’t peak too early/I don’t peak at all.” In an era obsessed with infinite self-improvement, with maxxing every element of oneself, Mascis simply wants to keep doing the things he does, to keep moving through a life he didn’t really know he wanted to live at all.","sourceHtml":"He smiles as he recites the first one, from the heartbreaking and beautiful “See You at the Movies”: “I don’t peak too early/I don’t peak at all.” In an era obsessed with infinite self-improvement, with \u003cmark>maxxing every element of oneself\u003c/mark>, Mascis simply wants to keep doing the things he does, to keep moving through a life he didn’t really know he wanted to live at all."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
