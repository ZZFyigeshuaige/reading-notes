let cards = [{"en":"perfect recall of","zh":"对……记得分毫不差","source":"Assuming you don’t have perfect recall of obscure British atmospheric black metal bands from the mid-2010s (I sure as hell don’t), Cariss’ name probably doesn’t ring any bells.","sourceHtml":"Assuming you don’t have \u003cmark>perfect recall of\u003c/mark> obscure British atmospheric black metal bands from the mid-2010s (I sure as hell don’t), Cariss’ name probably doesn’t ring any bells."},{"en":"doesn’t ring any bells","zh":"没有勾起任何印象","source":"Assuming you don’t have perfect recall of obscure British atmospheric black metal bands from the mid-2010s (I sure as hell don’t), Cariss’ name probably doesn’t ring any bells.","sourceHtml":"Assuming you don’t have perfect recall of obscure British atmospheric black metal bands from the mid-2010s (I sure as hell don’t), Cariss’ name probably \u003cmark>doesn’t ring any bells\u003c/mark>."},{"en":"the most jaded hesher swoon","zh":"让最麻木的金属老炮都倾倒","source":"It’s not that the Southampton group flopped—the smoldering dynamics and haunting acoustics on 2014’s demo, and later 2016’s Fall EP, could make even the most jaded hesher swoon—but rather that they straight-up vanished right after releasing the latter, suspending Cariss just as curiosity was spreading.","sourceHtml":"It’s not that the Southampton group flopped—the smoldering dynamics and haunting acoustics on 2014’s demo, and later 2016’s Fall EP, could make even \u003cmark>the most jaded hesher swoon\u003c/mark>—but rather that they straight-up vanished right after releasing the latter, suspending Cariss just as curiosity was spreading."},{"en":"straight-up vanished","zh":"干脆彻底消失","source":"It’s not that the Southampton group flopped—the smoldering dynamics and haunting acoustics on 2014’s demo, and later 2016’s Fall EP, could make even the most jaded hesher swoon—but rather that they straight-up vanished right after releasing the latter, suspending Cariss just as curiosity was spreading.","sourceHtml":"It’s not that the Southampton group flopped—the smoldering dynamics and haunting acoustics on 2014’s demo, and later 2016’s Fall EP, could make even the most jaded hesher swoon—but rather that they \u003cmark>straight-up vanished\u003c/mark> right after releasing the latter, suspending Cariss just as curiosity was spreading."},{"en":"has an album to their name","zh":"终于拥有一张以自己名义完成的专辑","source":"Returning after more than a decade away, with twice as many personnel as when they first started, the band finally has an album to their name—and it’s more stunning than anyone could have imagined, saturated in sensuous contrasts, sublime choral harmonies, and sophisticated, weeping fretwork.","sourceHtml":"Returning after more than a decade away, with twice as many personnel as when they first started, the band finally \u003cmark>has an album to their name\u003c/mark>—and it’s more stunning than anyone could have imagined, saturated in sensuous contrasts, sublime choral harmonies, and sophisticated, weeping fretwork."},{"en":"weeping fretwork","zh":"如泣如诉的指板演奏","source":"Returning after more than a decade away, with twice as many personnel as when they first started, the band finally has an album to their name—and it’s more stunning than anyone could have imagined, saturated in sensuous contrasts, sublime choral harmonies, and sophisticated, weeping fretwork.","sourceHtml":"Returning after more than a decade away, with twice as many personnel as when they first started, the band finally has an album to their name—and it’s more stunning than anyone could have imagined, saturated in sensuous contrasts, sublime choral harmonies, and sophisticated, \u003cmark>weeping fretwork\u003c/mark>."},{"en":"one hell of a re-introduction","zh":"一次极其有力、令人震撼的重新登场","source":"Take the impressionistic fury of Alcest and Deafheaven, add a dash of the Clair Obscur: Expedition 33 soundtrack, and you’ve got yourself one hell of a re-introduction.","sourceHtml":"Take the impressionistic fury of Alcest and Deafheaven, add a dash of the Clair Obscur: Expedition 33 soundtrack, and you’ve got yourself \u003cmark>one hell of a re-introduction\u003c/mark>."},{"en":"sublimely haunted suite","zh":"幽美而带有鬼魅感的一组连贯作品","source":"Nick Hakim’s latest, and first since exiting ATO Records, is a sublimely haunted suite of otherworldly soul and minimal gospel.","sourceHtml":"Nick Hakim’s latest, and first since exiting ATO Records, is a \u003cmark>sublimely haunted suite\u003c/mark> of otherworldly soul and minimal gospel."},{"en":"hear the space between instruments","zh":"仿佛能听见乐器之间的空隙","source":"With compositions so intimate that you can practically hear the space between instruments, it’s like the air in the room is as much a character as Hakim’s fragile, uncategorizable voice, which itself feels choked of oxygen.","sourceHtml":"With compositions so intimate that you can practically \u003cmark>hear the space between instruments\u003c/mark>, it’s like the air in the room is as much a character as Hakim’s fragile, uncategorizable voice, which itself feels choked of oxygen."},{"en":"choked of oxygen","zh":"像被抽走氧气般窒息","source":"With compositions so intimate that you can practically hear the space between instruments, it’s like the air in the room is as much a character as Hakim’s fragile, uncategorizable voice, which itself feels choked of oxygen.","sourceHtml":"With compositions so intimate that you can practically hear the space between instruments, it’s like the air in the room is as much a character as Hakim’s fragile, uncategorizable voice, which itself feels \u003cmark>choked of oxygen\u003c/mark>."},{"en":"straying from the spine of the groove","zh":"偏离律动的主干","source":"Songs average at five minutes in length, never straying from the spine of the groove as elements—bone-bare and emotionally resonant—shift in and out of the mix.","sourceHtml":"Songs average at five minutes in length, never \u003cmark>straying from the spine of the groove\u003c/mark> as elements—bone-bare and emotionally resonant—shift in and out of the mix."},{"en":"bone-bare and emotionally resonant","zh":"精简到只剩骨架，却能激起强烈情感共振","source":"Songs average at five minutes in length, never straying from the spine of the groove as elements—bone-bare and emotionally resonant—shift in and out of the mix.","sourceHtml":"Songs average at five minutes in length, never straying from the spine of the groove as elements—\u003cmark>bone-bare and emotionally resonant\u003c/mark>—shift in and out of the mix."},{"en":"the porosity of the atmosphere","zh":"氛围的多孔性与通透感","source":"An out-of-tune piano, a passing car, a chair creaking: These imperfections evidence the porosity of the atmosphere Hakim inhabits, a space at the edge of time where dead relatives haunt, storms threaten to end it all, and the floor beneath is caving in.","sourceHtml":"An out-of-tune piano, a passing car, a chair creaking: These imperfections evidence \u003cmark>the porosity of the atmosphere\u003c/mark> Hakim inhabits, a space at the edge of time where dead relatives haunt, storms threaten to end it all, and the floor beneath is caving in."},{"en":"most self-assured","zh":"最为自信笃定的","source":"Deliberate and thoughtful while never losing its spirit of spontaneity and intimacy, I Can See is Hakim at his most experimental and most self-assured.","sourceHtml":"Deliberate and thoughtful while never losing its spirit of spontaneity and intimacy, I Can See is Hakim at his most experimental and \u003cmark>most self-assured\u003c/mark>."},{"en":"triumphantly nihilistic street brawl","zh":"带着胜利气焰的虚无主义街头混战","source":"Eugene, Oregon’s Liquid Cross provides the ideal soundtrack for a triumphantly nihilistic street brawl spilling out of the dive bar, onto a packed sidewalk, and into oncoming traffic.","sourceHtml":"Eugene, Oregon’s Liquid Cross provides the ideal soundtrack for a \u003cmark>triumphantly nihilistic street brawl\u003c/mark> spilling out of the dive bar, onto a packed sidewalk, and into oncoming traffic."},{"en":"off-the-rails melodic punk eruption","zh":"彻底脱轨的旋律朋克喷发","source":"Their sophomore offering Hateful EP is an off-the-rails melodic punk eruption.","sourceHtml":"Their sophomore offering Hateful EP is an \u003cmark>off-the-rails melodic punk eruption\u003c/mark>."},{"en":"homespun recording gold","zh":"自家录制却弥足珍贵的作品","source":"This grip of tuneful yet buzzy post-punk songs will be a treat for lovers of ’80s French oi, The Wipers, and homespun recording gold.","sourceHtml":"This grip of tuneful yet buzzy post-punk songs will be a treat for lovers of ’80s French oi, The Wipers, and \u003cmark>homespun recording gold\u003c/mark>."},{"en":"a smash hit","zh":"极受欢迎的成功作品、爆款","source":"Hateful EP has that Let It Be The Replacements-era indescribable pop magic that makes this EP a smash hit.","sourceHtml":"Hateful EP has that Let It Be The Replacements-era indescribable pop magic that makes this EP \u003cmark>a smash hit\u003c/mark>."},{"en":"wake up and smell the glove","zh":"醒醒吧，闻闻这只手套","source":"Wake up and smell the glove.","sourceHtml":"\u003cmark>Wake up and smell the glove\u003c/mark>."},{"en":"quietly refining his craft","zh":"不动声色地持续打磨技艺","source":"Seattle rapper AJ Suede has spent the last decade quietly refining his craft.","sourceHtml":"Seattle rapper AJ Suede has spent the last decade \u003cmark>quietly refining his craft\u003c/mark>."},{"en":"relied heavily on free-association","zh":"大量依赖自由联想","source":"On early albums like Avada Kedavra and Oil On Canvas, he relied heavily on free-association, using the power of suggestion to connect one bar to the next. (The article illustrates this with a quoted lyric.) Over time, his writing has become more linear, and Atomic Justice is his strongest work yet.","sourceHtml":"On early albums like Avada Kedavra and Oil On Canvas, he \u003cmark>relied heavily on free-association\u003c/mark>, using the power of suggestion to connect one bar to the next. (The article illustrates this with a quoted lyric.) Over time, his writing has become more linear, and Atomic Justice is his strongest work yet."},{"en":"the power of suggestion to connect one bar to the next","zh":"借暗示的力量连接相邻小节","source":"On early albums like Avada Kedavra and Oil On Canvas, he relied heavily on free-association, using the power of suggestion to connect one bar to the next. (The article illustrates this with a quoted lyric.) Over time, his writing has become more linear, and Atomic Justice is his strongest work yet.","sourceHtml":"On early albums like Avada Kedavra and Oil On Canvas, he relied heavily on free-association, using \u003cmark>the power of suggestion to connect one bar to the next\u003c/mark>. (The article illustrates this with a quoted lyric.) Over time, his writing has become more linear, and Atomic Justice is his strongest work yet."},{"en":"favors the overcast and ominous","zh":"偏爱阴沉而不祥的音乐气质","source":"Musically, he favors the overcast and ominous; elements like the thumping bassline on “Billed Gates” and the creeping piano on “Lifting Gravity” hover like thick, distant thunderclouds.","sourceHtml":"Musically, he \u003cmark>favors the overcast and ominous\u003c/mark>; elements like the thumping bassline on “Billed Gates” and the creeping piano on “Lifting Gravity” hover like thick, distant thunderclouds."},{"en":"hover like thick, distant thunderclouds","zh":"像厚重遥远的雷云般悬浮","source":"Musically, he favors the overcast and ominous; elements like the thumping bassline on “Billed Gates” and the creeping piano on “Lifting Gravity” hover like thick, distant thunderclouds.","sourceHtml":"Musically, he favors the overcast and ominous; elements like the thumping bassline on “Billed Gates” and the creeping piano on “Lifting Gravity” \u003cmark>hover like thick, distant thunderclouds\u003c/mark>."},{"en":"sets his sights on the modern age","zh":"把批判目标对准现代社会","source":"On Justice, Suede sets his sights on the modern age, and his characteristic collage of images coheres into a series of sharp rebukes.","sourceHtml":"On Justice, Suede \u003cmark>sets his sights on the modern age\u003c/mark>, and his characteristic collage of images coheres into a series of sharp rebukes."},{"en":"coheres into a series of sharp rebukes","zh":"凝聚成一连串犀利斥责","source":"On Justice, Suede sets his sights on the modern age, and his characteristic collage of images coheres into a series of sharp rebukes.","sourceHtml":"On Justice, Suede sets his sights on the modern age, and his characteristic collage of images \u003cmark>coheres into a series of sharp rebukes\u003c/mark>."},{"en":"an artist coming into his own","zh":"一位艺术家终于成熟并建立自己的位置","source":"Atomic Justice is the sound of an artist coming into his own, delivering a sober assessment of the world we’ve created.","sourceHtml":"Atomic Justice is the sound of \u003cmark>an artist coming into his own\u003c/mark>, delivering a sober assessment of the world we’ve created."},{"en":"a sober assessment of","zh":"对……作出冷静清醒的评估","source":"Atomic Justice is the sound of an artist coming into his own, delivering a sober assessment of the world we’ve created.","sourceHtml":"Atomic Justice is the sound of an artist coming into his own, delivering \u003cmark>a sober assessment of\u003c/mark> the world we’ve created."},{"en":"laid-back, lighter-than-air quality","zh":"松弛、轻盈得仿佛没有重量的质感","source":"Cambridge producer Loman’s productions have a kind of laid-back, lighter-than-air quality to them.","sourceHtml":"Cambridge producer Loman’s productions have a kind of \u003cmark>laid-back, lighter-than-air quality\u003c/mark> to them."},{"en":"the perfect backdrop for","zh":"为……提供恰到好处的背景","source":"On his 2024 pairing with the excellent Lynn rapper Nyeusi Loe—one of the best records of that year—the music’s reflective tone was the perfect backdrop for Loe to look back on his life.","sourceHtml":"On his 2024 pairing with the excellent Lynn rapper Nyeusi Loe—one of the best records of that year—the music’s reflective tone was \u003cmark>the perfect backdrop for\u003c/mark> Loe to look back on his life."},{"en":"ambling approach to rhyming","zh":"漫步般、不疾不徐的押韵方式","source":"He’s found another strong match in Boston rapper Chandler Ward; on Cold Pressed, Ward’s ambling approach to rhyming mirrors Loman’s unhurried instrumentals.","sourceHtml":"He’s found another strong match in Boston rapper Chandler Ward; on Cold Pressed, Ward’s \u003cmark>ambling approach to rhyming\u003c/mark> mirrors Loman’s unhurried instrumentals."},{"en":"unspools bar after bar as easily as sighing","zh":"像叹气一样轻松地逐句铺开","source":"On “Touch Grass”—which gets an additional boost from the appearance of Lord Jah-Monte Ogbon—Ward unspools bar after bar as easily as sighing, as Loman spins up a DOOM-esque arrangement of jazz-y guitar and bright keys.","sourceHtml":"On “Touch Grass”—which gets an additional boost from the appearance of Lord Jah-Monte Ogbon—Ward \u003cmark>unspools bar after bar as easily as sighing\u003c/mark>, as Loman spins up a DOOM-esque arrangement of jazz-y guitar and bright keys."},{"en":"spins up a DOOM-esque arrangement","zh":"编织出一套带有 气质的编曲","source":"On “Touch Grass”—which gets an additional boost from the appearance of Lord Jah-Monte Ogbon—Ward unspools bar after bar as easily as sighing, as Loman spins up a DOOM-esque arrangement of jazz-y guitar and bright keys.","sourceHtml":"On “Touch Grass”—which gets an additional boost from the appearance of Lord Jah-Monte Ogbon—Ward unspools bar after bar as easily as sighing, as Loman \u003cmark>spins up a DOOM-esque arrangement\u003c/mark> of jazz-y guitar and bright keys."},{"en":"rifles through a scrapbook of interpersonal relationships","zh":"快速翻检一本关于人际关系的剪贴簿","source":"On “Table Etiquette,” Ward rifles through a scrapbook of interpersonal relationships, breezily tumbling from partners to parents as Loman strings up keyboard eighth notes like Christmas lights behind him.","sourceHtml":"On “Table Etiquette,” Ward \u003cmark>rifles through a scrapbook of interpersonal relationships\u003c/mark>, breezily tumbling from partners to parents as Loman strings up keyboard eighth notes like Christmas lights behind him."},{"en":"strings up keyboard eighth notes like Christmas lights","zh":"把键盘八分音符像圣诞灯串一样挂起","source":"On “Table Etiquette,” Ward rifles through a scrapbook of interpersonal relationships, breezily tumbling from partners to parents as Loman strings up keyboard eighth notes like Christmas lights behind him.","sourceHtml":"On “Table Etiquette,” Ward rifles through a scrapbook of interpersonal relationships, breezily tumbling from partners to parents as Loman \u003cmark>strings up keyboard eighth notes like Christmas lights\u003c/mark> behind him."},{"en":"library-music vibes","zh":"资料库音乐式的氛围","source":"Loman and Ward have created a gorgeous album, matching relaxed library-music vibes with conversational verses.","sourceHtml":"Loman and Ward have created a gorgeous album, matching relaxed \u003cmark>library-music vibes\u003c/mark> with conversational verses."},{"en":"feel your heart rate settle","zh":"感到心率逐渐平稳","source":"You can almost feel your heart rate settle as you listen.","sourceHtml":"You can almost \u003cmark>feel your heart rate settle\u003c/mark> as you listen."},{"en":"an earnestness and a vulnerability that characterize","zh":"以真诚与脆弱为鲜明特征","source":"There’s an earnestness and a vulnerability that characterize the music of Wicklow-born, Cork-based singer, songwriter, and visual artist Ezra Williams.","sourceHtml":"There’s \u003cmark>an earnestness and a vulnerability that characterize\u003c/mark> the music of Wicklow-born, Cork-based singer, songwriter, and visual artist Ezra Williams."},{"en":"tackling head-on","zh":"正面处理、毫不回避","source":"Tackling head-on the agonies of growing up, the hard graft of finding one’s place in a world not made for so many of us, and the majesties and emptinesses of connection and life’s various small attritions, they’ve begun garnering UK radio attention and landed a placement in Netflix’s Heartstopper adaptation.","sourceHtml":"\u003cmark>Tack illiams has more than \u003cmark>a natural knack for\u003c/mark>."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
