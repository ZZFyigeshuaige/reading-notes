s flop.","sourceHtml":"“No, now I have a superstition,” the 29-year-old Missouri native explains, her bleached curls—she’s keeping the roots dark these days—framing her face in \u003cmark>frazzled tresses\u003c/mark>, “that that makes albums flop."},{"en":"flop","zh":"商业或口碑表现失败、未达到预期","source":"“No, now I have a superstition,” the 29-year-old Missouri native explains, her bleached curls—she’s keeping the roots dark these days—framing her face in frazzled tresses, “that that makes albums flop.","sourceHtml":"“No, now I have a superstition,” the 29-year-old Missouri native explains, her bleached curls—she’s keeping the roots dark these days—framing her face in frazzled tresses, “that that makes albums \u003cmark>flop\u003c/mark>."},{"en":"psychic death","zh":"精神或心理层面的“死亡”，指旧有自我、信念或人生叙事崩塌， 并非生理死亡","source":"“Often psychic death can inspire a new acceptance of man’s fate,” Pitchfork contributor Meaghan Garvey writes in her new memoir Midwestern Death Trip.","sourceHtml":"“Often \u003cmark>psychic\u003c/mark> \u003cmark>death\u003c/mark> can inspire a new acceptance of man’s fate,” Pitchfork contributor Meaghan Garvey writes in her new memoir Midwestern \u003cmark>Death\u003c/mark> Trip."},{"en":"a chronicle of successive flop eras","zh":"接连几个失败时期的编年史","source":"“What you thought was the end is just the beginning.” Zara Larsson says, “I’ve had success, and then my flop era, and then it’s like, Well, OK, I’ve flopped, so it doesn’t scare me anymore.” WGIA$—that’s how Garner stylizes it—is a chronicle of successive flop eras: bad boyfriends, albums that didn’t land the way she hoped they would, addiction, abandonment, suicide.","sourceHtml":"“What you thought was the end is just the beginning.” Zara Larsson says, “I’ve had success, and then my flop era, and then it’s like, Well, OK, I’ve flopped, so it doesn’t scare me anymore.” WGIA$—that’s how Garner stylizes it—is \u003cmark>a chronicle of successive flop eras\u003c/mark>: bad boyfriends, albums that didn’t land the way ually, Garner prefers to call it an “inverse album,” citing a recently popular meme format wherein one dreams up an “evil” version of an artist’s discography.","sourceHtml":"Actually, Garner prefers to call it an “inverse album,” citing a recently popular meme format wherein one \u003cmark>dreams up an “evil” version of an artist’s discography\u003c/mark>."},{"en":"one’s frame of nostalgia shifts in real time","zh":"一个人用来定位怀旧对象的参照框架正在实时变化","source":"You can hear her frame of nostalgia shifting in real time, into the arena synth-rock of M83 and Madeon’s oops-all-drops EDM. (Slayyyter features on the latter’s new album, Victory.) She knows she’ll have even bigger rooms to fill pretty soon.","sourceHtml":"You can hear \u003cmark>her frame of nostalgia shifting in real time\u003c/mark>, into the arena synth-rock of M83 and Madeon’s oops-all-drops EDM. (Slayyyter features on the latter’s new album, Victory.) She knows she’ll have even bigger rooms to fill pretty soon."},{"en":"arena synth-rock","zh":"音场宏阔、适合大型体育馆演出的合成器摇滚","source":"You can hear her frame of nostalgia shifting in real time, into the arena synth-rock of M83 and Madeon’s oops-all-drops EDM. (Slayyyter features on the latter’s new album, Victory.) She knows she’ll have even bigger rooms to fill pretty soon.","sourceHtml":"You can hear her frame of nostalgia shifting in real time, into the \u003cmark>arena synth-rock\u003c/mark> of M83 and Madeon’s oops-all-drops EDM. (Slayyyter features on the latter’s new album, Victory.) She knows she’ll have even bigger rooms to fill pretty soon."},{"en":"oops-all-drops EDM","zh":"“哎呀，怎么全是 ”的电子舞曲","source":"You can hear her frame of nostalgia shifting in real time, into the arena synth-rock of M83 and Madeon’s oops-all-drops EDM. (Slayyyter features on the latter’s new album, Victory.) She knows she’ll have even bigger rooms to fill pretty soon.","sourceHtml":"You can hear her frame of nostalgia shifting in real time, into the arena synth-rock of M83 and Madeon’s \u003cma r, and make all of her American dreams come true.","sourceHtml":"To flop is, after all, to open the door to slay; “it is in dying that we are born to eternal life.” And that girl might one day \u003cmark>pick herself off the bathroom floor\u003c/mark>, rinse the vomit from her hair, and make all of her American dreams come true."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
