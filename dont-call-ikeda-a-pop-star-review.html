 really sucked, I’m not gonna lie.","sourceHtml":"\u003cmark>My specific course really sucked\u003c/mark>, I’m not gonna lie."},{"en":"broken up into","zh":"被划分成","source":"It was broken up into 2D, 3D, XD, and 4D, but I should have been in XD instead of 2D because that’s where everyone was doing, like, performance art and sculpture.","sourceHtml":"It was \u003cmark>broken up into\u003c/mark> 2D, 3D, XD, and 4D, but I should have been in XD instead of 2D because that’s where everyone was doing, like, performance art and sculpture."},{"en":"I should have been in XD instead of 2D","zh":"我本来应该进 ，而不是 2","source":"It was broken up into 2D, 3D, XD, and 4D, but I should have been in XD instead of 2D because that’s where everyone was doing, like, performance art and sculpture.","sourceHtml":"It was broken up into 2D, 3D, XD, and 4D, but \u003cmark>I should have been in XD instead of 2D\u003c/mark> because that’s where everyone was doing, like, performance art and sculpture."},{"en":"where I belonged","zh":"我真正适合、应该待的地方","source":"I thought that was where I belonged.","sourceHtml":"I thought that was \u003cmark>where I belonged\u003c/mark>."},{"en":"take me out to dinner","zh":"带我出去吃饭，也常隐含由对方请客","source":"I had a couple of friends that were really cool, though, like this one girl from a really rich Chinese family who would take me out to dinner and buy bottles of wine from the 1920s or whatever.","sourceHtml":"I had a couple of friends that were really cool, though, like this one girl from a really rich Chinese family who would \u003cmark>take me out to dinner\u003c/mark> and buy bottles of wine from the 1920s or whatever."},{"en":"express your interest in music","zh":"表达、展现自己对音乐的兴趣","source":"How did you express your interest in music then?","sourceHtml":"How did you \u003cmark>express your interest in music\u003c/mark> then?"},{"en":"pick a song to go with your page","zh":"选一首与个人页面搭配的歌","source":"You could pick a song to go with your page.","sourceHtml":"You could \u003cmark>pick a song to go with your page\u003c/mark>."},{"en":"my mains","zh":"我最主要关注、最常听的人","source":"But those girls were my mains when I was like 16.","sourceHtml":"But those girls were \u003cmark>my mains\u003c/mark> when I was like 16."},{"en":"the unreleased stuff","zh":"没有正式发行的作品","source":"With Azealia and Lana, I really liked the unreleased stuff.","sourceHtml":"With Azealia and Lana, I really liked \u003cmark>the unreleased stuff\u003c/mark>."},{"en":"keeps getting ripped off the internet","zh":"一再被人从网上撤下","source":"Then, Lana had this one called “Take Me To Paris” that keeps getting ripped off the internet, and it’s really sad because that’s one of my favorite songs by them.","sourceHtml":"Then, Lana had this one called “Take Me To Paris” that \u003cmark>keeps getting ripped off the internet\u003c/mark>, and it’s really sad because that’s one of my favorite songs by them."},{"en":"turn into","zh":"逐渐变成、发展成","source":"What did posting songs on Tumblr turn into?","sourceHtml":"What did posting songs on Tumblr \u003cmark>turn into\u003c/mark>?"},{"en":"making mixes to go on my Tumblr","zh":"制作要放到 上的混音","source":"From there, I started making mixes to go on my Tumblr, and then my SoundCloud.","sourceHtml":"From there, I started \u003cmark>making mixes to go on my Tumblr\u003c/mark>, and then my SoundCloud."},{"en":"turn down one track and turn up another","zh":"把一首歌的音量调低，再把另一首调高","source":"I just made them on Rekordbox, and didn’t have any CDJs, but would just use my computer to turn down one track and turn up another.","sourceHtml":"I just made them on Rekordbox, and didn’t have any CDJs, but would just use my computer to \u003cmark>turn down one track and turn up another\u003c/mark>."},{"en":"it was over","zh":"那就全完了、没法挽回了","source":"Completely focused for like 30 minutes, because if I touched anything, it was over.","sourceHtml":"Completely focused for like 30 minutes, because if I touched anything, \u003cmark>it was over\u003c/mark>."},{"en":"the vibe like at your sets","zh":"你那些 的现场氛围如何","source":"What was the vibe like at your sets?","sourceHtml":"What was \u003cmark>the vibe like at your sets\u003c/mark>?"},{"en":"anything goes","zh":"什么都可以、没有什么不被允许","source":"The vibe was sort of anything goes.","sourceHtml":"The vibe was sort of \u003cmark>anything goes\u003c/mark>."},{"en":"outside of the scene would see as ironic","zh":"圈外人会把它看作一种反讽","source":"Things that people outside of the scene would see as ironic, but is actually really good.","sourceHtml":"Things that people \u003cmark>outside of the scene would see as ironic\u003c/mark>, but is actually really good."},{"en":"hear hyperpop out","zh":"在外面参加派对、去酒吧或俱乐部时听到","source":"People didn’t want to hear hyperpop out, and now it’s so popular.","sourceHtml":"People didn’t want to \u003cmark>hear hyperpop out\u003c/mark>, and now it’s so popular."},{"en":"the transition is mad","zh":"这种变化太惊人了","source":"The transition is mad.","sourceHtml":"\u003cmark>The transition is mad\u003c/mark>."},{"en":"looked up to them","zh":"仰慕他们、把他们视为榜样","source":"I really looked up to them when I was younger because they were just having so much fun doing music.","sourceHtml":"I really \u003cmark>looked up to them\u003c/mark> when I was younger because they were just having so much fun doing music."},{"en":"be a part of something important","zh":"成为某件重要事情的一部分","source":"I always thought they were underrated, I just knew they were going to be a part of something important.","sourceHtml":"I always thought they were underrated, I just knew they were going to \u003cmark>be a part of something important\u003c/mark>."},{"en":"behind the shift","zh":"是这场转变背后的原因或推动力量","source":"What do you think was behind the shift?","sourceHtml":"What do you think was \u003cmark>behind the shift\u003c/mark>?"},{"en":"my little theories","zh":"我自己那点小理论","source":"In my little theories, it was because K-pop got so popular and they were using a lot of hyperpop sounds.","sourceHtml":"In \u003cmark>my little theories\u003c/mark>, it was because K-pop got so popular and they were using a lot of hyperpop sounds."},{"en":"blew it to the mainstream","zh":"把它迅速推向主流","source":"It really blew it to the mainstream.","sourceHtml":"It really \u003cmark>blew it to the mainstream\u003c/mark>."},{"en":"played a part in it","zh":"在这件事中起了一定作用","source":"There’s also a lot of straight boys using the hyperpop sounds now, too, so that probably played a part in it for some people.","sourceHtml":"There’s also a lot of straight boys using the hyperpop sounds now, too, so that probably \u003cmark>played a part in it\u003c/mark> for some people."},{"en":"how hard the bass is","zh":"低音有多猛烈、冲击力有多强","source":"Mostly because of how hard the bass is and the loose feel.","sourceHtml":"Mostly because of \u003cmark>how hard the bass is\u003c/mark> and the loose feel."},{"en":"the loose feel","zh":"松弛、粗粝而不过度修整的感觉","source":"Mostly because of how hard the bass is and the loose feel.","sourceHtml":"Mostly because of how hard the bass is and \u003cmark>the loose feel\u003c/mark>."},{"en":"grow up with that grime era","zh":"在那个 盛行的时期成长，并受到其陪伴或影响","source":"Did you grow up with that grime era at all?","sourceHtml":"Did you \u003cmark>grow up with that grime era\u003c/mark> at all?"},{"en":"grew up with UK grime","zh":"是听着英国 长大的","source":"I literally grew up with UK grime.","sourceHtml":"I literally \u003cmark>grew up with UK grime\u003c/mark>."},{"en":"mix it in with my music","zh":"把它融合进自己的音乐","source":"I’ve always wanted to mix it in with my music, put a female vocal over that sound.","sourceHtml":"I’ve always wanted to \u003cmark>mix it in with my music\u003c/mark>, put a female vocal over that sound."},{"en":"put a female vocal over that sound","zh":"在那种伴奏或声音之上加入女性人声","source":"I’ve always wanted to mix it in with my music, put a female vocal over that sound.","sourceHtml":"I’ve always wanted to mix it in with my music, \u003cmark>put a female vocal over that sound\u003c/mark>."},{"en":"big inspo for me","zh":"给我很大启发的人","source":"She’s a really, really big inspo for me.","sourceHtml":"She’s a really, really \u003cmark>big inspo for me\u003c/mark>."},{"en":"had that blend of singing and rapping down","zh":"已经熟练掌握了歌唱与说唱的融合","source":"She definitely had that blend of singing and rapping down.","sourceHtml":"She definitely \u003cmark>had that blend of singing and rapping down\u003c/mark>."},{"en":"very raw, very her","zh":"非常直接、未经打磨，同时极具她本人的个性","source":"She’s very raw, very her.","sourceHtml":"She’s \u003cmark>very raw, very her\u003c/mark>."},{"en":"speak-sing","zh":"介于说话与唱歌之间的演唱","source":"That really inspired me, and the way I speak-sing.","sourceHtml":"That really inspired me, and the way I \u003cmark>speak-sing\u003c/mark>."},{"en":"melodic storytelling","zh":"通过旋律讲故事","source":"I was always inspired by different sorts of melodic storytelling, like nursery rhymes and children’s books.","sourceHtml":"I was always inspired by different sorts of \u003cmark>melodic storytelling\u003c/mark>, like nursery rhymes and children’s books."},{"en":"mix in that two-stepping London girl feeling","zh":"融入那种踩着 节奏的伦敦女孩气质","source":"Then, Miss Dynamite would mix in that two-stepping London girl feeling.","sourceHtml":"Then, Miss Dynamite would \u003cmark>mix in that two-stepping London girl feeling\u003c/mark>."},{"en":"sing raw, a little off-key","zh":"唱得直接、未经修饰，音准还有一点偏","source":"So glad you brought up UK funky because the way people would sing raw, a little off-key, was really sweet and charming.","sourceHtml":"So glad you brought up UK funky because the way people would \u003cmark>sing raw, a little off-key\u003c/mark>, was really sweet and charming."},{"en":"recording live from the club","zh":"仿佛直接从俱乐部现场录下来","source":"It was like they were recording live from the club.","sourceHtml":"It was like they were \u003cmark>recording live from the club\u003c/mark>."},{"en":"a big clubber","zh":"很爱去俱乐部、经常参与夜生活的人","source":"Are you a big clubber?","sourceHtml":"Are you \u003cmark>a big clubber\u003c/mark>?"},{"en":"can’t not go out","zh":"不可能不出去玩，也就是隔一阵子就必须出门","source":"I can’t not go out for more than two weeks.","sourceHtml":"I \u003cmark>can’t not go out\u003c/mark> for more than two weeks."},{"en":"strict about it","zh":"对这件事有所节制、给自己立规矩","source":"I love to go out, but I’m strict about it at the same time.","sourceHtml":"I love to go out, but I’m \u003cmark>strict about it\u003c/mark> at the same time."},{"en":"not being inebriated","zh":"不处于醉酒状态","source":"I like to go dance and also appreciate not being inebriated and just losing myself in the music.","sourceHtml":"I like to go dance and also appreciate \u003cmark>not being inebriated\u003c/mark> and just losing myself in the music."},{"en":"losing myself in the music","zh":"完全沉浸在音乐里，暂时忘掉自我意识和周围压力","source":"I like to go dance and also appreciate not being inebriated and just losing myself in the music.","sourceHtml":"I like to go dance and also appreciate not being inebriated and just \u003cmark>losing myself in the music\u003c/mark>."},{"en":"sober and in reality","zh":"清醒地处在现实和当下之中","source":"I wanna be sober and in reality when I’m there.","sourceHtml":"I wanna be \u003cmark>sober and in reality\u003c/mark> when I’m there."},{"en":"your kind of club night","zh":"你喜欢、适合你的那类 夜晚","source":"What’s your kind of club night like?","sourceHtml":"What’s \u003cmark>your kind of club night\u003c/mark> like?"},{"en":"multi-rooms","zh":"有多个房间或区域的","source":"I like it when it’s multi-rooms.","sourceHtml":"I like it when it’s \u003cmark>multi-rooms\u003c/mark>."},{"en":"the smoking area","zh":"吸烟区","source":"I don’t like going to a club that’s one tiny room and then everyone else is in the smoking area.","sourceHtml":"I don’t like going to a club that’s one tiny room and then everyone else is in \u003cmark>the smoking area\u003c/mark>."},{"en":"plush bathrooms","zh":"舒适、讲究甚至有些奢华的洗手间","source":"I like when there’s plush bathrooms.","sourceHtml":"I like when there’s \u003cmark>plush bathrooms\u003c/mark>."},{"en":"a thing","zh":"一度很流行、成为大家关注和参与的现象","source":"It was a thing for the past few years.","sourceHtml":"It was a thing for the past few years."},{"en":"the crowd was curated","zh":"入场人群经过筛选、组织者有意识地塑造现场构成","source":"It was fun—not every single night—but the crowd was curated.","sourceHtml":"It was fun—not every single night—but \u003cmark>the crowd was curated\u003c/mark>."},{"en":"take your phone","zh":"暂时收走或封存手机","source":"They’d take your phone and you’d just be running around this massive space that gets a little crazy sometimes.","sourceHtml":"They’d \u003cmark>take your phone\u003c/mark> and you’d just be running around this massive space that gets a little crazy sometimes."},{"en":"pass that down to you","zh":"把某种习惯、品味或传统传给你","source":"Did she pass that down to you?","sourceHtml":"Did she \u003cmark>pass that down to you\u003c/mark>?"},{"en":"all the way up until I left home","zh":"一直持续到我离家生活为止","source":"And it was like that all the way up until I left home.","sourceHtml":"And it was like that \u003cmark>all the way up until I left home\u003c/mark>."},{"en":"get me out of bed","zh":"把我从床上叫起来、拉起来","source":"I thought it was cringe that she would always come home late and try to get me out of bed to dance with her.","sourceHtml":"I thought it was cringe that she would always come home late and try to \u003cmark>get me out of bed\u003c/mark> to dance with her."},{"en":"get up off me","zh":"别压着我、别缠着我、离我远点","source":"I used to be like, “Get up off me.” But obviously once I started going out, I understood.","sourceHtml":"I used to be like, “\u003cmark>Get up off me\u003c/mark>.” But obviously once I started going out, I understood."},{"en":"introduced me to a lot of music","zh":"让我接触并认识许多音乐","source":"And then, I was quite privileged to have a mom who introduced me to a lot of music.","sourceHtml":"And then, I was quite privileged to have a mom who \u003cmark>introduced me to a lot of music\u003c/mark>."},{"en":"put me onto","zh":"向我推荐、带我认识某种原本不熟悉的音乐或事物","source":"She put me onto jungle.","sourceHtml":"She \u003cmark>put me onto\u003c/mark> jungle."},{"en":"lost her mind","zh":"情绪彻底爆发、气疯了","source":"She lost her mind when I lost it.","sourceHtml":"She \u003cmark>lost her mind\u003c/mark> when I lost it."},{"en":"a memory that stuck with me","zh":"一段一直留在我心里的记忆","source":"It’s just a memory that stuck with me.","sourceHtml":"It’s just \u003cmark>a memory that stuck with me\u003c/mark>."},{"en":"made reggae","zh":"创作、演奏或录制","source":"And your dad made reggae?","sourceHtml":"And your dad \u003cmark>made reggae\u003c/mark>?"},{"en":"wasn’t in the house","zh":"没有生活在这个家里，也就是在她的成长中基本缺席","source":"Yeah, my dad was a reggae musician, but he really wasn’t in the house.","sourceHtml":"Yeah, my dad was a reggae musician, but he really \u003cmark>wasn’t in the house\u003c/mark>."},{"en":"a love child","zh":"非婚生子女，通常特指父母并非婚姻伴侣时出生的孩子","source":"I was a love child.","sourceHtml":"I was \u003cmark>a love child\u003c/mark>."},{"en":"Caribbean shit","zh":"“加勒比家庭那些破事”或“这就很加勒比”","source":"Caribbean shit.","sourceHtml":"\u003cmark>Caribbean shit\u003c/mark>."},{"en":"wasn’t famous or anything","zh":"并不出名，也不是什么公众人物","source":"He wasn’t famous or anything.","sourceHtml":"He \u003cmark>wasn’t famous or anything\u003c/mark>."},{"en":"low-budget studios","zh":"预算和设备条件有限的录音室","source":"He’d go to these low-budget studios and make music, I still have some of his stuff.","sourceHtml":"He’d go to these \u003cmark>low-budget studios\u003c/mark> and make music, I still have some of his stuff."},{"en":"dub-influenced","zh":"明显受到 影响的","source":"It’s very dub-influenced; I’m gonna sample one of his songs one day.","sourceHtml":"It’s very \u003cmark>dub-influenced\u003c/mark>; I’m gonna sample one of his songs one day."},{"en":"sample one of his songs","zh":"从他的一首歌中截取声音，放入自己的新作品","source":"It’s very dub-influenced; I’m gonna sample one of his songs one day.","sourceHtml":"It’s very dub-influenced; I’m gonna \u003cmark>sample one of his songs\u003c/mark> one day."},{"en":"play a lot of dancehall","zh":"经常播放","source":"Did you play a lot of dancehall?","sourceHtml":"Did you \u003cmark>play a lot of dancehall\u003c/mark>?"},{"en":"so dancehall","zh":"非常有 的典型感觉","source":"Did you play a lot of dancehall?","sourceHtml":"Did you \u003cmark>play a lot of dancehall\u003c/mark>?"},{"en":"so heavily intertwined with English pop culture","zh":"与英国流行文化极深地交织在一起","source":"Jamaican culture is just so heavily intertwined with English pop culture—the slang, everyting—that it’s just around.","sourceHtml":"Jamaican culture is just \u003cmark>so heavily intertwined with English pop culture\u003c/mark>—the slang, everyting—that it’s just around."},{"en":"it’s just around","zh":"它就是日常环境的一部分、到处都在","source":"Jamaican culture is just so heavily intertwined with English pop culture—the slang, everyting—that it’s just around.","sourceHtml":"Jamaican culture is just so heavily intertwined with English pop culture—the slang, everyting—that \u003cmark>it’s just around\u003c/mark>."},{"en":"bubble riddim","zh":"“泡泡般的 ”","source":"It’s what I always call a bubble riddim, where it’s danceful but thinking sort of like pop.","sourceHtml":"It’s what I always call a \u003cmark>bubble riddim\u003c/mark>, where it’s danceful but thinking sort of like pop."},{"en":"danceful but thinking sort of like pop","zh":"舞动性很强，但构思逻辑有点像流行音乐","source":"It’s what I always call a bubble riddim, where it’s danceful but thinking sort of like pop.","sourceHtml":"It’s what I always call a bubble riddim, where it’s \u003cmark>danceful but thinking sort of like pop\u003c/mark>."},{"en":"expanded dancehall to function more like pop","zh":"拓宽 ，使它能够像流行音乐一样运作","source":"He’s one of the producers who expanded dancehall to function more like pop.","sourceHtml":"He’s one of the producers who \u003cmark>expanded dancehall to function more like pop\u003c/mark>."},{"en":"bring a lot of outside influences into dancehall","zh":"把许多流派外部的影响带入","source":"He’d also bring a lot of outside influences into dancehall.","sourceHtml":"He’d also \u003cmark>bring a lot of outside influences into dancehall\u003c/mark>."},{"en":"behind your shift into making music yourself","zh":"是什么推动你转向亲自创作音乐","source":"What was behind your shift into making music yourself?","sourceHtml":"What was \u003cmark>behind your shift into making music yourself\u003c/mark>?"},{"en":"make songs together for fun","zh":"为了好玩而一起做歌，没有职业目标或成品压力","source":"We’d always make songs together for fun, and I mentioned to him that I wanted to start to make music for real, too, and he suggested that I work with everyone that he works with.","sourceHtml":"We’d always \u003cmark>make songs together for fun\u003c/mark>, and I mentioned to him that I wanted to start to make music for real, too, and he suggested that I work with everyone that he works with."},{"en":"make music for real","zh":"开始认真地、以正式作品为目标做音乐","source":"We’d always make songs together for fun, and I mentioned to him that I wanted to start to make music for real, too, and he suggested that I work with everyone that he works with.","sourceHtml":"We’d always make songs together for fun, and I mentioned to him that I wanted to start to \u003cmark>make music for real\u003c/mark>, too, and he suggested that I work with everyone that he works with."},{"en":"work with everyone that he works with","zh":"和他原本合作的整批人一起工作","source":"We’d always make songs together for fun, and I mentioned to him that I wanted to start to make music for real, too, and he suggested that I work with everyone that he works with.","sourceHtml":"We’d always make songs together for fun, and I mentioned to him that I wanted to start to make music for real, too, and he suggested that I \u003cmark>work with everyone that he works with\u003c/mark>."},{"en":"stuff to go with that","zh":"能与那种舞蹈相配的音乐","source":"At the time, I was really into tecktonik dancing, so I was just listening to stuff to go with that a lot.","sourceHtml":"At the time, I was really into tecktonik dancing, so I was just listening to \u003cmark>stuff to go with that\u003c/mark> a lot."},{"en":"do vocals in front of anyone","zh":"当着别人的面演唱或录制人声","source":"But it was hard because I was really shy to do vocals in front of anyone.","sourceHtml":"But it was hard because I was really shy to \u003cmark>do vocals in front of anyone\u003c/mark>."},{"en":"get past that","zh":"越过、克服那个障碍，继续向前","source":"How did you get past that?","sourceHtml":"How did you \u003cmark>get past that\u003c/mark>?"},{"en":"get over that putting forward your ideas is cringe","zh":"克服“主动提出自己的想法很尴尬”这种心理","source":"I just had to get over that putting forward your ideas is cringe.","sourceHtml":"I just had to \u003cmark>get over that putting forward your ideas is cringe\u003c/mark>."},{"en":"been affirmed so much","zh":"得到了大量肯定和认可","source":"The past year has been so amazing for me because I really trust my ideas now because I’ve been affirmed so much.","sourceHtml":"The past year has been so amazing for me because I really trust my ideas now because I’ve \u003cmark>been affirmed so much\u003c/mark>."},{"en":"I am my own worst enemy","zh":"我自己才是阻碍自己最严重的人","source":"Not even just with music—I had to realize, “Oh my God, I am my own worst enemy.”","sourceHtml":"Not even just with music—I had to realize, “Oh my God, \u003cmark>I am my own worst enemy\u003c/mark>.”"},{"en":"opening up for PinkPantheress","zh":"在 的正式演出前担任暖场嘉宾","source":"You went from making music with your friends to opening up for PinkPantheress and getting a bunch of new fans.","sourceHtml":"You went from making music with your friends to \u003cmark>opening up for PinkPantheress\u003c/mark> and getting a bunch of new fans."},{"en":"getting a bunch of new fans","zh":"获得一大批新粉丝","source":"You went from making music with your friends to opening up for PinkPantheress and getting a bunch of new fans.","sourceHtml":"You went from making music with your friends to opening up for PinkPantheress and \u003cmark>getting a bunch of new fans\u003c/mark>."},{"en":"the music getting bigger","zh":"音乐获得更大规模的关注，事业和受众都在扩张","source":"Does the music getting bigger scare you?","sourceHtml":"Does \u003cmark>the music getting bigger\u003c/mark> scare you?"},{"en":"Where’s the album?","zh":"“专辑到底什么时候来？","source":"It scares me because I wanna be able to still have fun making the music and not feel like people are like, “Where’s the album?” There’s more pressure now, but I’m really excited for it.","sourceHtml":"It scares me because I wanna be able to still have fun making the music and not feel like people are like, “\u003cmark>Where’s the album?\u003c/mark>” There’s more pressure now, but I’m really excited for it."},{"en":"not in an arrogant way","zh":"我这样说并不是出于傲慢","source":"Not in an arrogant way, it just comes really natural to me.","sourceHtml":"\u003cmark>Not in an arrogant way\u003c/mark>, it just comes really natural to me."},{"en":"comes really natural to me","zh":"对我来说来得非常自然、做起来很顺手","source":"Not in an arrogant way, it just comes really natural to me.","sourceHtml":"Not in an arrogant way, it just \u003cmark>comes really natural to me\u003c/mark>."},{"en":"be in the mood","zh":"有做某事的心情或状态","source":"Sometimes I won’t be in the mood, but that doesn’t last long and then songs will just fire out of me.","sourceHtml":"Sometimes I won’t \u003cmark>be in the mood\u003c/mark>, but that doesn’t last long and then songs will just fire out of me."},{"en":"fire out of me","zh":"歌曲从我体内猛烈、连续地迸发出来","source":"Sometimes I won’t be in the mood, but that doesn’t last long and then songs will just fire out of me.","sourceHtml":"Sometimes I won’t be in the mood, but that doesn’t last long and then songs will just \u003cmark>fire out of me\u003c/mark>."},{"en":"playing on this idea of being a mysterious pop star","zh":"借用并把玩“神秘流行巨星”这一概念","source":"I was really inspired by artists like Nadia Oh, who felt like they were playing on this idea of being a mysterious pop star.","sourceHtml":"I was really inspired by artists like Nadia Oh, who felt like they were \u003cmark>playing on this idea of being a mysterious pop star\u003c/mark>."},{"en":"describe myself as a pop star","zh":"把自己称作流行巨星","source":"But I hate the words “pop star” so much that I would never describe myself as a pop star.","sourceHtml":"But I hate the words “pop star” so much that I would never \u003cmark>describe myself as a pop star\u003c/mark>."},{"en":"actually quite big","zh":"真的已经红到相当大的规模","source":"You just have to be actually quite big to be a pop star and people just use it so loosely these days.","sourceHtml":"You just have to be \u003cmark>actually quite big\u003c/mark> to be a pop star and people just use it so loosely these days."},{"en":"use it so loosely","zh":"使用这个词时标准过于宽松、随意","source":"You just have to be actually quite big to be a pop star and people just use it so loosely these days.","sourceHtml":"You just have to be actually quite big to be a pop star and people just \u003cmark>use it so loosely\u003c/mark> these days."},{"en":"inspire the new EP","zh":"为新 提供灵感、促成它的主题","source":"What happened in life to inspire the new EP?","sourceHtml":"What happened in life to \u003cmark>inspire the new EP\u003c/mark>?"},{"en":"really broke","zh":"穷得厉害、几乎没钱","source":"When I was doing my first EP, I was really broke and didn’t have any money.","sourceHtml":"When I was doing my first EP, I was \u003cmark>really broke\u003c/mark> and didn’t have any money."},{"en":"random jobs on the side","zh":"正职之外做的各种零散兼职","source":"Then, I got a full-time job and was doing a lot of other random jobs on the side.","sourceHtml":"Then, I got a full-time job and was doing a lot of other \u003cmark>random jobs on the side\u003c/mark>."},{"en":"I got fired","zh":"我被解雇了","source":"And then I left my full-time job—well, actually I got fired.","sourceHtml":"And then I left my full-time job—well, actually \u003cmark>I got fired\u003c/mark>."},{"en":"saw the job as temporary","zh":"把这份工作看作临时过渡","source":"And I was always talking about how I saw the job as temporary and my music.","sourceHtml":"And I was always talking about how I \u003cmark>saw the job as temporary\u003c/mark> and my music."},{"en":"sticking up for people getting treated badly","zh":"为受到恶劣对待的人挺身说话","source":"I was also sticking up for people getting treated badly and setting my boundaries.","sourceHtml":"I was also \u003cmark>sticking up for people getting treated badly\u003c/mark> and setting my boundaries."},{"en":"setting my boundaries","zh":"明确并维护自己的边界，包括什么行为可以接受、自己愿意承担到什么程度","source":"I was also sticking up for people getting treated badly and setting my boundaries.","sourceHtml":"I was also sticking up for people getting treated badly and \u003cmark>setting my boundaries\u003c/mark>."},{"en":"being free from that cage","zh":"从那座牢笼中获得自由","source":"Anyway, the EP is inspired by being free from that cage; getting to express myself and not have to make myself feel small to make other people comfortable.","sourceHtml":"Anyway, the EP is inspired by \u003cmark>being free from that cage\u003c/mark>; getting to express myself and not have to make myself feel small to make other people comfortable."},{"en":"make myself feel small to make other people comfortable","zh":"为了让别人舒服而压低自己、缩小自己的存在感","source":"Anyway, the EP is inspired by being free from that cage; getting to express myself and not have to make myself feel small to make other people comfortable.","sourceHtml":"Anyway, the EP is inspired by being free from that cage; getting to express myself and not have to \u003cmark>make myself feel small to make other people comfortable\u003c/mark>."},{"en":"bond over music","zh":"因共同热爱音乐而建立亲密关系","source":"Did you two bond over music?","sourceHtml":"Did you two \u003cmark>bond over music\u003c/mark>?"},{"en":"a very strong emotional bond through making music together","zh":"通过共同创作建立的强烈情感纽带","source":"We have a different type of friendship because it’s the first time I met someone through music and we just have a very strong emotional bond through making music together.","sourceHtml":"We have a different type of friendship because it’s the first time I met someone through music and we just have \u003cmark>a very strong emotional bond through making music together\u003c/mark>."},{"en":"such similar taste","zh":"品味如此相近","source":"We have such similar taste.","sourceHtml":"We have \u003cmark>such similar taste\u003c/mark>."},{"en":"she’ll get it","zh":"她会立刻理解其中的感觉或价值","source":"We’re just both emotional people and I can show her something she doesn’t even know and she’ll get it.","sourceHtml":"We’re just both emotional people and I can show her something she doesn’t even know and \u003cmark>she’ll get it\u003c/mark>."},{"en":"an old-school type of producer","zh":"一位偏老派方法的制作人","source":"She’s an old-school type of producer.","sourceHtml":"She’s \u003cmark>an old-school type of producer\u003c/mark>."},{"en":"can loop anything","zh":"能把任何声音截取、重复并转化成有效的音乐循环","source":"She really studies music and can loop anything.","sourceHtml":"She really studies music and \u003cmark>can loop anything\u003c/mark>."},{"en":"full of all these unexpected loops and references","zh":"充满意想不到的循环片段与音乐指涉","source":"She’s like Timbaland with the way her music is full of all these unexpected loops and references.","sourceHtml":"She’s like Timbaland with the way her music is \u003cmark>full of all these unexpected loops and references\u003c/mark>."},{"en":"the type of music fan that always has a new obsession","zh":"总会进入下一轮迷恋的那类乐迷","source":"Are you the type of music fan that always has a new obsession?","sourceHtml":"Are you \u003cmark>the type of music fan that always has a new obsession\u003c/mark>?"},{"en":"loyal to my oldies","zh":"仍然忠于自己过去长期喜欢的人","source":"Yeah, with new people, but I’m always loyal to my oldies.","sourceHtml":"Yeah, with new people, but I’m always \u003cmark>loyal to my oldies\u003c/mark>."},{"en":"not to be shady","zh":"不是想暗中贬低、冒犯谁","source":"It’s part of what’s difficult for me about collaborating with people, because I can be really obsessed with someone’s music one month and then—not to be shady—onto something new the next month.","sourceHtml":"It’s part of what’s difficult for me about collaborating with people, because I can be really obsessed with someone’s music one month and then—\u003cmark>not to be shady\u003c/mark>—onto something new the next month."},{"en":"onto something new","zh":"转向新的兴趣对象","source":"It’s part of what’s difficult for me about collaborating with people, because I can be really obsessed with someone’s music one month and then—not to be shady—onto something new the next month.","sourceHtml":"It’s part of what’s difficult for me about collaborating with people, because I can be really obsessed with someone’s music one month and then—not to be shady—\u003cmark>onto something new\u003c/mark> the next month."},{"en":"an artist I’ve been looking for for a really long time","zh":"一位我寻找了很久、终于遇到的艺术家","source":"She’s an artist I’ve been looking for for a really long time.","sourceHtml":"She’s \u003cmark>an artist I’ve been looking for for a really long time\u003c/mark>."},{"en":"the emotional lodestar for the album","zh":"为整张专辑指引情感方向的核心参照","source":"Is there an artist you consider to be the emotional lodestar for the album?","sourceHtml":"Is there an artist you consider to be \u003cmark>the emotional lodestar for the album\u003c/mark>?"},{"en":"compare me to them forever","zh":"从此永远拿我与那位艺人比较","source":"I actually can’t, because if I do say that then people are gonna compare me to them forever.","sourceHtml":"I actually can’t, because if I do say that then people are gonna \u003cmark>compare me to them forever\u003c/mark>."},{"en":"bring up M.I.A.","zh":"在谈论她时提到","source":"I actually can’t, because if I do say that then people are gonna compare me to them forever.","sourceHtml":"I actually can’t, because if I do say that then people are gonna compare me to them forever."},{"en":"such a hard energy to emulate","zh":"一种极难仿效的能量","source":"It’s a compliment because it’s just such a hard energy to emulate.","sourceHtml":"It’s a compliment because it’s just \u003cmark>such a hard energy to emulate\u003c/mark>."},{"en":"euphoric and playful and coy","zh":"亢奋、顽皮，又带一点欲拒还迎","source":"I’d love if people got that same feeling of euphoric and playful and coy from my music.","sourceHtml":"I’d love if people got that same feeling of \u003cmark>euphoric and playful and coy\u003c/mark> from my music."},{"en":"“I’m not influenced by anyone” rapper era","zh":"“我不受任何人影响”的说唱歌手时期","source":"I’m glad I got to talk to you before you’re in your “I’m not influenced by anyone” rapper era.","sourceHtml":"I’m glad I got to talk to you before you’re in your \u003cmark>“I’m not influenced by anyone” rapper era\u003c/mark>."},{"en":"comes with the rap attitude","zh":"是那种说唱姿态天然附带的一部分","source":"Yeah, that just comes with the rap attitude; you gotta vouch for yourself a lot.","sourceHtml":"Yeah, that just \u003cmark>comes with the rap attitude\u003c/mark>; you gotta vouch for yourself a lot."},{"en":"vouch for yourself","zh":"为自己的能力、价值和可信度背书","source":"Yeah, that just comes with the rap attitude; you gotta vouch for yourself a lot.","sourceHtml":"Yeah, that just comes with the rap attitude; you gotta \u003cmark>vouch for yourself\u003c/mark> a lot."},{"en":"gatekeep","zh":"把守入口，控制谁能接触某种信息、文化或社群","source":"I don’t gatekeep.","sourceHtml":"I don’t \u003cmark>gatekeep\u003c/mark>."},{"en":"somebody out there gatekeeping your music","zh":"外面某个正在对你的音乐搞“守门”的人","source":"There’s probably somebody out there gatekeeping your music right now.","sourceHtml":"There’s probably \u003cmark>somebody out there gatekeeping your music\u003c/mark> right now."},{"en":"free me from those chains","zh":"把我从那些锁链中解放出来","source":"Free me from those chains.","sourceHtml":"\u003cmark>Free me from those chains\u003c/mark>."},{"en":"been gatekept enough my whole life","zh":"这一生已经经历了太多被把关者排除在外的时刻","source":"I’ve been gatekept enough my whole life.","sourceHtml":"I’ve \u003cmark>been gatekept enough my whole life\u003c/mark>."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
