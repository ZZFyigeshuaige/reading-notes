g at the abandoned campsite where the first film was shot, Billy is introduced like a ghost haunting the place—like Norma Desmond locked in a prison of her former glory.","sourceHtml":"Residing at the abandoned campsite where the first film was shot, Billy is introduced like a ghost haunting the place—like Norma Desmond locked in a \u003cmark>prison\u003c/mark> of \u003cmark>her\u003c/mark> \u003cmark>former\u003c/mark> \u003cmark>glory\u003c/mark>."},{"en":"nods to classic cinema lore","zh":"对经典电影掌故／传统的致意","source":"It’s one of many nods to classic cinema lore that Schoenbrun packs, across a movie that Justin says “will inevitably be a generational text because it does something exceedingly rare: embraces post-modernism while remaining clearly affectionate to genre conventions and their sources.”","sourceHtml":"It’s one of many \u003cmark>nods to classic cinema lore\u003c/mark> that Schoenbrun packs, across a movie that Justin says “will inevitably be a generational text because it does something exceedingly rare: embraces post-modernism while remaining clearly affectionate to genre conventions and their sources.”"},{"en":"a generational text","zh":"一代人的标志性文本，指能集中表达某代人的经验、焦虑或审美，并可能被长期讨论的作品","source":"It’s one of many nods to classic cinema lore that Schoenbrun packs, across a movie that Justin says “will inevitably be a generational text because it does something exceedingly rare: embraces post-modernism while remaining clearly affectionate to genre conventions and their sources.”","sourceHtml":"It’s one of many nods to classic cinema lore that Schoenbrun packs, across a movie that Justin says “will inevitably be a \u003cmark>generational\u003c/mark> \u003cmark>text\u003c/mark> because it does something exceedingly rare: embraces post-modernism while remaining clearly affectionate to genre conventions and their sources.”"},{"en":"have a blast behind the camera","zh":"在执导／拍摄过程中玩得非常开心","source":"Through Teenage Sex and Death at Camp Miasma, Schoenbrun is having a bla g they put on screen is,” adding that they “believe Camp Miasma will absolutely become a classic and staple of queer cinema, especially for horror fans.”","sourceHtml":"I love the way they approach aesthetics, and how \u003cmark>unapologetically\u003c/mark> \u003cmark>bizarre\u003c/mark> and \u003cmark>intentional\u003c/mark> everything they put on screen is,” adding that they “believe Camp Miasma will absolutely become a classic and staple of queer cinema, especially for horror fans.”"},{"en":"a staple of queer cinema","zh":"酷儿电影中的代表性、常备式作品","source":"I love the way they approach aesthetics, and how unapologetically bizarre and intentional everything they put on screen is,” adding that they “believe Camp Miasma will absolutely become a classic and staple of queer cinema, especially for horror fans.”","sourceHtml":"I love the way they approach aesthetics, and how unapologetically bizarre and intentional everything they put on screen is,” adding that they “believe Camp Miasma will absolutely become a classic and \u003cmark>staple\u003c/mark> of \u003cmark>queer\u003c/mark> \u003cmark>cinema\u003c/mark>, especially for horror fans.”"},{"en":"hit on the beating heart of","zh":"准确触及……最鲜活的核心","source":"That last note hits on the beating heart of Camp Miasma, that underneath the “flesh and fluids” of the film (as Billy at one point states the franchise is all about), this is a tale of finding and accepting yourself—even in the corners of your mind that most unnerve you.","sourceHtml":"That last note \u003cmark>hits on the beating heart of\u003c/mark> Camp Miasma, that underneath the “flesh and fluids” of the film (as Billy at one point states the franchise is all about), this is a tale of finding and accepting yourself—even in the corners of your mind that most unnerve you."},{"en":"the corners of your mind that most unnerve you","zh":"内心最让你不安的隐秘角落","source":"That last note hits on the beating heart of Camp Miasma, that underneath the “flesh and fluids” of the film (as Billy at one point states the franchise is all about), this is a tale of finding and accepting yourself—even in the corners of your mind that most unnerve you.","sourceHtml":"\u003cmark>That\u003c/mark> last note hits on the beating heart of Camp Miasma, \u003cmark>that\u003c/mark> underneath the “flesh and fluids” of the film (as Billy at one point states the franchise is all about), this is a tale of finding and accepting yourself—even in the \u003cmark>corners\u003c/mark> of \u003cmark>your\u003c/mark> \u003cmark>mind\u003c/mark> \u003cmark>that\u003c/mark> \u003cmark>most\u003c/mark> \u003cmark>unnerve\u003c/mark> \u003cmark>you\u003c/mark>."},{"en":"a little too into movies","zh":"对电影有点过分着迷","source":"Or, as Mak declares, it’s “amazing representation for awkward lesbians who are a little too into movies.”","sourceHtml":"Or, as Mak declares, it’s “amazing representation for awkward lesbians who are \u003cmark>a little too into movies\u003c/mark>.”"},{"en":"the embrace of the troublesome thoughts that lurk within us all","zh":"接纳潜藏在所有人内心、令人不安的念头","source":"Teenage Sex and Death at Camp Miasma won the Queer Palm at this year’s Cannes Film Festival, and as the film now arrives in theaters worldwide, Schoenbrun tells us about several of its most astonishing sequences—and the embrace of the troublesome thoughts that lurk within us all.","sourceHtml":"Teenage Sex and Death at Camp Miasma won the Queer Palm at this year’s Cannes Film Festival, and as the film now arrives in theaters worldwide, Schoenbrun tells us about several of its most astonishing sequences—and \u003cmark>the embrace of the troublesome thoughts that lurk within us all\u003c/mark>."},{"en":"all too rare these days","zh":"如今少得令人遗憾","source":"As a lover of opening credit sequences, which are all too rare these days, the one in Camp Miasma is incredible.","sourceHtml":"As a lover of opening credit sequences, which are \u003cmark>all too rare these days\u003c/mark>, the one in Camp Miasma is incredible."},{"en":"pack in","zh":"在有限空间或时间里塞入大量内容","source":"Not only does it give us a great introduction to the vibe of the film, but it packs in such a deep understanding of the lore of this invented franchise.","sourceHtml":"Not only does it give us a great introduction to the vibe of the film, but it \u003cmark>packs in\u003c/mark> such a deep understanding of the lore of this invented franchise."},{"en":"the lore of this invented franchise","zh":"这个虚构系列的背景掌故与内部历史","source":"Not only does it give us a great introduction to the vibe of the film, but it packs in such a deep understanding of the lore of this invented franchise.","sourceHtml":"Not only does it give us a great introduction to the vibe of the film, but it packs in such a deep understanding of the \u003cmark>lore\u003c/mark> of \u003cmark>this\u003c/mark> \u003cmark>invented\u003c/mark> \u003cmark>franchise\u003c/mark>."},{"en":"such a gift","zh":"简直是一份难得的礼物","source":"So good it’s going to make David Fincher jealous.” Because I agree, a great opening credit sequence is such a gift.","sourceHtml":"So good it’s going to make David Fincher jealous.” Because I agree, a great opening credit sequence is \u003cmark>such a gift\u003c/mark>."},{"en":"enjoy their present moment","zh":"享受自身正在发生的当下","source":"When you’re trying to make movies that are enjoying their present moment—rather than just being a vehicle to push along a plot or get you to the end of the movie, which is something that I always try to bring to my films—the opening credit sequence is such a gift because it can be standalone in this way.","sourceHtml":"When you’re trying to make movies that are \u003cmark>enjoying their present moment\u003c/mark>—rather than just being a vehicle to push along a plot or get you to the end of the movie, which is something that I always try to bring to my films—the opening credit sequence is such a gift because it can be standalone in this way."},{"en":"push along a plot","zh":"推动情节往前走","source":"When you’re trying to make movies that are enjoying their present moment—rather than just being a vehicle to push along a plot or get you to the end of the movie, which is something that I always try to bring to my films—the opening credit sequence is such a gift because it can be standalone in this way.","sourceHtml":"When you’re trying to make movies that are enjoying their present moment—rather than just being a vehicle to \u003cmark>push along a plot\u003c/mark> or get you to the end of the movie, which is something that I always try to bring to my films—the opening credit sequence is such a gift because it can be standalone in this way."},{"en":"standalone","zh":"能够独立成立的","source":"When you’re trying to make movies that are enjoying their present moment—rather than just being a vehicle to push along a plot or get you to the end of the movie, which is something that I always try to bring to my films—the opening credit sequence is such a gift because it can be standalone in this way.","sourceHtml":"When you’re trying to make movies that are enjoying their present moment—rather than just being a vehicle to push along a plot or get you to the end of the movie, which is something that I always try to bring to my films—the opening credit sequence is such a gift because it can be \u003cmark>standalone\u003c/mark> in this way."},{"en":"trace the genealogy","zh":"追溯谱系与演变路径","source":"I hadn’t done anything like that before, and was like, “I think it’s time.” I thought that this idea of tracing the genealogy and the ups and downs of this horror movie franchise was a perfect way to get us to where we need to be when the movie starts to create this “everything’s been done” mentality.","sourceHtml":"I hadn’t done anything like that before, and was like, “I think it’s time.” I thought that this idea of \u003cmark>tracing the genealogy\u003c/mark> and the ups and downs of this horror movie franchise was a perfect way to get us to where we need to be when the movie starts to create this “everything’s been done” mentality."},{"en":"get us to where we need to be","zh":"把我们带到理解后续内容所需的位置","source":"I hadn’t done anything like that before, and was like, “I think it’s time.” I thought that this idea of tracing the genealogy and the ups and downs of this horror movie franchise was a perfect way to get us to where we need to be when the movie starts to create this “everything’s been done” mentality.","sourceHtml":"I hadn’t done anything like that before, and was like, “I think it’s time.” I thought that this idea of tracing the genealogy and the ups and downs of this horror movie franchise was a perfect way to \u003cmark>get us to where we need to be\u003c/mark> when the movie starts to create this “everything’s been done” mentality."},{"en":"everything’s been done mentality","zh":"“所有招数都已经被用过”的心态，指创作者处在一个形式和观念仿佛都已耗尽的阶段","source":"I hadn’t done anything like that before, and was like, “I think it’s time.” I thought that this idea of tracing the genealogy and the ups and downs of this horror movie franchise was a perfect way to get us to where we need to be when the movie starts to create this “everything’s been done” mentality.","sourceHtml":"I hadn’t \u003cmark>done\u003c/mark> anything like that before, and was like, “I think it’s time.” I thought that this idea of tracing the genealogy and the ups and downs of this horror movie franchise was a perfect way to get us to where we need to be when the movie starts to create this “\u003cmark>everything’s\u003c/mark> \u003cmark>been\u003c/mark> \u003cmark>done\u003c/mark>” \u003cmark>mentality\u003c/mark>."},{"en":"blow something out of the water","zh":"远远超越原有标准，或以压倒性方式打破旧局面","source":"When they made Scream, which blew something out of the water in terms of self-referentiality or metaness or self-awareness of the genre-within-the-genre, this was before we had gotten to the point where there were twelve sequels to all of those ’80s franchises.","sourceHtml":"When they made Scream, which \u003cmark>blew something out of the water\u003c/mark> in terms of self-referentiality or metaness or self-awareness of the genre-within-the-genre, this was before we had gotten to the point where there were twelve sequels to all of those ’80s franchises."},{"en":"canon","zh":"正史、被官方承认的故事连续性","source":"That was before the reboot that erases all of the canon, but then reinvents new canon.","sourceHtml":"That was before the reboot that erases all of the \u003cmark>canon\u003c/mark>, but then reinvents new \u003cmark>canon\u003c/mark>."},{"en":"unfurl a banner","zh":"展开一条横幅","source":"One thing in the movie that I haven’t seen anyone mention is when Kris arrives at that hotel, you see them unfurling a banner saying that what used to be this independent hotel is now part of the Marriott family.","sourceHtml":"One thing in the movie that I haven’t seen anyone mention is when Kris arrives at that hotel, you see them \u003cmark>unfurling a banner\u003c/mark> saying that what used to be this independent hotel is now part of the Marriott family."},{"en":"homogenize and remake things","zh":"把事物同质化并重新制作","source":"There’s something of the reboot in that, that we as a culture can only homogenize and remake things.","sourceHtml":"There’s something of the reboot in that, that we as a culture can only \u003cmark>homogenize and remake things\u003c/mark>."},{"en":"there’s something of X in that","zh":"那件事中带有某种 的性质／影子","source":"Yeah, and then they reboot it and something in that is political, or there’s something that this movie is trying to talk about in terms of why we keep doing that.","sourceHtml":"Yeah, and then they reboot it and \u003cmark>something\u003c/mark> in \u003cmark>that\u003c/mark> is political, or \u003cmark>there’s\u003c/mark> \u003cmark>something\u003c/mark> \u003cmark>that\u003c/mark> this movie is trying to talk about in terms of why we keep doing \u003cmark>that\u003c/mark>."},{"en":"something in that is political","zh":"那件事本身包含政治意味","source":"Yeah, and then they reboot it and something in that is political, or there’s something that this movie is trying to talk about in terms of why we keep doing that.","sourceHtml":"Yeah, and then they reboot it and \u003cmark>something\u003c/mark> in \u003cmark>that\u003c/mark> is \u003cmark>political\u003c/mark>, or there’s \u003cmark>something\u003c/mark> \u003cmark>that\u003c/mark> this movie is trying to talk about in terms of why we keep doing \u003cmark>that\u003c/mark>."},{"en":"a heavy lift","zh":"一项工作量巨大、执行难度很高的任务","source":"Above all, that opening credit sequence was such a heavy lift for everyone, but it was also so fun.","sourceHtml":"Above all, that opening credit sequence was \u003cmark>such a heavy lift\u003c/mark> for everyone, but it was also so fun."},{"en":"do the lift","zh":"承担最主要的重活","source":"Above all, that opening credit sequence was such a heavy lift for everyone, but it was also so fun.","sourceHtml":"Above all, that opening credit sequence was \u003cmark>such a heavy lift\u003c/mark> for everyone, but it was also so fun."},{"en":"childlike joy","zh":"孩子般纯粹、毫无保留的快乐","source":"I remember that being one of the things that made me feel childlike joy, because I was a kid who waited for the Halloween catalogs to show up at home.","sourceHtml":"I remember that being one of the things that made me feel \u003cmark>childlike\u003c/mark> \u003cmark>joy\u003c/mark>, because I was a kid who waited for the Halloween catalogs to show up at home."},{"en":"ephemera","zh":"短期流通、原本不打算长久保存的印刷品或周边物件，例如宣传册、票根、目录、包装和小商品","source":"I think there’s so much fun that the movie is having with that ephemera and with actually enjoying recreating it—not just being like, “Oh yeah, there’s a Little Death Halloween costume,” but going, “Yeah, but Party City wouldn’t have been able to get the copyright, so they would still make the lookalike version of it, but they would call it Air Vent Man.” We had so much fun with these details.","sourceHtml":"I think there’s so much fun that the movie is having with that \u003cmark>ephemera\u s ashamed of, and doesn’t want to actually articulate because it \u003cmark>goes against all of her values\u003c/mark>, is misogynist."},{"en":"doesn’t make it not be there","zh":"并不会让它真的不存在","source":"What matters is that it’s her fantasy and that to not explore it would be repression, and to pretend that it isn’t there doesn’t make it not be there.","sourceHtml":"What matters is that it’s her fantasy and that to not explore it would be repression, and to pretend that it isn’t there \u003cmark>doesn’t make it not be there\u003c/mark>."},{"en":"less puritanical","zh":"少一些清教徒式的道德严苛，尤其指对性抱有禁欲、羞耻化和非黑即白的态度","source":"In fact, we as a culture in 2026 would be a little bit healthier if we’re a little less puritanical and a little more open about these things.","sourceHtml":"In fact, we as a culture in 2026 would be a little bit healthier if we’re a little \u003cmark>less puritanical\u003c/mark> and a little more open about these things."},{"en":"the American sexual psyche","zh":"美国社会集体的性心理结构","source":"It’s like the American sexual psyche—and I say from the highest levels of power down—is a deeply sick thing and the problem comes when you don’t have a “now if it gets too real, you can turn it off,” in the way we’re exploring and trying to heal that.","sourceHtml":"It’s like \u003cmark>the American sexual psyche\u003c/mark>—and I say from the highest levels of power down—is a deeply sick thing and the problem comes when you don’t have a “now if it gets too real, you can turn it off,” in the way we’re exploring and trying to heal that."},{"en":"from the highest levels of power down","zh":"从最高权力阶层一路向下，强调问题贯穿整个社会等级，而非只存在于普通人的私人生活","source":"It’s like the American sexual psyche—and I say from the highest levels of power down—is a deeply sick thing and the problem comes when you don’t have a “now if it gets too real, you can turn it off,” in the way we’re exploring and trying to heal that.","sourceHtml":"It’s like the American sexual psyche—and I say from \u003cmark>the highest cene obviously than the birthday party scene, but it \u003cmark>comes from a similar place\u003c/mark>."},{"en":"ruin her career","zh":"毁掉自己的职业生涯，常用于形容一次公开行为可能造成无法挽回的职业后果","source":"She has this breakdown and she finishes her pitch and she’s ruined her career or whatever it is, and then she gives this little smile.","sourceHtml":"She has this breakdown and she finishes \u003cmark>her\u003c/mark> pitch and she’s \u003cmark>ruined\u003c/mark> \u003cmark>her\u003c/mark> \u003cmark>career\u003c/mark> or whatever it is, and then she gives this little smile."},{"en":"a perfect angel","zh":"一个善良、真诚得像天使一样的人","source":"Hannah, I always tell her this and she likes to hear it, she is a perfect angel.","sourceHtml":"Hannah, I always tell her this and she likes to hear it, she is a \u003cmark>perfect angel\u003c/mark>."},{"en":"mischief","zh":"淘气、恶作剧式的越界，通常带有玩心，不等同于恶意伤害","source":"She’s an angel and there’s something of the way that Hannah is a perfect angel in that smile; it’s mischief in a way that I really enjoy.","sourceHtml":"She’s an angel and there’s something of the way that Hannah is a perfect angel in that smile; it’s \u003cmark>mischief\u003c/mark> in a way that I really enjoy."},{"en":"righteous and deranged","zh":"出于正当立场，却又疯狂失控","source":"It’s like mischief that’s coming from a place that’s righteous and deranged, and that’s what the movie is trying to do.","sourceHtml":"It’s like mischief that’s coming from a place that’s \u003cmark>righteous and deranged\u003c/mark>, and that’s what the movie is trying to do."},{"en":"hard-won triumph","zh":"付出代价、历经挣扎才赢得的胜利","source":"Again, it’s like a moment of hard-won triumph.","sourceHtml":"Again, it’s like a moment of \u003cmark>hard-won triumph\u003c/mark>."}];
let index = 0;
let revealed = false;
const promptEl = document.getElementById('prompt');
const answerEl = document.getElementById('answer');
const sourceEl = document.getElementById('source');
const answerWrap = document.getElementById('answerWrap');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');
const revealButton = document.getElementById('reveal');
function render() {
  const card = cards[index];
  promptEl.textContent = card.zh;
  answerEl.textContent = card.en;
  sourceEl.innerHTML = card.sourceHtml;
  progress.textContent = `${index + 1} / ${cards.length}`;
  revealed = false;
  answerWrap.classList.add('hidden');
  hint.classList.remove('hidden');
  revealButton.textContent = '显示答案';
}
function reveal() {
  revealed = !revealed;
  answerWrap.classList.toggle('hidden', !revealed);
  hint.classList.toggle('hidden', revealed);
  revealButton.textContent = revealed ? '重新隐藏' : '显示答案';
}
function move(delta) { index = (index + delta + cards.length) % cards.length; render(); }
function shuffle() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}
document.getElementById('card').addEventListener('click', reveal);
revealButton.addEventListener('click', reveal);
document.getElementById('prev').addEventListener('click', () => move(-1));
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('shuffle').addEventListener('click', shuffle);
document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') { event.preventDefault(); reveal(); }
  if (event.key === 'ArrowLeft') move(-1);
  if (event.key === 'ArrowRight') move(1);
});
let textSize = Number(localStorage.getItem('reading-font-size')) || 19;
function applyTextSize() { document.documentElement.style.setProperty('--font-size', textSize + 'px'); localStorage.setItem('reading-font-size', textSize); }
function resizeText(delta) { textSize = Math.max(15, Math.min(30, textSize + delta)); applyTextSize(); }
applyTextSize();
render();
</script>
